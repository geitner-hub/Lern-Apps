<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Sachaufgaben – Längeneinheiten</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fef9f0;
  --card:#ffffff;
  --p1:#f4631e;
  --p1d:#c94d14;
  --p2:#2e86ab;
  --p3:#44b39a;
  --text:#1a1a2e;
  --muted:#7a7a9a;
  --border:#e8e0d5;
  --easy:#44b39a;
  --medium:#f4a021;
  --hard:#e63b5a;
  --correct:#44b39a;
  --wrong:#e63b5a;
}
html,body{min-height:100vh;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);}
body{display:flex;flex-direction:column;align-items:center;padding:16px;}
#app{width:100%;max-width:680px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1;}100%{transform:translateY(220px) rotate(540deg);opacity:0;}}
.fade-up{animation:fadeUp 0.3s ease both;}
.shake{animation:shake 0.35s ease;}
.pop{animation:pop 0.3s ease;}

/* ── Header ── */
.header{
  background:linear-gradient(135deg,var(--p1),#e84393 150%);
  border-radius:20px;padding:16px 20px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 6px 24px rgba(244,99,30,0.25);
}
.header-left h1{font-family:'Fredoka One',cursive;font-size:1.5rem;color:#fff;line-height:1;}
.header-left p{font-size:0.75rem;color:rgba(255,255,255,0.8);margin-top:3px;font-weight:700;letter-spacing:0.05em;}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.xp-wrap{display:flex;align-items:center;gap:8px;}
.xp-stars{font-size:0.85rem;color:#fde68a;font-weight:800;}
.xp-bar{width:100px;height:10px;background:rgba(0,0,0,0.2);border-radius:6px;overflow:hidden;}
.xp-fill{height:100%;background:#fde68a;border-radius:6px;transition:width 0.5s ease;}
.streak{font-size:0.72rem;color:rgba(255,255,255,0.85);font-weight:700;}

/* ── Level tabs ── */
.level-tabs{display:flex;gap:8px;margin-bottom:14px;}
.level-tab{
  flex:1;padding:10px 6px;border-radius:14px;border:none;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:0.78rem;
  cursor:pointer;transition:all 0.18s;letter-spacing:0.04em;
  background:var(--card);color:var(--muted);border:2px solid var(--border);
}
.level-tab:hover:not(.active){transform:translateY(-2px);}
.level-tab.active.easy{background:var(--easy);color:#fff;border-color:var(--easy);box-shadow:0 4px 14px rgba(68,179,154,0.35);}
.level-tab.active.medium{background:var(--medium);color:#fff;border-color:var(--medium);box-shadow:0 4px 14px rgba(244,160,33,0.35);}
.level-tab.active.hard{background:var(--hard);color:#fff;border-color:var(--hard);box-shadow:0 4px 14px rgba(230,59,90,0.35);}

/* ── Card ── */
.card{
  background:var(--card);border-radius:20px;
  padding:clamp(18px,4vw,32px);
  box-shadow:0 4px 24px rgba(0,0,0,0.07);
  border:2px solid var(--border);
  margin-bottom:12px;
}

/* ── Story header ── */
.story-header{
  display:flex;align-items:center;gap:14px;margin-bottom:16px;
}
.story-icon{
  font-size:3rem;width:64px;height:64px;
  display:flex;align-items:center;justify-content:center;
  border-radius:16px;flex-shrink:0;
}
.story-meta{flex:1;}
.story-theme{
  font-size:0.65rem;font-weight:800;letter-spacing:0.15em;
  text-transform:uppercase;margin-bottom:3px;
}
.story-title{font-family:'Fredoka One',cursive;font-size:1.15rem;line-height:1.2;}

/* ── Task text ── */
.task-text{
  background:linear-gradient(135deg,#fff8f0,#fff3e8);
  border-radius:14px;padding:16px 18px;margin-bottom:16px;
  border-left:4px solid var(--p1);
  font-size:0.95rem;line-height:1.7;font-weight:600;
}
.task-text strong{color:var(--p1);}

/* ── Hint box ── */
.hint-box{
  background:#fffbeb;border:2px solid #fde68a;border-radius:12px;
  padding:10px 14px;margin-bottom:14px;
  font-size:0.78rem;color:#78350f;line-height:1.5;
  display:none;
}
.hint-box.show{display:block;}
.hint-toggle{
  background:none;border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:0.72rem;
  color:var(--muted);text-decoration:underline;
  display:block;margin-bottom:10px;
}

/* ── Steps ── */
.steps{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.step{
  background:#f8f8fc;border-radius:12px;padding:12px 14px;
  border:2px solid var(--border);
}
.step-label{font-size:0.72rem;font-weight:800;color:var(--muted);letter-spacing:0.08em;margin-bottom:6px;}
.step-question{font-size:0.88rem;font-weight:700;margin-bottom:8px;line-height:1.4;}
.step-input-row{display:flex;gap:8px;align-items:center;}
.step-input{
  width:110px;padding:9px 12px;font-size:1rem;text-align:center;
  font-family:'Nunito',sans-serif;font-weight:800;
  border:2px solid var(--border);border-radius:10px;
  outline:none;transition:border-color 0.2s;
  -moz-appearance:textfield;background:#fff;
}
.step-input::-webkit-inner-spin-button,.step-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.step-input:focus{border-color:var(--p2);}
.step-input.correct{border-color:var(--correct);background:#f0fdf4;}
.step-input.wrong{border-color:var(--wrong);background:#fff1f2;}
.step-unit{font-size:0.88rem;font-weight:800;color:var(--muted);}
.step-feedback{font-size:0.75rem;font-weight:700;margin-top:6px;min-height:1.1em;}
.step-feedback.correct{color:var(--correct);}
.step-feedback.wrong{color:var(--wrong);}

/* ── Progress bar ── */
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:0.72rem;color:var(--muted);font-weight:700;}
.progress-track{height:8px;background:var(--border);border-radius:6px;margin-bottom:18px;overflow:hidden;}
.progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--p1),#e84393);transition:width 0.4s ease;}

/* ── Buttons ── */
.btn-row{display:flex;gap:10px;margin-top:4px;}
.btn{
  flex:1;padding:13px;border-radius:14px;border:none;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:0.88rem;
  cursor:pointer;transition:all 0.18s;letter-spacing:0.03em;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(0);}
.btn-check{background:var(--p1);color:#fff;box-shadow:0 4px 14px rgba(244,99,30,0.3);}
.btn-next{background:var(--p2);color:#fff;box-shadow:0 4px 14px rgba(46,134,171,0.3);display:none;}
.btn-hint{background:var(--bg);color:var(--muted);border:2px solid var(--border);}
.btn.show{display:block;}

/* ── Result screen ── */
.result-screen{text-align:center;padding:16px 0;}
.result-icon{font-size:4.5rem;margin-bottom:10px;}
.result-title{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--p1);margin-bottom:6px;}
.result-sub{color:var(--muted);font-size:0.88rem;margin-bottom:20px;line-height:1.6;}
.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
.result-stat{
  background:var(--bg);border-radius:14px;padding:14px 8px;
  border:2px solid var(--border);
}
.result-stat-num{font-family:'Fredoka One',cursive;font-size:1.8rem;color:var(--p1);}
.result-stat-label{font-size:0.68rem;color:var(--muted);font-weight:700;letter-spacing:0.05em;margin-top:2px;}
.restart-btn{
  padding:14px 32px;border-radius:14px;border:none;
  background:var(--p1);color:#fff;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;
  cursor:pointer;box-shadow:0 4px 16px rgba(244,99,30,0.3);
  transition:all 0.18s;
}
.restart-btn:hover{transform:translateY(-2px);}

/* ── Start screen ── */
.start-screen{
  display:flex;flex-direction:column;align-items:center;
  gap:20px;padding:20px 0;text-align:center;
}
.start-icon{font-size:4rem;}
.start-title{font-family:'Fredoka One',cursive;font-size:2.2rem;color:var(--p1);}
.start-desc{color:var(--muted);font-size:0.88rem;line-height:1.6;max-width:380px;}
.start-topics{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  margin:4px 0;
}
.topic-chip{
  padding:6px 14px;border-radius:20px;
  font-size:0.75rem;font-weight:800;letter-spacing:0.05em;
}
.start-btn{
  padding:15px 48px;border-radius:16px;border:none;
  background:var(--p1);color:#fff;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;
  cursor:pointer;box-shadow:0 6px 20px rgba(244,99,30,0.35);
  transition:all 0.18s;letter-spacing:0.05em;
}
.start-btn:hover{transform:translateY(-3px);}

.confetti-piece{position:fixed;border-radius:2px;pointer-events:none;z-index:999;animation:confetti 1.6s ease-out forwards;}
</style>
</head>

        {q:'Gesamtstrecke in km: wie viele ganze km?',answer:6,unit:'km',fb:'6 700 m = 6 km + 700 m → 6 km ✓'},
      ],
    },
    {
      theme:'🐬 Natur',themeColor:'#e0f2fe',themeText:'#0c4a6e',
      title:'Der Delfin-Forscher',
      icon:'🐬',iconBg:'#e0f2fe',
      text:'Forscher Ben beobachtet Delfine. Delfin A schwimmt <strong>1 km 200 m</strong>, Delfin B schwimmt <strong>850 m</strong> weniger als A. Wie weit schwimmen beide zusammen?',
      hint:'Erst Delfin B berechnen (A minus 850 m), dann beide addieren!',
      steps:[
        {q:'Delfin A in Meter: 1 km 200 m = ? m',answer:1200,unit:'m',fb:'1 × 1 000 + 200 = 1 200 m ✓'},
        {q:'Delfin B in Meter: A − 850 m = ? m',answer:350,unit:'m',fb:'1 200 − 850 = 350 m ✓'},
        {q:'Beide zusammen in Meter?',answer:1550,unit:'m',fb:'1 200 + 350 = 1 550 m ✓'},
      ],
    },
  ],
};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const G = {
  phase: 'start',   // start | game | result
  level: 'easy',
  taskIdx: 0,
  stepIdx: 0,
  stars: 0,
  streak: 0,
  correct: 0,
  total: 0,
  taskOrder: [],
  stepsDone: [],   // per task: array of booleans
  hintShown: false,
};

function tasks() { return TASKS[G.level]; }
function task()  { return tasks()[G.taskOrder[G.taskIdx]]; }

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (G.phase==='start') renderStart(app);
  else if (G.phase==='game') renderGame(app);
  else if (G.phase==='result') renderResult(app);
}

// ── START ──
function renderStart(app) {
  const div = document.createElement('div');
  div.className='card fade-up';
  div.innerHTML=`
    <div class="start-screen">
      <div class="start-icon">📏</div>
      <div class="start-title">Sachaufgaben</div>
      <div class="start-desc">Übe Längeneinheiten, Umrechnen, Addition und Subtraktion – mit spannenden Geschichten!</div>
      <div class="start-topics">
        <span class="topic-chip" style="background:#dbeafe;color:#1d4ed8;">🏫 Schule</span>
        <span class="topic-chip" style="background:#fef9c3;color:#713f12;">⚽ Sport</span>
        <span class="topic-chip" style="background:#dcfce7;color:#166534;">🌿 Natur</span>
        <span class="topic-chip" style="background:#cffafe;color:#164e63;">🗺️ Abenteuer</span>
      </div>
      <div style="font-size:0.78rem;color:var(--muted);font-weight:700;letter-spacing:0.05em;">SCHWIERIGKEITSGRAD WÄHLEN</div>
      <div style="display:flex;gap:10px;width:100%;max-width:360px;">
        <button onclick="startGame('easy')" style="flex:1;padding:14px;border-radius:14px;border:none;background:var(--easy);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:0.85rem;cursor:pointer;box-shadow:0 4px 14px rgba(68,179,154,0.3);">🟢 Leicht</button>
        <button onclick="startGame('medium')" style="flex:1;padding:14px;border-radius:14px;border:none;background:var(--medium);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:0.85rem;cursor:pointer;box-shadow:0 4px 14px rgba(244,160,33,0.3);">🟡 Mittel</button>
        <button onclick="startGame('hard')" style="flex:1;padding:14px;border-radius:14px;border:none;background:var(--hard);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:0.85rem;cursor:pointer;box-shadow:0 4px 14px rgba(230,59,90,0.3);">🔴 Schwer</button>
      </div>
    </div>
  `;
  app.appendChild(div);
}

// ── GAME ──
function renderGame(app) {
  const t = task();
  const levelTasks = tasks();
  const pct = Math.round((G.taskIdx / levelTasks.length) * 100);
  const maxStars = tasks().reduce((s,t)=>s+t.steps.length,0)*3;
  const xpPct = Math.min(100,Math.round(G.stars/maxStars*100));
  const levelColor = {easy:'var(--easy)',medium:'var(--medium)',hard:'var(--hard)'}[G.level];
  const levelLabel = {easy:'🟢 Leicht',medium:'🟡 Mittel',hard:'🔴 Schwer'}[G.level];

  // header
  const header = document.createElement('div');
  header.className='header';
  header.innerHTML=`
    <div class="header-left">
      <h1>📏 Sachaufgaben</h1>
      <p>KLASSE 5 · LÄNGENEINHEITEN</p>
    </div>
    <div class="header-right">
      <div class="xp-wrap">
        <span class="xp-stars">⭐ ${G.stars}</span>
        <div class="xp-bar"><div class="xp-fill" style="width:${xpPct}%"></div></div>
      </div>
      <div class="streak">${G.streak>1?'🔥 '+G.streak+'er Serie!':levelLabel}</div>
    </div>
  `;
  app.appendChild(header);

  // level tabs
  const tabs = document.createElement('div');
  tabs.className='level-tabs';
  ['easy','medium','hard'].forEach(l=>{
    const btn=document.createElement('button');
    btn.className=`level-tab ${l}${G.level===l?' active':''}`;
    btn.textContent={easy:'🟢 Leicht',medium:'🟡 Mittel',hard:'🔴 Schwer'}[l];
    btn.onclick=()=>{ G.level=l; startGame(l); };
    tabs.appendChild(btn);
  });
  app.appendChild(tabs);

  // card
  const card = document.createElement('div');
  card.className='card fade-up';

  // progress
  card.innerHTML+=`
    <div class="progress-row">
      <span>Aufgabe ${G.taskIdx+1} von ${levelTasks.length}</span>
      <span style="color:${levelColor};">${pct}% geschafft</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;

  // story header
  card.innerHTML+=`
    <div class="story-header">
      <div class="story-icon" style="background:${t.iconBg};">${t.icon}</div>
      <div class="story-meta">
        <div class="story-theme" style="color:${t.themeText};">${t.theme}</div>
        <div class="story-title">${t.title}</div>
      </div>
    </div>
  `;

  // task text
  card.innerHTML+=`<div class="task-text">${t.text}</div>`;

  // hint toggle
  card.innerHTML+=`
    <button class="hint-toggle" onclick="toggleHint()">💡 Tipp anzeigen</button>
    <div class="hint-box${G.hintShown?' show':''}" id="hint-box">💡 ${t.hint}</div>
  `;

  // steps
  const stepsDiv = document.createElement('div');
  stepsDiv.className='steps';
  t.steps.forEach((step,i)=>{
    const done = G.stepsDone[G.taskIdx] && G.stepsDone[G.taskIdx][i] !== undefined;
    const wasCorrect = done && G.stepsDone[G.taskIdx][i];
    const stepDiv = document.createElement('div');
    stepDiv.className='step';
    stepDiv.id='step-'+i;
    stepDiv.innerHTML=`
      <div class="step-label">TEILAUFGABE ${i+1}</div>
      <div class="step-question">${step.q}</div>
      <div class="step-input-row">
        <input class="step-input${done?(wasCorrect?' correct':' wrong'):''}"
          type="number" id="inp-${i}"
          placeholder="?"
          value="${done?(wasCorrect?step.answer:(G.stepsDone[G.taskIdx]?.given?.[i]??'')):''}",
          ${done?'disabled':''}
          step="any"
        />
        <span class="step-unit">${step.unit}</span>
      </div>
      <div class="step-feedback${done?(wasCorrect?' correct':' wrong'):''}" id="fb-${i}">
        ${done?(wasCorrect?'✅ '+step.fb:'❌ Falsch – Richtig: '+step.answer+' '+step.unit):''}
      </div>
    `;
    stepsDiv.appendChild(stepDiv);
  });
  card.appendChild(stepsDiv);

  // buttons
  const allDone = G.stepsDone[G.taskIdx] &&
    Object.keys(G.stepsDone[G.taskIdx]).filter(k=>k!=='given'&&k!=='undefined').length === t.steps.length;
  const btnRow = document.createElement('div');
  btnRow.className='btn-row';
  btnRow.innerHTML=`
    <button class="btn btn-check" id="btn-check" onclick="checkAnswers()" ${allDone?'style="display:none"':''}>✅ Prüfen</button>
    <button class="btn btn-next show" id="btn-next" onclick="nextTask()" style="${allDone?'':'display:none'}">
      ${G.taskIdx+1<levelTasks.length?'Nächste Aufgabe →':'🏁 Auswertung'}
    </button>
  `;
  card.appendChild(btnRow);
  app.appendChild(card);

  // focus first empty input
  setTimeout(()=>{
    const first = document.querySelector('.step-input:not([disabled])');
    first?.focus();
  },60);
}

// ── RESULT ──
function renderResult(app) {
  const total = G.total;
  const correct = G.correct;
  const pct = total>0?Math.round(correct/total*100):0;
  const emoji = pct===100?'🏆':pct>=80?'🎯':pct>=60?'💪':'📚';
  const msg = pct===100?'Perfekt! Alle Aufgaben richtig!':pct>=80?'Super gemacht!':pct>=60?'Gut! Übe weiter!':'Nochmal versuchen!';

  const header = document.createElement('div');
  header.className='header';
  header.innerHTML=`<div class="header-left"><h1>📏 Sachaufgaben</h1><p>AUSWERTUNG</p></div>`;
  app.appendChild(header);

  const card = document.createElement('div');
  card.className='card fade-up';
  card.innerHTML=`
    <div class="result-screen">
      <div class="result-icon">${emoji}</div>
      <div class="result-title">${msg}</div>
      <div class="result-sub">
        Du hast alle ${tasks().length} Aufgaben bearbeitet.<br>
        Schwierigkeit: ${{easy:'🟢 Leicht',medium:'🟡 Mittel',hard:'🔴 Schwer'}[G.level]}
      </div>
      <div class="result-grid">
        <div class="result-stat">
          <div class="result-stat-num">${correct}</div>
          <div class="result-stat-label">RICHTIG</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-num" style="color:var(--wrong);">${total-correct}</div>
          <div class="result-stat-label">FALSCH</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-num">${G.stars}⭐</div>
          <div class="result-stat-label">STERNE</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="restart-btn" onclick="startGame('${G.level}')">🔄 Nochmal (${({easy:'Leicht',medium:'Mittel',hard:'Schwer'})[G.level]})</button>
        <button class="restart-btn" style="background:var(--p2);" onclick="G.phase='start';render();">← Zurück</button>
      </div>
    </div>
  `;
  app.appendChild(card);
  spawnConfetti();
}

// ═══════════════════════════════════════════════════════
// LOGIC
// ═══════════════════════════════════════════════════════
function startGame(level) {
  G.level = level;
  G.taskIdx = 0;
  G.stars = 0;
  G.streak = 0;
  G.correct = 0;
  G.total = 0;
  G.hintShown = false;
  G.taskOrder = shuffle(tasks().map((_,i)=>i));
  G.stepsDone = tasks().map(()=>({}));
  G.phase = 'game';
  render();
}

function checkAnswers() {
  const t = task();
  if (!G.stepsDone[G.taskIdx]) G.stepsDone[G.taskIdx]={};
  let anyWrong = false;

  t.steps.forEach((step,i)=>{
    if (G.stepsDone[G.taskIdx][i] !== undefined) return; // already checked
    const inp = document.getElementById('inp-'+i);
    if (!inp || inp.value==='') return;
    const val = parseFloat(inp.value.replace(',','.'));
    const correct = Math.abs(val - step.answer) < 0.001;
    G.stepsDone[G.taskIdx][i] = correct;
    if (!G.stepsDone[G.taskIdx].given) G.stepsDone[G.taskIdx].given={};
    G.stepsDone[G.taskIdx].given[i] = val;
    G.total++;
    if (correct) { G.correct++; G.stars+=3; G.streak++; }
    else { G.stars=Math.max(0,G.stars); G.streak=0; anyWrong=true; }

    // update UI
    inp.disabled=true;
    inp.className='step-input '+(correct?'correct':'wrong');
    const fb=document.getElementById('fb-'+i);
    if(fb){
      fb.className='step-feedback '+(correct?'correct':'wrong');
      fb.textContent=correct?'✅ '+step.fb:'❌ Falsch – Richtig: '+step.answer+' '+step.unit;
    }
    const stepEl=document.getElementById('step-'+i);
    if(stepEl) stepEl.classList.add(correct?'pop':'shake');
  });

  // check if all done
  const filled = Object.keys(G.stepsDone[G.taskIdx]).filter(k=>k!=='given'&&k!=='undefined').length;
  if (filled >= t.steps.length) {
    document.getElementById('btn-check').style.display='none';
    const nb=document.getElementById('btn-next');
    if(nb){ nb.style.display='block'; nb.textContent=G.taskIdx+1<tasks().length?'Nächste Aufgabe →':'🏁 Auswertung'; }
    if(!anyWrong) spawnStars();
  }
}

function nextTask() {
  G.taskIdx++;
  G.hintShown=false;
  if (G.taskIdx >= tasks().length) {
    G.phase='result';
  }
  render();
}

function toggleHint() {
  G.hintShown=!G.hintShown;
  const hb=document.getElementById('hint-box');
  const btn=document.querySelector('.hint-toggle');
  if(hb) hb.className='hint-box'+(G.hintShown?' show':'');
  if(btn) btn.textContent=G.hintShown?'💡 Tipp ausblenden':'💡 Tipp anzeigen';
}

// ═══════════════════════════════════════════════════════
// EFFECTS
// ═══════════════════════════════════════════════════════
function spawnStars() {
  for(let i=0;i<8;i++){
    const s=document.createElement('div');
    s.textContent='⭐';
    s.style.cssText=`position:fixed;font-size:1.4rem;pointer-events:none;z-index:999;
      left:${20+Math.random()*60}vw;top:${20+Math.random()*40}vh;
      animation:confetti 1.2s ease-out ${i*0.08}s forwards;`;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1500);
  }
}

function spawnConfetti() {
  const colors=['#f4631e','#2e86ab','#44b39a','#f4a021','#e63b5a','#fde68a'];
  for(let i=0;i<35;i++){
    const c=document.createElement('div');
    c.className='confetti-piece';
    c.style.cssText=`left:${Math.random()*100}vw;top:-10px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${7+Math.random()*9}px;height:${7+Math.random()*9}px;
      animation-delay:${Math.random()*0.8}s;
      animation-duration:${1.3+Math.random()*0.9}s;
      transform:rotate(${Math.random()*360}deg);`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2500);
  }
}

// Enter key support
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&G.phase==='game') checkAnswers();
});

// ── Init ──
render();
</script>
