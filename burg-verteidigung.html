<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Burg-Verteidigung – Lernwelt</title>
  <!--
  ═══════════════════════════════════════════════
   LERNWELT – Burg-Verteidigung (Tower Defense)
   Richtige Antworten bringen Münzen, Münzen bauen Türme,
   Türme halten die Monster von der Burg fern. Die eigene
   Figur steht als Burgherr/Burgherrin auf der Burg.

   Modi:   Runde (6 Wellen, XP wie jede App, Burg fällt nicht)
           Endlos (bis die Burg fällt, Rekord = erreichte Welle,
           XP über LernPass.awardEndless)
   Fragen: aufgaben.js (Klassenfilter über den Pass)
   Links:  burg-verteidigung.html?pool=vok5&bis=unit3
           burg-verteidigung.html?pool=1x1-klein&modus=endlos
   Braucht: navbar.js, aufgaben.js, avatar3d.js, vendor/three.min.js
   Speicher: lern-burg-wahl, lern-burg-rekorde (localStorage)
  ═══════════════════════════════════════════════
  -->
  <link rel="stylesheet" href="fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e1a; --panel: rgba(27,25,41,.92); --surface: #1b1929;
      --accent: #e6a817; --accent2: #fde68a; --indigo: #6366f1; --indigo2: #818cf8;
      --text: #f1f0fb; --text2: rgba(241,240,251,.72); --muted: rgba(241,240,251,.45);
      --green: #4ade80; --red: #f87171;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Nunito', system-ui, sans-serif; background: #7fc27f; color: var(--text);
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--indigo2); outline-offset: 2px; }
    [hidden] { display: none !important; }

    #stage { position: fixed; inset: 0; touch-action: none; }
    #stage canvas { display: block; width: 100%; height: 100%; }

    /* ── HUD ─────────────────────────────── */
    #hud { position: fixed; inset: 0; pointer-events: none; }
    .hud-top { position: absolute; top: max(.6rem, env(safe-area-inset-top)); left: .6rem; right: .6rem;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: .5rem; }
    .chip { background: var(--panel); border-radius: 14px; padding: .45rem .75rem; font-weight: 900; font-size: 1rem;
      display: inline-flex; align-items: center; gap: .4rem; box-shadow: 0 6px 18px rgba(0,0,0,.25); white-space: nowrap; }
    .hud-left { justify-self: start; display: flex; flex-direction: column; gap: .4rem; align-items: flex-start; }
    .hud-right { justify-self: end; display: flex; gap: .4rem; align-items: center; }
    .pause-btn { pointer-events: auto; width: 44px; height: 44px; justify-content: center; font-size: 1.1rem; padding: 0; }
    #hud-coins { font-size: 1.15rem; transition: transform .15s; }
    #hud-coins.pop { transform: scale(1.15); }
    #hud-coins .serie { color: #fb923c; font-size: .9rem; }
    .hearts.hit { animation: hit .4s; }
    @keyframes hit { 30% { transform: scale(1.25); color: var(--red); } }
    #reparatur { pointer-events: auto; min-height: 44px; font-size: .92rem; }
    #reparatur:disabled { opacity: .5; cursor: default; }
    #naechste { pointer-events: auto; gap: .5rem; padding: .3rem .35rem .3rem .75rem; }
    #naechste button { background: var(--accent); color: #231a02; border-radius: 10px; min-height: 44px; padding: 0 .8rem; font-weight: 900; }
    .qcard { background: var(--panel); border-radius: 20px; padding: .55rem 1.5rem .7rem; text-align: center;
      max-width: min(760px, 62vw); min-width: min(360px, 60vw); box-shadow: 0 10px 30px rgba(0,0,0,.3); border: 1px solid rgba(230,168,23,.3); }
    .qhint { font-size: .95rem; font-weight: 800; color: var(--muted); min-height: 1.2em; }
    .qtext { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(2.1rem, 5.6vw, 3.8rem); line-height: 1.1; color: var(--text); overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
    .qtext.in { animation: pop .3s cubic-bezier(.2,.9,.3,1.3); }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (max-width: 760px), (orientation: portrait) {
      .hud-top { grid-template-columns: 1fr auto; }
      .qcard { grid-column: 1 / -1; grid-row: 2; max-width: none; min-width: 0; justify-self: stretch; }
    }

    .answers { position: absolute; left: 50%; bottom: max(.8rem, env(safe-area-inset-bottom)); transform: translateX(-50%);
      width: min(820px, calc(100% - 1.2rem)); display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; pointer-events: auto; }
    .ans { position: relative; background: var(--panel); border-radius: 16px; min-height: 68px; padding: .5rem .6rem; font-weight: 900;
      font-size: clamp(1.05rem, 2.5vw, 1.45rem); line-height: 1.15; border: 3px solid rgba(255,255,255,.08); transition: border-color .12s, opacity .12s, transform .1s;
      box-shadow: 0 8px 22px rgba(0,0,0,.28); overflow-wrap: anywhere; }
    .ans:active:not(:disabled) { transform: scale(.97); }
    .ans:disabled { cursor: default; }
    .ans.wait { opacity: .5; }
    .ans.ok { background: #14532d; border-color: var(--green); opacity: 1; }
    .ans.bad { background: #5b1a24; border-color: var(--red); opacity: 1; }
    .sperre { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(max(.8rem, env(safe-area-inset-bottom)) + 76px);
      width: min(820px, calc(100% - 1.2rem)); height: 6px; border-radius: 99px; background: rgba(15,14,26,.35); overflow: hidden; opacity: 0; transition: opacity .15s; }
    .sperre.show { opacity: 1; }
    .sperre i { display: block; height: 100%; background: var(--red); border-radius: 99px; transform-origin: left; }

    .flash { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font-family: 'Fredoka One', 'Nunito', sans-serif;
      font-size: clamp(1.3rem, 3.6vw, 2.2rem); padding: .45rem 1.1rem; border-radius: 18px; background: var(--panel); opacity: 0;
      transition: opacity .15s; text-align: center; max-width: 92vw; }
    .flash.show { opacity: 1; }
    .flash.ok { color: var(--accent2); }
    .flash.bad { color: var(--red); font-size: clamp(1.1rem, 3vw, 1.7rem); }
    .flash.info { color: var(--text); font-size: clamp(1rem, 2.6vw, 1.4rem); }
    .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Fredoka One', 'Nunito', sans-serif;
      font-size: clamp(4rem, 14vw, 8rem); color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.35); pointer-events: none; }

    /* ── Baumenü (am Bauplatz) ───────────── */
    #baumenu { position: absolute; left: 0; top: 0; pointer-events: auto; background: var(--panel); border-radius: 18px; padding: .45rem;
      box-shadow: 0 12px 34px rgba(0,0,0,.4); border: 2px solid rgba(230,168,23,.45); display: flex; flex-direction: column; gap: .35rem; }
    #baumenu .titel { font-weight: 900; font-size: .85rem; color: var(--text2); text-align: center; padding: 0 .3rem; }
    #baumenu .reihe { display: flex; gap: .4rem; }
    #baumenu button { min-width: 72px; min-height: 72px; border-radius: 14px; background: rgba(255,255,255,.08); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .05rem; padding: .3rem .45rem; font-weight: 900; line-height: 1.1; border: 2px solid transparent; }
    #baumenu button .i { font-size: 1.6rem; }
    #baumenu button b { font-size: .82rem; }
    #baumenu button small { font-size: .8rem; color: var(--accent2); font-weight: 900; }
    #baumenu button:not(:disabled):active { transform: scale(.96); }
    #baumenu button.kaufbar { border-color: var(--accent); background: rgba(230,168,23,.16); }
    #baumenu button:disabled { opacity: .42; cursor: default; }
    #baumenu button.zu { min-width: 44px; min-height: 44px; }

    /* ── Menü & Ergebnis ─────────────────── */
    .overlay { position: fixed; inset: 0; display: flex; align-items: center; padding: 1rem 1rem calc(4.5rem + env(safe-area-inset-bottom)); overflow-y: auto; }
    .sheet { width: min(470px, 100%); background: var(--panel); border-radius: 22px; padding: 1.3rem 1.3rem 1.2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.35); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); margin: auto 0; }
    @media (min-width: 800px) and (orientation: landscape) { .overlay { padding-left: max(2rem, 5vw); } }
    @media (orientation: portrait) { .overlay { align-items: flex-end; } .sheet { margin: 0 auto; } }
    h1 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; color: var(--accent); font-size: 2.1rem; line-height: 1.05; }
    .lead { color: var(--text2); font-size: .92rem; margin: .3rem 0 .9rem; }
    .lbl { display: block; font-size: .8rem; font-weight: 900; color: var(--muted); margin: .85rem 0 .4rem; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; background: rgba(255,255,255,.06); border-radius: 14px; padding: 4px; gap: 4px; }
    .seg button { border-radius: 11px; padding: .55rem .5rem; min-height: 52px; font-weight: 900; font-size: .98rem; color: var(--text2); }
    .seg button small { display: block; font-size: .74rem; font-weight: 800; color: var(--muted); }
    .seg button.on { background: var(--accent); color: #231a02; }
    .seg button.on small { color: rgba(35,26,2,.7); }
    .tabs { display: flex; gap: .35rem; flex-wrap: wrap; }
    .tabs button { min-height: 44px; padding: .4rem .9rem; border-radius: 99px; font-weight: 900; font-size: .88rem; background: rgba(255,255,255,.06); color: var(--text2); }
    .tabs button.on { background: var(--indigo); color: #fff; }
    .pools { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .55rem; }
    .pools button { min-height: 44px; padding: .45rem .75rem; border-radius: 12px; font-weight: 800; font-size: .88rem; background: rgba(255,255,255,.06);
      border: 2px solid transparent; text-align: left; }
    .pools button.on { border-color: var(--accent); background: rgba(230,168,23,.14); color: var(--accent2); }
    .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    select { font: inherit; font-weight: 800; font-size: .9rem; background: #252238; color: var(--text); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: .55rem .6rem; min-height: 44px; max-width: 100%; }
    .note { font-size: .82rem; color: var(--muted); margin-top: .5rem; font-weight: 700; }
    .note b { color: var(--accent2); }
    .unten { display: flex; gap: .5rem; margin-top: 1rem; }
    .go { flex: 1; background: var(--accent); color: #231a02; font-weight: 900; font-size: 1.2rem;
      padding: .9rem; min-height: 56px; border-radius: 16px; box-shadow: 0 8px 24px rgba(230,168,23,.3); }
    .go:active { transform: scale(.98); }
    .go:disabled { opacity: .45; cursor: default; }
    .ton { min-width: 56px; min-height: 56px; border-radius: 16px; background: rgba(255,255,255,.08); font-size: 1.3rem; }
    .err { color: var(--red); font-weight: 800; font-size: .85rem; margin-top: .5rem; }

    .big { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 3.4rem; color: var(--accent); line-height: 1; }
    .big small { font-size: 1.4rem; color: var(--text2); }
    .kronen { font-size: 1.9rem; margin-top: .35rem; letter-spacing: .1em; }
    .kronen .off { filter: grayscale(1); opacity: .3; }
    .rmsg { font-weight: 900; font-size: 1.1rem; margin: .4rem 0 .2rem; }
    .rsub { color: var(--text2); font-size: .92rem; }
    .record { display: inline-block; margin-top: .5rem; background: rgba(230,168,23,.18); color: var(--accent2); font-weight: 900;
      padding: .3rem .8rem; border-radius: 99px; font-size: .9rem; }
    .fehler { margin-top: .9rem; background: rgba(255,255,255,.04); border-radius: 12px; padding: .65rem .8rem; max-height: 30vh; overflow-y: auto; }
    .fehler h3 { font-size: .82rem; color: var(--muted); font-weight: 900; margin-bottom: .35rem; }
    .fehler li { list-style: none; font-size: .9rem; padding: .2rem 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .fehler li b { color: var(--green); }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 1rem; }
    .btn { padding: .8rem; min-height: 52px; border-radius: 14px; font-weight: 900; font-size: 1rem; background: rgba(255,255,255,.08); }
    .btn.primary { background: var(--accent); color: #231a02; }

    #pause { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,14,26,.55); }
    #pause .sheet { text-align: center; width: min(360px, 92vw); }

    @media (prefers-reduced-motion: reduce) {
      .qtext.in, .hearts.hit { animation: none; }
      #hud-coins { transition: none; }
    }
  </style>
</head>
<body>

<div id="stage" aria-hidden="true"></div>

<!-- ── HUD (während des Spiels) ─────────────────── -->
<div id="hud" hidden>
  <div class="hud-top" id="hud-top">
    <div class="hud-left">
      <div class="chip" id="hud-welle"></div>
      <div class="chip hearts" id="hud-herzen"></div>
      <button class="chip" id="reparatur" type="button" hidden></button>
      <div class="chip" id="naechste" hidden><span id="naechste-text"></span><button type="button" id="naechste-btn">Los ▶</button></div>
    </div>
    <div class="qcard" aria-live="polite">
      <div class="qhint" id="q-hint"></div>
      <div class="qtext" id="q-text"></div>
    </div>
    <div class="hud-right">
      <div class="chip" id="hud-coins" title="Münzen">🪙 0</div>
      <button class="chip pause-btn" id="pause-btn" type="button" aria-label="Pause">⏸</button>
    </div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="count" id="count"></div>
  <div id="baumenu" hidden></div>
  <div class="sperre" id="sperre"><i id="sperre-bar"></i></div>
  <div class="answers" id="answers">
    <button class="ans" type="button" data-i="0"></button>
    <button class="ans" type="button" data-i="1"></button>
    <button class="ans" type="button" data-i="2"></button>
  </div>
</div>

<!-- ── Menü ────────────────────────────────────── -->
<div class="overlay" id="menu">
  <div class="sheet">
    <h1>🏰 Burg-Verteidigung</h1>
    <p class="lead">Richtige Antworten bringen Münzen. Tippe auf eine Steinplatte und bau Türme – so kommt kein Monster in deine Burg!</p>

    <div class="seg" id="mode-seg">
      <button type="button" data-mode="runde" class="on">Runde<small>6 Wellen</small></button>
      <button type="button" data-mode="endlos">Endlos<small>bis die Burg fällt</small></button>
    </div>

    <div id="klasse-box" hidden>
      <span class="lbl">Deine Klasse</span>
      <div class="tabs" id="klasse-tabs"></div>
    </div>

    <span class="lbl">Thema</span>
    <div class="tabs" id="fach-tabs"></div>
    <div class="pools" id="pool-list"></div>
    <div class="tabs" style="margin-top:.55rem"><button type="button" id="mix-btn">🔀 Mehrere Themen mischen</button></div>
    <p class="note" id="lehrer-note" hidden>Deine Lehrkraft hat dieses Thema ausgewählt.</p>

    <div id="vok-box" hidden>
      <span class="lbl">Vokabeln</span>
      <div class="row">
        <select id="vok-bis" aria-label="Vokabeln bis Unit"><option value="">Alle Units</option></select>
        <select id="vok-richtung" aria-label="Richtung">
          <option value="de-en">Deutsch → Englisch</option>
          <option value="en-de">Englisch → Deutsch</option>
        </select>
      </div>
    </div>

    <div id="tempo-box">
      <span class="lbl">Tempo der Monster</span>
      <div class="tabs" id="tempo-tabs">
        <button type="button" data-tempo="gemuetlich">🐢 Gemütlich</button>
        <button type="button" data-tempo="normal" class="on">🚶 Normal</button>
        <button type="button" data-tempo="schnell">⚡ Schnell</button>
      </div>
    </div>
    <p class="note" id="rekord-note" hidden></p>

    <div class="unten">
      <button class="go" id="go" type="button" disabled>Los geht's!</button>
      <button class="ton" id="ton-btn" type="button" aria-label="Ton an oder aus">🔇</button>
    </div>
    <div class="err" id="menu-err"></div>
  </div>
</div>

<!-- ── Ergebnis ─────────────────────────────────── -->
<div class="overlay" id="result" hidden>
  <div class="sheet" id="result-body"></div>
</div>

<!-- ── Pause ───────────────────────────────────── -->
<div id="pause" hidden>
  <div class="sheet">
    <h1 style="font-size:1.8rem">Pause</h1>
    <div class="btns">
      <button class="btn primary" id="resume" type="button">Weiter</button>
      <button class="btn" id="quit" type="button">Beenden</button>
    </div>
  </div>
</div>

<script src="navbar.js"></script>
<script src="aufgaben.js"></script>
<script src="avatar3d.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   EINSTELLUNGEN (hier anpassen)
   Zeiten in Sekunden, Tempo in Welteinheiten pro Sekunde
   (1 Feld der Karte = 16 Einheiten).
   ═══════════════════════════════════════════════════════ */
const CFG = {
  // ── Münzen & Antworten ────────────────────────────
  startMuenzen: 60,                  // Münzen zu Beginn (reicht für einen Turm)
  muenzen: { basis: 10, serie3: 15, serie6: 20 },   // pro richtiger Antwort; ab 3 bzw. 6 richtigen in Folge mehr
  sperreFalsch: 2.0,                 // Sperre nach falscher Antwort (Lösung wird so lange gezeigt)
  sperreNeu: 0.4,                    // neue Frage: Buttons so lange gesperrt (gegen Reflextippen)
  pauseRichtig: 0.35,                // kurzer Moment „grün“, dann kommt die nächste Frage

  // ── Burg ──────────────────────────────────────────
  burgHerzen: 10,                    // Herzen der Burg (Runde: Burg fällt nie, Herzen geben Kronen)
  reparatur: { preis: 100, plus: 50 },   // Burg reparieren: +1 ❤️; jede weitere Reparatur kostet 50 mehr

  // ── Wellen ────────────────────────────────────────
  pauseErste: 12,                    // Bauzeit vor der ersten Welle
  pauseZwischen: 8,                  // Pause zwischen zwei Wellen (Fragen laufen weiter)
  gruppenAbstand: 1.4,               // Lücke zwischen zwei Gegnergruppen einer Welle
  hpProWelle: .15,                   // Runde: jede Welle +15 % Lebenspunkte
  // Runde: je Welle Gruppen aus [Gegner, Anzahl, Abstand in s]
  wellen: [
    [['schleim', 8, 2.0]],
    [['schleim', 8, 1.6], ['flitzer', 5, 1.0]],
    [['schleim', 6, 1.5], ['ritter', 3, 2.6], ['flitzer', 5, 0.9]],
    [['flitzer', 7, 0.9], ['ritter', 4, 2.3], ['schleim', 8, 1.3]],
    [['ritter', 5, 2.1], ['schleim', 10, 1.1], ['flitzer', 8, 0.8]],
    [['schleim', 8, 1.2], ['ritter', 4, 2.0], ['boss', 1, 0]],
  ],
  // Runde: Wellenstärke passt sich an die verdienten Münzen an
  anpassung: { an: true, erwartetProMin: 130, min: .5, max: 2.0 },

  // ── Tempo ─────────────────────────────────────────
  grundTempo: 18.5,                  // Schleim bei „Normal“ (ca. 28 s für den ganzen Weg)
  tempo: { gemuetlich: .8, normal: 1, schnell: 1.2 },   // Runde: Tempo-Stufen im Menü
  lesezeit: { referenz: 2.3, min: .75, max: 1.1 },      // Thema mit langer Lesezeit → Monster langsamer

  // ── Endlos ────────────────────────────────────────
  endlos: {
    hpFaktor: 1.24,                  // Lebenspunkte je Welle × 1,24 (gute Kinder schaffen ca. Welle 10–12)
    tempoProWelle: .02, tempoMax: 1.5,
    anzahlBasis: 8, anzahlProWelle: 2,
    bossAlle: 5,                     // jede 5. Welle ein Boss
    herzenNachBoss: 2,               // Belohnung nach einer Boss-Welle (höchstens bis burgHerzen)
  },

  // ── Gegner ────────────────────────────────────────
  gegner: {
    schleim: { name: 'Schleim', hp: 40,  tempo: 1.0, schaden: 1 },
    flitzer: { name: 'Flitzer', hp: 24,  tempo: 1.8, schaden: 1 },
    ritter:  { name: 'Ritter',  hp: 115, tempo: 0.6, schaden: 2, ruestung: .5 },   // Pfeile machen nur halben Schaden
    boss:    { name: 'Boss',    hp: 520, tempo: 0.5, schaden: 3, frostHalb: true }, // Frost bremst ihn nur halb
  },

  // ── Türme (je Stufe 1 / 2 / 3; preis[0] = Bauen, preis[1..2] = Aufwerten) ──
  tuerme: {
    bogen:  { name: 'Bogen',  icon: '🏹', preis: [50, 40, 70],  schaden: [10, 15, 22], rate: [1.2, 1.4, 1.6], reichweite: [3.0, 3.3, 3.6] },
    kanone: { name: 'Kanone', icon: '💣', preis: [80, 60, 100], schaden: [22, 34, 50], rate: [.5, .55, .6],  reichweite: [2.6, 2.8, 3.0], flaeche: 1.1 },
    frost:  { name: 'Frost',  icon: '❄️', preis: [60, 50, 80],  schaden: [3, 5, 8],    rate: [1, 1.1, 1.2],  reichweite: [2.6, 2.9, 3.2], flaeche: .8,
              bremse: [.4, .5, .6], bremsDauer: 1.5 },
  },
  abrissAnteil: .5,                  // Abreißen gibt diesen Anteil der investierten Münzen zurück

  // ── Technik ───────────────────────────────────────
  figurGroesse: .72,                 // Größe der eigenen Figur auf der Burg
  minFps: 40,                        // darunter wird die Auflösung gesenkt
  zeitraffer: 1,                     // nur zum Testen (2 = doppelt so schnell)
};

const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const APP_KEY = (location.pathname.split('/').pop() || 'burg-verteidigung.html');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ── Karte (Felder: 14 × 9) ──────────────────────── */
const TILE = 16;
const KARTE = {
  spalten: 14, zeilen: 9,
  weg: [[-2, 1.5], [9.5, 1.5], [9.5, 4.5], [2.5, 4.5], [2.5, 7.5], [11.35, 7.5]],   // Mittellinie des Wegs
  plaetze: [[4, 3], [7, 3], [11.5, 3], [4.6, 6], [7.5, 6], [.9, 6], [5.5, 8.5], [9, 8.5]],
  burg: [12.6, 7.4],
};
const gw = (gx, gy) => [(gx - KARTE.spalten / 2) * TILE, (gy - KARTE.zeilen / 2) * TILE];

/* ═══════════════════════════════════════════════════════
   AUSWAHL (Menü) – wie im Runner

const WAHL_KEY = 'lern-burg-wahl', REKORD_KEY = 'lern-burg-rekorde';
const W = { modus: 'runde', pools: [], bis: '', richtung: 'de-en', tempo: 'normal', fach: null, klasse: null, lehrer: false, mix: false, ton: false };
function loadWahl() { try { Object.assign(W, JSON.parse(localStorage.getItem(WAHL_KEY) || '{}')); } catch (e) {} W.lehrer = false; }
function saveWahl() { try { const { lehrer, ...w } = W; localStorage.setItem(WAHL_KEY, JSON.stringify(w)); } catch (e) {} }
function rekorde() { try { return JSON.parse(localStorage.getItem(REKORD_KEY) || '{}'); } catch (e) { return {}; } }
function rekordKey() { return [...W.pools].sort().join('+') + (W.pools.some(p => /^vok/.test(p)) ? '|' + (W.bis || 'alle') + '|' + W.richtung : ''); }
function klasse() { return LernAufgaben.klasse() || W.klasse || null; }

function buildMenu() {
  const passKl = LernAufgaben.klasse();
  $('klasse-box').hidden = !!passKl;
  if (!passKl) {
    $('klasse-tabs').innerHTML = [5, 6, 7, 8, 9].map(k => `<button type="button" data-kl="${k}" class="${W.klasse === k ? 'on' : ''}">Klasse ${k}</button>`).join('');
  }

  if (klasse()) W.pools = W.pools.filter(id => list.some(p => p.id === id));

  if (!faecher.includes(W.fach)) W.fach = ((list.find(p => p.id === W.pools[0]) || {}).fach) || faecher[0] || null;
  $('fach-tabs').innerHTML = faecher.map(f => `<button type="button" data-fach="${esc(f)}" class="${f === W.fach ? 'on' : ''}">${esc(f)}</button>`).join('');
  $('pool-list').innerHTML = list.filter(p => p.fach === W.fach)
    .map(p => `<button type="button" data-pool="${esc(p.id)}" class="${W.pools.includes(p.id) ? 'on' : ''}">${esc(p.titel)}</button>`).join('')
    || (klasse() ? '' : '<p class="note">Wähle zuerst deine Klasse.</p>');

  $('mix-btn').classList.toggle('on', W.mix);
  document.querySelectorAll('#mode-seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === W.modus));
  document.querySelectorAll('#tempo-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tempo === W.tempo));

let vokFuer = null;
async function updateVok() {
  const vok = W.pools.find(id => /^vok/.test(id));
  $('vok-box').hidden = !vok;
  if (!vok || vokFuer === vok) { $('vok-bis').value = W.bis; return; }
  vokFuer = vok;
  const units = await LernAufgaben.einheiten(vok).catch(() => []);
  if (!units.length) vokFuer = null;
  $('vok-bis').innerHTML = '<option value="">Alle Units</option>' +
    units.map(u => `<option value="${esc(u.id)}">bis ${esc(u.id === 'intro' ? 'Einführung: ' + u.label : u.label)}</option>`).join('');

}

$('menu').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.mode) { W.modus = t.dataset.mode; }
  else if (t.dataset.kl) { W.klasse = Number(t.dataset.kl); }
  else if (t.dataset.fach) { W.fach = t.dataset.fach; }
  else if (t.dataset.pool) {
    const id = t.dataset.pool, vok = /^vok/.test(id);
    if (!W.mix) W.pools = [id];
    else if (W.pools.includes(id)) W.pools = W.pools.length > 1 ? W.pools.filter(x => x !== id) : W.pools;
    else W.pools = [...W.pools.filter(x => !(vok && /^vok/.test(x))), id];   // Mix – aber nur ein Vokabelbuch
    W.lehrer = false;
  }
  else if (t.id === 'mix-btn') { W.mix = !W.mix; if (!W.mix) W.pools = W.pools.slice(-1); }
  else if (t.dataset.tempo) { W.tempo = t.dataset.tempo; }

$('vok-bis').onchange = () => { W.bis = $('vok-bis').value; saveWahl(); buildMenu(); };

/* ── Ton (standardmäßig aus, ohne Dateien) ─────────── */
let AC = null;
function ton(f, d = .12, typ = 'triangle', vol = .06) {
  if (!W.ton) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = typ; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}

/* ═══════════════════════════════════════════════════════
   3D-WELT
   ═══════════════════════════════════════════════════════ */
let gl = false, T = null, renderer, scene, camera, camFit, figur, burgherr, burg, ring, pixelRatio = 1;
const MAT = {}, GEO = {};
const WEG = { punkte: [], laengen: [], gesamt: 0 };
const plaetze = [], gegner = [], geschosse = [], teile = [];
const pool = { gegner: {}, geschoss: {} };
let matPlatz, matPlatzGlow;

async function init3d() {
  figur = await LernAvatar.figur(null);
  T = figur.THREE;
  renderer = new T.WebGLRenderer({ antialias: true });
  pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(pixelRatio);
  $('stage').appendChild(renderer.domElement);
  scene = new T.Scene();
  scene.background = himmel();
  scene.add(new T.HemisphereLight(0xf2f6ff, 0x4d6b45, .62));
  const sun = new T.DirectionalLight(0xfff1d6, .62); sun.position.set(-70, 150, 90); scene.add(sun);
  camera = new T.PerspectiveCamera(38, 1, 1, 4000);
  camFit = new T.PerspectiveCamera(38, 1, 1, 4000);
  baueKarte();
  gl = true;
  resize();
  new ResizeObserver(resize).observe($('stage'));
  requestAnimationFrame(loop);

function himmel() {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#6fb6ff'); g.addColorStop(.55, '#a9d8ff'); g.addColorStop(1, '#e9f5ff');
  x.fillStyle = g; x.fillRect(0, 0, 2, 256);
  return new T.CanvasTexture(c);
}
function lam(c, o = {}) { const k = c + JSON.stringify(o); return MAT[k] || (MAT[k] = new T.MeshLambertMaterial(Object.assign({ color: c }, o))); }
function box(w, h, d) { const k = w + '|' + h + '|' + d; return GEO[k] || (GEO[k] = new T.BoxGeometry(w, h, d)); }
function mesh(g, m, x = 0, y = 0, z = 0, p) { const o = new T.Mesh(g, m); o.position.set(x, y, z); if (p) p.add(o); return o; }
function pixelTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  t.magFilter = T.NearestFilter; t.minFilter = T.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = T.RepeatWrapping;
  if (rep) t.repeat.set(rep[0], rep[1]);
  return t;
}
/** Zufall mit festem Startwert – die Deko sieht jedes Mal gleich aus */
function seeded(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

/** Alle Meshes einer Gruppe zu wenigen großen Meshes zusammenfügen (je Material eins) – spart Zeichenaufrufe */
function backe(gruppe) {
  gruppe.updateMatrixWorld(true);
  const nachMat = new Map();
  gruppe.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
    if (!nachMat.has(o.material)) nachMat.set(o.material, []);
    nachMat.get(o.material).push(g);
  });
  const out = new T.Group();
  nachMat.forEach((geos, mat) => out.add(new T.Mesh(verbinde(geos), mat)));
  return out;
}
function verbinde(geos) {
  let n = 0, ni = 0;
  geos.forEach(g => { n += g.attributes.position.count; ni += g.index.count; });
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
  const ind = n > 65000 ? new Uint32Array(ni) : new Uint16Array(ni);
  let o = 0, io = 0;
  geos.forEach(g => {
    const c = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
    const I = g.index.array;
    for (let i = 0; i < I.length; i++) ind[io + i] = I[i] + o;
    o += c; io += I.length;
    g.dispose();
  });
  const b = new T.BufferGeometry();
  b.setAttribute('position', new T.BufferAttribute(pos, 3));
  b.setAttribute('normal', new T.BufferAttribute(nor, 3));
  b.setAttribute('uv', new T.BufferAttribute(uv, 2));
  b.setIndex(new T.BufferAttribute(ind, 1));
  return b;
}

function baueKarte() {
  const statisch = new T.Group();
  const R = seeded(7);
  // Wiese
  const gras = pixelTex(32, 32, (x, w, h) => {
    x.fillStyle = '#6cc56f'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) { x.fillStyle = ['#5fb862', '#79cf78', '#64bd66'][i % 3]; x.fillRect(Math.random() * w | 0, Math.random() * h | 0, 2, 2); }
  }, [90, 90]);
  const wiese = mesh(new T.PlaneGeometry(1440, 1440), new T.MeshLambertMaterial({ map: gras }), 0, 0, 0, scene);
  wiese.rotation.x = -Math.PI / 2;

  // Weg: Punkte, Längen, Streifen
  WEG.punkte = KARTE.weg.map(([a, b]) => { const [x, z] = gw(a, b); return new T.Vector3(x, 0, z); });
  WEG.laengen = [0];
  for (let i = 1; i < WEG.punkte.length; i++) WEG.laengen.push(WEG.laengen[i - 1] + WEG.punkte[i].distanceTo(WEG.punkte[i - 1]));
  WEG.gesamt = WEG.laengen[WEG.laengen.length - 1];
  const sand = (len) => pixelTex(16, 16, (x, w, h) => {
    x.fillStyle = '#e8cf9f'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 26; i++) { x.fillStyle = ['#dcbf8b', '#f1dcb2', '#d5b682'][i % 3]; x.fillRect(Math.random() * w | 0, Math.random() * h | 0, 1 + (Math.random() * 2 | 0), 1); }
  }, [1, len]);
  const breite = TILE * .95;
  for (let i = 1; i < WEG.punkte.length; i++) {
    const a = WEG.punkte[i - 1], b = WEG.punkte[i];
    const len = a.distanceTo(b) + breite, quer = Math.abs(b.x - a.x) > Math.abs(b.z - a.z);
    const t = sand(len / TILE); if (quer) { t.repeat.set(len / TILE, 1); }
    const m = mesh(box(quer ? len : breite, .5, quer ? breite : len), new T.MeshLambertMaterial({ map: t }), (a.x + b.x) / 2, .25 + i * .02, (a.z + b.z) / 2);
    statisch.add(m);
    // Rand: etwas breiterer, dunklerer Streifen unter dem Weg (auch an den Ecken sauber)
    statisch.add(mesh(box(quer ? len + 2.2 : breite + 2.2, .34, quer ? breite + 2.2 : len + 2.2), lam('#c9ad7a'), (a.x + b.x) / 2, .17 - i * .01, (a.z + b.z) / 2));
  }
  // Höhle am Start
  {
    const [x, z] = gw(-1.2, 1.5);
    const fels = lam('#7d8196'), dunkel = lam('#262338');
    mesh(box(14, 20, 34), fels, x - 6, 10, z, statisch);
    mesh(box(10, 12, 26), fels, x - 2, 26, z, statisch);
    mesh(box(2, 14, 13), dunkel, x + 1.2, 7, z, statisch);
  }
  // Deko: Bäume, Büsche, Steine – nicht auf Weg, Bauplätzen oder Burg
  const frei = (gx, gy) => {
    const [x, z] = gw(gx, gy), p = new T.Vector3(x, 0, z);
    for (let i = 1; i < WEG.punkte.length; i++) if (abstandStrecke(p, WEG.punkte[i - 1], WEG.punkte[i]) < TILE * 1.05) return false;
    if (KARTE.plaetze.some(([a, b]) => Math.hypot(a - gx, b - gy) < 1.15)) return false;
    if (Math.hypot(KARTE.burg[0] - gx, KARTE.burg[1] - gy) < 2.2) return false;
    if (gx < 1 && gy < 3) return false;                            // Höhle
    if (gy > 8.2 && Math.abs(gx - KARTE.burg[0]) < 5) return false;   // freie Sicht auf die Burg
    return true;
  };
  for (let gx = -5; gx <= 18; gx += 1) for (let gy = -4; gy <= 13; gy += 1) {
    const x0 = gx + R() * .6, y0 = gy + R() * .6;
    const innen = x0 > -.3 && x0 < KARTE.spalten + .3 && y0 > -.3 && y0 < KARTE.zeilen + .3;
    if (R() > (innen ? .22 : .5) || !frei(x0, y0)) continue;
    const [x, z] = gw(x0, y0);
    const o = [baum, baum, busch, stein][R() * (innen ? 4 : 2) | 0](R);
    o.position.set(x, 0, z); o.rotation.y = R() * 6.28;
    statisch.add(o);
  }
  scene.add(backe(statisch));

  // Burg (eigene Gruppe, sie wackelt bei Treffern)
  burg = baueBurg();
  scene.add(burg);

  // Bauplätze
  matPlatz = new T.MeshLambertMaterial({ color: '#9aa0b4' });
  matPlatzGlow = new T.MeshLambertMaterial({ color: '#e9d9a0', emissive: new T.Color('#6b4c00') });
  KARTE.plaetze.forEach(([gx, gy], i) => {
    const [x, z] = gw(gx, gy);
    const m = mesh(box(12.5, 1.6, 12.5), matPlatz, x, .8, z, scene);
    plaetze.push({ i, x, z, m, turm: null });
  });
  // Reichweiten-Ring
  ring = new T.Mesh(new T.RingGeometry(.94, 1, 48), new T.MeshBasicMaterial({ color: 0xfde68a, transparent: true, opacity: .75, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 1.9; ring.visible = false; scene.add(ring);
  const fuell = new T.Mesh(new T.CircleGeometry(1, 48), new T.MeshBasicMaterial({ color: 0xfde68a, transparent: true, opacity: .14, depthWrite: false }));
  fuell.position.z = -.01; ring.add(fuell);

  // Partikel-Vorrat
  for (let i = 0; i < 80; i++) {
    const p = mesh(box(1.6, 1.6, 1.6), lam('#e6a817'));
    p.visible = false; scene.add(p);
    teile.push({ m: p, t: 0, life: 0, v: new T.Vector3() });
  }
}
function abstandStrecke(p, a, b) {
  const ab = b.clone().sub(a), t = clamp(p.clone().sub(a).dot(ab) / ab.lengthSq(), 0, 1);
  return p.distanceTo(a.clone().addScaledVector(ab, t));
}
function baum(R) {
  const g = new T.Group(), h = 7 + R() * 5, s = 10 + R() * 5;
  mesh(box(3, h, 3), lam('#7a5230'), 0, h / 2, 0, g);
  const gruen = lam(['#3f9b4b', '#4fae55', '#2f8a45'][R() * 3 | 0]);
  mesh(box(s, s * .8, s), gruen, 0, h + s * .35, 0, g);
  mesh(box(s * .6, s * .5, s * .6), gruen, 0, h + s * .95, 0, g);
  return g;
}
function busch(R) { const g = new T.Group(), s = 5 + R() * 3; mesh(box(s, s * .7, s), lam('#58b25d'), 0, s * .35, 0, g); mesh(box(s * .6, s * .5, s * .6), lam('#6cc56f'), s * .4, s * .25, s * .2, g); return g; }
function stein(R) { const g = new T.Group(), s = 3 + R() * 3; mesh(box(s, s * .6, s * .8), lam('#a4a9b8'), 0, s * .3, 0, g); return g; }

function baueBurg() {
  const [x, z] = gw(...KARTE.burg);
  const aussen = new T.Group(); aussen.position.set(x, 0, z);
  const g = new T.Group();
  const stein = lam('#c3bdd3'), stein2 = lam('#a39db6'), dach = lam('#4f4ba8'), dunkel = lam('#2a2540'), holz = lam('#8b5a2b');
  mesh(box(34, 18, 32), stein, 0, 9, 0, g);
  mesh(box(35, 2, 33), stein2, 0, 4, 0, g);
  // Zinnen
  for (let i = -3; i <= 3; i++) { mesh(box(3, 3, 3), stein, i * 5, 19.5, -14.5, g); mesh(box(3, 3, 3), stein, i * 5, 19.5, 14.5, g); }
  for (let i = -2; i <= 2; i++) { mesh(box(3, 3, 3), stein, -15.5, 19.5, i * 5, g); mesh(box(3, 3, 3), stein, 15.5, 19.5, i * 5, g); }
  // Ecktürme
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    mesh(box(10, 27, 10), stein, sx * 16, 13.5, sz * 15, g);
    mesh(box(12, 3, 12), dach, sx * 16, 28.5, sz * 15, g);
    mesh(box(7, 4, 7), dach, sx * 16, 32, sz * 15, g);
  });
  // Tor zur Wegseite (−x)
  mesh(box(1.4, 12, 11), holz, -17.3, 6, 3, g);
  mesh(box(1.6, 2, 13), dunkel, -17.4, 13, 3, g);
  const gebacken = backe(g);
  aussen.add(gebacken);
  // Fahnen (bewegt)
  aussen.userData.fahnen = [];
  [[-1, -1], [1, -1]].forEach(([sx, sz]) => {
    mesh(box(.7, 10, .7), holz, sx * 16, 38, sz * 15, aussen);
    const f = mesh(box(.4, 4.5, 7), lam('#e6a817'), sx * 16, 40.5, sz * 15 + 3.6, aussen);
    aussen.userData.fahnen.push(f);
  });
  // Burgherr / Burgherrin
  burgherr = new T.Group();
  burgherr.position.set(0, 18, 3);
  figur.root.scale.setScalar(CFG.figurGroesse);
  burgherr.add(figur.root);
  aussen.add(burgherr);
  aussen.userData.basis = new T.Vector3(x, 0, z);
  return aussen;
}

/* ── Weg ───────────────────────────────────────────── */
const _v = { a: null };
function wegPos(s, out) {
  s = clamp(s, 0, WEG.gesamt);
  let i = 1; while (i < WEG.laengen.length - 1 && WEG.laengen[i] < s) i++;
  const a = WEG.punkte[i - 1], b = WEG.punkte[i];
  const t = (s - WEG.laengen[i - 1]) / (WEG.laengen[i] - WEG.laengen[i - 1] || 1);
  out.x = a.x + (b.x - a.x) * t; out.z = a.z + (b.z - a.z) * t;
  out.dx = b.x - a.x; out.dz = b.z - a.z;
  return out;
}

/* ═══════════════════════════════════════════════════════
   TÜRME
   ═══════════════════════════════════════════════════════ */
function baueTurmMesh(typ, stufe) {
  const g = new T.Group(), kopf = new T.Group(); g.add(kopf);
  const band = [null, lam('#e2e8f0'), lam('#e6a817', { emissive: 0x4a3400 })][stufe - 1];
  let h, w;
  if (typ === 'bogen') {
    w = 8.5; h = 8 + stufe * 2.5;
    mesh(box(w, h, w), lam('#b98556'), 0, h / 2 + 1.6, 0, g);

/* ── Geschosse ───────────────────────────────────── */

function welleEndlos(n) {

}

    const oben = Math.max($('hud-top').getBoundingClientRect().bottom, qc.top + 34 + fs * 2.2) + 6;
    const unten = $('answers').getBoundingClientRect().top - 8;
    const rect = { x: 8, y: oben, w: w - 16, h: Math.max(120, unten - oben) };
    const [ax, az0] = gw(-.9, -.2), [bx, bz] = gw(KARTE.spalten, KARTE.zeilen + .1);
    const ecken = quader(ax, bx, 0, 14, az0, bz), el = 56 * Math.PI / 180;
    // Karte quer oder um 90° gedreht – je nachdem, was größer auf den Bildschirm passt
    if (!CAM.drehFuer || CAM.drehFuer.w !== w || CAM.drehFuer.h !== h) {
      const quer = fitte(ecken, rect, 0, el), gedreht = fitte(ecken, rect, Math.PI / 2, el);
      CAM.drehFuer = { w, h, az: gedreht.d < quer.d * .92 ? Math.PI / 2 : 0 };
    }
    return fitte(ecken, rect, CAM.drehFuer.az, el);
  }
  // Menü / Ergebnis: Burg mit Figur groß neben bzw. über dem Blatt
  const overlay = !$('result').hidden ? $('result') : $('menu');
  const sheet = overlay.querySelector('.sheet').getBoundingClientRect();
  let rect;
  if (w > h * 1.05 && sheet.right < w * .7) rect = { x: sheet.right + 20, y: h * .08, w: w - sheet.right - 40, h: h * .78 };
  else {
    const y1 = sheet.top - 12;
    rect = y1 > h * .22 ? { x: 16, y: 12, w: w - 32, h: y1 - 12 } : { x: 16, y: 12, w: w - 32, h: h * .3 };
  }
  const bx = burg.position.x, bz = burg.position.z;
  return fitte(quader(bx - 20, bx + 20, 6, 44, bz - 4, bz + 6), rect, 0, 16 * Math.PI / 180);
}
function kamera(dt) {
  CAM.t -= dt;
  if (CAM.dirty || CAM.t <= 0) { CAM.ziel = kameraZiel(); CAM.dirty = false; CAM.t = .5; }
  const z = CAM.ziel;
  if (!CAM.cur) CAM.cur = Object.assign({}, z);
  const f = REDUCED ? 1 : Math.min(1, dt * 3.2);
  ['tx', 'ty', 'tz', 'az', 'el', 'd', 'ox', 'oy'].forEach(k => { CAM.cur[k] += (z[k] - CAM.cur[k]) * f; });
  setzeKam(camera, CAM.cur);
  const { w, h } = stageGroesse();
  const sx = G.shake > 0 && !REDUCED ? rnd(-1, 1) * G.shake * 14 : 0;
  camera.setViewOffset(w, h, CAM.cur.ox + sx, CAM.cur.oy, w, h);
}
function resize() {
  if (!renderer) return;
  const { w, h } = stageGroesse();
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  CAM.dirty = true;
}

/* ═══════════════════════════════════════════════════════
   SCHLEIFE
   ═══════════════════════════════════════════════════════ */
let last = 0;
const FPS = { t: 0, n: 0, gesenkt: false };
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (!gl) return;
  const Z = G.zustand;
  const dt = Z === 'pause' ? 0 : rdt * CFG.zeitraffer;
  G.t += dt;

  if (Z === 'countdown') {
    G.countT -= dt;
    $('count').textContent = G.countT > 2.2 ? '3' : G.countT > 1.2 ? '2' : G.countT > .2 ? '1' : 'Los!';
    if (G.countT <= -.3) {
      $('count').textContent = ''; G.zustand = 'play'; G.spielStart = G.t;
      neueFrage();
      blitz('Tippe auf eine leuchtende Steinplatte!', 'info');
    }
  }
  if (Z === 'play') {
    fragenUpdate();
    wellenUpdate(dt);
    gegnerUpdate(dt);
    tuermeUpdate(dt);
    geschosseUpdate(dt);
  }
  if (Z === 'ende') { geschosseUpdate(dt); G.endeT -= dt; if (G.endeT <= 0) ende(); }
  if (Z !== 'pause') teileUpdate(dt);
  bauHud();

  // Bauplätze leuchten, wenn man sich einen Turm leisten kann
  const billig = Math.min(...Object.values(CFG.tuerme).map(d => d.preis[0]));
  const glow = (Z === 'play' || Z === 'countdown') && G.muenzen >= billig;
  const k = REDUCED ? .7 : .45 + .35 * Math.sin(G.t * 4);
  matPlatzGlow.emissive.setRGB(.42 * k, .3 * k, 0);
  plaetze.forEach(p => { p.m.material = glow && !p.turm ? matPlatzGlow : matPlatz; p.m.visible = !p.turm; });

  figurUpdate(dt || rdt * .0001);
  kamera(rdt);
  positioniereMenu();
  renderer.render(scene, camera);

  // Leistungswächter: bei zu wenig Bildern pro Sekunde Auflösung senken
  if (Z === 'play' && !FPS.gesenkt && pixelRatio > 1) {
    FPS.t += rdt; FPS.n++;
    if (FPS.t > 3) {
      if (FPS.n / FPS.t < CFG.minFps) { pixelRatio = 1; renderer.setPixelRatio(1); resize(); FPS.gesenkt = true; }
      FPS.t = 0; FPS.n = 0;
    }
  }
}

/* ═══════════════════════════════════════════════════════
   START
   ═══════════════════════════════════════════════════════ */
loadWahl();
(function linkParameter() {
  const L = LernAufgaben.ausLink(location.search);
  if (L.ids.length) { W.pools = L.ids; W.bis = L.opts.bis || ''; W.richtung = L.opts.richtung || 'de-en'; W.lehrer = true; W.fach = null; }
  const m = new URLSearchParams(location.search).get('modus');
  if (m === 'endlos' || m === 'runde') W.modus = m;
})();

whenPass(() => {
  buildMenu();
  init3d().then(buildMenu).catch(() => {
    $('menu-err').textContent = 'Auf diesem Gerät kann die 3D-Welt leider nicht angezeigt werden.';
    buildMenu();
  });
});
