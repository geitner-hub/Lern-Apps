<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0e1a">
  <title>Zauberwort</title>
  <!--
  ═══════════════════════════════════════════════
   ZAUBERWORT  (spiele/zauberwort.html)

   Monster laufen auf den Zauberturm zu. Jedes Monster trägt ein deutsches
   Wort. Besiegt wird es nur, wenn das Kind das englische Wort im Buchstaben-
   feld richtig zusammenwischt – das richtig geschriebene Wort IST der Zauber
   (intrinsische Integration: Rechtschreibung ist die Spielmechanik).
   Falsch geschrieben → der Zauber verpufft. Nach jedem Fehlversuch leuchtet
   ein Buchstabe mehr (vom Anfang her). Erreicht ein Monster den Turm,
   kostet das ein Herz, die Lösung wird gezeigt und das Wort kommt später
   noch einmal dran.

   Wischen über benachbarte Felder (auch schräg); Zurückziehen nimmt den
   letzten Buchstaben weg. Alternativ: Felder nacheinander antippen, dann „Zaubern“.

   Wörter: „Meine Themen“ (nur Vokabeln) über LernAufgaben.woerter(),
   frei gewählt (Band + Unit) oder Lehrer-Link: zauberwort.html?pool=vok5&bis=unit2
   XP: Runde → LernApps.saveResult (Sterne), Endlos → LernPass.awardEndless.
   Braucht: navbar.js, aufgaben.js, spiel-hilfen.js, avatar3d.js, vendor/three.min.js
  ═══════════════════════════════════════════════
  -->
  <link rel="stylesheet" href="../gemeinsam/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e1a; --panel: rgba(27,25,41,.92); --surface: #1b1929;
      --accent: #e6a817; --accent2: #fde68a; --indigo: #6366f1; --indigo2: #818cf8;
      --text: #f1f0fb; --text2: rgba(241,240,251,.7); --muted: rgba(241,240,251,.42);
      --green: #4ade80; --red: #f87171; --magie: #c084fc; --magie2: #a855f7;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Nunito', system-ui, sans-serif; background: #1e1b3a; color: var(--text);
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--indigo2); outline-offset: 2px; }
    [hidden] { display: none !important; }

    /* ── Aufteilung: Szene + Zauberfeld ─── */
    #spiel { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr min(44vw, 460px); }
    @media (orientation: portrait), (max-width: 700px) { #spiel { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }
    #stage { position: relative; overflow: hidden; min-height: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    .label { position: absolute; transform: translate(-50%, -100%); background: rgba(27,25,41,.92); border: 2px solid var(--magie);
      color: #fff; font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(1rem, 2.6vmin, 1.4rem); padding: .2rem .7rem;
      border-radius: 12px; white-space: nowrap; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
    .label::after { content: ''; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--magie); }
    .hud { position: absolute; top: max(.6rem, env(safe-area-inset-top)); left: .6rem; right: .6rem; display: flex; gap: .4rem; align-items: center; pointer-events: none; }
    .chip { background: var(--panel); border-radius: 14px; padding: .4rem .7rem; font-weight: 900; font-size: .95rem; display: inline-flex; gap: .35rem; align-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
    .hud .rechts { margin-left: auto; display: flex; gap: .4rem; }
    .pause { pointer-events: auto; width: 42px; height: 42px; justify-content: center; }
    .flash { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: 'Fredoka One', 'Nunito', sans-serif;
      font-size: clamp(1.3rem, 4.5vmin, 2.3rem); padding: .45rem 1.1rem; border-radius: 18px; background: var(--panel); opacity: 0;
      transition: opacity .15s; text-align: center; white-space: nowrap; pointer-events: none; }
    .flash.show { opacity: 1; }
    .flash.ok { color: var(--accent2); } .flash.bad { color: var(--red); }
    .flash small { display: block; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .55em; color: var(--text2); }
    .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Fredoka One', 'Nunito', sans-serif;
      font-size: clamp(3.5rem, 16vmin, 8rem); color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.4); pointer-events: none; }
    /* Ersatz ohne 3D */
    .bahn { position: absolute; left: 4%; right: 4%; top: 55%; height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; }
    .bahn .turm, .bahn .monster { position: absolute; top: 0; transform: translate(-50%, -100%); font-size: 3rem; line-height: 1; }
    .bahn .turm { left: 0; } .bahn .monster { left: calc(var(--p, 1) * 100%); }

    #panel { background: linear-gradient(180deg, #221f3d, #17152b); padding: .8rem max(.8rem, env(safe-area-inset-right)) calc(4.6rem + env(safe-area-inset-bottom)) .8rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .55rem; min-height: 0; }
    @media (orientation: portrait), (max-width: 700px) { #panel { padding-top: .6rem; } }
    .auftrag { text-align: center; }
    .auftrag small { display: block; font-size: .78rem; font-weight: 900; color: var(--muted); }
    .auftrag b { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: clamp(1.4rem, 4vmin, 2rem); color: var(--accent2); }
    .eingabe { min-height: 2.6rem; font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(1.5rem, 4.4vmin, 2.2rem); letter-spacing: .12em;
      color: var(--magie); text-shadow: 0 0 14px rgba(192,132,252,.6); }
    .eingabe.bad { color: var(--red); text-shadow: none; animation: wackeln .35s; }
    @keyframes wackeln { 25%, 75% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
    .feld-wrap { position: relative; width: min(100%, 44vh, 400px); aspect-ratio: 1; }
    @media (orientation: portrait) { .feld-wrap { width: min(92vw, 40vh, 420px); } }
    .feld { position: absolute; inset: 0; display: grid; gap: 8px; touch-action: none; }
    .zelle { border-radius: 16px; background: linear-gradient(180deg, #3b3663, #2b2750); box-shadow: inset 0 -5px 0 rgba(0,0,0,.3), 0 4px 10px rgba(0,0,0,.25);
      display: grid; place-items: center; font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(1.3rem, 5vmin, 2.3rem); color: #efeaff;
      transition: transform .1s, background .15s; pointer-events: none; }
    .zelle.an { background: linear-gradient(180deg, #b77cf6, #8b3fe0); transform: scale(1.06); color: #fff; box-shadow: 0 0 18px rgba(192,132,252,.7), inset 0 -5px 0 rgba(0,0,0,.25); }
    .zelle.hilfe { box-shadow: 0 0 0 3px var(--accent), 0 0 16px rgba(230,168,23,.6), inset 0 -5px 0 rgba(0,0,0,.3); }
    .zelle.loesung { background: linear-gradient(180deg, #2f9e5a, #1f7a44); }
    .spur { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .knoepfe { display: flex; gap: .5rem; }
    .kbtn { min-height: 46px; padding: .4rem 1rem; border-radius: 14px; font-weight: 900; background: rgba(255,255,255,.08); }
    .kbtn.zaubern { background: var(--magie2); color: #fff; }
    .kbtn:disabled { opacity: .35; }

    /* ── Menü & Ergebnis ───────────────── */
    .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15,14,26,.55);
      padding: 1rem 1rem calc(4.5rem + env(safe-area-inset-bottom)); overflow-y: auto; z-index: 10; }
    .sheet { width: min(500px, 100%); background: var(--panel); border-radius: 22px; padding: 1.3rem; box-shadow: 0 20px 60px rgba(0,0,0,.4);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); margin: auto 0; }
    h1 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; color: var(--magie); font-size: 2.1rem; line-height: 1.05; }
    h2 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; color: var(--accent2); font-size: 1.9rem; text-align: center; }
    .lead { color: var(--text2); font-size: .92rem; margin: .3rem 0 .9rem; }
    .lbl { display: block; font-size: .78rem; font-weight: 900; color: var(--muted); margin: .9rem 0 .4rem; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; background: rgba(255,255,255,.06); border-radius: 14px; padding: 4px; gap: 4px; }
    .seg button { border-radius: 11px; padding: .6rem .5rem; font-weight: 900; font-size: .95rem; color: var(--text2); }
    .seg button small { display: block; font-size: .72rem; font-weight: 800; color: var(--muted); }
    .seg button.on { background: var(--magie2); color: #fff; }
    .seg button.on small { color: rgba(255,255,255,.75); }
    .tabs { display: flex; gap: .35rem; flex-wrap: wrap; }
    .tabs button { padding: .45rem .85rem; border-radius: 99px; font-weight: 900; font-size: .86rem; background: rgba(255,255,255,.06); color: var(--text2); min-height: 40px; }
    .tabs button.on { background: var(--indigo); color: #fff; }
    select { font: inherit; font-weight: 800; font-size: .9rem; background: #252238; color: var(--text); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: .5rem .6rem; max-width: 100%; }
    .meine { width: 100%; min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: .5rem 1rem; border-radius: 16px; background: rgba(255,255,255,.06); border: 3px solid rgba(192,132,252,.3);
      font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 1.35rem; line-height: 1.1; }
    .meine small { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .8rem; color: var(--muted); margin-top: .15rem; }
    .meine small:empty { display: none; }
    .meine.on { border-color: var(--magie); background: rgba(192,132,252,.16); color: #f3e8ff; }
    .selbst { display: block; margin: .5rem auto 0; min-height: 44px; padding: .4rem 1.1rem; border-radius: 99px; font-weight: 900; font-size: .92rem;
      background: rgba(255,255,255,.06); color: var(--text2); }
    .selbst.on { background: var(--indigo); color: #fff; }
    .note { font-size: .8rem; color: var(--muted); margin-top: .5rem; font-weight: 700; }
    .note b { color: var(--accent2); }
    .unten { display: flex; gap: .6rem; margin-top: 1.1rem; }
    .go { flex: 1; min-height: 56px; border-radius: 16px; background: var(--magie2); color: #fff; font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 1.4rem; }
    .go:disabled { opacity: .45; cursor: default; }
    .ton { width: 56px; min-height: 56px; border-radius: 16px; background: rgba(255,255,255,.08); font-size: 1.3rem; }
    .err { color: var(--red); font-weight: 800; font-size: .88rem; margin-top: .6rem; min-height: 1em; }
    .res-zahl { text-align: center; font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 3rem; color: #fff; margin: .3rem 0; }
    .res-sub { text-align: center; color: var(--text2); font-weight: 800; }
    .ueben { margin-top: .8rem; background: rgba(255,255,255,.05); border-radius: 14px; padding: .6rem .8rem; font-size: .9rem; color: var(--text2); max-height: 10em; overflow-y: auto; }
    .ueben b { color: var(--accent2); }
    .btns { display: flex; gap: .6rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
    .btn { min-height: 48px; padding: .5rem 1.1rem; border-radius: 14px; font-weight: 900; background: rgba(255,255,255,.08); }
    .btn.primary { background: var(--magie2); color: #fff; }
    @media (prefers-reduced-motion: reduce) { .eingabe.bad { animation: none; } .zelle { transition: none; } }
  </style>
</head>
<body>

<div id="spiel">
  <div id="stage">
    <div class="bahn" id="bahn" hidden><span class="turm">🏰</span><span class="monster">👾</span></div>
    <div id="labels"></div>
    <div class="hud" id="hud" hidden>
      <span class="chip" id="herzen">❤️❤️❤️</span>
      <span class="chip" id="stand">✨ 0</span>
      <span class="rechts"><span class="chip" id="rest"></span><button class="chip pause" id="pause-btn" type="button" aria-label="Pause">⏸</button></span>
    </div>
    <div class="flash" id="flash"></div>
    <div class="count" id="count"></div>
  </div>
  <div id="panel">
    <div class="auftrag"><small>Zaubere auf Englisch:</small><b id="auftrag">…</b></div>
    <div class="eingabe" id="eingabe" aria-live="polite"></div>
    <div class="feld-wrap">
      <div class="feld" id="feld"></div>
      <svg class="spur" id="spur"></svg>
    </div>
    <div class="knoepfe">
      <button class="kbtn" id="loeschen" type="button">✕ Löschen</button>
      <button class="kbtn zaubern" id="zaubern" type="button" disabled>✨ Zaubern</button>
    </div>
  </div>
</div>

<!-- ── Menü ─────────────────────────────────── -->
<div class="overlay" id="menu">
  <div class="sheet">
    <h1>🪄 Zauberwort</h1>
    <p class="lead">Monster greifen deinen Turm an! Jedes Monster trägt ein deutsches Wort. Wisch das englische Wort richtig zusammen – dann wirkt dein Zauber.</p>

    <div id="meine-box" hidden>
      <button type="button" class="meine on" id="meine-btn">⭐ Meine Themen<small id="meine-info"></small></button>
      <button type="button" class="selbst" id="selbst-btn" hidden>Selbst wählen</button>
    </div>

    <div id="klasse-box" hidden>
      <span class="lbl">Deine Klasse</span>
      <div class="tabs" id="klasse-tabs"></div>
    </div>

    <div id="frei-box">
      <span class="lbl">Vokabeln</span>
      <div class="tabs" id="buch-tabs"></div>
      <div style="margin-top:.5rem"><select id="bis" aria-label="Vokabeln bis Unit"><option value="">Alle Units</option></select></div>
    </div>
    <p class="note" id="lehrer-note" hidden>Deine Lehrkraft hat die Vokabeln ausgewählt.</p>

    <span class="lbl">Modus</span>
    <div class="seg" id="mode-seg">
      <button type="button" data-mode="runde" class="on">Runde<small>12 Monster</small></button>
      <button type="button" data-mode="endlos">Endlos<small>3 Herzen · immer schneller</small></button>
    </div>
    <p class="note" id="rekord-note" hidden></p>

    <div class="unten">
      <button class="go" id="go" type="button" disabled>Los geht's!</button>
      <button class="ton" id="ton-btn" type="button" aria-label="Ton an oder aus">🔇</button>
    </div>
    <div class="err" id="menu-err"></div>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="sheet" style="text-align:center">
    <h2>Pause</h2>
    <div class="btns"><button class="btn primary" id="weiter" type="button">Weiter</button><button class="btn" id="beenden" type="button">Beenden</button></div>
  </div>
</div>

<div class="overlay" id="ergebnis" hidden>
  <div class="sheet" id="ergebnis-body"></div>
</div>

<script src="../gemeinsam/navbar.js"></script>
<script src="../gemeinsam/aufgaben.js"></script>
<script src="../gemeinsam/spiel-hilfen.js"></script>
<script src="../gemeinsam/avatar3d.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   EINSTELLUNGEN
   ═══════════════════════════════════════════════════════ */
const CFG = {
  runde: 12,                          // Monster pro Runde
  herzen: 3,
  laufBasis: 20, laufJeBuchstabe: 2.5, // Sekunden bis zum Turm (5 Buchstaben ≈ 32 s; Endlos startet genauso)
  endlos: { stufeAlle: 5, faktor: .92, min: .45, herzAlle: 15 },
  hilfeAb: 1,                         // ab so vielen Fehlversuchen leuchtet der erste Buchstabe (danach je einer mehr)
  wiederholenNach: 3,                 // verpasstes Wort kommt nach so vielen anderen wieder
  minWoerter: 4,
};
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const APP_KEY = 'zauberwort.html';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ═══════════════════════════════════════════════════════
   MENÜ
   ═══════════════════════════════════════════════════════ */
const WAHL_KEY = 'lern-zauberwort-wahl', REKORD_KEY = 'lern-zauberwort-rekord';
const W = { modus: 'runde', buch: 'vok5', bis: '', klasse: null, ton: false, quelle: 'meine', lehrer: false };
function loadWahl() { try { Object.assign(W, JSON.parse(localStorage.getItem(WAHL_KEY) || '{}')); } catch (e) {} W.lehrer = false; W.quelle = 'meine'; }
function saveWahl() { try { const { lehrer, quelle, ...w } = W; localStorage.setItem(WAHL_KEY, JSON.stringify(w)); } catch (e) {} }
function spielAuswahl() { try { return LernPass.settings.spiele.auswahl || 'auto+frei'; } catch (e) { return 'auto+frei'; } }
function quelle() {
  const a = spielAuswahl();
  if (W.lehrer || a === 'frei') return 'frei';
  if (a === 'auto') return 'meine';
  return W.quelle === 'frei' ? 'frei' : 'meine';
}
function klasse() { return LernAufgaben.klasse() || W.klasse || null; }
function rekord() { try { return Number(localStorage.getItem(REKORD_KEY)) || 0; } catch (e) { return 0; } }

let MEINE_WOERTER = null, meineFuer = '';
async function buildMenu() {
  const passKl = LernAufgaben.klasse();
  $('klasse-box').hidden = !!passKl;
  if (!passKl) $('klasse-tabs').innerHTML = [5, 6, 7, 8, 9].map(k => `<button type="button" data-kl="${k}" class="${W.klasse === k ? 'on' : ''}">Klasse ${k}</button>`).join('');
  const buecher = klasse() ? LernAufgaben.pools({ klasse: klasse() }).filter(p => /^vok\d/.test(p.id)) : [];
  if (buecher.length && !buecher.some(b => b.id === W.buch)) W.buch = buecher[buecher.length - 1].id;
  $('buch-tabs').innerHTML = buecher.map(b => `<button type="button" data-buch="${esc(b.id)}" class="${b.id === W.buch ? 'on' : ''}">${esc(b.titel)}</button>`).join('')
    || '<p class="note">Wähle zuerst deine Klasse.</p>';
  const auswahl = spielAuswahl(), q = quelle();
  $('meine-box').hidden = auswahl === 'frei';
  $('selbst-btn').hidden = auswahl !== 'auto+frei';
  $('frei-box').hidden = q !== 'frei' || W.lehrer;
  $('lehrer-note').hidden = !W.lehrer;
  $('meine-btn').classList.toggle('on', q === 'meine');
  $('selbst-btn').classList.toggle('on', q === 'frei' && !W.lehrer);
  document.querySelectorAll('#mode-seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === W.modus));
  $('ton-btn').textContent = W.ton ? '🔊' : '🔇';
  $('rekord-note').hidden = W.modus !== 'endlos';
  $('rekord-note').innerHTML = rekord() ? `Dein Rekord: <b>${rekord()} Monster</b>` : 'Noch kein Rekord – leg los!';
  updateBis();
  // „Meine Themen“: wie viele Wörter?
  let bereit = false;
  if (q === 'meine' && klasse()) {
    const key = klasse() + '|' + JSON.stringify(LernAufgaben.meineThemen({ klasse: klasse() }).inhalte);
    if (meineFuer !== key) { meineFuer = key; MEINE_WOERTER = await LernAufgaben.woerter({ meine: true, klasse: klasse() }).catch(() => []); }
    const n = MEINE_WOERTER ? MEINE_WOERTER.length : 0;
    bereit = n >= CFG.minWoerter;
    $('meine-info').textContent = bereit ? `${n} Wörter`
      : auswahl === 'auto+frei' ? 'Noch keine Vokabeln geübt – tippe „Selbst wählen“'
      : 'Übe zuerst im Vokabeltrainer – dann kommen deine Wörter hierher.';
  } else if (q === 'frei') bereit = !!(klasse() && W.buch);
  $('go').disabled = !bereit;
}
let bisFuer = null;
async function updateBis() {
  if (bisFuer === W.buch) { $('bis').value = W.bis; return; }
  bisFuer = W.buch;
  const units = await LernAufgaben.einheiten(W.buch).catch(() => []);
  if (!units.length) bisFuer = null;
  $('bis').innerHTML = '<option value="">Alle Units</option>' + units.map(u => `<option value="${esc(u.id)}">bis ${esc(u.id === 'intro' ? 'Einführung: ' + u.label : u.label)}</option>`).join('');
  $('bis').value = units.some(u => u.id === W.bis) ? W.bis : '';
}
$('menu').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.kl) W.klasse = Number(t.dataset.kl);
  else if (t.id === 'meine-btn') { W.quelle = 'meine'; W.lehrer = false; }
  else if (t.id === 'selbst-btn') { W.quelle = 'frei'; W.lehrer = false; }
  else if (t.dataset.buch) { W.buch = t.dataset.buch; W.bis = ''; }
  else if (t.dataset.mode) W.modus = t.dataset.mode;
  else if (t.id === 'ton-btn') { W.ton = !W.ton; tonBereit(); if (W.ton) ton(660, .1); }
  else if (t.id === 'go') { tonBereit(); starte(); return; }
  else return;

/* ═══════════════════════════════════════════════════════
   BUCHSTABENFELD
   Das Zielwort steckt immer als zusammenhängender Pfad im Feld
   (Nachbarn auch schräg, kein Feld doppelt).
   ═══════════════════════════════════════════════════════ */
const FUELL = 'EEEAAIIOOUTTNNSSRRLLHDCMPGBYWFK';
function nachbarn(i, n) {
  const r = Math.floor(i / n), c = i % n, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < n && cc >= 0 && cc < n) out.push(rr * n + cc);
  }
  return out;
}
function baueFeld(wort) {
  const n = wort.length <= 7 ? 4 : 5, N = n * n;
  let pfad = null;
  const tiefe = (p, belegt) => {
    if (p.length === wort.length) return p;
    const kand = p.length ? shuffle(nachbarn(p[p.length - 1], n)) : shuffle([...Array(N).keys()]);
    for (const c of kand) {
      if (belegt.has(c)) continue;
      belegt.add(c); p.push(c);
      const r = tiefe(p, belegt);
      if (r) return r;
      p.pop(); belegt.delete(c);
    }
    return null;
  };
  pfad = tiefe([], new Set());
  const zellen = Array(N).fill('');
  pfad.forEach((c, i) => { zellen[c] = wort[i]; });
  for (let i = 0; i < N; i++) if (!zellen[i]) {
    // halb Buchstaben aus dem Wort (Ablenkung), halb häufige Buchstaben
    zellen[i] = Math.random() < .45 ? wort[Math.floor(Math.random() * wort.length)] : FUELL[Math.floor(Math.random() * FUELL.length)];
  }
  return { n, zellen, pfad };
}

const F = { feld: null, pfad: [], gewischt: false, aktiv: false };
function zeigeFeld() {
  const f = F.feld;
  $('feld').style.gridTemplateColumns = `repeat(${f.n}, 1fr)`;
  $('feld').innerHTML = f.zellen.map((b, i) => `<div class="zelle" data-i="${i}">${b}</div>`).join('');
  F.pfad = [];
  zeichnePfad();
}
function zellMitte(i) {
  const n = F.feld.n, r = $('feld').getBoundingClientRect(), gap = 8;
  const w = (r.width - gap * (n - 1)) / n;
  return { x: (i % n) * (w + gap) + w / 2, y: Math.floor(i / n) * (w + gap) + w / 2, w };
}
function zeichnePfad() {
  const zellen = $('feld').children;
  [...zellen].forEach((z, i) => z.classList.toggle('an', F.pfad.includes(i)));
  const pts = F.pfad.map(i => { const m = zellMitte(i); return `${m.x},${m.y}`; }).join(' ');
  $('spur').innerHTML = F.pfad.length > 1
    ? `<polyline points="${pts}" fill="none" stroke="rgba(233,213,255,.55)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
       <polyline points="${pts}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>` : '';
  const txt = F.pfad.map(i => F.feld.zellen[i]).join('');
  const e = $('eingabe'); e.classList.remove('bad'); e.textContent = txt;
  $('zaubern').disabled = F.pfad.length < 2 || G.zustand !== 'spiel';
}
/** Feld unter dem Finger – nur im inneren Bereich, damit schräges Wischen nicht Nachbarn streift */
function zelleBei(x, y) {
  const r = $('feld').getBoundingClientRect(), n = F.feld.n, gap = 8;
  const w = (r.width - gap * (n - 1)) / n;
  const lx = x - r.left, ly = y - r.top;
  const c = Math.floor(lx / (w + gap)), rr = Math.floor(ly / (w + gap));
  if (c < 0 || c >= n || rr < 0 || rr >= n) return -1;
  const i = rr * n + c, m = zellMitte(i);
  return Math.hypot(lx - m.x, ly - m.y) <= w * .42 ? i : -1;
}
function istNachbar(a, b) { return nachbarn(a, F.feld.n).includes(b); }

LernSpiel.zeiger($('feld'), {
  down(p) {
    if (G.zustand !== 'spiel' || !F.feld) return false;
    const i = zelleBei(p.x, p.y);
    if (i < 0) return false;
    const letzte = F.pfad[F.pfad.length - 1];
    if (F.pfad.length && i === letzte) { F.pfad.pop(); p.daten.tipp = true; }                 // Antippen: letzten wegnehmen
    else if (F.pfad.length && istNachbar(letzte, i) && !F.pfad.includes(i)) { F.pfad.push(i); p.daten.tipp = true; }
    else { F.pfad = [i]; }
    p.daten.zellen = 1;
    ton(500 + F.pfad.length * 60, .05);
    zeichnePfad();
  },
  move(p) {
    const i = zelleBei(p.x, p.y);
    if (i < 0) return;
    const letzte = F.pfad[F.pfad.length - 1];
    if (i === letzte) return;
    if (F.pfad.length > 1 && i === F.pfad[F.pfad.length - 2]) { F.pfad.pop(); zeichnePfad(); return; }   // zurückziehen
    if (!F.pfad.includes(i) && (!F.pfad.length || istNachbar(letzte, i))) {
      F.pfad.push(i); p.daten.zellen++; ton(500 + F.pfad.length * 60, .05); zeichnePfad();
    }
  },
  up(p) {
    // Gewischt (über mehrere Felder) → sofort zaubern; nur getippt → Wort weiter aufbauen
    if (p.daten.zellen > 1 && F.pfad.length > 1) zaubere();
  },
  cancel() { /* Pfad bleibt stehen – das Kind kann weitermachen */ },
});
$('zaubern').onclick = () => zaubere();
$('loeschen').onclick = () => { F.pfad = []; zeichnePfad(); };
window.addEventListener('resize', () => { if (F.feld) zeichnePfad(); });

const G = { zustand: 'menu', woerter: [], warteschlange: [], nochmal: [], wort: null, fehler: 0, herzen: 0, besiegt: 0, versucht: 0,

async function holeWoerter() {

async function starte() {

function naechstesWort() {
  // verpasste Wörter kommen nach ein paar anderen noch einmal
  const faellig = G.nochmal.findIndex(n => n.nach <= 0);
  let w;
  if (faellig >= 0) w = G.nochmal.splice(faellig, 1)[0].wort;
  else {
    if (!G.warteschlange.length) G.warteschlange = shuffle(G.woerter.filter(x => !G.wort || x.wort !== G.wort.wort));
    w = G.warteschlange.shift();
  }
  G.nochmal.forEach(n => n.nach--);
  return w;
}

function neuesMonster() {
  if (W.modus === 'runde' && G.versucht >= CFG.runde) { ende(); return; }
  G.wort = naechstesWort();

  G.laufzeit = (CFG.laufBasis + CFG.laufJeBuchstabe * G.wort.wort.length) * G.tempo;

    LernSpiel.speichereRunde({ score: G.besiegt, max: CFG.runde, titel: 'Zauberwörter', skill: G.meine ? 'zauberwort:meine-themen' : 'zauberwort:' + W.buch + (W.bis ? '-' + W.bis : '') });
  } else {
    zahl = String(G.besiegt);
    const alt = rekord();
    if (G.besiegt > alt) { try { localStorage.setItem(REKORD_KEY, String(G.besiegt)); } catch (e) {} }
    titel = G.besiegt > alt ? 'Neuer Rekord! 🏆' : 'Gut gezaubert!';
    sub = G.besiegt > alt ? 'Monster besiegt' : `Monster besiegt · Rekord: ${alt}`;
    LernSpiel.endlos({ key: APP_KEY, correct: G.besiegt, seconds: sek });
  }
  const ueben = [...new Map(G.verpasst.map(w => [w.wort, w])).values()];
  $('ergebnis-body').innerHTML = `<h2>${titel}</h2><div class="res-zahl">${zahl}</div><div class="res-sub">${sub}</div>
    ${ueben.length ? `<div class="ueben">Übe diese Wörter noch einmal: ${ueben.map(w => `${esc(w.de)} → <b>${esc(w.en)}</b>`).join(' · ')}</div>` : ''}
    <div class="btns"><button class="btn primary" type="button" id="nochmal">🔄 Nochmal</button><button class="btn" type="button" id="zum-menu">Menü</button></div>`;
  $('ergebnis').hidden = false;
  $('nochmal').onclick = () => starte();
  $('zum-menu').onclick = zeigeMenu;
}
function zeigeMenu() {
  G.zustand = 'menu';
  if (welt.monster) { welt3d.remove(welt.monster); welt.monster = null; }
  $('labels').innerHTML = ''; $('hud').hidden = true; $('ergebnis').hidden = true; $('pause').hidden = true; $('menu').hidden = false;
  $('auftrag').textContent = '…'; $('feld').innerHTML = ''; $('spur').innerHTML = ''; $('eingabe').textContent = ''; F.feld = null;
  setNavbar(true);
  buildMenu();
}
function setNavbar(an) { ['lern-home-btn', 'lern-result-badge'].forEach(id => { const el = $(id); if (el) el.style.visibility = an ? '' : 'hidden'; }); }

let vorPause = null;
$('pause-btn').onclick = () => { if (G.zustand === 'menu' || G.zustand === 'ende' || G.zustand === 'pause') return; vorPause = G.zustand; G.zustand = 'pause'; $('pause').hidden = false; };
$('weiter').onclick = () => { $('pause').hidden = true; G.zustand = vorPause || 'spiel'; };
$('beenden').onclick = () => { $('pause').hidden = true; zeigeMenu(); };
document.addEventListener('visibilitychange', () => { if (document.hidden && (G.zustand === 'spiel' || G.zustand === 'treffer')) $('pause-btn').click(); });

function hud() {
  $('herzen').textContent = G.herzen > 0 ? '❤️'.repeat(G.herzen) : '💔';
  $('stand').textContent = '✨ ' + G.besiegt;
  $('rest').textContent = W.modus === 'runde' ? `👾 ${Math.max(0, CFG.runde - G.versucht + (G.zustand === 'spiel' ? 1 : 0))}` : `⚡ ${Math.round(1 / G.tempo * 100)} %`;
}
let flashT = 0;
function flash(typ, text, klein = '', ms = 1100) {
  const el = $('flash');
  el.className = 'flash show ' + typ;
  el.innerHTML = esc(text) + (klein ? `<small>${esc(klein)}</small>` : '');
  clearTimeout(flashT); flashT = setTimeout(() => el.classList.remove('show'), ms);
}

/* ═══════════════════════════════════════════════════════
   SCHLEIFE
   ═══════════════════════════════════════════════════════ */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  G.t += dt;
  schritt(dt);
  if (gl) { animiere(dt); renderer.render(scene, camera); }
  else if (G.zustand !== 'menu') $('bahn').style.setProperty('--p', String(1 - G.weg));
}
function schritt(dt) {
  if (G.zustand === 'count') {
    const vor = Math.ceil(G.countT); G.countT -= dt; const n = Math.ceil(G.countT);
    $('count').textContent = G.countT > 0 && n > 0 ? n : '';
    if (n !== vor && n > 0) ton(392, .08);
    if (G.countT <= 0) { $('count').textContent = ''; neuesMonster(); }
  } else if (G.zustand === 'spiel') {
    G.weg += dt / G.laufzeit;
    if (G.weg >= 1) { G.weg = 1; monsterAmTurm(); }
  } else if (G.zustand === 'treffer') {
    G.trefferT += dt;
    if (G.trefferT > .38 && welt.monster && !welt.monster.userData.tot) {
      welt.monster.userData.tot = true;
      explosion(welt.monster.position, welt.monster.userData.farbe);
      welt3d.remove(welt.monster); welt.monster = null;
    }
    if (!gl && G.trefferT > .38) $('bahn').style.setProperty('--p', '1');
    if (G.trefferT > .38) $('labels').innerHTML = '';
    if (G.trefferT > .9) neuesMonster();
  } else if (G.zustand === 'verpasst') {
    G.pauseT -= dt;
    if (G.pauseT <= 0) {
      if (welt.monster) { welt3d.remove(welt.monster); welt.monster = null; }
      $('labels').innerHTML = '';
      if (G.herzen <= 0) ende(); else neuesMonster();
    }
  }
}
function animiere(dt) {
  const m = welt.monster;
  if (m && (G.zustand === 'spiel' || G.zustand === 'treffer' || G.zustand === 'verpasst' || G.zustand === 'pause')) {
    const zielX = START_X + (TURM_X + 10 - START_X) * G.weg;
    m.position.x = zielX;
    const k = m.userData.koerper, t = G.t;
    if (!REDUCED) {
      if (m.userData.typ === 'schleim') { const s = Math.abs(Math.sin(t * 6)); k.scale.set(1 + s * .12, 1 - s * .15, 1 + s * .12); k.position.y = s * 2.5; }
      else if (m.userData.typ === 'geist') { k.position.y = 3 + Math.sin(t * 3) * 1.5; k.rotation.x = Math.sin(t * 2) * .08; }
      else { k.position.y = Math.abs(Math.sin(t * 8)) * 1.2; k.rotation.x = Math.sin(t * 8) * .08; }
    }
    // Namensschild über dem Monster
    const lab = $('m-label');
    if (lab) {
      const p = m.getWorldPosition(new T.Vector3()); p.y += m.userData.hoehe + 4; p.project(camera);
      const r = $('stage').getBoundingClientRect();
      lab.style.left = ((p.x + 1) / 2 * r.width) + 'px'; lab.style.top = ((1 - p.y) / 2 * r.height) + 'px';
    }
  }
  // Figur: Zauberpose beim Treffer
  if (G.castT >= 0) { G.castT += dt; if (G.castT > .7) G.castT = -1; }
  const cast = G.castT >= 0 ? Math.sin(Math.min(1, G.castT / .7) * Math.PI) : 0;
  const traurig = G.zustand === 'verpasst' ? 1 : 0;
  figur.pose({ arme: cast * 1.5, jubel: G.zustand === 'ende' && G.herzen > 0 ? .6 + .4 * Math.abs(Math.sin(G.t * 5)) : 0,
    stolpern: traurig * .5, t: G.t, lehnen: cast * -.1 });
  figur.gesicht(cast > .2 ? 'cheer' : 'open');
  stab.rotation.z = -cast * .9;
  stab.userData.spitze.rotation.y += dt * 2;
  // Zauberstrahl
  if (G.castT >= 0 && G.castT < .4 && welt.monster) {
    if (!welt.blitz) {
      welt.blitz = new T.Mesh(new T.SphereGeometry(2.4, 12, 10), new T.MeshBasicMaterial({ color: 0xe9d5ff }));
      welt3d.add(welt.blitz);
      welt.blitzSchweif = [];
    }
    const a = new T.Vector3(TURM_X + 6, 16, 12), b = welt.monster.position.clone(); b.y += 7;
    const f = Math.min(1, G.castT / .38);
    welt.blitz.position.lerpVectors(a, b, f);
    welt.blitz.scale.setScalar(1 + (G.wort ? G.wort.wort.length : 4) * .08);
    if (!REDUCED && Math.random() < .8) {
      const s = new T.Mesh(new T.BoxGeometry(1, 1, 1), new T.MeshBasicMaterial({ color: Math.random() < .5 ? 0xc084fc : 0xfde68a, transparent: true }));
      s.position.copy(welt.blitz.position); s.userData = { v: new T.Vector3((Math.random() - .5) * 6, (Math.random() - .5) * 6, (Math.random() - .5) * 6), t: 0, dreh: 3 };
      welt3d.add(s); welt.teile.push(s);
    }
  } else if (welt.blitz) { welt3d.remove(welt.blitz); welt.blitz = null; }
  // Teilchen
  for (let i = welt.teile.length - 1; i >= 0; i--) {
    const p = welt.teile[i], u = p.userData;
    u.t += dt; u.v.y -= 40 * dt; p.position.addScaledVector(u.v, dt); p.rotation.x += u.dreh * dt; p.rotation.y += u.dreh * dt;
    if (p.position.y < .8) { p.position.y = .8; u.v.y *= -.3; u.v.x *= .6; u.v.z *= .6; }
    p.material.opacity = Math.max(0, 1 - u.t / 1.1);
    if (u.t > 1.1) { welt3d.remove(p); p.geometry.dispose(); p.material.dispose(); welt.teile.splice(i, 1); }
  }
}

/* ═══════════════════════════════════════════════════════
   START
   ═══════════════════════════════════════════════════════ */
loadWahl();
(function linkAuswerten() {
  const L = LernAufgaben.ausLink(location.search);
  const vok = L.ids.find(id => /^vok\d/.test(id));
  if (vok) { W.buch = vok; W.bis = L.opts.bis || ''; W.lehrer = true; }
  const m = new URLSearchParams(location.search).get('modus');
  if (m === 'endlos' || m === 'runde') W.modus = m;
})();
LernSpiel.whenPass(() => {
  buildMenu();
  requestAnimationFrame(loop);
  init3d().catch(() => { gl = false; });
});
</script>
