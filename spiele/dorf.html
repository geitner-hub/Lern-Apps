<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Mein Dorf – Lernwelt</title>
  <!--
    Mein Dorf – Aufbauspiel der Lernwelt
    Etappe 4: 3D-Dorf mit Bauplätzen, Bauen/Ausbauen (Stufe 1–4, Ansehen), Auftragsbrett mit
    Wochen- und Bewohner-Auftrag, Bewohner, Sammelbuch, Dorf-Postkarte.
    Etappe 5: Dorf-Events (Festwiese mit Festgebäude und Gast, Event-Währung, Deko und Festkiste,
    Adventskalender bzw. Suche, Fest-Seiten im Sammelbuch).
    Logik und Spielstand: gemeinsam/dorf-kern.js · 3D: gemeinsam/dorf-szene.js
    Inhalte: daten/dorf-inhalte.json
  -->
  <link rel="stylesheet" href="../gemeinsam/fonts.css">
  <style>
    :root {
      --nacht: #13121f; --nacht2: #1b1929; --text: #f1f0fb; --text2: rgba(241,240,251,.72); --muted: rgba(241,240,251,.45);
      --holz: #7a4a28; --holz2: #5c351b; --holz3: #9a6538;
      --papier: #f6ecd2; --papier2: #efe0bb; --tinte: #3b2a1a; --tinte2: #7a6248;
      --gruen: #4ade80; --gold: #e6a817;
    }
    * { box-sizing: border-box; }
    html { background: var(--nacht); }
    html, body { margin: 0; }
    body {
      min-height: 100vh; font-family: 'Nunito', system-ui, sans-serif; color: var(--text);
      background: linear-gradient(180deg, #1d2447 0, var(--nacht) 520px) no-repeat var(--nacht);
      padding: max(1rem, env(safe-area-inset-top)) 1rem calc(5.5rem + env(safe-area-inset-bottom));
    }
    main { max-width: 980px; margin: 0 auto; }
    h1, h2 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; margin: 0; }
    button, .knopf { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #818cf8; outline-offset: 3px; }

    /* Kopf */
    .kopf { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .8rem 1.5rem; margin: .4rem 0 1.4rem; }
    .kopf h1 { font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1; }
    .kopf p { margin: .35rem 0 0; color: var(--text2); font-weight: 700; }
    .vorrat { display: flex; gap: .5rem; flex-wrap: wrap; }
    .kiste {
      display: flex; align-items: center; gap: .45rem; padding: .45rem .8rem .45rem .6rem; border-radius: 10px;
      background: var(--holz2); border: 2px solid var(--holz3); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
      font-weight: 900; font-size: 1.15rem; min-width: 5.2rem;
    }
    .kiste span { font-size: 1.3rem; }
    .kiste small { display: block; font-size: .68rem; font-weight: 800; color: rgba(255,255,255,.6); line-height: 1; }
    .kiste.neu { animation: puls .9s ease; }
    @keyframes puls { 40% { transform: scale(1.12); border-color: var(--gruen); } }

    /* Das Brett */
    .brett {
      position: relative; padding: 1.2rem 1.2rem 1.4rem; border-radius: 14px;
      background:
        repeating-linear-gradient(180deg, transparent 0 58px, rgba(0,0,0,.18) 58px 61px),
        linear-gradient(90deg, var(--holz2), var(--holz) 12%, var(--holz) 88%, var(--holz2));
      border: 6px solid #4a2a14; box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    .brett-kopf { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .5rem 1rem; margin-bottom: 1.1rem; }
    .brett-kopf h2 { font-size: 1.55rem; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
    .wuerfel { font-weight: 800; color: #fde7c4; background: rgba(0,0,0,.25); padding: .3rem .7rem; border-radius: 99px; font-size: .92rem; }
    .zettel-reihe { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.3rem 1.1rem; }

    .zettel {
      --pin: #818cf8; position: relative; background: var(--papier); color: var(--tinte);
      padding: 1.4rem 1.1rem 1rem; border-radius: 3px 3px 6px 6px; min-height: 250px;
      display: flex; flex-direction: column; gap: .55rem;
      box-shadow: 0 8px 14px rgba(0,0,0,.35), inset 0 -18px 30px -24px rgba(122,74,40,.5);
      transform: rotate(var(--dreh, -1deg));
    }
    .zettel:nth-child(2) { --dreh: 1.2deg; }
    .zettel:nth-child(3) { --dreh: -.4deg; }
    .zettel:nth-child(4) { --dreh: .8deg; }
    .zettel::before {                                     /* Reißzwecke */
      content: ''; position: absolute; top: -9px; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.7) 0 3px, var(--pin) 4px);
      box-shadow: 0 3px 4px rgba(0,0,0,.4);
    }
    .fach { font-weight: 900; font-size: .85rem; color: var(--tinte2); }
    .app { display: flex; align-items: center; gap: .55rem; font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 1.3rem; line-height: 1.15; }
    .app .emoji { font-size: 1.8rem; }
    .ziel { font-weight: 700; font-size: .95rem; }
    .punkte { display: flex; gap: .4rem; }
    .punkte i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--tinte2); }
    .punkte i.voll { background: #16a34a; border-color: #15803d; }
    .lohn { font-weight: 900; font-size: 1.15rem; margin-top: auto; }
    .bonus { display: inline-block; font-size: .78rem; font-weight: 800; background: #fde68a; color: #7a4a00; border-radius: 6px; padding: .1rem .4rem; margin-left: .2rem; vertical-align: 2px; }
    .knoepfe { display: flex; gap: .5rem; margin-top: .35rem; }
    .knopf, .tausch {
      border: 0; border-radius: 10px; padding: .6rem .9rem; font-weight: 900; cursor: pointer; text-decoration: none; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .knopf { flex: 1; background: #16a34a; color: #fff; box-shadow: 0 4px 0 #0f6b30; }
    .knopf:active { transform: translateY(3px); box-shadow: 0 1px 0 #0f6b30; }
    .tausch { background: transparent; color: var(--tinte); border: 2px dashed var(--tinte2); }
    .tausch:disabled { opacity: .35; cursor: default; }
    .zettel.leer { background: var(--papier2); align-items: center; justify-content: center; text-align: center; color: var(--tinte2); font-weight: 800; }
    .zettel.leer .gross { font-size: 2.2rem; }
    .zettel.getauscht { animation: tausch .5s ease; }
    @keyframes tausch { 0% { transform: rotate(var(--dreh)) rotateY(90deg); } 100% { transform: rotate(var(--dreh)); } }

    /* Wochenauftrag: breiter Zettel über die ganze Reihe */
    .zettel.woche { grid-column: 1 / -1; min-height: 0; --pin: #e6a817; --dreh: .3deg;
      background: linear-gradient(180deg, #fff6d6, var(--papier)); display: grid; grid-template-columns: 1fr auto; gap: .5rem 1.2rem; align-items: center; }
    .zettel.woche .links { display: flex; flex-direction: column; gap: .45rem; }
    .zettel.woche .rechts { display: flex; flex-direction: column; gap: .5rem; align-items: flex-end; }
    .balken { height: 12px; border-radius: 99px; background: rgba(122,98,72,.25); overflow: hidden; max-width: 360px; }
    .balken i { display: block; height: 100%; background: linear-gradient(90deg, #e6a817, #f5c542); border-radius: 99px; }
    .von-lk { display: inline-block; font-size: .75rem; font-weight: 900; background: #3b2a1a; color: #fde68a; border-radius: 6px; padding: .1rem .45rem; margin-left: .3rem; vertical-align: 2px; }
    .rest { font-size: .82rem; font-weight: 800; color: var(--tinte2); }
    @media (max-width: 560px) { .zettel.woche { grid-template-columns: 1fr; } .zettel.woche .rechts { align-items: stretch; } }

    /* Bewohner-Auftrag */
    .zettel.bewohner { grid-column: 1 / -1; min-height: 0; --dreh: -.4deg; background: linear-gradient(180deg, #eef6ff, #f6ecd2);
      display: grid; grid-template-columns: auto 1fr auto; gap: .5rem 1rem; align-items: center; }
    .zettel.bewohner .portrait { font-size: 3rem; line-height: 1; }
    .zettel.bewohner .geschichte { font-style: italic; line-height: 1.4; }
    .zettel.bewohner .rechts { display: flex; flex-direction: column; gap: .5rem; align-items: flex-end; }
    @media (max-width: 560px) { .zettel.bewohner { grid-template-columns: auto 1fr; } .zettel.bewohner .rechts { grid-column: 1 / -1; align-items: stretch; } }

    /* Kopf-Knöpfe, Neuigkeiten */
    .kopf-knoepfe { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }
    .kopf-knoepfe button { border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); color: var(--text); border-radius: 99px;
      padding: .45rem .9rem; font-weight: 800; cursor: pointer; }
    .kopf-knoepfe button .punkt { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #f87171; margin-left: .3rem; vertical-align: 1px; }
    .kiste.ansehen { background: #3b2f5c; border-color: #7c6bc4; }
    .neu-banner { background: linear-gradient(90deg, #14532d, #166534); border: 2px solid rgba(74,222,128,.5); border-radius: 14px;
      padding: .8rem 1rem; margin: 0 0 1rem; display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; font-weight: 700; }
    .neu-banner .gross { font-size: 2rem; }
    .neu-banner button { margin-left: auto; background: rgba(0,0,0,.25); border: 0; color: #fff; border-radius: 99px; padding: .4rem .9rem; font-weight: 800; cursor: pointer; }
    .ansehen-balken { height: 10px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; max-width: 320px; margin: .2rem 0; }
    .ansehen-balken i { display: block; height: 100%; background: linear-gradient(90deg, #a78bfa, #c4b5fd); }

    /* Overlays: Sammelbuch, Postkarte */
    .overlay { position: fixed; inset: 0; z-index: 10002; background: rgba(10,9,20,.82); display: flex; align-items: flex-start; justify-content: center;
      overflow: auto; padding: max(1rem, env(safe-area-inset-top)) .8rem 2rem; }
    .overlay[hidden] { display: none; }
    .buch { width: min(920px, 100%); background: #f3e7c9; color: var(--tinte); border-radius: 12px; padding: 1.3rem 1.2rem 1.6rem;
      box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 6px #7a4a28; }
    .buch-kopf { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .6rem; }
    .buch-kopf h2 { color: var(--tinte); font-size: 1.7rem; }
    .zu { border: 0; background: #7a4a28; color: #fff; border-radius: 99px; width: 2.4rem; height: 2.4rem; font-size: 1.2rem; cursor: pointer; flex: none; }
    .buch h3 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; margin: 1.2rem 0 .6rem; font-size: 1.2rem; }
    .buch .leise { color: var(--tinte2); font-weight: 700; font-size: .9rem; margin: 0; }
    .seiten { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .7rem; }
    .person { background: rgba(255,255,255,.5); border-radius: 10px; padding: .7rem .8rem; display: grid; grid-template-columns: auto 1fr; gap: .15rem .7rem; align-items: center; }
    .person .gesicht { font-size: 2rem; grid-row: span 2; }
    .person b { font-size: 1rem; }
    .person small { color: var(--tinte2); font-weight: 700; }
    .person .fach-stuecke { grid-column: 1 / -1; display: flex; gap: .4rem; margin-top: .3rem; flex-wrap: wrap; }
    .stueck { display: inline-flex; align-items: center; gap: .35rem; background: #fff8e7; border: 2px solid #d9c49a; border-radius: 10px; padding: .25rem .55rem; font-weight: 800; font-size: .85rem; }
    .stueck.fehlt { background: transparent; border-style: dashed; color: rgba(59,42,26,.45); }
    .person.fremd { opacity: .55; }
    .meilen { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
    .meilen div { background: rgba(255,255,255,.5); border-radius: 10px; padding: .6rem; text-align: center; font-weight: 800; font-size: .85rem; }
    .meilen div .gross { font-size: 1.8rem; display: block; }
    .meilen div small { display: block; font-weight: 600; color: var(--tinte2); }
    .meilen div.fehlt { opacity: .4; filter: grayscale(1); }
    .karte-bild { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .postkarte-steuer { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .9rem; }
    .postkarte-steuer input { font: inherit; font-weight: 700; padding: .55rem .8rem; border-radius: 10px; border: 2px solid #d9c49a; background: #fff; min-width: 0; flex: 1 1 200px; }

    .hinweis { margin: 1.1rem .2rem 0; color: var(--text2); font-size: .92rem; font-weight: 600; }

    /* Dorf-Event */
    .event-band { --e1: #f59e0b; --e2: #6366f1; position: relative; overflow: hidden; margin: 0 0 1rem; border-radius: 16px; padding: .9rem 1rem;
      background: #2a2340; border: 2px solid rgba(255,255,255,.2);
      background: linear-gradient(110deg, color-mix(in srgb, var(--e1) 38%, #1b1929), color-mix(in srgb, var(--e2) 34%, #1b1929));
      border: 2px solid color-mix(in srgb, var(--e1) 60%, transparent); display: grid; grid-template-columns: auto 1fr; gap: .2rem .9rem; align-items: center; }
    .event-band .gross { font-size: 2.6rem; grid-row: span 2; line-height: 1; }
    .event-band h2 { font-size: 1.35rem; }
    .event-band p { margin: 0; color: var(--text2); font-weight: 700; font-size: .92rem; line-height: 1.4; }
    .event-band .ev-knoepfe { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
    .event-band .ev-knoepfe button { border: 0; border-radius: 99px; padding: .5rem 1rem; font-weight: 900; cursor: pointer; background: rgba(255,255,255,.14); color: #fff; }
    .event-band .ev-knoepfe button.an { background: #fff; color: #3b2a1a; box-shadow: 0 0 0 3px color-mix(in srgb, var(--e1) 70%, transparent); }
    .event-band .geschenk { grid-column: 1 / -1; margin-top: .5rem; background: rgba(0,0,0,.25); border-radius: 10px; padding: .45rem .7rem; font-weight: 800; }
    .kiste.event { background: #4a2d5c; border-color: #a78bfa; }
    .zettel.gast { grid-column: 1 / -1; min-height: 0; --dreh: .5deg; background: linear-gradient(180deg, #fff1e6, #f6ecd2);
      display: grid; grid-template-columns: auto 1fr auto; gap: .5rem 1rem; align-items: center; }
    .zettel.gast .portrait { font-size: 3rem; line-height: 1; }
    .zettel.gast .geschichte { font-style: italic; line-height: 1.4; }
    .zettel.gast .rechts { display: flex; flex-direction: column; gap: .5rem; align-items: flex-end; }
    .fest-marke { display: inline-block; font-size: .75rem; font-weight: 900; background: #3b2a1a; color: #fde68a; border-radius: 6px; padding: .1rem .45rem; margin-left: .3rem; vertical-align: 2px; }
    @media (max-width: 560px) { .zettel.gast { grid-template-columns: auto 1fr; } .zettel.gast .rechts { grid-column: 1 / -1; align-items: stretch; } }
    .deko-reihe { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; margin-top: .7rem; }
    .deko-reihe .option { align-items: flex-start; }
    .deko-reihe .icon { font-size: 2rem; }
    .fertig-marke { font-weight: 900; color: var(--gruen); }
    .tueren { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: .5rem; margin-top: .8rem; }
    .tuer { width: 100%; min-height: 64px; aspect-ratio: 1; align-self: start; border-radius: 10px; border: 3px solid #7a4a28; background: #b91c1c; color: #fff; font-family: 'Fredoka One', 'Nunito', sans-serif;
      font-size: 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: default; position: relative; }
    .tuer:nth-child(3n+2) { background: #15803d; } .tuer:nth-child(3n) { background: #1d4ed8; }
    .tuer small { font-family: 'Nunito', sans-serif; font-size: .7rem; font-weight: 900; }
    .tuer.zu { opacity: .45; }
    .tuer.offen { background: #f6ecd2 !important; color: var(--tinte); border-style: dashed; font-size: 1.2rem; }
    .tuer.jetzt { cursor: pointer; box-shadow: 0 0 0 4px #fde047, 0 0 20px #fde047; animation: wackeln 1.4s ease-in-out infinite; }
    @keyframes wackeln { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
    .kisten-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .6rem; margin-top: .6rem; }
    .kisten-liste .person { grid-template-columns: auto 1fr; }
    .kisten-liste button { grid-column: 1 / -1; border: 0; border-radius: 8px; padding: .45rem; font-weight: 900; background: #16a34a; color: #fff; cursor: pointer; }
    .kisten-liste button.leise { background: transparent; color: var(--tinte); border: 2px dashed var(--tinte2); }
    .fest-seite { background: rgba(255,255,255,.45); border-radius: 12px; padding: .7rem .8rem; margin-top: .6rem; }
    .fest-seite h4 { margin: 0 0 .3rem; font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: 1.1rem; }
    @media (prefers-reduced-motion: reduce) { .tuer.jetzt { animation: none; } }

    /* Das Dorf (3D) */
    .szene {
      position: relative; height: clamp(280px, 68vw, 560px); max-height: 70vh; border-radius: 18px; overflow: hidden;
      background: linear-gradient(180deg, #6fb6ff, #e9f5ff); border: 4px solid #4a2a14; box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    .szene-tipp { position: absolute; left: .7rem; bottom: .6rem; background: rgba(19,18,31,.72); color: #fff; font-weight: 800; font-size: .85rem;
      padding: .3rem .7rem; border-radius: 99px; pointer-events: none; }
    .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: .5rem; padding: .8rem; height: 100%; overflow: auto; align-content: start; }
    .raster button { border: 2px solid rgba(0,0,0,.15); border-radius: 12px; background: #e9dcc0; color: var(--tinte); font-weight: 800; padding: .6rem .3rem; cursor: pointer; }
    .raster button .gross { display: block; font-size: 1.8rem; }
    .raster button.zu { background: #cfd8c8; opacity: .75; }
    .raster button.an { outline: 3px solid #ffd84a; }

    /* Bau-Tafel zum gewählten Bauplatz */
    .bau { margin: 1rem 0 2rem; background: var(--nacht2); border: 1px solid rgba(255,255,255,.09); border-radius: 16px; padding: 1.1rem 1.2rem; }
    .bau h2 { font-size: 1.35rem; display: flex; align-items: center; gap: .5rem; }
    .bau p { margin: .45rem 0; color: var(--text2); line-height: 1.45; }
    .bau .leise { color: var(--muted); font-size: .9rem; }
    .optionen { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .7rem; margin-top: .8rem; }
    .option { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: .8rem; display: flex; flex-direction: column; gap: .4rem; }
    .option b { font-size: 1.05rem; }
    .option .icon { font-size: 1.6rem; }
    .option small { color: var(--text2); line-height: 1.35; }
    .kosten { display: flex; gap: .4rem; flex-wrap: wrap; font-weight: 900; }
    .kosten span { background: rgba(255,255,255,.08); border-radius: 8px; padding: .15rem .5rem; }
    .kosten span.fehlt { background: rgba(248,113,113,.18); color: #fca5a5; }
    .bau .knopf { flex: none; align-self: flex-start; margin-top: .3rem; }
    .bau .knopf:disabled { background: #4b5563; box-shadow: 0 4px 0 #374151; cursor: default; opacity: .8; }
    .stufen { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: .3rem; }
    .stufen i { width: 10px; height: 10px; border-radius: 2px; background: rgba(255,255,255,.18); }
    .stufen i.voll { background: var(--gold); }

    /* Start und Hinweise */
    .karte { max-width: 520px; margin: 3rem auto; text-align: center; background: var(--nacht2); border-radius: 18px; padding: 2rem 1.6rem; border: 1px solid rgba(255,255,255,.08); }
    .karte h1 { font-size: 2rem; margin: .4rem 0 .6rem; }
    .karte p { color: var(--text2); line-height: 1.5; margin: .4rem 0; }
    .karte .gross { font-size: 3.2rem; }
    .karte .knopf { display: inline-block; flex: none; margin-top: 1.1rem; padding: .8rem 1.5rem; font-size: 1.1rem; }

    @media (max-width: 560px) { .zettel { transform: none; } .zettel-reihe { gap: 1.4rem; } }
    @media (prefers-reduced-motion: reduce) { .kiste.neu, .zettel.getauscht { animation: none; } }
    .hinweis + .ende { height: 1rem; }
  </style>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="karte"><div class="gross">🏘️</div><p>Dorf wird geladen …</p></div>
</main>

<script src="../gemeinsam/shared.js"></script>
<script src="../gemeinsam/config-api.js"></script>
<script src="../gemeinsam/avatar3d.js"></script>
<script src="../gemeinsam/dorf-szene.js"></script>
<script>
(function () {
  'use strict';
  const $app = document.getElementById('app');
  const esc = s => (typeof escHtml === 'function' ? escHtml(s) : String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));
  const farbe = fach => (typeof CAT_STYLES !== 'undefined' && CAT_STYLES[fach]) ? CAT_STYLES[fach].color : '#94a3b8';
  const ICON = { Mathematik: '➕', Englisch: '🇬🇧', GPG: '🏛' };
  let vorher = {};                                  // Rohstoffe beim letzten Zeichnen (für den Puls)
  let getauscht = null;

  // Warten, bis navbar.js pass.js und dorf-kern.js geladen hat
  function warte(test, ms = 8000) {
    return new Promise(res => {
      const t0 = Date.now();
      (function schau() { if (test()) return res(true); if (Date.now() - t0 > ms) return res(false); setTimeout(schau, 60); })();
    });
  }

  async function start() {
    await ConfigAPI.loadPublic().catch(() => {});  // App-Liste aktuell halten (schreibt den Zwischenspeicher)
    const da = await warte(() => window.LernDorf && window.LernPass);
    if (!da) { karte('⚠️', 'Das Dorf konnte nicht geladen werden.', 'Prüfe die Internetverbindung und lade die Seite neu.'); return; }
    const D = window.LernDorf, P = window.LernPass;

    if (!P.hasProfile()) {
      karte('🪪', 'Du brauchst zuerst einen Lernwelt-Pass.', 'Leg ihn auf der Startseite an. Danach kannst du hier dein Dorf gründen.',
            '<a class="knopf" href="../index.html">Zur Startseite</a>');
      return;
    }
    if (!D.klasse()) {
      karte('🎒', 'Welche Klasse bist du?', 'Wähle deine Klasse im Pass auf der Startseite. Dann bekommst du passende Aufträge.',
            '<a class="knopf" href="../index.html">Zur Startseite</a>');
      return;
    }
    if (!D.gestartet()) {
      const name = esc(P.profile().name || '');
      karte('🏘️', 'Gründe dein Dorf!',
        `${name ? name + ', du' : 'Du'} wirst Bürgermeister oder Bürgermeisterin. Erledige Aufträge in den Lern-Apps und sammle Holz und Stein. Damit baust du dein Dorf.`,
        '<button class="knopf" id="gruenden">Dorf gründen</button>');
      document.getElementById('gruenden').onclick = async () => { await D.starten(); laufen(); };
      return;
    }
    await D.bereit();
    laufen();
  }

  function karte(icon, titel, text, extra = '') {
    $app.innerHTML = `<div class="karte"><div class="gross" aria-hidden="true">${icon}</div><h1>${titel}</h1><p>${text}</p>${extra}</div>`;
  }

  // ── Seite aufbauen (einmal), danach nur Teile aktualisieren ──
  let szene = null, gewaehlt = null, besuch = null, setzen = null, fund = null;

  async function laufen() {
    const D = window.LernDorf;
    $app.innerHTML = `
      <header class="kopf">
        <div><h1 id="dorfname">Mein Dorf</h1><p id="untertitel"></p>
          <div class="kopf-knoepfe"><button id="k-buch">📖 Sammelbuch<span id="k-buch-punkt"></span></button><button id="k-karte">📮 Postkarte</button><button id="k-kiste" hidden>🎁 Festkiste</button></div></div>
        <div class="vorrat" id="vorrat" aria-label="Deine Rohstoffe"></div>
      </header>
      <div id="event"></div>
      <div id="neues"></div>
      <section class="szene" id="szene" aria-label="Dein Dorf"><div class="szene-tipp">Tippe auf einen Bauplatz</div></section>
      <section class="bau" id="bau" aria-live="polite"></section>
      <section class="brett" aria-labelledby="brett-titel">
        <div class="brett-kopf"><h2 id="brett-titel">Auftragsbrett</h2><div class="wuerfel" id="wuerfel"></div></div>
        <div class="zettel-reihe" id="zettel"></div>
      </section>
      <p class="hinweis" id="hinweis"></p>
      <div class="overlay" id="ov-buch" hidden role="dialog" aria-modal="true" aria-labelledby="buch-titel"><div class="buch" id="buch"></div></div>
      <div class="overlay" id="ov-karte" hidden role="dialog" aria-modal="true" aria-labelledby="karte-titel"><div class="buch" id="karte"></div></div>
      <div class="overlay" id="ov-kal" hidden role="dialog" aria-modal="true" aria-labelledby="kal-titel"><div class="buch" id="kal"></div></div>
      <div class="overlay" id="ov-kiste" hidden role="dialog" aria-modal="true" aria-labelledby="kiste-titel"><div class="buch" id="kiste"></div></div>`;
    document.getElementById('k-kiste').onclick = () => { kisteZeichnen(); oeffnen('ov-kiste'); };
    document.getElementById('k-buch').onclick = () => { buchZeichnen(); oeffnen('ov-buch'); };
    document.getElementById('k-karte').onclick = () => { oeffnen('ov-karte'); karteZeichnen(); };
    document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) schliessen(o.id); }));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.overlay:not([hidden])').forEach(o => schliessen(o.id)); });
    // Start: noch nichts gebaut → Rathaus-Platz zeigen
    const rathausPlatz = D.plaetze().find(p => p.fest === 'rathaus');
    if (rathausPlatz && !D.state.b[rathausPlatz.id]) gewaehlt = rathausPlatz.id;
    zeichnen();

    besuch = D.eventBesuch();
    if (besuch && besuch.start) zeichnen();
    const host = document.getElementById('szene');
    szene = window.LernDorfSzene ? await window.LernDorfSzene.mount(host, { onPlatz: waehle }) : null;
    window.LernDorfSeite = { get szene() { return szene; }, waehle };
    if (szene) { szene.auswahl(gewaehlt); }
    else { host.querySelector('.szene-tipp').remove(); rasterZeichnen(); }
    neuesZeigen();
    D.onChange(() => zeichnen());
  }

  function waehle(id) {
    const D = window.LernDorf;
    if (id === 'suche') {                                              // Gefunden!
      const r = D.gefunden();
      if (r.ok) { fund = r; if (szene) szene.jubel(); }
      id = gewaehlt;
    } else fund = null;
    if (setzen) {                                                      // Deko platzieren
      if (typeof id === 'string' && id.startsWith('d:')) {
        const r = D.dekoSetzen(id.slice(2), setzen);
        if (r.ok && szene) szene.jubel();
      }
      setzen = null;
      tipp('Tippe auf einen Bauplatz');
      if (szene) szene.setzModus(false);
    }
    gewaehlt = id;
    if (szene) szene.auswahl(id); else rasterZeichnen();
    bauZeichnen();
    const bau = document.getElementById('bau');
    if (bau && bau.getBoundingClientRect().top > window.innerHeight - 120) bau.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function zeichnen() {
    const D = window.LernDorf, S = D.state;
    const name = (window.LernPass.profile() || {}).name || '';
    document.getElementById('untertitel').textContent = name ? 'Bürgermeisterei von ' + name : 'Deine Bürgermeisterei';
    document.getElementById('vorrat').innerHTML = D.rohstoffe().map(r => {
      const n = S.r[r.id] || 0, neu = vorher[r.id] !== undefined && n > vorher[r.id];
      return `<div class="kiste${neu ? ' neu' : ''}" title="${esc(r.name)}"><span aria-hidden="true">${r.icon}</span><div>${n}<small>${esc(r.name)}</small></div></div>`;
    }).join('') + `<div class="kiste ansehen${vorher.an !== undefined && S.an > vorher.an ? ' neu' : ''}" title="Ansehen: wie beliebt dein Dorf ist"><span aria-hidden="true">⭐</span><div>${S.an}<small>Ansehen</small></div></div>`
      + (() => {                                                       // Währung des laufenden Events
        const a = D.aktivesEvent(), w = a && a.def && a.def.waehrung;
        if (!w) return '';
        const n = S.r[w.id] || 0, neu = vorher[w.id] !== undefined && n > vorher[w.id];
        return `<div class="kiste event${neu ? ' neu' : ''}" title="${esc(w.name)}: nur für das Fest"><span aria-hidden="true">${esc(w.icon)}</span><div>${n}<small>${esc(w.name)}</small></div></div>`;
      })();
    vorher = Object.assign({}, S.r, { an: S.an });
    eventZeichnen();
    document.getElementById('k-kiste').hidden = !(D.festkiste().length || (D.aktivesEvent() || {}).def);
    document.getElementById('dorfname').textContent = S.dn || 'Mein Dorf';
    document.getElementById('k-buch-punkt').className = S.nz && S.nz.length ? 'punkt' : '';
    if (S.nz && S.nz.length) setTimeout(neuesZeigen, 0);
    if (szene) szene.update(); else if (document.querySelector('.raster')) rasterZeichnen();
    bauZeichnen();
    brettZeichnen();
  }

  // Ohne 3D: Bauplätze als Knöpfe
  function rasterZeichnen() {
    const D = window.LernDorf;
    const host = document.getElementById('szene');
    host.innerHTML = '<div class="raster">' + D.plaetze().map(p => {
      const i = D.platzInfo(p.id);
      const icon = i.gesperrt ? '🔒' : !i.eintrag ? '🚧' : i.imBau && i.stufe === 0 ? '🏗️' : (i.gebaeude.icon || '🏠');
      const text = i.gesperrt ? 'Gesperrt' : !i.eintrag ? 'Bauplatz' : esc(i.gebaeude.name) + (i.stufe ? ' ' + i.stufe : '');
      return `<button class="${i.gesperrt ? 'zu' : ''}${gewaehlt === p.id ? ' an' : ''}" data-platz="${p.id}"><span class="gross" aria-hidden="true">${icon}</span>${text}</button>`;
    }).join('') + (() => {
      const a = D.aktivesEvent(), fi = a && a.def ? D.festInfo(a.id) : null, s = D.sucheInfo();
      const kiste = D.festkiste(), frei = setzen || kiste.some(k => !k.platz);
      let h = `<button class="${gewaehlt === 'fest' ? 'an' : ''}" data-platz="fest"><span class="gross" aria-hidden="true">${fi ? esc(fi.gebaeude.icon) : '🎪'}</span>Festwiese</button>`;
      D.dekoPlaetze().forEach(p => {
        if (!p.belegt && !frei) return;
        const d = p.belegt ? D.dekoDef(p.belegt) : null;
        h += `<button class="${gewaehlt === 'd:' + p.id ? 'an' : ''}" data-platz="d:${esc(p.id)}"><span class="gross" aria-hidden="true">${d ? esc(d.icon) : '✨'}</span>${d ? esc(d.name) : 'Deko-Platz'}</button>`;
      });
      if (s && s.versteck) h += `<button data-platz="suche"><span class="gross" aria-hidden="true">${esc(s.mechanik.icon)}</span>Suchen!</button>`;
      return h;
    })() + '</div>';
    host.querySelectorAll('button').forEach(b => b.onclick = () => waehle(/^\d+$/.test(b.dataset.platz) ? Number(b.dataset.platz) : b.dataset.platz));
  }

  function kostenHtml(k) {
    const D = window.LernDorf, S = D.state;
    return '<div class="kosten">' + Object.entries(k).filter(([, n]) => n > 0).map(([r, n]) => {
      const R = D.rohstoff(r), hat = S.r[r] || 0;
      return `<span class="${hat < n ? 'fehlt' : ''}" title="${esc(R.name)}: du hast ${hat}">${R.icon} ${n}</span>`;
    }).join('') + '</div>';
  }
  function stufenHtml(st, max) { return `<span class="stufen" aria-label="Stufe ${st} von ${max}">${Array.from({ length: max }, (_, i) => `<i class="${i < st ? 'voll' : ''}"></i>`).join('')}</span>`; }
  function bonusText(g, st) {
    if (!g.bonus || st < 1) return '';
    return Object.entries(g.bonus).map(([r, l]) => {
      const v = Array.isArray(l) ? l[Math.min(st, l.length) - 1] : 0;
      if (!v) return '';
      const p = Math.round(v * 100);
      if (r === 'rabatt') return `alle Bauten ${p} % günstiger`;
      if (r === 'woche') return `+${p} % Holz und Stein aus dem Wochenauftrag`;
      return `+${p} % ${window.LernDorf.rohstoff(r).name} aus jedem Auftrag`;
    }).filter(Boolean).join(' · ');
  }
  function wann(tag) {
    const D = window.LernDorf, t = D.heute();
    const d = D._tageZwischen(t, tag);
    if (d <= 0) return 'heute';
    if (d === 1) return 'morgen';
    return 'am ' + tag.slice(6, 8) + '.' + tag.slice(4, 6) + '.';
  }

  function bauZeichnen() {
    const D = window.LernDorf, el = document.getElementById('bau');
    if (!el) return;
    if (setzen) { setzenZeichnen(el); return; }
    if (gewaehlt === 'fest') { festZeichnen(el); return; }
    if (typeof gewaehlt === 'string' && gewaehlt.startsWith('d:')) { dekoPlatzZeichnen(el, gewaehlt.slice(2)); return; }
    if (gewaehlt === null) {
      el.innerHTML = (fund ? fundHtml() : '') + `<h2>🏗️ Bauen</h2><p>Tippe im Dorf auf einen Bauplatz. Dort kannst du bauen oder ein Gebäude ausbauen.</p>`;
      return;
    }
    const i = D.platzInfo(gewaehlt);
    if (!i) { el.innerHTML = ''; return; }
    const nichts = Object.keys(D.state.b).length === 0;

    if (i.gesperrt) {
      el.innerHTML = `<h2>🔒 Gesperrter Bauplatz</h2><p>Baue dein Rathaus auf Stufe ${i.noetig} aus. Dann kannst du hier bauen.</p>`;
      return;
    }
    if (!i.eintrag) {
      const liste = D.baubar(gewaehlt);
      const opt = liste.map(o => `
        <div class="option">
          <div><span class="icon" aria-hidden="true">${esc(o.gebaeude.icon || '🏠')}</span> <b>${esc(o.gebaeude.name)}</b></div>
          <small>${esc(o.gebaeude.text || '')}</small>
          ${kostenHtml(o.kosten)}
          <button class="knopf" data-bauen="${esc(o.gebaeude.id)}" ${o.genug ? '' : 'disabled'}>${o.genug ? 'Bauen' : 'Noch zu wenig'}</button>
        </div>`).join('');
      const fest = i.def.fest ? D.gebaeude(i.def.fest) : null;
      el.innerHTML = `<h2>🚧 ${fest ? 'Platz für dein ' + esc(fest.name) : 'Freier Bauplatz'}</h2>
        <p>${nichts ? 'Dein erster Bau ist sofort fertig. Holz und Stein bekommst du für Aufträge vom Auftragsbrett.' : 'Neue Gebäude und Ausbauten sind ab dem nächsten Tag fertig.'}</p>
        ${liste.length ? `<div class="optionen">${opt}</div>` : '<p class="leise">Hier ist gerade nichts mehr zu bauen. Jedes Gebäude außer Wohnhäusern gibt es nur einmal.</p>'}`;
      el.querySelectorAll('[data-bauen]').forEach(b => b.onclick = () => {
        const r = D.bauen(gewaehlt, b.dataset.bauen);
        if (r.ok && szene) szene.jubel();
      });
      return;
    }

    const g = i.gebaeude, max = Number(g.maxStufe) || i.zielStufe;
    const bonus = bonusText(g, i.stufe);
    let unten;
    if (i.imBau) {
      unten = `<p>🔨 ${i.stufe ? 'Ausbau auf Stufe ' + i.zielStufe : 'Wird gebaut'} – fertig ${wann(i.fertigAb)}.</p>`;
    } else if (i.naechste) {
      const frei = g.id === 'rathaus' ? D.plaetze().filter(p => p.rathaus === i.naechste).length : 0;
      const an = D.state.an, noetig = i.ansehen || 0;
      const kann = i.genug && i.ansehenOk;
      unten = `<div class="option" style="margin-top:.7rem">
          <b>Ausbauen auf Stufe ${i.naechste}${i.naechste === 4 ? ' ✨ Prachtstufe' : ''}</b>
          ${frei ? `<small>Schaltet ${frei} neue Bauplätze frei.</small>` : ''}
          ${bonusText(g, i.naechste) ? `<small>Danach: ${esc(bonusText(g, i.naechste))}</small>` : ''}
          ${noetig ? `<small>⭐ Ansehen: ${an} von ${noetig} nötig${i.ansehenOk ? ' ✓' : ' – mehr Ansehen gibt es für Gebäude und Aufträge deiner Bewohner'}</small>
            <div class="ansehen-balken" aria-hidden="true"><i style="width:${Math.min(100, Math.round(an / noetig * 100))}%"></i></div>` : ''}
          ${kostenHtml(i.kosten)}
          <button class="knopf" id="ausbauen" ${kann ? '' : 'disabled'}>${kann ? 'Ausbauen' : !i.ansehenOk ? 'Noch zu wenig Ansehen' : 'Noch zu wenig'}</button>
        </div>`;
    } else {
      unten = '<p class="leise">Höchste Stufe erreicht.</p>';
    }
    el.innerHTML = (fund ? fundHtml() : '') + `<h2><span aria-hidden="true">${esc(g.icon || '🏠')}</span> ${esc(g.name)} ${stufenHtml(i.stufe, max)}</h2>
      <p>${esc(g.text || '')}${bonus ? ' <b>' + esc(bonus) + '</b>' : ''}</p>${unten}`;
    const k = document.getElementById('ausbauen');
    if (k) k.onclick = () => { const r = D.ausbauen(gewaehlt); if (r.ok && szene) szene.jubel(); };
  }

  function bewohnerZettel() {
    const D = window.LernDorf, i = D.bewohnerAuftragInfo();
    if (!i) return '';
    const q = i.auftrag, b = i.bewohner, app = D.appInfo(q.a);
    const punkte = Array.from({ length: q.n }, (_, k) => `<i class="${k < q.c ? 'voll' : ''}"></i>`).join('');
    const farbe = Array.isArray(b.farben) ? b.farben[0] : '#60a5fa';
    return `<article class="zettel bewohner" style="--pin:${esc(farbe)}">
        <div class="portrait" aria-hidden="true">${esc(b.icon)}</div>
        <div>
          <div class="fach">Auftrag von ${esc(b.name)}</div>
          <div class="geschichte">„${esc(i.text)}“</div>
          <div class="ziel" style="margin-top:.35rem">${q.n} Runden in <b>${esc(app.name)}</b> mit mindestens ${q.m} %</div>
          <div class="punkte" role="img" aria-label="${q.c} von ${q.n} Runden geschafft" style="margin-top:.3rem">${punkte}</div>
        </div>
        <div class="rechts">
          <div class="lohn">+${i.ansehen} ⭐${i.stueck ? ` + ${esc(i.stueck.icon)}` : ''}</div>
          ${i.stueck ? `<small style="font-weight:800;color:var(--tinte2)">${esc(i.stueck.name)} fürs Sammelbuch</small>` : ''}
          ${app.link ? `<a class="knopf" href="${esc(app.link)}">Los geht's</a>` : ''}
        </div>
      </article>`;
  }

  // ── Dorf-Event: Band oben, Festwiese, Deko, Kalender, Festkiste ──
  function eventZeichnen() {
    const D = window.LernDorf, box = document.getElementById('event');
    if (!box) return;
    const a = D.aktivesEvent();
    if (!a) { box.innerHTML = ''; return; }
    const pe = a.pass || {}, e = a.def;
    const f1 = /^#[0-9a-f]{6}$/i.test(pe.farbe || '') ? pe.farbe : '#f59e0b', f2 = /^#[0-9a-f]{6}$/i.test(pe.farbe2 || '') ? pe.farbe2 : '#6366f1';
    if (!e) {
      box.innerHTML = `<section class="event-band" style="--e1:${f1};--e2:${f2}"><div class="gross" aria-hidden="true">${esc(pe.icon || '🎉')}</div>
        <h2>${esc(pe.titel || pe.name || 'Event')}</h2><p>Das Dorf ist geschmückt. Event-Truhen gibt es in den Lern-Apps.</p></section>`;
      return;
    }
    const w = e.waehrung, k = D.kalenderInfo(), s = D.sucheInfo();
    let knoepfe = `<button data-ev="fest" class="${gewaehlt === 'fest' ? 'an' : ''}">${esc((e.festgebaeude || {}).icon || '🎪')} Zur Festwiese</button>`;
    if (k) {
      const offen = k.frei - k.offen;
      knoepfe += `<button data-ev="kal" class="${offen > 0 ? 'an' : ''}">${esc(k.mechanik.icon || '🗓️')} ${esc(k.mechanik.name || 'Kalender')}${offen > 0 ? ` · ${offen} ${offen === 1 ? 'Tür' : 'Türen'} offen!` : ''}</button>`;
    }
    const suche = s && s.versteck ? `<div class="geschenk">${esc(s.mechanik.icon)} ${esc(s.mechanik.ding || 'Etwas')} hat sich im Dorf versteckt! Findest du es? Tippe es an.</div>` : '';
    const start = besuch && besuch.start ? `<div class="geschenk">🎁 Willkommen zum Fest! Dein Startgeschenk: +${besuch.start} ${esc(w.icon)} ${esc(w.name)}</div>` : '';
    box.innerHTML = `<section class="event-band" style="--e1:${f1};--e2:${f2}">
        <div class="gross" aria-hidden="true">${esc(e.icon || pe.icon || '🎉')}</div>
        <h2>${esc(e.titel || e.name)}</h2>
        <p>${esc(e.text || '')} Jeder erfüllte Auftrag bringt dir ${D.eventWerte().proAuftrag} ${esc(w.icon)} extra.</p>
        ${start}${suche}
        <div class="ev-knoepfe">${knoepfe}</div>
      </section>`;
    box.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => {
      if (b.dataset.ev === 'kal') { kalenderZeichnen(); oeffnen('ov-kal'); }
      else { waehle('fest'); document.getElementById('szene').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });
  }

  function fundHtml() {
    const w = fund.waehrung || {};
    return `<p class="neu-banner" style="margin-bottom:.8rem"><span class="gross" aria-hidden="true">🎉</span><span>Gefunden! <b>+${fund.lohn} ${esc(w.icon || '')} ${esc(w.name || '')}</b>. Morgen versteckt sich wieder etwas.</span></p>`;
  }

  function festZeichnen(el) {
    const D = window.LernDorf, a = D.aktivesEvent();
    if (!a || !a.def) {
      const alt = D.eventListe().map(e => ({ e, i: D.festInfo(e.id) })).filter(x => x.i && x.i.stufe > 0);
      el.innerHTML = `<h2>🎪 Festwiese</h2>
        <p>Hier feiert dein Dorf seine Feste: Halloween, Weihnachten und Ostern. Sobald das nächste Fest beginnt, geht es hier los.</p>
        ${a ? '<p class="leise">Zu diesem Fest gibt es im Dorf nichts zu bauen – aber schau in die Lern-Apps: Dort gibt es Event-Truhen.</p>' : ''}
        ${alt.length ? `<p>In deiner Festkiste warten: ${alt.map(x => `${esc(x.i.gebaeude.icon)} <b>${esc(x.i.gebaeude.name)}</b> (Stufe ${x.i.stufe})`).join(', ')}. Beim nächsten Fest stehen sie wieder hier.</p>` : ''}`;
      return;
    }
    const e = a.def, w = e.waehrung, i = D.festInfo(a.id);
    let gebaeude = '';
    if (i) {
      const texte = Array.isArray(i.gebaeude.text) ? i.gebaeude.text : [];
      let unten;
      if (i.imBau) unten = `<p>🔨 ${i.stufe ? 'Ausbau auf Stufe ' + i.zielStufe : 'Wird gebaut'} – fertig ${wann(i.fertigAb)}.</p>`;
      else if (i.naechste) unten = `<div class="option" style="margin-top:.6rem">
          <b>${i.stufe ? 'Ausbauen auf Stufe ' + i.naechste : 'Bauen'}</b>
          ${texte[i.naechste - 1] ? `<small>${esc(texte[i.naechste - 1])}</small>` : ''}
          ${kostenHtml(i.kosten)}
          <button class="knopf" id="fest-bauen" ${i.genug ? '' : 'disabled'}>${i.genug ? (i.stufe ? 'Ausbauen' : 'Bauen') : 'Noch zu wenig ' + esc(w.name)}</button>
        </div>`;
      else unten = '<p class="leise">Höchste Stufe erreicht. Wunderschön!</p>';
      gebaeude = `<h2><span aria-hidden="true">${esc(i.gebaeude.icon)}</span> ${esc(i.gebaeude.name)} ${stufenHtml(i.stufe, i.max)}</h2>
        <p>${i.stufe && texte[i.stufe - 1] ? esc(texte[i.stufe - 1]) + ' ' : ''}Nach dem Fest kommt es in die Festkiste und steht beim nächsten Fest wieder hier.</p>${unten}`;
    }
    const shop = D.dekoShop();
    const deko = shop.length ? `<h2 style="margin-top:1.1rem">✨ Deko zum Fest</h2>
      <p>Einmal freigeschaltet gehört die Deko dir für immer. Du kannst sie überall im Dorf aufstellen – sie darf auch nach dem Fest stehen bleiben.</p>
      <div class="deko-reihe">${shop.map(x => `<div class="option"><span class="icon" aria-hidden="true">${esc(x.deko.icon)}</span><b>${esc(x.deko.name)}</b>
        ${x.hat ? '<span class="fertig-marke">✓ in deiner Festkiste</span>' : kostenHtml(x.kosten) + `<button class="knopf" data-deko="${esc(x.key)}" ${x.genug ? '' : 'disabled'}>${x.genug ? 'Freischalten' : 'Noch zu wenig'}</button>`}</div>`).join('')}</div>` : '';
    el.innerHTML = (fund ? fundHtml() : '') + gebaeude + deko
      + `<p class="leise" style="margin-top:.8rem">${esc(w.icon)} ${esc(w.name)} bekommst du für jeden erfüllten Auftrag${e.gast ? ', für Aufträge von ' + esc(e.gast.name) : ''}${e.mechanik && e.mechanik.art === 'kalender' ? ' und aus dem ' + esc(e.mechanik.name || 'Kalender') : e.mechanik && e.mechanik.art === 'suche' ? ' und wenn du ' + esc(e.mechanik.ding || 'etwas') + ' im Dorf findest' : ''}. ${esc(w.name)} verfallen nicht.</p>`;
    const k = document.getElementById('fest-bauen');
    if (k) k.onclick = () => { const r = D.festBauen(); if (r.ok && szene) szene.jubel(); };
    el.querySelectorAll('[data-deko]').forEach(b => b.onclick = () => {
      const key = b.dataset.deko, r = D.dekoKaufen(key);

    setzen = key;

    const D = window.LernDorf, S = D.state;

    el.innerHTML = `<div class="buch-kopf"><h2 id="karte-titel">📮 Deine Dorf-Postkarte</h2><button class="zu" aria-label="Schließen">✕</button></div>

        <label for="dn" style="font-weight:800">Wie heißt dein Dorf?</label>

    el.querySelector('.zu').onclick = () => schliessen('ov-karte');
    const neu = () => postkarte().then(url => { const img = document.getElementById('karte-bild'); if (img && url) img.src = url; });
    document.getElementById('dn-ok').onclick = () => { D.dorfname(document.getElementById('dn').value); neu(); };
    document.getElementById('dn').onkeydown = e => { if (e.key === 'Enter') document.getElementById('dn-ok').click(); };
    neu();

  async function postkarte() {
    const D = window.LernDorf, S = D.state, sb = D.sammelbuch();
    const name = (window.LernPass.profile() || {}).name || '';
    try { await document.fonts.ready; } catch (e) {}
    const W = 1200, H = 800, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#f6ecd2'; g.fillRect(0, 0, W, H);
    g.strokeStyle = '#7a4a28'; g.lineWidth = 14; g.strokeRect(7, 7, W - 14, H - 14);
    // Foto
    const foto = szene ? szene.foto() : null;
    g.save(); g.translate(60, 70); g.rotate(-.025);
    g.fillStyle = '#fff'; g.fillRect(0, 0, 660, 540);
    if (foto) {
      const img = new Image(); img.src = foto;
      await new Promise(r => { img.onload = r; img.onerror = r; });
      const s = Math.max(620 / img.width, 500 / img.height), iw = img.width * s, ih = img.height * s;
      g.save(); g.beginPath(); g.rect(20, 20, 620, 500); g.clip();
      g.drawImage(img, 20 + (620 - iw) / 2, 20 + (500 - ih) / 2, iw, ih); g.restore();
    } else { g.fillStyle = '#6cc56f'; g.fillRect(20, 20, 620, 500); g.font = '200px serif'; g.textAlign = 'center'; g.fillText('🏘️', 330, 340); }
    g.restore();
    // Trennlinie wie bei einer Postkarte
    g.strokeStyle = 'rgba(122,98,72,.35)'; g.lineWidth = 3; g.beginPath(); g.moveTo(780, 90); g.lineTo(780, 720); g.stroke();
    // Briefmarke
    g.save(); g.translate(1010, 60);
    g.fillStyle = '#fff'; g.fillRect(0, 0, 140, 170);
    g.setLineDash([8, 6]); g.strokeStyle = '#b91c1c'; g.lineWidth = 4; g.strokeRect(8, 8, 124, 154); g.setLineDash([]);
    g.font = '72px serif'; g.textAlign = 'center'; g.fillText('🏘️', 70, 100);
    g.fillStyle = '#b91c1c'; g.font = '800 20px Nunito, sans-serif'; g.fillText('LERNWELT', 70, 145);
    g.restore();
    // Stempel
    g.save(); g.translate(930, 200); g.rotate(-.2); g.strokeStyle = 'rgba(30,64,175,.55)'; g.lineWidth = 4;
    g.beginPath(); g.arc(0, 0, 58, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.arc(0, 0, 46, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(30,64,175,.6)'; g.font = '800 16px Nunito, sans-serif'; g.textAlign = 'center';
    const d = new Date(); g.fillText(d.toLocaleDateString('de-DE'), 0, 6); g.restore();
    // Text
    g.fillStyle = '#3b2a1a'; g.textAlign = 'left';
    g.font = '400 34px "Fredoka One", Nunito, sans-serif'; g.fillText('Grüße aus', 810, 330);
    const dn = S.dn || (name ? name + 's Dorf' : 'meinem Dorf');
    let gr = 58; g.font = `400 ${gr}px "Fredoka One", Nunito, sans-serif`;
    while (g.measureText(dn).width > 360 && gr > 26) { gr -= 2; g.font = `400 ${gr}px "Fredoka One", Nunito, sans-serif`; }
    g.fillText(dn, 810, 400);
    g.font = '700 24px Nunito, sans-serif'; g.fillStyle = '#7a6248';
    if (name) g.fillText('Bürgermeisterei: ' + name, 810, 450);
    const gebaeude = Object.values(S.b).length;
    const zeilen = [['🏠', gebaeude + (gebaeude === 1 ? ' Gebäude' : ' Gebäude')], ['👥', S.bw.length + (S.bw.length === 1 ? ' Bewohner' : ' Bewohner')],
                    ['📖', sb.gesammelt + ' von ' + sb.gesamt + ' Sammelstücken'], ['⭐', S.an + ' Ansehen']];
    g.font = '800 26px Nunito, sans-serif'; g.fillStyle = '#3b2a1a';
    zeilen.forEach(([ic, t], k) => { g.fillText(ic + '  ' + t, 810, 520 + k * 44); });
    return c.toDataURL('image/png');
  }

  function wochenZettel() {
    const D = window.LernDorf, w = D.state.w;

    const tag = new Date().getDay(), rest = (7 - tag) % 7;             // Tage bis Sonntag

    let was, link = '';
    if (w.a === 'auftraege') was = `Erledige ${w.n} Aufträge vom Brett.`;
    else {
      const app = D.appInfo(w.p || w.z);
      was = w.a === 'app'
        ? `${w.n} Runden in <b>${esc(app.name)}</b> mit mindestens ${w.m} %.`
        : `${w.n} Runden zum Thema <b>${esc(w.t || w.z)}</b> mit mindestens ${w.m} %.`;
      if (app.link && !w.f) link = `<a class="knopf" href="${esc(app.link)}">Los geht's</a>`;
    }
    const pct = Math.round(w.c / w.n * 100);
    return `<article class="zettel woche">
        <div class="links">
          <div class="fach">📅 Wochenauftrag${w.a !== 'auftraege' ? '<span class="von-lk">von deiner Lehrkraft</span>' : ''}</div>
          <div class="ziel">${w.f ? '✅ Geschafft! Nächste Woche gibt es einen neuen Wochenauftrag.' : was}</div>
          ${w.f ? '' : `<div class="balken" role="img" aria-label="${w.c} von ${w.n} geschafft"><i style="width:${pct}%"></i></div>
          <div class="rest">${w.c} von ${w.n} geschafft · ${rest === 0 ? 'heute ist der letzte Tag' : rest === 1 ? 'noch 1 Tag' : 'noch ' + rest + ' Tage'}</div>`}
        </div>
        <div class="rechts"><div class="lohn">${w.f ? '' : lohn}</div>${link}</div>
      </article>`;
  }

  function brettZeichnen() {
    const D = window.LernDorf, S = D.state, W = D.werte();
    document.getElementById('wuerfel').textContent = `🎲 ${S.rr} ${S.rr === 1 ? 'Tausch' : 'Tausche'} übrig`;
    document.getElementById('hinweis').textContent =
      'Jeden Tag kommen neue Aufträge. Offene Aufträge bleiben hängen, bis du sie erledigst. '
      + (W.rrProTag && W.rrMax ? `Pro Tag bekommst du ${W.rrProTag === 1 ? 'einen Tausch' : W.rrProTag + ' Tausche'} dazu, sparen kannst du bis zu ${W.rrMax}. ` : '')
      + 'Der Wochenauftrag gilt bis Sonntag, Gold gibt es nur dafür.';
    const zettel = W.plaetze.map(platz => {
      const q = S.q.find(x => x.p === platz.id);
      const titel = `${platz.faecher === 'alle' ? '🎲' : (ICON[platz.faecher[0]] || '📌')} ${esc(platz.name || '')}`;
      if (!q) {
        return `<div class="zettel leer" style="--pin:#a8a29e"><div class="fach">${titel}</div><div class="gross" aria-hidden="true">✅</div>
                  <div>Erledigt!<br>Morgen hängt hier ein neuer Auftrag.</div></div>`;
      }
      const app = D.appInfo(q.a), r = D.rohstoff(q.r), l = D.lohn(q);
      const punkte = Array.from({ length: q.n }, (_, i) => `<i class="${i < q.c ? 'voll' : ''}"></i>`).join('');
      const kann = D.kannTauschen(q.p);
      return `<article class="zettel${getauscht === q.p ? ' getauscht' : ''}" style="--pin:${farbe(app.fach)}">
          <div class="fach">${titel}</div>
          <div class="app"><span class="emoji" aria-hidden="true">${esc(app.emoji)}</span>${esc(app.name)}</div>
          <div class="ziel">${q.n} ${q.n === 1 ? 'Runde' : 'Runden'} mit mindestens ${q.m} %</div>
          <div class="punkte" role="img" aria-label="${q.c} von ${q.n} Runden geschafft">${punkte}</div>
          <div class="lohn">+${l.gesamt} ${r.icon} ${esc(r.name)}${q.x ? '<span class="bonus" title="Diese App hast du lange nicht geübt">+50 % Bonus</span>' : ''}${l.extra ? `<span class="bonus" title="Bonus durch deine Gebäude">+${l.extra} Gebäude</span>` : ''}</div>
          <div class="knoepfe">
            ${app.link ? `<a class="knopf" href="${esc(app.link)}">Los geht's</a>` : ''}
            <button class="tausch" data-platz="${q.p}" ${kann ? '' : 'disabled'} aria-label="Auftrag tauschen">🎲 Tauschen</button>
          </div>
        </article>`;
    }).join('');
    getauscht = null;
    const box = document.getElementById('zettel');
    box.innerHTML = zettel + gastZettel() + bewohnerZettel() + wochenZettel();
    box.querySelectorAll('.tausch').forEach(b => b.onclick = () => {
      const platz = Number(b.dataset.platz);
      getauscht = platz;
      if (!D.tauschen(platz).ok) getauscht = null;
    });
  }

  start();
})();
</script>
<script src="../gemeinsam/navbar.js"></script>
</body>
</html>
