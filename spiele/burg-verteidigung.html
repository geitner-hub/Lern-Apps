<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <script src="../gemeinsam/umgebung.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tower Defense – Lernwelt</title>
  <!--
  ═══════════════════════════════════════════════
   LERNWELT – Tower Defense (Burg-Verteidigung)
   Richtige Antworten bringen Münzen, Münzen bauen Türme,
   Türme halten die Monster von der Burg fern. Die eigene
   Figur steht als Burgherr/Burgherrin auf der Burg.

   Modi:   Kampagne (10 Stationen: Karte + Wellen + Sonderregel; Kronen schalten
           Stationen und Türme frei – Daten in tower-defense.json → kampagne)
           Runde (6 Wellen, XP wie jede App, Burg fällt nicht)
           Endlos (bis die Burg fällt, Rekord = erreichte Welle,
           XP über LernPass.awardEndless)
   Fragen: aufgaben.js (Klassenfilter über den Pass)
   Themen: „⭐ Meine Themen“ = in den Lern-Apps freigeschalteter Stoff + Starter-Paket
           (aufgaben.js → meineThemen, Einstellungen im Admin: config.json → spiele)
   Links:  burg-verteidigung.html?pool=vok5&bis=unit3  (haben Vorrang)
           burg-verteidigung.html?pool=1x1-klein&modus=endlos&karte=engpass
   Daten:  daten/tower-defense.json (Karten, Landschaften, Wellen, Türme, Gegner).
           Fehlt die Datei, läuft das Spiel mit der eingebauten Burgwiese (EINGEBAUT).
           Neuer Turm/Gegner = Werte in der JSON + Eintrag in TURM_TYPEN/GEGNER_TYPEN.
           Türme: Bogen, Kanone, Frost, Blitz, Ballista, Giftkessel, Banner (je Karte höchstens 5)
           Gegner: Schleim, Flitzer, Ritter, Boss, Schildträger, Heiler, Riesenschleim, Fledermaus
   Braucht: navbar.js, aufgaben.js, avatar3d.js, vendor/three.min.js
   Speicher: lern-burg-wahl, lern-burg-rekorde (localStorage)
             lern-burg-wahl merkt sich auch, welche neuen Monster schon vorgestellt wurden (gesehen)
             lernwelt-td-kampagne: { v: 1, k: { <stations-id>: Kronen }, t: [freigeschaltete Türme] }
             (reist mit der Sicherungskarte; freigeschaltete Türme gehen nie wieder verloren)
             Rekorde: Burgwiese wie bisher, andere Karten mit „<karten-id>|“ davor,
             beste Kronen je Karte unter „#kronen“
  ═══════════════════════════════════════════════
  -->
  <link rel="stylesheet" href="../gemeinsam/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e1a; --panel: rgba(27,25,41,.92); --surface: #1b1929;
      --accent: #e6a817; --accent2: #fde68a; --indigo: #6366f1; --indigo2: #818cf8;
      --text: #f1f0fb; --text2: rgba(241,240,251,.72); --muted: rgba(241,240,251,.45);
      --green: #4ade80; --red: #f87171;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Nunito', system-ui, sans-serif; background: #7fc27f; color: var(--text);
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--indigo2); outline-offset: 2px; }
    [hidden] { display: none !important; }

    #stage { position: fixed; inset: 0; touch-action: none; }
    #stage canvas { display: block; width: 100%; height: 100%; }

    /* ── HUD ─────────────────────────────── */
    #hud { position: fixed; inset: 0; pointer-events: none; }
    .hud-top { position: absolute; top: max(.6rem, env(safe-area-inset-top)); left: .6rem; right: .6rem;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: .5rem; }
    .chip { background: var(--panel); border-radius: 14px; padding: .45rem .75rem; font-weight: 900; font-size: 1rem;
      display: inline-flex; align-items: center; gap: .4rem; box-shadow: 0 6px 18px rgba(0,0,0,.25); white-space: nowrap; }
    .hud-left { justify-self: start; display: flex; flex-direction: column; gap: .4rem; align-items: flex-start; }
    .hud-right { justify-self: end; display: flex; gap: .4rem; align-items: center; }
    .pause-btn { pointer-events: auto; width: 44px; height: 44px; justify-content: center; font-size: 1.1rem; padding: 0; }
    #hud-coins { font-size: 1.15rem; transition: transform .15s; }
    #hud-coins.pop { transform: scale(1.15); }
    #hud-coins .serie { color: #fb923c; font-size: .9rem; }
    .hearts.hit { animation: hit .4s; }
    @keyframes hit { 30% { transform: scale(1.25); color: var(--red); } }
    #reparatur { pointer-events: auto; min-height: 44px; font-size: .92rem; }
    #reparatur:disabled { opacity: .5; cursor: default; }
    #naechste { pointer-events: auto; gap: .5rem; padding: .3rem .35rem .3rem .75rem; }
    #naechste button { background: var(--accent); color: #231a02; border-radius: 10px; min-height: 44px; padding: 0 .8rem; font-weight: 900; }
    .qcard { background: var(--panel); border-radius: 20px; padding: .55rem 1.5rem .7rem; text-align: center;
      max-width: min(760px, 62vw); min-width: min(360px, 60vw); box-shadow: 0 10px 30px rgba(0,0,0,.3); border: 1px solid rgba(230,168,23,.3); }
    .qhint { font-size: .95rem; font-weight: 800; color: var(--muted); min-height: 1.2em; }
    .qtext { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(2.1rem, 5.6vw, 3.8rem); line-height: 1.1; color: var(--text); overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
    .qtext.in { animation: pop .3s cubic-bezier(.2,.9,.3,1.3); }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (max-width: 760px), (orientation: portrait) {
      .hud-top { grid-template-columns: 1fr auto; }
      .qcard { grid-column: 1 / -1; grid-row: 2; max-width: none; min-width: 0; justify-self: stretch; }
    }

    .answers { position: absolute; left: 50%; bottom: max(.8rem, env(safe-area-inset-bottom)); transform: translateX(-50%);
      width: min(820px, calc(100% - 1.2rem)); display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; pointer-events: auto; }
    .ans { position: relative; background: var(--panel); border-radius: 16px; min-height: 68px; padding: .5rem .6rem; font-weight: 900;
      font-size: clamp(1.05rem, 2.5vw, 1.45rem); line-height: 1.15; border: 3px solid rgba(255,255,255,.08); transition: border-color .12s, opacity .12s, transform .1s;
      box-shadow: 0 8px 22px rgba(0,0,0,.28); overflow-wrap: anywhere; }
    .ans:active:not(:disabled) { transform: scale(.97); }
    .ans:disabled { cursor: default; }
    .ans.wait { opacity: .5; }
    .ans.ok { background: #14532d; border-color: var(--green); opacity: 1; }
    .ans.bad { background: #5b1a24; border-color: var(--red); opacity: 1; }
    .sperre { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(max(.8rem, env(safe-area-inset-bottom)) + 76px);
      width: min(820px, calc(100% - 1.2rem)); height: 6px; border-radius: 99px; background: rgba(15,14,26,.35); overflow: hidden; opacity: 0; transition: opacity .15s; }
    .sperre.show { opacity: 1; }
    .sperre i { display: block; height: 100%; background: var(--red); border-radius: 99px; transform-origin: left; }

    .flash { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font-family: 'Fredoka One', 'Nunito', sans-serif;
      font-size: clamp(1.3rem, 3.6vw, 2.2rem); padding: .45rem 1.1rem; border-radius: 18px; background: var(--panel); opacity: 0;
      transition: opacity .15s; text-align: center; max-width: 92vw; }
    .flash.show { opacity: 1; }
    .flash.ok { color: var(--accent2); }
    .flash.bad { color: var(--red); font-size: clamp(1.1rem, 3vw, 1.7rem); }
    .flash.info { color: var(--text); font-size: clamp(1rem, 2.6vw, 1.4rem); }
    .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Fredoka One', 'Nunito', sans-serif;
      font-size: clamp(4rem, 14vw, 8rem); color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.35); pointer-events: none; }

    /* ── Baumenü (am Bauplatz) ───────────── */
    #baumenu { position: absolute; left: 0; top: 0; pointer-events: auto; background: var(--panel); border-radius: 18px; padding: .45rem;
      box-shadow: 0 12px 34px rgba(0,0,0,.4); border: 2px solid rgba(230,168,23,.45); display: flex; flex-direction: column; gap: .35rem; }
    #baumenu .titel { font-weight: 900; font-size: .85rem; color: var(--text2); text-align: center; padding: 0 .3rem; }
    #baumenu .reihe { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); }
    #baumenu button { min-width: 72px; min-height: 72px; border-radius: 14px; background: rgba(255,255,255,.08); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .05rem; padding: .3rem .45rem; font-weight: 900; line-height: 1.1; border: 2px solid transparent; }
    #baumenu button .i { font-size: 1.6rem; }
    #baumenu button b { font-size: .82rem; }
    #baumenu button small { font-size: .8rem; color: var(--accent2); font-weight: 900; }
    #baumenu button:not(:disabled):active { transform: scale(.96); }
    #baumenu button.kaufbar { border-color: var(--accent); background: rgba(230,168,23,.16); }
    #baumenu button:disabled { opacity: .42; cursor: default; }
    #baumenu button.gesperrt small { color: var(--text2); }
    #baumenu button.zu { min-width: 44px; min-height: 44px; }
    #baumenu .bonus { color: var(--accent2); }

    /* ── Neues Monster (Bildkarte, einmalig) ── */
    #neu { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,14,26,.55); padding: 1rem; }
    #neu .sheet { text-align: center; width: min(400px, 94vw); }
    .neu-karte { display: flex; gap: .9rem; align-items: center; text-align: left; margin: .7rem 0; }
    .neu-karte .bild { font-size: 3rem; line-height: 1; width: 4.4rem; height: 4.4rem; display: grid; place-items: center; flex: none;
      border-radius: 18px; background: rgba(230,168,23,.14); border: 2px solid rgba(230,168,23,.45); }
    .neu-karte b { display: block; font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: 1.35rem; color: var(--accent2); }
    .neu-karte p { font-weight: 800; font-size: .98rem; }
    .neu-karte small { display: block; color: var(--text2); font-weight: 700; font-size: .86rem; margin-top: .2rem; }

    /* ── Menü & Ergebnis ─────────────────── */
    .overlay { position: fixed; inset: 0; display: flex; align-items: center; padding: 1rem 1rem calc(4.5rem + env(safe-area-inset-bottom)); overflow-y: auto; }
    .sheet { width: min(470px, 100%); background: var(--panel); border-radius: 22px; padding: 1.3rem 1.3rem 1.2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.35); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); margin: auto 0; }
    @media (min-width: 800px) and (orientation: landscape) { .overlay { padding-left: max(2rem, 5vw); } }
    @media (orientation: portrait) { .overlay { align-items: flex-end; } .sheet { margin: 0 auto; } }
    h1 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; color: var(--accent); font-size: 2.1rem; line-height: 1.05; }
    .lead { color: var(--text2); font-size: .92rem; margin: .3rem 0 .9rem; }
    .lbl { display: block; font-size: .8rem; font-weight: 900; color: var(--muted); margin: .85rem 0 .4rem; }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(255,255,255,.06); border-radius: 14px; padding: 4px; gap: 4px; }
    .seg button { border-radius: 11px; padding: .55rem .5rem; min-height: 52px; font-weight: 900; font-size: .98rem; color: var(--text2); }
    .seg button small { display: block; font-size: .74rem; font-weight: 800; color: var(--muted); }
    .seg button.on { background: var(--accent); color: #231a02; }
    .seg button.on small { color: rgba(35,26,2,.7); }
    .tabs { display: flex; gap: .35rem; flex-wrap: wrap; }
    .tabs button { min-height: 44px; padding: .4rem .9rem; border-radius: 99px; font-weight: 900; font-size: .88rem; background: rgba(255,255,255,.06); color: var(--text2); }
    .tabs button.on { background: var(--indigo); color: #fff; }
    .pools { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .55rem; }
    .pools button { min-height: 44px; padding: .45rem .75rem; border-radius: 12px; font-weight: 800; font-size: .88rem; background: rgba(255,255,255,.06);
      border: 2px solid transparent; text-align: left; }
    .pools button.on { border-color: var(--accent); background: rgba(230,168,23,.14); color: var(--accent2); }
    /* Kartenwahl */
    .karten { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: .4rem; }
    .karten button { display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .3rem .25rem .35rem; min-height: 44px;
      border-radius: 12px; background: rgba(255,255,255,.06); border: 2px solid transparent; line-height: 1.1; }
    .karten svg { width: 100%; height: 42px; border-radius: 7px; display: block; }
    .karten b { font-size: .7rem; font-weight: 900; color: var(--text2); text-align: center; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; max-width: 100%; }
    .karten small { font-size: .66rem; font-weight: 900; color: var(--accent2); letter-spacing: .02em; }
    .karten small .off { filter: grayscale(1); opacity: .3; }
    .karten button.on { border-color: var(--accent); background: rgba(230,168,23,.14); }
    .karten button.on b { color: var(--accent2); }
    .karten button:active { transform: scale(.97); }
    .karten button:disabled { opacity: .45; cursor: default; }
    .karten button:disabled:active { transform: none; }
    /* Kampagne: Weg mit 10 Stationen (Schlange: oben links → rechts, unten rechts → links) */
    .kamp { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: auto auto; gap: .55rem .4rem; }
    .kamp svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .kamp button { position: relative; justify-self: center; width: 60px; min-height: 60px; border-radius: 16px; border: 3px solid rgba(15,14,26,.55);
      display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
    .kamp button b { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: 1.3rem; color: #1b1929; }
    .kamp button small { font-size: .62rem; font-weight: 900; color: #1b1929; letter-spacing: -.02em; }
    .kamp button small .off { filter: grayscale(1); opacity: .35; }
    .kamp button.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(230,168,23,.45), 0 4px 12px rgba(0,0,0,.25); }
    .kamp button:disabled { filter: grayscale(.85) brightness(.6); cursor: default; }
    .kamp button:not(:disabled):active { transform: scale(.95); }
    @media (prefers-reduced-motion: reduce) { .kamp button:not(:disabled):active { transform: none; } }
    .kamp-info { margin-top: .6rem; background: rgba(255,255,255,.05); border-radius: 12px; padding: .55rem .75rem; font-size: .88rem; font-weight: 700; color: var(--text2); }
    .kamp-info b { color: var(--accent2); font-size: .98rem; }
    .kamp-info .regel { color: var(--text); }
    @media (prefers-reduced-motion: reduce) { .karten button:active { transform: none; } }
    .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    select { font: inherit; font-weight: 800; font-size: .9rem; background: #252238; color: var(--text); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: .55rem .6rem; min-height: 44px; max-width: 100%; }
    /* „Meine Themen“ */
    #meine-box { margin-bottom: .9rem; }
    .meine { width: 100%; min-height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: .55rem 1rem; border-radius: 16px; background: rgba(255,255,255,.06); border: 3px solid rgba(230,168,23,.3);
      font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 1.45rem; line-height: 1.1; color: var(--text); }
    .meine small { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .8rem; color: var(--muted); margin-top: .15rem; }
    .meine small:empty { display: none; }
    .meine.on { border-color: var(--accent); background: rgba(230,168,23,.18); color: var(--accent2); }
    .meine:active { transform: scale(.98); }
    .selbst { display: block; margin: .5rem auto 0; min-height: 44px; padding: .4rem 1.1rem; border-radius: 99px; font-weight: 900; font-size: .92rem;
      background: rgba(255,255,255,.06); color: var(--text2); }
    .selbst.on { background: var(--indigo); color: #fff; }
    @media (prefers-reduced-motion: reduce) { .meine:active { transform: none; } }
    .note { font-size: .82rem; color: var(--muted); margin-top: .5rem; font-weight: 700; }
    .note b { color: var(--accent2); }
    .unten { display: flex; gap: .5rem; margin-top: 1rem; }
    .go { flex: 1; background: var(--accent); color: #231a02; font-weight: 900; font-size: 1.2rem;
      padding: .9rem; min-height: 56px; border-radius: 16px; box-shadow: 0 8px 24px rgba(230,168,23,.3); }
    .go:active { transform: scale(.98); }
    .go:disabled { opacity: .45; cursor: default; }
    .ton { min-width: 56px; min-height: 56px; border-radius: 16px; background: rgba(255,255,255,.08); font-size: 1.3rem; }
    .err { color: var(--red); font-weight: 800; font-size: .85rem; margin-top: .5rem; }

    .big { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 3.4rem; color: var(--accent); line-height: 1; }
    .big small { font-size: 1.4rem; color: var(--text2); }
    .kronen { font-size: 1.9rem; margin-top: .35rem; letter-spacing: .1em; }
    .kronen .off { filter: grayscale(1); opacity: .3; }
    .rmsg { font-weight: 900; font-size: 1.1rem; margin: .4rem 0 .2rem; }
    .rsub { color: var(--text2); font-size: .92rem; }
    .record { display: inline-block; margin-top: .5rem; background: rgba(230,168,23,.18); color: var(--accent2); font-weight: 900;
      padding: .3rem .8rem; border-radius: 99px; font-size: .9rem; }
    .fehler { margin-top: .9rem; background: rgba(255,255,255,.04); border-radius: 12px; padding: .65rem .8rem; max-height: 30vh; overflow-y: auto; }
    .fehler h3 { font-size: .82rem; color: var(--muted); font-weight: 900; margin-bottom: .35rem; }
    .fehler li { list-style: none; font-size: .9rem; padding: .2rem 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .fehler li b { color: var(--green); }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 1rem; }
    .btn { padding: .8rem; min-height: 52px; border-radius: 14px; font-weight: 900; font-size: 1rem; background: rgba(255,255,255,.08); }
    .btn.primary { background: var(--accent); color: #231a02; }

    #pause { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,14,26,.55); }
    #pause .sheet { text-align: center; width: min(360px, 92vw); }

    @media (prefers-reduced-motion: reduce) {
      .qtext.in, .hearts.hit { animation: none; }
      #hud-coins { transition: none; }
    }
  </style>
</head>
<body>

<div id="stage" aria-hidden="true"></div>

<!-- ── HUD (während des Spiels) ─────────────────── -->
<div id="hud" hidden>
  <div class="hud-top" id="hud-top">
    <div class="hud-left">
      <div class="chip" id="hud-welle"></div>
      <div class="chip hearts" id="hud-herzen"></div>
      <button class="chip" id="reparatur" type="button" hidden></button>
      <div class="chip" id="naechste" hidden><span id="naechste-text"></span><button type="button" id="naechste-btn">Los ▶</button></div>
    </div>
    <div class="qcard" aria-live="polite">
      <div class="qhint" id="q-hint"></div>
      <div class="qtext" id="q-text"></div>
    </div>
    <div class="hud-right">
      <div class="chip" id="hud-coins" title="Münzen">🪙 0</div>
      <button class="chip pause-btn" id="pause-btn" type="button" aria-label="Pause">⏸</button>
    </div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="count" id="count"></div>
  <div id="baumenu" hidden></div>
  <div class="sperre" id="sperre"><i id="sperre-bar"></i></div>
  <div class="answers" id="answers">
    <button class="ans" type="button" data-i="0"></button>
    <button class="ans" type="button" data-i="1"></button>
    <button class="ans" type="button" data-i="2"></button>
  </div>
</div>

<!-- ── Menü ────────────────────────────────────── -->
<div class="overlay" id="menu">
  <div class="sheet">
    <h1>🏰 Tower Defense</h1>
    <p class="lead">Richtige Antworten bringen Münzen. Tippe auf eine Steinplatte und bau Türme – so kommt kein Monster in deine Burg!</p>

    <div id="meine-box" hidden>
      <button type="button" class="meine on" id="meine-btn">⭐ Meine Themen<small id="meine-info"></small></button>
      <button type="button" class="selbst" id="selbst-btn" hidden>Selbst wählen</button>
    </div>

    <div class="seg" id="mode-seg">
      <button type="button" data-mode="kampagne" hidden>Kampagne<small>10 Stationen</small></button>
      <button type="button" data-mode="runde" class="on">Runde<small>6 Wellen</small></button>
      <button type="button" data-mode="endlos">Endlos<small>bis die Burg fällt</small></button>
    </div>

    <div id="karten-box" hidden>
      <span class="lbl">Karte</span>
      <div class="karten" id="karten-list"></div>
    </div>

    <div id="kampagne-box" hidden>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   EINSTELLUNGEN (hier anpassen)

   ═══════════════════════════════════════════════════════ */
const CFG = {
  // ── Münzen & Antworten ────────────────────────────

  burgHerzen: 10,                    // Herzen der Burg (Runde: Burg fällt nie, Herzen geben Kronen)
  reparatur: { preis: 100, plus: 50 },   // Burg reparieren: +1 ❤️; jede weitere Reparatur kostet 50 mehr

  tempo: { gemuetlich: .8, normal: 1, schnell: 1.2 },   // Runde: Tempo-Stufen im Menü
  lesezeit: { referenz: 2.3, min: .75, max: 1.1 },      // Thema mit langer Lesezeit → Monster langsamer

  endlos: {

const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const APP_KEY = (location.pathname.split('/').pop() || 'burg-verteidigung.html');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = l => l[Math.random() * l.length | 0];

/* ═══════════════════════════════════════════════════════
   DATEN – Karten, Landschaften (Biome), Wellen, Türme, Gegner
   Kommen aus daten/tower-defense.json. EINGEBAUT ist die Burgwiese
   als Ersatz, falls die Datei fehlt (offline, Fehler).
   Kartenformat (Felder, 1 Feld = 16 Einheiten; Wege nur waagrecht/senkrecht):
     wege: [[[x, y], …], …]  je Weg eine Mittellinie, erster Punkt = Höhle,
                             letzter Punkt vor der Burg (alle Wege enden dort)
     plaetze: [[x, y] | { x, y, abWelle }]   abWelle: erst später nutzbar (Etappe 5)
     burg: [x, y]   sperren: [[x0, y0, x1, y1]] keine Deko darin (Höhle, Sicht auf die Burg)
     wasser: [[x0, y0, x1, y1]] Fluss/See, Wege darüber bekommen eine Brücke
     tuerme: ['bogen', …] erlaubte Turmtypen (fehlt es: alle; höchstens 5, sonst wird das Baumenü zu voll)
     rahmen: [x0, y0, x1, y1] Bereich für die Kamera   staerke: Lebenspunkte × (Standard 1)
     wellen: Name eines Wellensatzes (Standard 'standard')
   IDs von Karten, Türmen, Gegnern und Biomen nie umbenennen oder löschen.
   ═══════════════════════════════════════════════════════ */
const TILE = 16;
const EINGEBAUT = {
  tuerme: {   // je Stufe 1 / 2 / 3; preis[0] = Bauen, preis[1..2] = Aufwerten
    bogen:  { name: 'Bogen',  icon: '🏹', art: 'pfeil', preis: [50, 40, 70],  schaden: [10, 15, 22], rate: [1.2, 1.4, 1.6], reichweite: [3.0, 3.3, 3.6] },
    kanone: { name: 'Kanone', icon: '💣', preis: [80, 60, 100], schaden: [22, 34, 50], rate: [.5, .55, .6],  reichweite: [2.6, 2.8, 3.0], flaeche: 1.1, nurBoden: true },
    frost:  { name: 'Frost',  icon: '❄️', preis: [60, 50, 80],  schaden: [3, 5, 8],    rate: [1, 1.1, 1.2],  reichweite: [2.6, 2.9, 3.2], flaeche: .8,
              bremse: [.4, .5, .6], bremsDauer: 1.5, nurBoden: true },
    // weitere Türme (Blitz, Ballista, Giftkessel, Banner) nur in tower-defense.json
  },
  gegner: {
    schleim: { name: 'Schleim', hp: 40,  tempo: 1.0, schaden: 1 },
    flitzer: { name: 'Flitzer', hp: 24,  tempo: 1.8, schaden: 1 },
    ritter:  { name: 'Ritter',  hp: 115, tempo: 0.6, schaden: 2, ruestung: .5 },               // Pfeile machen nur halben Schaden
    boss:    { name: 'Boss',    hp: 520, tempo: 0.5, schaden: 3, frostHalb: true, boss: true }, // Frost bremst ihn nur halb
  },
  // Runde: je Welle Gruppen aus [Gegner, Anzahl, Abstand in s]
  wellen: {
    standard: [
      [['schleim', 8, 2.0]],
      [['schleim', 8, 1.6], ['flitzer', 5, 1.0]],
      [['schleim', 6, 1.5], ['ritter', 3, 2.6], ['flitzer', 5, 0.9]],
      [['flitzer', 7, 0.9], ['ritter', 4, 2.3], ['schleim', 8, 1.3]],
      [['ritter', 5, 2.1], ['schleim', 10, 1.1], ['flitzer', 8, 0.8]],
      [['schleim', 8, 1.2], ['ritter', 4, 2.0], ['boss', 1, 0]],
    ],
  },
  biome: {
    wiese: { name: 'Wiese', hintergrund: '#7fc27f', himmel: ['#6fb6ff', '#a9d8ff', '#e9f5ff'], licht: ['#f2f6ff', '#4d6b45'],
             boden: ['#6cc56f', '#5fb862', '#79cf78', '#64bd66'], weg: ['#e8cf9f', '#dcbf8b', '#f1dcb2', '#d5b682'], wegRand: '#c9ad7a',
             hoehle: '#7d8196', deko: { innen: ['baum', 'baum', 'busch', 'stein'], aussen: ['baum', 'baum'], dichte: [.22, .5] } },
  },
  karten: [
    { id: 'burgwiese', name: 'Burgwiese', biom: 'wiese', spalten: 14, zeilen: 9,
      wege: [[[-2, 1.5], [9.5, 1.5], [9.5, 4.5], [2.5, 4.5], [2.5, 7.5], [11.35, 7.5]]],
      plaetze: [[4, 3], [7, 3], [11.5, 3], [4.6, 6], [7.5, 6], [.9, 6], [5.5, 8.5], [9, 8.5]],
      burg: [12.6, 7.4], sperren: [[-99, -99, 1, 3], [7.6, 8.2, 17.6, 99]] },
  ],
};
let DATEN = EINGEBAUT, DATEN_FERTIG = false;   // DATEN_FERTIG: Laden abgeschlossen (mit oder ohne Datei)
let KARTE = null;   // die aktuelle Karte (aufbereitet durch bereiteKarte)

/** tower-defense.json laden und mit EINGEBAUT zusammenführen – scheitert nie */
async function ladeDaten() {
  let j = null;
  try {
    const ab = window.AbortController ? new AbortController() : null;
    const uhr = ab && setTimeout(() => ab.abort(), 6000);
    const r = await fetch('../daten/tower-defense.json', ab ? { signal: ab.signal } : undefined);
    if (uhr) clearTimeout(uhr);
    if (r.ok) j = await r.json();
  } catch (e) {}
  DATEN_FERTIG = true;
  if (!j || typeof j !== 'object') return;
  const D = {
    tuerme: Object.assign({}, EINGEBAUT.tuerme, j.tuerme),
    gegner: Object.assign({}, EINGEBAUT.gegner, j.gegner),
    wellen: Object.assign({}, EINGEBAUT.wellen, j.wellen),
    biome: Object.assign({}, EINGEBAUT.biome, j.biome),
    karten: [],
    kampagne: j.kampagne && typeof j.kampagne === 'object' ? j.kampagne : null,
  };
  (Array.isArray(j.karten) ? j.karten : []).forEach(k => {
    if (k && k.id && D.biome[k.biom] && Array.isArray(k.wege) && k.wege.length && Array.isArray(k.plaetze) && Array.isArray(k.burg)
        && !D.karten.some(x => x.id === k.id)) D.karten.push(k);
  });
  if (!D.karten.some(k => k.id === 'burgwiese')) D.karten.unshift(EINGEBAUT.karten[0]);
  DATEN = D;
}
function karteDaten(id) { return DATEN.karten.find(k => k.id === id) || DATEN.karten[0]; }
/** Karte aus den Daten in das Format bringen, mit dem das Spiel rechnet */
function bereiteKarte(k) {
  return {
    id: k.id, name: k.name || k.id, biom: DATEN.biome[k.biom] || DATEN.biome.wiese,
    spalten: k.spalten || 14, zeilen: k.zeilen || 9,
    wege: k.wege, burg: k.burg, sperren: k.sperren || [], wasser: k.wasser || [],
    plaetze: k.plaetze.map(p => Array.isArray(p) ? { x: p[0], y: p[1], ab: 0 } : { x: p.x, y: p.y, ab: p.abWelle || 0 }),
    tuerme: Array.isArray(k.tuerme) ? k.tuerme : null,
    rahmen: k.rahmen || [-.9, -.2, k.spalten || 14, (k.zeilen || 9) + .1],
    staerke: k.staerke || 1, wellen: k.wellen || 'standard',
  };
}
/** Türme, die es auf dieser Karte gibt (Werte in den Daten UND Eintrag im Register) – ohne Rücksicht aufs Freischalten */
function turmIdsKarte() { return Object.keys(DATEN.tuerme).filter(id => TURM_TYPEN[id] && (!KARTE || !KARTE.tuerme || KARTE.tuerme.includes(id))); }
/** … davon die freigeschalteten (die kann man bauen) */
function turmIds() { return turmIdsKarte().filter(turmFrei); }
/** Wellen der aktuellen Karte (Runde/Kampagne); unbekannte Gegner werden übersprungen */
function wellenListe() {
  const l = (DATEN.wellen[KARTE && KARTE.wellen] || DATEN.wellen.standard || EINGEBAUT.wellen.standard)
    .map(w => w.filter(([typ]) => DATEN.gegner[typ] && GEGNER_TYPEN[typ]));
  // Sonderregel der Kampagne: Boss schon in Welle n
  const b = G.regel && G.regel.bossWelle;
  if (b && l[b - 1] && !l[b - 1].some(([typ]) => DATEN.gegner[typ].boss)) l[b - 1] = [...l[b - 1], ['boss', 1, 0]];
  return l;
}

/* ═══════════════════════════════════════════════════════
   KAMPAGNE – Stationen, Kronen, Freischalten
   Daten: tower-defense.json → kampagne { tuerme: { <turm>: Kronen }, stationen: [
     { id, name, karte, wellen?, regel?: { text, startMuenzen, tempo, staerke, tuerme, bossWelle } } ] }
   Nächste Station ab 1 Krone in der vorherigen. Türme aus kampagne.tuerme werden ab so
   vielen Kronen (Summe aller Stationen) frei – auch für Runde und Endlos. Türme, die dort
   nicht stehen, sind immer frei. Stations-IDs nie umbenennen (stehen im Spielstand).
   ═══════════════════════════════════════════════════════ */
const KAMP_KEY = 'lernwelt-td-kampagne';
let KAMP = null, LINK_KARTE = null;
function stationen() { return (DATEN.kampagne && Array.isArray(DATEN.kampagne.stationen)) ? DATEN.kampagne.stationen.filter(st => st && st.id && DATEN.karten.some(k => k.id === st.karte)) : []; }
function turmSchwellen() { return (DATEN.kampagne && DATEN.kampagne.tuerme) || {}; }
function kamp() {
  if (KAMP) return KAMP;
  if (!stationen().length) return { v: 1, k: {}, t: [] };   // Daten noch nicht geladen: nichts merken
  try { const k = JSON.parse(localStorage.getItem(KAMP_KEY) || 'null'); if (k && k.k && typeof k.k === 'object') KAMP = { v: 1, k: k.k, t: Array.isArray(k.t) ? k.t : [] }; } catch (e) {}
  if (!KAMP) {
    KAMP = { v: 1, k: {}, t: [] };
    // Wer schon Runden auf der Burgwiese gespielt hat, hat Station 1 geschafft (gespeichert wird erst beim nächsten Ergebnis)
    let alt = besteKronen('burgwiese') > 0;
    try { alt = alt || !!JSON.parse(localStorage.getItem('lern-apps-results') || '{}')[APP_KEY]; } catch (e) {}
    const s1 = stationen()[0];
    if (alt && s1 && s1.karte === 'burgwiese') KAMP.k[s1.id] = 1;
  }
  return KAMP;
}
function kampSpeichern() { try { localStorage.setItem(KAMP_KEY, JSON.stringify(kamp())); } catch (e) {} }
function stationKronen(st) { return (st && kamp().k[st.id]) || 0; }
function kampKronen() { return stationen().reduce((n, st) => n + stationKronen(st), 0); }
function stationFrei(i) { const l = stationen(); return i === 0 || (i > 0 && i < l.length && stationKronen(l[i - 1]) >= 1); }
function station() { const l = stationen(); return l[clamp(W.station | 0, 0, Math.max(0, l.length - 1))]; }
function turmFrei(id) { return !(id in turmSchwellen()) || kamp().t.includes(id); }
/** Neue Kronen eintragen → { besser, neueStation, neueTuerme } */
function kampWerten(st, kronen) {
  const K = kamp(), i = stationen().indexOf(st), vorherFrei = stationFrei(i + 1);
  const besser = kronen > stationKronen(st);
  if (besser) K.k[st.id] = kronen;
  const summe = kampKronen(), neueTuerme = [];
  Object.entries(turmSchwellen()).forEach(([id, n]) => { if (summe >= n && !K.t.includes(id) && DATEN.tuerme[id]) { K.t.push(id); neueTuerme.push(id); } });
  if (besser || neueTuerme.length) kampSpeichern();
  return { besser, neueStation: !vorherFrei && stationFrei(i + 1) ? i + 1 : -1, neueTuerme };
}
/** Karten der freien Wahl: Burgwiese, Karten erreichter Stationen, Karten mit eigenem Rekord, Lehrer-Link */
function karteFrei(id) {
  const l = stationen();
  if (!l.length || id === DATEN.karten[0].id || id === LINK_KARTE) return true;
  if (l.some((st, i) => st.karte === id && stationFrei(i))) return true;
  if (besteKronen(id) > 0) return true;
  return Object.keys(rekorde()).some(k => k.startsWith(id + '|'));
}
/** Welche Karte gerade gebaut sein soll */
function aktKarteId() { return W.modus === 'kampagne' && stationen().length ? station().karte : W.karte; }
function weltPruefen() { if (gl && (!KARTE || KARTE.id !== karteDaten(aktKarteId()).id)) baueWelt(); }
/** Vor jedem Start: Werte der Karte zurücksetzen, in der Kampagne die Sonderregel anwenden */
function regelnSetzen() {
  const basis = bereiteKarte(karteDaten(KARTE.id));
  Object.assign(KARTE, { wellen: basis.wellen, tuerme: basis.tuerme, staerke: basis.staerke });
  G.regel = null; G.station = null;
  if (W.modus !== 'kampagne' || !stationen().length) return;
  const st = station(), R = st.regel || {};
  G.station = st; G.regel = R;
  if (st.wellen && DATEN.wellen[st.wellen]) KARTE.wellen = st.wellen;
  if (Array.isArray(R.tuerme)) KARTE.tuerme = (KARTE.tuerme || Object.keys(DATEN.tuerme)).filter(t => R.tuerme.includes(t));
  if (R.staerke) KARTE.staerke *= R.staerke;
}
const gw = (gx, gy) => [(gx - KARTE.spalten / 2) * TILE, (gy - KARTE.zeilen / 2) * TILE];

/* ═══════════════════════════════════════════════════════
   AUSWAHL (Menü) – wie im Runner
   ═══════════════════════════════════════════════════════ */
const WAHL_KEY = 'lern-burg-wahl', REKORD_KEY = 'lern-burg-rekorde';
const W = { modus: 'runde', pools: [], bis: '', richtung: 'de-en', tempo: 'normal', fach: null, klasse: null, lehrer: false, mix: false, ton: false, karte: 'burgwiese', gesehen: [], station: null };
function loadWahl() { try { Object.assign(W, JSON.parse(localStorage.getItem(WAHL_KEY) || '{}')); } catch (e) {} W.lehrer = false; W.quelle = 'meine'; if (!Array.isArray(W.gesehen)) W.gesehen = []; }
function saveWahl() { try { const { lehrer, quelle, ...w } = W; localStorage.setItem(WAHL_KEY, JSON.stringify(w)); } catch (e) {} }
// „Meine Themen“ (Einstellung der Lehrkraft im Admin: config.json → spiele.auswahl)
function spielAuswahl() { try { return LernPass.settings.spiele.auswahl || 'auto+frei'; } catch (e) { return 'auto+frei'; } }
/** 'meine' oder 'frei' – Lehrer-Links haben Vorrang */
function quelle() {
  const a = spielAuswahl();
  if (W.lehrer || a === 'frei') return 'frei';
  if (a === 'auto') return 'meine';
  return W.quelle === 'frei' ? 'frei' : 'meine';
}
let MEINE = null;
function rekorde() { try { return JSON.parse(localStorage.getItem(REKORD_KEY) || '{}'); } catch (e) { return {}; } }
/** Rekord-Schlüssel: Burgwiese wie bisher (alte Rekorde bleiben sichtbar), andere Karten mit „<id>|“ davor */
function rekordKey() {
  const k = quelle() === 'meine' ? 'meine-themen' : [...W.pools].sort().join('+') + (W.pools.some(p => /^vok/.test(p)) ? '|' + (W.bis || 'alle') + '|' + W.richtung : '');
  const karte = karteDaten(W.karte).id;
  return karte === 'burgwiese' ? k : karte + '|' + k;
}
const KRONEN_FELD = '#kronen';  // Feld in lern-burg-rekorde: { <karten-id>: beste Kronen im Rundenmodus }
function besteKronen(id) { const k = rekorde()[KRONEN_FELD]; return (k && k[id]) || 0; }
function klasse() { return LernAufgaben.klasse() || W.klasse || null; }

function buildMenu() {
  const passKl = LernAufgaben.klasse();
  $('klasse-box').hidden = !!passKl;
  if (!passKl) {
    $('klasse-tabs').innerHTML = [5, 6, 7, 8, 9].map(k => `<button type="button" data-kl="${k}" class="${W.klasse === k ? 'on' : ''}">Klasse ${k}</button>`).join('');
  }
  const list = klasse() ? LernAufgaben.pools({ klasse: klasse() }) : [];
  if (klasse()) W.pools = W.pools.filter(id => list.some(p => p.id === id));

/* ── Kartenwahl: Kacheln mit kleiner Vorschau aus den Wegdaten ── */
function kartenVorschau(k) {
  const b = DATEN.biome[k.biom] || DATEN.biome.wiese, s = k.spalten || 14, z = k.zeilen || 9;

  const wege = k.wege.map(w => `<polyline points="${w.map(p => p.join(',')).join(' ')}" fill="none" stroke="${f(b.weg[0])}" stroke-width=".95" stroke-linejoin="round"/>`).join('');
  const plaetze = k.plaetze.map(p => { const [x, y] = Array.isArray(p) ? p : [p.x, p.y]; return `<rect x="${x - .38}" y="${y - .38}" width=".76" height=".76" rx=".12" fill="#9aa0b4"/>`; }).join('');
  const hoehlen = k.wege.map(w => `<circle cx="${Math.max(-.6, Math.min(s + .6, w[0][0]))}" cy="${Math.max(-.6, Math.min(z + .6, w[0][1]))}" r=".8" fill="#262338"/>`).join('');
  return `<svg viewBox="-1 -1 ${s + 2} ${z + 2}" aria-hidden="true"><rect x="-1" y="-1" width="${s + 2}" height="${z + 2}" fill="${f(b.boden[0])}"/>${wasser}${wege}${plaetze}${hoehlen}
    <rect x="${k.burg[0] - 1.1}" y="${k.burg[1] - 1.1}" width="2.2" height="2.2" rx=".3" fill="#4f4ba8" stroke="#e6a817" stroke-width=".25"/></svg>`;

/* ── Ton (standardmäßig aus, ohne Dateien) ─────────── */
let AC = null;
function ton(f, d = .12, typ = 'triangle', vol = .06) {
  if (!W.ton) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = typ; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}

/* ═══════════════════════════════════════════════════════
   3D-WELT
   ═══════════════════════════════════════════════════════ */
let gl = false, T = null, renderer, scene, camera, camFit, figur, burgherr, burg, ring, hemi, pixelRatio = 1;
const MAT = {}, GEO = {};
const WEGE = [];                                  // je Weg: { punkte, laengen, gesamt }
const plaetze = [], gegner = [], geschosse = [], teile = [];
const pool = { gegner: {}, geschoss: {} };
let matPlatz, matPlatzGlow, WELT = null;          // WELT: was beim Kartenwechsel abgebaut wird

async function init3d() {
  figur = await LernAvatar.figur(null);

  renderer = new T.WebGLRenderer({ antialias: true });

  hemi = new T.HemisphereLight(0xf2f6ff, 0x4d6b45, .62); scene.add(hemi);
  const sun = new T.DirectionalLight(0xfff1d6, .62); sun.position.set(-70, 150, 90); scene.add(sun);
  camera = new T.PerspectiveCamera(38, 1, 1, 4000);
  camFit = new T.PerspectiveCamera(38, 1, 1, 4000);
  matPlatz = new T.MeshLambertMaterial({ color: '#9aa0b4' });
  matPlatzGlow = new T.MeshLambertMaterial({ color: '#e9d9a0', emissive: new T.Color('#6b4c00') });
  // Reichweiten-Ring
  ring = new T.Mesh(new T.RingGeometry(.94, 1, 48), new T.MeshBasicMaterial({ color: 0xfde68a, transparent: true, opacity: .75, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 1.9; ring.visible = false; scene.add(ring);
  const fuell = new T.Mesh(new T.CircleGeometry(1, 48), new T.MeshBasicMaterial({ color: 0xfde68a, transparent: true, opacity: .14, depthWrite: false }));
  fuell.position.z = -.01; ring.add(fuell);
  // Partikel-Vorrat
  for (let i = 0; i < 80; i++) {

  }
  baueWelt();
  gl = true;

function himmel(farben) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, farben[0]); g.addColorStop(.55, farben[1]); g.addColorStop(1, farben[2]);
  x.fillStyle = g; x.fillRect(0, 0, 2, 256);
  return new T.CanvasTexture(c);
}
function lam(c, o = {}) { const k = c + JSON.stringify(o); return MAT[k] || (MAT[k] = new T.MeshLambertMaterial(Object.assign({ color: c }, o))); }
function box(w, h, d) { const k = w + '|' + h + '|' + d; return GEO[k] || (GEO[k] = new T.BoxGeometry(w, h, d)); }
function mesh(g, m, x = 0, y = 0, z = 0, p) { const o = new T.Mesh(g, m); o.position.set(x, y, z); if (p) p.add(o); return o; }
function pixelTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  t.magFilter = T.NearestFilter; t.minFilter = T.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = T.RepeatWrapping;
  if (rep) t.repeat.set(rep[0], rep[1]);
  return t;
}
/** Material mit eigener Pixel-Textur (wird beim Kartenwechsel wieder freigegeben) */
function texMat(tex) { const m = new T.MeshLambertMaterial({ map: tex }); WELT.frei.push(tex, m); return m; }
/** Zufall mit festem Startwert – die Deko sieht jedes Mal gleich aus */
function seeded(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

/** Alle Meshes einer Gruppe zu wenigen großen Meshes zusammenfügen (je Material eins) – spart Zeichenaufrufe */
function backe(gruppe) {
  gruppe.updateMatrixWorld(true);
  const nachMat = new Map();
  gruppe.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
    if (!nachMat.has(o.material)) nachMat.set(o.material, []);
    nachMat.get(o.material).push(g);
  });
  const out = new T.Group();
  nachMat.forEach((geos, mat) => out.add(new T.Mesh(verbinde(geos), mat)));
  return out;
}
function verbinde(geos) {
  let n = 0, ni = 0;
  geos.forEach(g => { n += g.attributes.position.count; ni += g.index.count; });
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
  const ind = n > 65000 ? new Uint32Array(ni) : new Uint16Array(ni);
  let o = 0, io = 0;
  geos.forEach(g => {
    const c = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
    const I = g.index.array;
    for (let i = 0; i < I.length; i++) ind[io + i] = I[i] + o;
    o += c; io += I.length;
    g.dispose();
  });
  const b = new T.BufferGeometry();
  b.setAttribute('position', new T.BufferAttribute(pos, 3));
  b.setAttribute('normal', new T.BufferAttribute(nor, 3));
  b.setAttribute('uv', new T.BufferAttribute(uv, 2));
  b.setIndex(new T.BufferAttribute(ind, 1));
  return b;
}
/** Gebackene Gruppe aus der Szene nehmen und ihre (eigenen) Geometrien freigeben */
function wegwerfen(o) { if (!o) return; if (o.parent) o.parent.remove(o); o.traverse(m => { if (m.isMesh) m.geometry.dispose(); }); }

/** Die Welt der gewählten Karte bauen (beim Start und bei jedem Kartenwechsel) */
function baueWelt() {
  if (WELT) {
    aufraeumen();
    wegwerfen(WELT.statisch);
    if (WELT.boden) { scene.remove(WELT.boden); WELT.boden.geometry.dispose(); }
    WELT.frei.forEach(x => x.dispose());
    if (burg) { scene.remove(burg); wegwerfen(burg.userData.gebacken); }
    plaetze.forEach(p => scene.remove(p.m)); plaetze.length = 0;
  }
  KARTE = bereiteKarte(karteDaten(aktKarteId()));
  WELT = { frei: [] };
  const B = KARTE.biom;
  if (scene.background) scene.background.dispose();
  scene.background = himmel(B.himmel);
  hemi.color.set(B.licht[0]); hemi.groundColor.set(B.licht[1]);
  document.body.style.background = B.hintergrund || '#7fc27f';

  const statisch = new T.Group();
  const R = seeded(7);
  // Boden
  const gras = pixelTex(32, 32, (x, w, h) => {
    x.fillStyle = B.boden[0]; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) { x.fillStyle = B.boden[1 + i % 3]; x.fillRect(Math.random() * w | 0, Math.random() * h | 0, 2, 2); }
  }, [90, 90]);
  const boden = mesh(new T.PlaneGeometry(1440, 1440), texMat(gras), 0, 0, 0, scene);
  boden.rotation.x = -Math.PI / 2;
  WELT.boden = boden;

  // Wege: Punkte, Längen, Streifen (gemeinsame Abschnitte nur einmal zeichnen)
  WEGE.length = 0;
  const gezeichnet = new Set();
  const sand = (len) => pixelTex(16, 16, (x, w, h) => {
    x.fillStyle = B.weg[0]; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 26; i++) { x.fillStyle = B.weg[1 + i % 3]; x.fillRect(Math.random() * w | 0, Math.random() * h | 0, 1 + (Math.random() * 2 | 0), 1); }
  }, [1, len]);
  const breite = TILE * .95;
  KARTE.wege.forEach((liste, wi) => {
    const W0 = { punkte: liste.map(([a, b]) => { const [x, z] = gw(a, b); return new T.Vector3(x, 0, z); }), laengen: [0], gesamt: 0 };
    for (let i = 1; i < W0.punkte.length; i++) W0.laengen.push(W0.laengen[i - 1] + W0.punkte[i].distanceTo(W0.punkte[i - 1]));
    W0.gesamt = W0.laengen[W0.laengen.length - 1];
    WEGE.push(W0);
    for (let i = 1; i < W0.punkte.length; i++) {
      const a = W0.punkte[i - 1], b = W0.punkte[i];
      const sch = [liste[i - 1].join(','), liste[i].join(',')].sort().join('|');
      if (gezeichnet.has(sch)) continue;
      gezeichnet.add(sch);
      const len = a.distanceTo(b) + breite, quer = Math.abs(b.x - a.x) > Math.abs(b.z - a.z);
      const t = sand(len / TILE); if (quer) { t.repeat.set(len / TILE, 1); }
      statisch.add(mesh(box(quer ? len : breite, .5, quer ? breite : len), texMat(t), (a.x + b.x) / 2, .25 + i * .02 + wi * .011, (a.z + b.z) / 2));
      // Rand: etwas breiterer, dunklerer Streifen unter dem Weg (auch an den Ecken sauber)
      statisch.add(mesh(box(quer ? len + 2.2 : breite + 2.2, .34, quer ? breite + 2.2 : len + 2.2), lam(B.wegRand), (a.x + b.x) / 2, .17 - i * .01 - wi * .005, (a.z + b.z) / 2));
    }
    // Höhle am Start, zur Wegrichtung gedreht
    const [p0, p1] = liste, dl = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) || 1, dx = (p1[0] - p0[0]) / dl, dy = (p1[1] - p0[1]) / dl;
    const [x, z] = gw(p0[0] + dx * .8, p0[1] + dy * .8);
    const h = new T.Group(); h.position.set(x, 0, z); h.rotation.y = Math.atan2(-dy, dx); statisch.add(h);
    const fels = lam(B.hoehle || '#7d8196'), dunkel = lam('#262338');
    mesh(box(14, 20, 34), fels, -6, 10, 0, h);
    mesh(box(10, 12, 26), fels, -2, 26, 0, h);
    mesh(box(2, 14, 13), dunkel, 1.2, 7, 0, h);
  });
  // Wasser und Brücken
  KARTE.wasser.forEach(([x0, y0, x1, y1]) => {
    const [ax, az] = gw(x0, y0), [bx, bz] = gw(x1, y1);
    statisch.add(mesh(box(bx - ax + 3, .2, bz - az + 3), lam(B.ufer || '#8a7a55'), (ax + bx) / 2, .1, (az + bz) / 2));
    statisch.add(mesh(box(bx - ax, .3, bz - az), lam(B.wasser || '#4f9fd8', { emissive: 0x0b2540 }), (ax + bx) / 2, .16, (az + bz) / 2));
    KARTE.wege.forEach(liste => { for (let i = 1; i < liste.length; i++) brueckeUeber(statisch, liste[i - 1], liste[i], x0, y0, x1, y1, breite); });
  });
  // Deko – nicht auf Weg, Bauplätzen, Wasser, Burg oder in Sperrflächen
  const frei = (gx, gy) => {
    const [x, z] = gw(gx, gy), p = new T.Vector3(x, 0, z);
    for (const w of WEGE) for (let i = 1; i < w.punkte.length; i++) if (abstandStrecke(p, w.punkte[i - 1], w.punkte[i]) < TILE * 1.05) return false;
    if (KARTE.plaetze.some(q => Math.hypot(q.x - gx, q.y - gy) < 1.15)) return false;
    if (Math.hypot(KARTE.burg[0] - gx, KARTE.burg[1] - gy) < 2.2) return false;
    if (KARTE.sperren.some(([a, b, c, d]) => gx > a && gx < c && gy > b && gy < d)) return false;
    if (KARTE.wasser.some(([a, b, c, d]) => gx > a - .5 && gx < c + .5 && gy > b - .5 && gy < d + .5)) return false;
    return true;
  };
  const D = B.deko, S = KARTE.spalten, Z = KARTE.zeilen;
  for (let gx = -5; gx <= S + 4; gx += 1) for (let gy = -4; gy <= Z + 4; gy += 1) {
    const x0 = gx + R() * .6, y0 = gy + R() * .6;
    const innen = x0 > -.3 && x0 < S + .3 && y0 > -.3 && y0 < Z + .3;
    if (R() > D.dichte[innen ? 0 : 1] || !frei(x0, y0)) continue;
    const [x, z] = gw(x0, y0), l = innen ? D.innen : D.aussen;
    const o = (DEKO[l[R() * l.length | 0]] || DEKO.stein)(R);
    o.position.set(x, 0, z); o.rotation.y = R() * 6.28;
    statisch.add(o);
  }
  WELT.statisch = backe(statisch);
  scene.add(WELT.statisch);

  // Burg (eigene Gruppe, sie wackelt bei Treffern)
  burg = baueBurg();
  scene.add(burg);

  // Bauplätze
  KARTE.plaetze.forEach(({ x: gx, y: gy, ab }, i) => {
    const [x, z] = gw(gx, gy);
    const m = mesh(box(12.5, 1.6, 12.5), matPlatz, x, .8, z, scene);
    plaetze.push({ i, x, z, m, turm: null, ab });
  });
  CAM.drehFuer = null; CAM.dirty = true;
}
/** Brücke, wo ein Wegabschnitt (waagrecht/senkrecht) über Wasser führt */
function brueckeUeber(gruppe, p, q, x0, y0, x1, y1, breite) {
  const quer = Math.abs(q[0] - p[0]) > Math.abs(q[1] - p[1]);
  const [lo, hi] = quer ? [Math.min(p[0], q[0]), Math.max(p[0], q[0])] : [Math.min(p[1], q[1]), Math.max(p[1], q[1])];
  const fest = quer ? p[1] : p[0], [f0, f1, a0, a1] = quer ? [y0, y1, x0, x1] : [x0, x1, y0, y1];
  if (fest < f0 || fest > f1) return;
  const von = Math.max(lo, a0) - .45, bis = Math.min(hi, a1) + .45;
  if (bis - von <= .9) return;
  const mitte = (von + bis) / 2, [x, z] = quer ? gw(mitte, fest) : gw(fest, mitte), len = (bis - von) * TILE;
  const g = new T.Group(); g.position.set(x, 0, z); if (!quer) g.rotation.y = Math.PI / 2; gruppe.add(g);
  const holz = lam('#9a6a3a'), dunkel = lam('#6b4423');
  mesh(box(len, 1, breite + 3), holz, 0, .9, 0, g);
  for (let i = -len / 2 + 2; i < len / 2; i += 4) mesh(box(.6, .25, breite + 3), dunkel, i, 1.45, 0, g);
  [-1, 1].forEach(s => {
    mesh(box(len, .9, .9), dunkel, 0, 4, s * (breite / 2 + 1.6), g);
    for (let i = -len / 2 + 1; i <= len / 2; i += Math.max(4, len / 4)) mesh(box(.9, 3.6, .9), dunkel, i, 2.4, s * (breite / 2 + 1.6), g);
  });
}
function abstandStrecke(p, a, b) {
  const ab = b.clone().sub(a), t = clamp(p.clone().sub(a).dot(ab) / ab.lengthSq(), 0, 1);
  return p.distanceTo(a.clone().addScaledVector(ab, t));
}

function baueBurg() {
  const [x, z] = gw(...KARTE.burg);
  const aussen = new T.Group(); aussen.position.set(x, 0, z);
  // Tor zeigt zum Weg: letzter Abschnitt des ersten Wegs
  const w = KARTE.wege[0], a = w[w.length - 2], b = w[w.length - 1];
  aussen.rotation.y = Math.atan2(-(b[1] - a[1]), b[0] - a[0]);
  const g = new T.Group();
  const stein = lam('#c3bdd3'), stein2 = lam('#a39db6'), dach = lam('#4f4ba8'), dunkel = lam('#2a2540'), holz = lam('#8b5a2b');
  mesh(box(34, 18, 32), stein, 0, 9, 0, g);
  mesh(box(35, 2, 33), stein2, 0, 4, 0, g);
  // Zinnen
  for (let i = -3; i <= 3; i++) { mesh(box(3, 3, 3), stein, i * 5, 19.5, -14.5, g); mesh(box(3, 3, 3), stein, i * 5, 19.5, 14.5, g); }
  for (let i = -2; i <= 2; i++) { mesh(box(3, 3, 3), stein, -15.5, 19.5, i * 5, g); mesh(box(3, 3, 3), stein, 15.5, 19.5, i * 5, g); }
  // Ecktürme
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    mesh(box(10, 27, 10), stein, sx * 16, 13.5, sz * 15, g);
    mesh(box(12, 3, 12), dach, sx * 16, 28.5, sz * 15, g);
    mesh(box(7, 4, 7), dach, sx * 16, 32, sz * 15, g);
  });
  // Tor zur Wegseite (−x)
  mesh(box(1.4, 12, 11), holz, -17.3, 6, 3, g);
  mesh(box(1.6, 2, 13), dunkel, -17.4, 13, 3, g);
  const gebacken = backe(g);
  aussen.add(gebacken);
  aussen.userData.gebacken = gebacken;
  // Fahnen (bewegt)
  aussen.userData.fahnen = [];
  [[-1, -1], [1, -1]].forEach(([sx, sz]) => {
    mesh(box(.7, 10, .7), holz, sx * 16, 38, sz * 15, aussen);
    const f = mesh(box(.4, 4.5, 7), lam('#e6a817'), sx * 16, 40.5, sz * 15 + 3.6, aussen);
    aussen.userData.fahnen.push(f);
  });
  // Burgherr / Burgherrin
  burgherr = new T.Group();
  burgherr.position.set(0, 18, 3);
  figur.root.scale.setScalar(CFG.figurGroesse);
  burgherr.add(figur.root);
  aussen.add(burgherr);
  aussen.userData.basis = new T.Vector3(x, 0, z);
  // Tor in Weltkoordinaten (dort treffen die Monster die Burg)
  const r = aussen.rotation.y;
  aussen.userData.tor = new T.Vector3(x - 16 * Math.cos(r), 0, z + 16 * Math.sin(r));
  return aussen;
}

/* ── Wege ──────────────────────────────────────────── */
function wegPos(s, out, w = WEGE[0]) {
  s = clamp(s, 0, w.gesamt);
  let i = 1; while (i < w.laengen.length - 1 && w.laengen[i] < s) i++;
  const a = w.punkte[i - 1], b = w.punkte[i];
  const t = (s - w.laengen[i - 1]) / (w.laengen[i] - w.laengen[i - 1] || 1);
  out.x = a.x + (b.x - a.x) * t; out.z = a.z + (b.z - a.z) * t;
  out.dx = b.x - a.x; out.dz = b.z - a.z;
  return out;
}

/* ═══════════════════════════════════════════════════════

   Werte (Preise, Schaden, Reichweite …) stehen in DATEN.tuerme.
   Neuer Turm: hier eintragen + Werte in tower-defense.json.
     modell(stufe, g, kopf) baut das Modell, gibt { w, h } zurück
     geschoss()             Mesh des Geschosses
     flug: 'folgen' (fliegt dem Ziel nach, tempo) | 'wurf' (Bogen, dauer, zielt vor)
     einschlag(g, x, z)     was beim Ankommen passiert
     sofort(t, ziel, schaden)  statt Geschoss: wirkt sofort (Blitz)
     passiv: true           schießt nicht (Banner)
     schussTon()            optional
   Werte in den Daten: nurBoden (trifft keine Fledermäuse), durchschlag (bricht Schilde),
   gift/giftDauer (Schaden pro Sekunde, stapelt nicht), sprung/sprungWeite (Blitz),

function baueTurmMesh(typ, stufe) {
  const g = new T.Group(), kopf = new T.Group(); g.add(kopf);
  const band = [null, lam('#e2e8f0'), lam('#e6a817', { emissive: 0x4a3400 })][stufe - 1];
  const { w, h } = TURM_TYPEN[typ].modell(stufe, g, kopf);
  if (band) {
    mesh(box(w + .9, 1.4, w + .9), band, 0, 3.6, 0, g);
    if (stufe === 3) mesh(box(w + .9, 1.4, w + .9), band, 0, h - 1, 0, g);
  }
  return { g, kopf, hoehe: h + 6 };
}
function stellTurm(platz) {
  const t = platz.turm;
  if (t.g) scene.remove(t.g);
  const m = baueTurmMesh(t.typ, t.stufe);
  m.g.position.set(platz.x, 1.6, platz.z);
  if (t.kopfDreh !== undefined) m.kopf.rotation.y = t.kopfDreh;
  scene.add(m.g);
  Object.assign(t, { g: m.g, kopf: m.kopf, hoehe: m.hoehe });
}
function turmWert(t, feld) { const v = DATEN.tuerme[t.typ][feld]; return Array.isArray(v) ? v[t.stufe - 1] : v; }

function bauen(platz, typ) {
  if (!turmIds().includes(typ)) return;
  const preis = DATEN.tuerme[typ].preis[0];
  if (platz.turm || G.muenzen < preis) return;
  G.muenzen -= preis;
  platz.turm = { typ, stufe: 1, cd: .3, investiert: preis, platz };
  stellTurm(platz);
  funken(platz.x, 8, platz.z, '#e6a817', 14);
  ton(520, .08); ton(780, .1);
  schliesseMenu(); updateHud();
}
function aufwerten(platz) {
  const t = platz.turm; if (!t || t.stufe >= 3) return;
  const preis = DATEN.tuerme[t.typ].preis[t.stufe];
  if (G.muenzen < preis) return;
  G.muenzen -= preis; t.investiert += preis; t.stufe++;
  stellTurm(platz);
  funken(platz.x, 14, platz.z, '#fde68a', 16);
  ton(660, .08); ton(990, .12);
  schliesseMenu(); updateHud();
}
function abreissen(platz) {
  const t = platz.turm; if (!t) return;
  G.muenzen += Math.round(t.investiert * CFG.abrissAnteil);
  scene.remove(t.g); platz.turm = null;
  funken(platz.x, 6, platz.z, '#a4a9b8', 12);
  schliesseMenu(); updateHud();
}

/** Banner in Reichweite: Schaden × (1 + bester Bonus) – mehrere Banner stapeln nicht */
function bannerFaktor(t) {
  let b = 0;
  plaetze.forEach(pl => {
    const o = pl.turm;
    if (!o || o === t || !TURM_TYPEN[o.typ].passiv || !DATEN.tuerme[o.typ].bonus || TURM_TYPEN[t.typ].passiv) return;
    const r = turmWert(o, 'reichweite') * TILE;
    if ((pl.x - t.platz.x) ** 2 + (pl.z - t.platz.z) ** 2 <= r * r) b = Math.max(b, turmWert(o, 'bonus'));
  });
  return 1 + b;
}
const fliegt = e => !!DATEN.gegner[e.typ].fliegt;
const _p = { x: 0, z: 0, dx: 0, dz: 0 };
function tuermeUpdate(dt) {
  plaetze.forEach(pl => {
    const t = pl.turm; if (!t) return;
    if (t.kopf.userData.dreh && !REDUCED) t.kopf.userData.dreh.rotation.y += dt * 1.5;
    if (t.kopf.userData.fahne && !REDUCED) t.kopf.userData.fahne.rotation.y = Math.sin(G.t * 3 + pl.i) * .25;
    if (TURM_TYPEN[t.typ].passiv) return;
    t.cd -= dt;
    if (t.cd > 0) return;
    const r = turmWert(t, 'reichweite') * TILE, boden = DATEN.tuerme[t.typ].nurBoden;
    let ziel = null, zielRest = 0;
    for (const e of gegner) {
      if (!e.alive || (boden && fliegt(e))) continue;
      if ((e.x - pl.x) ** 2 + (e.z - pl.z) ** 2 > r * r) continue;
      const rest = e.weg.gesamt - e.s;                          // der Burg am nächsten zuerst
      if (!ziel || rest < zielRest) { ziel = e; zielRest = rest; }
    }
    if (!ziel) { t.cd = .1; return; }
    t.cd = 1 / turmWert(t, 'rate');
    t.kopfDreh = Math.atan2(ziel.x - pl.x, ziel.z - pl.z);
    t.kopf.rotation.y = t.kopfDreh;
    schiesse(t, ziel);
  });
}

/* ── Geschosse ───────────────────────────────────── */
function holeGeschoss(typ) {
  const frei = (pool.geschoss[typ] || (pool.geschoss[typ] = [])).pop();
  if (frei) return frei;
  return { typ, m: TURM_TYPEN[typ].geschoss(), von: new T.Vector3(), nach: new T.Vector3(), pos: new T.Vector3() };
}
function schiesse(t, ziel) {
  const R = TURM_TYPEN[t.typ];
  if (R.sofort) { R.sofort(t, ziel, turmWert(t, 'schaden') * bannerFaktor(t)); return; }
  const g = holeGeschoss(t.typ);
  g.von.set(t.platz.x, t.hoehe + 1.6, t.platz.z);
  g.pos.copy(g.von);
  g.ziel = ziel; g.t = 0;
  g.schaden = turmWert(t, 'schaden') * bannerFaktor(t); g.turm = t;
  if (R.flug === 'wurf') {
    // Vorhalten: dorthin zielen, wo der Gegner gleich sein wird
    wegPos(ziel.s + ziel.vAkt * R.dauer, _p, ziel.weg);
    g.nach.set(_p.x, 1, _p.z); g.dauer = R.dauer;
  } else {
    g.nach.set(ziel.x, ziel.mitte, ziel.z);
  }
  g.m.position.copy(g.pos); g.m.visible = true;
  scene.add(g.m); geschosse.push(g);
  if (R.schussTon) R.schussTon();
}
function geschosseUpdate(dt) {
  for (let i = geschosse.length - 1; i >= 0; i--) {
    const g = geschosse[i], R = TURM_TYPEN[g.typ];
    let fertig = false;
    if (R.flug === 'wurf') {
      g.t += dt;
      const u = Math.min(1, g.t / g.dauer);
      g.pos.lerpVectors(g.von, g.nach, u);
      g.pos.y += Math.sin(u * Math.PI) * 16;
      if (u >= 1) { fertig = true; R.einschlag(g, g.nach.x, g.nach.z); }
    } else {
      if (g.ziel && g.ziel.alive) g.nach.set(g.ziel.x, g.ziel.mitte, g.ziel.z);
      const d = g.nach.clone().sub(g.pos), dist = d.length(), weit = R.tempo * dt;
      if (dist <= weit + 1) {
        fertig = true;
        R.einschlag(g, g.nach.x, g.nach.z);
      } else {
        g.pos.addScaledVector(d, weit / dist);
        g.m.lookAt(g.nach);
      }
    }
    g.m.position.copy(g.pos);
    if (fertig) {
      scene.remove(g.m);
      pool.geschoss[g.typ].push(g);
      geschosse.splice(i, 1);
    }
  }
}
/** Schaden in einem Kreis (Turmwert flaeche in Feldern); mit „bremse“ werden Gegner langsamer, mit „gift“ vergiftet */
function flaechenTreffer(g, x, z) {
  const def = DATEN.tuerme[g.typ], r = def.flaeche * TILE;
  gegner.slice().forEach(e => {
    if (!e.alive || (e.x - x) ** 2 + (e.z - z) ** 2 > r * r || (def.nurBoden && fliegt(e))) return;
    if (def.gift) {
      // Gift stapelt nicht: der stärkere Wert gilt, die Dauer beginnt neu
      e.giftDps = Math.max(e.giftT > 0 ? e.giftDps : 0, turmWert(g.turm, 'gift') * (g.schaden / turmWert(g.turm, 'schaden')));
      e.giftT = def.giftDauer || 4;
    }
    if (def.bremse) {
      const b = turmWert(g.turm, 'bremse') * (DATEN.gegner[e.typ].frostHalb ? .5 : 1);
      e.bremse = Math.max(e.slowT > 0 ? e.bremse : 0, b);
      e.slowT = def.bremsDauer;
    }
    treffer(e, g.schaden, g.typ);
  });
}
function treffer(e, schaden, turmTyp) {
  if (!e.alive) return;
  const def = DATEN.gegner[e.typ], td = DATEN.tuerme[turmTyp] || {};
  if (e.schild > 0) {
    // Schild fängt den Treffer ab; Durchschlag (Ballista) bricht ihn ganz
    e.schild = td.durchschlag ? 0 : e.schild - 1;
    funken(e.x, e.mitte, e.z, '#cbd5e1', e.schild ? 3 : 10);
    if (e.k.userData.schild) e.k.userData.schild.visible = e.schild > 0;
    if (!td.durchschlag) { e.blinkT = .08; return; }
  }
  if (def.ruestung && td.art === 'pfeil') schaden *= def.ruestung;
  e.hp -= schaden;
  e.blinkT = .12;
  if (e.hp <= 0) stirb(e);
}

/* ═══════════════════════════════════════════════════════

/* ── Wellen ─────────────────────────────────────── */
function welleEndlos(n) {

  // Neue Monster der Karte (aus ihren Runden-Wellen) ab Welle 4, ab Welle 8 zwei Sorten

  const extra = n >= 4 && neu.length ? [neu[(n - 4) % neu.length]] : [];
  if (n >= 8 && neu.length > 1) extra.push(neu[(n - 3) % neu.length]);
  const jeExtra = Math.max(2, Math.floor(anz * .12));

/* ═══════════════════════════════════════════════════════

    }
  }

    tuermeUpdate(dt);

  }

  const glow = (Z === 'play' || Z === 'countdown') && G.muenzen >= billig;
  const k = REDUCED ? .7 : .45 + .35 * Math.sin(G.t * 4);

    FPS.t += rdt; FPS.n++;
    if (FPS.t > 3) {
      if (FPS.n / FPS.t < CFG.minFps) { pixelRatio = 1; renderer.setPixelRatio(1); resize(); FPS.gesenkt = true; }
      FPS.t = 0; FPS.n = 0;
    }
  }
}

loadWahl();
(function linkParameter() {
  const L = LernAufgaben.ausLink(location.search);
  if (L.ids.length) { W.pools = L.ids; W.bis = L.opts.bis || ''; W.richtung = L.opts.richtung || 'de-en'; W.lehrer = true; W.fach = null; }
  const P = new URLSearchParams(location.search), m = P.get('modus');
  if (m === 'endlos' || m === 'runde' || m === 'kampagne') W.modus = m;
  if (P.get('karte')) { W.karte = LINK_KARTE = P.get('karte'); if (W.modus === 'kampagne') W.modus = 'runde'; }   // z. B. ?karte=engpass (unbekannt → Burgwiese; auch wenn noch gesperrt)
})();

whenPass(() => {
  buildMenu();

  });
});
