<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙️ Admin – Lern-Apps</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; min-height: 100vh; background: #f8fafc; padding-bottom: 48px; }

header { background: linear-gradient(90deg, #1e293b, #334155); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 20px; font-weight: 900; color: #fff; }
header p { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 2px; }
.btn-home { background: rgba(255,255,255,0.15); border: none; color: #fff; font-weight: 700; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-family: 'Nunito', sans-serif; font-size: 13px; text-decoration: none; display: inline-block; }

.container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
.stat-card { background: #fff; border-radius: 14px; padding: 16px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.stat-card .val { font-size: 32px; font-weight: 900; color: #7c6af7; }
.stat-card .lbl { font-size: 12px; color: #6b7280; font-weight: 600; margin-top: 4px; }

.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-title { font-weight: 800; color: #1e293b; font-size: 16px; }
.badge { background: #f3f0ff; color: #7c6af7; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }

.unit-block { background: #fff; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }
.unit-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; border-bottom: 1px solid #f1f5f9; }
.unit-header:hover { background: #f8fafc; }
.unit-header h3 { font-size: 15px; font-weight: 800; color: #1e293b; }
.unit-header .meta { display: flex; align-items: center; gap: 10px; }
.unit-header .toggle { font-size: 18px; color: #9ca3af; transition: transform .2s; }
.unit-header.open .toggle { transform: rotate(90deg); }

.theme-block { border-bottom: 1px solid #f1f5f9; }
.theme-block:last-child { border-bottom: none; }
.theme-header { padding: 12px 20px 12px 32px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: #fafafa; }
.theme-header:hover { background: #f3f0ff; }
.theme-header h4 { font-size: 13px; font-weight: 700; color: #374151; }

.word-table { width: 100%; border-collapse: collapse; display: none; }
.word-table.visible { display: table; }
.word-table th { background: #f8fafc; padding: 8px 16px 8px 32px; text-align: left; font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; }
.word-table td { padding: 8px 16px 8px 32px; font-size: 13px; border-top: 1px solid #f1f5f9; }
.word-table tr:hover td { background: #fafafa; }
.word-table td:first-child { font-weight: 700; color: #374151; }
.word-table td:last-child { color: #6b7280; }

.special-block { background: #fff7ed; border: 2px solid #fed7aa; border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
.special-header { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.special-header h3 { font-size: 14px; font-weight: 800; color: #f97316; }
.special-table { width: 100%; border-collapse: collapse; display: none; }
.special-table.visible { display: table; }
.special-table th { background: #fff7ed; padding: 8px 20px; text-align: left; font-size: 11px; font-weight: 700; color: #f97316; text-transform: uppercase; }
.special-table td { padding: 8px 20px; font-size: 13px; border-top: 1px solid #fed7aa; }
.special-table td:first-child { font-weight: 700; }

.search-bar { width: 100%; padding: 12px 18px; border: 2px solid #e5e7eb; border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: 15px; outline: none; margin-bottom: 20px; }
.search-bar:focus { border-color: #7c6af7; }
.search-results { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: none; margin-bottom: 20px; }
.search-results.visible { display: block; }
.search-result-item { padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; display: flex; gap: 12px; }
.search-result-item:last-child { border-bottom: none; }
.search-result-item .en { font-weight: 700; color: #374151; min-width: 160px; }
.search-result-item .de { color: #6b7280; }
.search-result-item .loc { font-size: 11px; color: #a78bfa; margin-left: auto; }

#loading { text-align: center; padding: 60px; color: #7c6af7; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div>
    <h1>⚙️ Admin – Vokabelverwaltung</h1>
    <p>Klasse 5 · Lern-Apps</p>
  </div>
  <a href="index.html" class="btn-home">← Zur Plattform</a>
</header>

<div class="container">
  <div id="loading">Vokabeln werden geladen... ⏳</div>
  <div id="content" style="display:none">

    <!-- Stats -->
    <div class="stats-grid" id="stats-grid"></div>

    <!-- Search -->
    <div class="section-header"><div class="section-title">🔍 Vokabel suchen</div></div>
    <input type="text" class="search-bar" id="search-bar" placeholder="Englisch oder Deutsch eingeben..." oninput="doSearch(this.value)">
    <div class="search-results" id="search-results"></div>

    <!-- Special lists -->
    <div class="section-header">
      <div class="section-title">⭐ Sonderlisten</div>
      <span class="badge" id="special-count"></span>
    </div>
    <div id="special-lists"></div>

    <!-- Units -->
    <div class="section-header" style="margin-top:24px">
      <div class="section-title">📚 Units & Themen</div>
      <span class="badge" id="unit-count"></span>
    </div>
    <div id="unit-blocks"></div>

  </div>
</div>

<script src="navbar.js" onerror="console.log('navbar not found')"></script>
<script>
let CONFIG = null;
let allWordIndex = []; // {en, de, location}

async function loadConfig() {
  try {
    const res = await fetch('config.json');
    CONFIG = await res.json();
    buildIndex();
    renderStats();
    renderSpecialLists();
    renderUnits();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').textContent = '⚠️ Fehler beim Laden der config.json';
  }
}

function buildIndex() {
  // Special lists
  Object.entries(CONFIG.specialLists).forEach(([key, sl]) => {
    sl.words.forEach(w => allWordIndex.push({en: w.en, de: w.de, location: sl.label}));
  });
  // Units
  Object.entries(CONFIG.units).forEach(([uKey, unit]) => {
    Object.entries(unit.themes).forEach(([tKey, theme]) => {
      theme.words.forEach(w => allWordIndex.push({en: w.en, de: w.de, location: `${unit.label} – ${theme.label}`}));
    });
  });
}

function renderStats() {
  const totalWords = allWordIndex.length;
  const unitCount = Object.keys(CONFIG.units).length;
  const specialCount = Object.keys(CONFIG.specialLists).length;
  let themeCount = 0;
  Object.values(CONFIG.units).forEach(u => themeCount += Object.keys(u.themes).length);

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="val">${totalWords}</div><div class="lbl">Vokabeln gesamt</div></div>
    <div class="stat-card"><div class="val">${unitCount}</div><div class="lbl">Units</div></div>
    <div class="stat-card"><div class="val">${themeCount}</div><div class="lbl">Themen</div></div>
    <div class="stat-card"><div class="val">${specialCount}</div><div class="lbl">Sonderlisten</div></div>
  `;
}

function renderSpecialLists() {
  const container = document.getElementById('special-lists');
  const count = Object.keys(CONFIG.specialLists).length;
  document.getElementById('special-count').textContent = count + ' Listen';

  Object.entries(CONFIG.specialLists).forEach(([key, sl]) => {
    const block = document.createElement('div');
    block.className = 'special-block';
    block.innerHTML = `
      <div class="special-header" onclick="toggleTable('st-${key}', this)">
        <h3>${sl.label}</h3>
        <span class="badge">${sl.words.length} Wörter</span>
      </div>
      <table class="special-table" id="st-${key}">
        <tr><th>Englisch</th><th>Deutsch</th></tr>
        ${sl.words.map(w => `<tr><td>${w.en}</td><td>${w.de}</td></tr>`).join('')}
      </table>
    `;
    container.appendChild(block);
  });
}

function renderUnits() {
  const container = document.getElementById('unit-blocks');
  let totalUnits = Object.keys(CONFIG.units).length;
  document.getElementById('unit-count').textContent = totalUnits + ' Units';

  Object.entries(CONFIG.units).forEach(([uKey, unit]) => {
    const totalWords = Object.values(unit.themes).reduce((s, t) => s + t.words.length, 0);
    const block = document.createElement('div');
    block.className = 'unit-block';

    const themesHTML = Object.entries(unit.themes).map(([tKey, theme]) => `
      <div class="theme-block">
        <div class="theme-header" onclick="toggleTable('tt-${uKey}-${tKey}', this)">
          <h4>${theme.label}</h4>
          <span class="badge">${theme.words.length} Wörter</span>
        </div>
        <table class="word-table" id="tt-${uKey}-${tKey}">
          <tr><th>Englisch</th><th>Deutsch</th></tr>
          ${theme.words.map(w => `<tr><td>${escHtml(w.en)}</td><td>${escHtml(w.de)}</td></tr>`).join('')}
        </table>
      </div>
    `).join('');

    block.innerHTML = `
      <div class="unit-header" onclick="toggleUnit(this, '${uKey}')">
        <h3>${unit.label}</h3>
        <div class="meta">
          <span class="badge">${totalWords} Wörter</span>
          <span class="toggle">›</span>
        </div>
      </div>
      <div class="unit-body" id="ub-${uKey}" style="display:none">${themesHTML}</div>
    `;
    container.appendChild(block);
  });
}

function toggleUnit(headerEl, unitKey) {
  const body = document.getElementById('ub-' + unitKey);
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  headerEl.classList.toggle('open', !isOpen);
}

function toggleTable(id, headerEl) {
  const table = document.getElementById(id);
  table.classList.toggle('visible');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function doSearch(query) {
  const q = query.trim().toLowerCase();
  const box = document.getElementById('search-results');
  if (q.length < 2) { box.classList.remove('visible'); return; }

  const results = allWordIndex.filter(w =>
    w.en.toLowerCase().includes(q) || w.de.toLowerCase().includes(q)
  ).slice(0, 30);

  if (results.length === 0) {
    box.innerHTML = '<div style="color:#9ca3af;font-size:13px">Keine Ergebnisse gefunden.</div>';
  } else {
    box.innerHTML = `<div style="font-size:12px;color:#9ca3af;margin-bottom:8px">${results.length} Ergebnisse</div>` +
      results.map(r => `
        <div class="search-result-item">
          <span class="en">${escHtml(r.en)}</span>
          <span class="de">${escHtml(r.de)}</span>
          <span class="loc">${escHtml(r.location)}</span>
        </div>
      `).join('');
  }
  box.classList.add('visible');
}

loadConfig();
</script>
</body>
</html>
