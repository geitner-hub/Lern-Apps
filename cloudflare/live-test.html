<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="../gemeinsam/umgebung.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lernwelt · Live-Test</title>
<style>
  :root { --bg:#0f0e1a; --panel:#1a1830; --line:#2e2b4d; --text:#ecebf5; --muted:#9d9abf; --gold:#e6a817; --indigo:#818cf8; --ok:#4ade80; --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .3rem; color: var(--gold); }
  p { color: var(--muted); margin: 0 0 1.4rem; }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:1.2rem; }
  input { flex:1 1 220px; padding:.7rem .9rem; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }
  button { padding:.7rem 1.2rem; border-radius:10px; border:0; background:var(--indigo); color:#0f0e1a; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  ol { list-style:none; padding:0; margin:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  li { display:grid; grid-template-columns: 1.6rem 1fr; gap:.6rem; padding:.65rem .9rem; border-top:1px solid var(--line); background:var(--panel); }
  li:first-child { border-top:0; }
  li .ic { font-weight:800; }
  li.ok .ic { color:var(--ok); } li.err .ic { color:var(--err); } li.run .ic { color:var(--muted); }
  li small { display:block; color:var(--muted); word-break:break-word; }
  #fazit { margin-top:1.2rem; font-weight:700; }
  #fazit.ok { color:var(--ok); } #fazit.err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Live-Abfrage testen</h1>
  <p>Prüft den Live-Teil des Workers (cloudflare/live.js, Etappe 1). Legt einen Raum mit einer Frage an, lässt drei
    „Kinder“ beitreten und antworten, liest den Stand, deckt auf und beendet den Raum wieder – danach ist alles gelöscht.</p>

  <div class="row">
    <label for="pw" style="position:absolute;left:-9999px">Admin-Passwort</label>
    <input id="pw" type="password" placeholder="Admin-Passwort" autocomplete="current-password">
    <button type="button" id="start">Test starten</button>
  </div>
  <ol id="log"></ol>
  <div id="fazit"></div>
</main>
<script>
'use strict';
const W = 'https://lern-apps-config.bennigeitner.workers.dev';
const logEl = document.getElementById('log');
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
const kennung = () => hex(crypto.getRandomValues(new Uint8Array(16)));

async function anfrage(methode, pfad, body, token) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(W + pfad, { method: methode, headers, cache: 'no-store', body: body === undefined ? undefined : JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch (e) {}
  return { status: r.status, d };
}
const post = (p, b, t) => anfrage('POST', p, b || {}, t);
const get = (p, t) => anfrage('GET', p, undefined, t);

function zeile(text) {
  const li = document.createElement('li');
  li.className = 'run';
  li.innerHTML = '<span class="ic">…</span><span></span>';
  li.lastChild.textContent = text;
  logEl.appendChild(li);
  const add = info => { const s = document.createElement('small'); s.textContent = info; li.lastChild.appendChild(s); };
  return {
    ok(info)  { li.className = 'ok';  li.firstChild.textContent = '✓'; if (info) add(info); },
    err(info) { li.className = 'err'; li.firstChild.textContent = '✗'; if (info) add(info); },
  };
}
async function schritt(text, fn) {
  const z = zeile(text);
  try { z.ok(await fn()); return true; } catch (e) { z.err(e.message || String(e)); return false; }
}
const pruef = (bed, msg) => { if (!bed) throw new Error(msg); };

document.getElementById('start').addEventListener('click', async () => {
  const btn = document.getElementById('start'), fazit = document.getElementById('fazit');
  logEl.innerHTML = ''; fazit.textContent = ''; fazit.className = '';
  btn.disabled = true;
  let token = '', code = '', fehler = 0;
  const kinder = [kennung(), kennung(), kennung()];
  const lauf = async (t, f) => { if (!await schritt(t, f)) fehler++; };
  try {
    if (!await schritt('Anmelden', async () => {
      const r = await fetch(W + '/login', { method: 'POST', headers: { Authorization: 'Bearer ' + document.getElementById('pw').value } });
      const d = await r.json().catch(() => ({}));
      pruef(r.ok && d.token, d.error || 'HTTP ' + r.status);
      token = d.token;
    })) { fehler++; return; }

    if (!await schritt('Raum mit einer Auswahl-Frage anlegen', async () => {
      const { status, d } = await post('/live/raum', { quiz: { titel: 'Live-Test', fragen: [{ typ: 'auswahl', text: 'Test: 2 + 2?', optionen: ['3', '4', '5'], richtig: 1 }], optionen: { rueckblick: false } } }, token);
      pruef(status === 200 && d.code, status === 404 ? 'Worker kennt /live/ nicht – live.js anlegen und worker.js ersetzen' : d.error || 'HTTP ' + status);
      code = d.code;
      return 'Code ' + code;
    })) { fehler++; return; }

    await lauf('Drei Kinder treten bei', async () => {
      for (const k of kinder) { const { status, d } = await post('/live/beitreten', { raum: code, kennung: k }); pruef(status === 200, d.error || 'HTTP ' + status); }
    });
    await lauf('Antwort vor dem Start wird abgelehnt (409)', async () => {
      const { status } = await post('/live/antwort', { raum: code, kennung: kinder[0], frage: 0, runde: 1, antwort: 1 });
      pruef(status === 409, 'HTTP ' + status);
    });
    await lauf('Lehrkraft startet die Frage', async () => {
      const { status, d } = await post('/live/raum/' + code + '/phase', { aktion: 'start' }, token);
      pruef(status === 200 && d.phase === 'sammeln' && d.teilnehmer === 3, d.error || JSON.stringify(d));
    });
    await lauf('Kind sieht die Frage, aber keine Lösung', async () => {
      const { status, d } = await get('/live/raum/' + code + '?k=' + kinder[0]);
      pruef(status === 200 && d.frage && d.frage.richtig === undefined && !d.loesung, JSON.stringify(d));
    });
    await lauf('Drei Antworten senden', async () => {
      for (const [i, k] of kinder.entries()) { const { status, d } = await post('/live/antwort', { raum: code, kennung: k, frage: 0, runde: 1, antwort: i ? 1 : 0 }); pruef(status === 200, d.error || 'HTTP ' + status); }
    });
    await lauf('Zweite Antwort desselben Kindes wird abgelehnt', async () => {
      const { status, d } = await post('/live/antwort', { raum: code, kennung: kinder[1], frage: 0, runde: 1, antwort: 0 });
      pruef(status === 409 && d.schon, 'HTTP ' + status);
    });
    await lauf('Stand lesen: 3 von 3 beantwortet', async () => {
      const { status, d } = await get('/live/raum/' + code + '/stand', token);
      pruef(status === 200 && d.beantwortet === 3, d.error || JSON.stringify(d));
    });
    await lauf('Aufdecken – Kind bekommt Lösung und Ergebnis', async () => {
      await post('/live/raum/' + code + '/phase', { aktion: 'aufdecken' }, token);
      const { d } = await get('/live/raum/' + code + '?k=' + kinder[1]);
      pruef(d.loesung && d.loesung.richtig === 1 && d.meine && d.meine.r === 1, JSON.stringify(d));
    });
  } finally {
    if (code) {
      await lauf('Raum beenden', async () => {
        const { status, d } = await post('/live/raum/' + code + '/ende', {}, token);
        pruef(status === 200 && d.ok, d.error || 'HTTP ' + status);
      });
      await lauf('Raum und Antworten sind gelöscht', async () => {
        const { status } = await get('/live/raum/' + code + '?k=' + kinder[0]);
        pruef(status === 404, 'HTTP ' + status);
        const { d } = await post('/live/raeume', {}, token);
        pruef(!(d.raeume || []).some(r => r.code === code), 'Raum steht noch in der Liste');
      });
    }
    fazit.textContent = fehler ? `${fehler} Schritt(e) fehlgeschlagen` : 'Alles in Ordnung – die Live-Abfrage ist einsatzbereit.';
    fazit.className = fehler ? 'err' : 'ok';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
