<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Länder-Finder – Lernwelt</title>
  <!--
  ═══════════════════════════════════════════════
   LERNWELT – Länder-Finder (GPG)
   Länder Europas bzw. Bundesländer auf der Karte finden.

   Modi (Auswahl in der App):
     Europa Start  – 15 aus 24 bekannten Ländern
     Europa Profi  – 15 aus allen 39 Ländern
     Deutschland     – alle 16 Bundesländer; Fehler kommen am Ende wieder

   Kartendaten: Natural Earth (gemeinfrei, naturalearthdata.com),
   vereinfacht und direkt eingebettet → läuft offline, keine externen Dienste.
   Länderlisten anpassen: siehe MODI unten im Skript.
  ═══════════════════════════════════════════════
  -->
  <link rel="stylesheet" href="../../gemeinsam/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f0e1a;
      --surface: #1b1929;
      --accent:  #e6a817;
      --accent2: #fde68a;
      --indigo:  #6366f1;
      --indigo2: #818cf8;
      --text:    #f1f0fb;
      --text2:   rgba(241,240,251,.65);
      --muted:   rgba(241,240,251,.38);
      --green:   #4ade80;
      --red:     #f87171;
      --r:       14px;

      /* Karte */
      --sea:     #121a3a;
      --sea2:    #1b2656;
      --land:    #4b4f70;
      --land-st: #141a3a;
      --ctx:     #272c47;
      --late:    #818cf8;
      --miss:    #7a3b50;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    button:focus-visible { outline: 3px solid var(--indigo2); outline-offset: 2px; }

    .screen { position: fixed; inset: 0; display: flex; flex-direction: column;
      padding: max(.9rem, env(safe-area-inset-top)) 1rem calc(4.4rem + env(safe-area-inset-bottom)); }
    .screen[hidden] { display: none; }

    /* ── Start ─────────────────────────────── */
    #start { overflow-y: auto; align-items: center; }
    .start-inner { width: 100%; max-width: 980px; margin: auto 0; padding: 1rem 0; }
    .start-head { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; margin-bottom: .35rem; }
    h1 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400;
      font-size: clamp(2rem, 5vw, 3rem); color: var(--accent); line-height: 1.05; }
    .start-sub { color: var(--text2); font-size: 1rem; margin-bottom: 1.6rem; max-width: 60ch; }
    .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    @media (max-width: 760px) { .modes { grid-template-columns: 1fr; } }
    .mode {
      display: flex; flex-direction: column; text-align: left;
      background: var(--surface); border-radius: 18px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.07);
      transition: transform .15s ease, border-color .15s ease;
    }
    .mode:hover, .mode:focus-visible { transform: translateY(-3px); border-color: rgba(230,168,23,.55); }
    .mode:active { transform: scale(.98); }
    .mode-map { position: relative; aspect-ratio: 1 / 1; background: radial-gradient(circle at 50% 40%, var(--sea2), var(--sea) 75%); }
    @media (max-width: 760px) { .mode { flex-direction: row; } .mode-map { width: 38%; flex-shrink: 0; } }
    .mode-map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .mode-map .land { fill: var(--land); stroke: var(--land-st); stroke-width: .6px; vector-effect: non-scaling-stroke; }
    .mode-map .land.pool { fill: var(--indigo2); }
    .mode-map .land.ctx { fill: var(--ctx); }
    .mode-map .grat { display: none; }
    .mode-txt { padding: .9rem 1rem 1.05rem; display: flex; flex-direction: column; gap: .25rem; justify-content: center; }
    .mode-name { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 1.35rem; color: var(--text); }
    .mode-desc { font-size: .88rem; color: var(--text2); line-height: 1.4; }
    .mode-best { font-size: .78rem; font-weight: 800; color: var(--accent); margin-top: .2rem; min-height: 1em; }

    /* ── Spiel ─────────────────────────────── */
    #game { gap: .6rem; }
    .topbar { display: flex; align-items: center; gap: .8rem; }
    .quit { font-weight: 800; font-size: .85rem; color: var(--text2); padding: .45rem .8rem;
      border-radius: 99px; background: rgba(255,255,255,.06); flex-shrink: 0; }
    .quit:hover { color: var(--text); }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; justify-content: center; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.12); transition: background .25s; }
    .dot.now  { box-shadow: 0 0 0 2px var(--indigo2); }
    .dot.ok   { background: var(--accent); }
    .dot.late { background: var(--late); }
    .dot.bad  { background: var(--red); }
    .count { font-weight: 800; font-size: .9rem; color: var(--text2); flex-shrink: 0; min-width: 4.5rem; text-align: right; }

    .prompt { display: flex; align-items: baseline; justify-content: center; gap: .6rem; flex-wrap: wrap; text-align: center; min-height: 3.1rem; }
    .prompt-q { font-size: 1.05rem; color: var(--text2); font-weight: 700; }
    .prompt-name { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(1.7rem, 4.5vw, 2.5rem);
      color: var(--accent2); line-height: 1.1; }
    .prompt-name.in { animation: nameIn .35s cubic-bezier(.2,.9,.3,1.25); }
    @keyframes nameIn { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }

    #map-wrap {
      position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, var(--sea2), var(--sea) 70%);
      box-shadow: inset 0 0 0 1px rgba(129,140,248,.14);
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    #map { width: 100%; height: 100%; display: block; }
    .grat { fill: none; stroke: rgba(129,140,248,.13); stroke-width: 1px; vector-effect: non-scaling-stroke; pointer-events: none; }
    .land {
      fill: var(--land); stroke: var(--land-st); stroke-width: .9px; vector-effect: non-scaling-stroke;
      stroke-linejoin: round; transition: fill .3s ease;
      transform-box: fill-box; transform-origin: center;
    }
    .land.ctx { fill: var(--ctx); }
    .land.ok   { fill: var(--accent); }
    .land.late { fill: var(--late); }
    .land.miss { fill: var(--miss); }
    .land.pop  { animation: pop .45s cubic-bezier(.2,.9,.3,1.4); }
    .land.bad  { fill: var(--red) !important; transition: none; }
    .land.reveal { animation: reveal 1.5s ease-in-out; }
    .hit { fill: transparent; pointer-events: all; }
    @keyframes pop { 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
    @keyframes reveal {
      0%   { fill: var(--land); }
      25%  { fill: #fff6d6; filter: drop-shadow(0 0 6px rgba(253,230,138,.9)); }
      55%  { fill: var(--accent); filter: drop-shadow(0 0 10px rgba(230,168,23,.9)); }
      100% { fill: var(--land); filter: none; }
    }

    .tip {
      position: absolute; z-index: 5; pointer-events: none;
      background: var(--surface); color: var(--text); font-weight: 800; font-size: .95rem;
      padding: .45rem .8rem; border-radius: 12px; white-space: nowrap;
      border: 1px solid rgba(248,113,113,.55); box-shadow: 0 8px 24px rgba(0,0,0,.45);
      transform: translate(-50%, calc(-100% - 14px)); opacity: 0; transition: opacity .15s;
    }
    .tip.show { opacity: 1; }
    .tip::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
      border: 7px solid transparent; border-bottom: 0; border-top-color: rgba(248,113,113,.55); }
    .tip b { color: var(--red); font-weight: 900; }

    .zoom { position: absolute; top: .7rem; right: .7rem; z-index: 4; display: flex; flex-direction: column; gap: .4rem; }
    .zoom button { width: 44px; height: 44px; border-radius: 12px; background: rgba(27,25,41,.85);
      border: 1px solid rgba(255,255,255,.1); font-size: 1.35rem; font-weight: 900; line-height: 1;
      display: grid; place-items: center; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .zoom button:active { transform: scale(.94); }
    .zoom .z-reset { font-size: 1rem; }
    .hint { position: absolute; left: .8rem; bottom: .7rem; z-index: 3; font-size: .78rem; color: var(--muted);
      pointer-events: none; transition: opacity .6s; }

    /* ── Ergebnis ──────────────────────────── */
    .result {
      position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(420px, calc(100% - 2rem)); max-height: calc(100% - 2rem); overflow-y: auto;
      background: rgba(27,25,41,.96); border: 1px solid rgba(230,168,23,.35); border-radius: 20px;
      padding: 1.4rem 1.4rem 1.2rem; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.55);
      animation: nameIn .4s cubic-bezier(.2,.9,.3,1.2);
    }
    .result[hidden] { display: none; }
    .res-score { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 3.2rem; color: var(--accent); line-height: 1; }
    .res-score small { font-size: 1.6rem; color: var(--text2); }
    .res-msg { font-weight: 800; font-size: 1.05rem; margin: .45rem 0 .2rem; }
    .res-sub { color: var(--text2); font-size: .88rem; }
    .res-missed { margin-top: .9rem; text-align: left; background: rgba(255,255,255,.04); border-radius: 12px; padding: .7rem .85rem; }
    .res-missed h3 { font-size: .85rem; color: var(--text2); font-weight: 800; margin-bottom: .35rem; }
    .res-missed ul { list-style: none; display: flex; flex-wrap: wrap; gap: .35rem; }
    .res-missed li { font-size: .85rem; font-weight: 700; padding: .2rem .6rem; border-radius: 99px;
      background: rgba(122,59,80,.5); border: 1px solid rgba(248,113,113,.3); }
    .res-btns { display: flex; gap: .6rem; margin-top: 1.1rem; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 8rem; padding: .8rem 1rem; border-radius: 14px; font-weight: 900; font-size: 1rem; }
    .btn.primary { background: var(--accent); color: #231a02; }
    .btn.ghost { background: rgba(255,255,255,.07); }
    .btn.link { flex-basis: 100%; padding: .4rem; font-size: .85rem; color: var(--indigo2); font-weight: 800; }
    .show-result { position: absolute; z-index: 6; left: 50%; bottom: .8rem; transform: translateX(-50%);
      background: var(--accent); color: #231a02; font-weight: 900; padding: .65rem 1.2rem; border-radius: 99px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    .show-result[hidden] { display: none; }

    @media (max-height: 560px) { .prompt-name { font-size: 1.6rem; } .prompt { min-height: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .land, .dot { transition: none; }
      .land.pop, .prompt-name.in, .result { animation: none; }
      .land.reveal { animation: none; fill: var(--accent); }
    }
  </style>
</head>
<body>

<!-- ── Start ───────────────────────────────────── -->
<section id="start" class="screen">
  <div class="start-inner">
    <div class="start-head"><h1>🗺️ Länder-Finder</h1></div>
    <p class="start-sub">Ein Name erscheint – tippe auf der Karte an, wo das Land liegt. Mit zwei Fingern kannst du die Karte größer ziehen.</p>
    <div class="modes" id="modes"></div>
  </div>
</section>

<!-- ── Spiel ───────────────────────────────────── -->
<section id="game" class="screen" hidden>
  <div class="topbar">
    <button class="quit" id="quit" type="button">✕ Beenden</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="prompt" aria-live="polite">
    <span class="prompt-q" id="prompt-q">Wo liegt</span>
    <span class="prompt-name" id="prompt-name"></span>
  </div>
  <div id="map-wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Karte"></svg>
    <div class="zoom">
      <button type="button" id="z-in" aria-label="Größer">+</button>
      <button type="button" id="z-out" aria-label="Kleiner">−</button>
      <button type="button" id="z-reset" class="z-reset" aria-label="Ganze Karte">⤢</button>
    </div>
    <div class="tip" id="tip"></div>
    <div class="hint" id="hint">Zwei Finger: vergrößern · ein Finger: verschieben</div>
    <div class="result" id="result" hidden></div>
    <button class="show-result" id="show-result" type="button" hidden>Ergebnis zeigen</button>
  </div>
</section>

<script src="../../gemeinsam/navbar.js"></script>
<script src="../../gemeinsam/karten-ansicht.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   KARTENDATEN in daten/karten.json (Natural Earth, gemeinfrei; vorbereitet & vereinfacht)
   Format: { w, h, v: Kernausschnitt [x,y,w,h], g: Gradnetz, f: [{ id, n: Name, d: Pfad, c?: Kontext, h?: [[x,y,r],…] Tipphilfe }] }
   ═══════════════════════════════════════════════════════ */
let MAPS = null;   // wird aus ../../daten/karten.json geladen (gemeinsam mit der Entdecker-Expedition)

/* ═══════════════════════════════════════════════════════
   MODI – hier Länderlisten anpassen (IDs = ISO-Codes aus den Kartendaten)
   ═══════════════════════════════════════════════════════ */
const EUROPA_START = ['DEU','FRA','ITA','ESP','PRT','GBR','IRL','NLD','BEL','CHE','AUT','POL',
                      'CZE','DNK','NOR','SWE','FIN','GRC','HUN','ROU','UKR','RUS','ISL','HRV'];
const EUROPA_PROFI = EUROPA_START.concat(['ALB','BGR','BIH','BLR','CYP','EST','LTU','LUX','LVA',
                      'MDA','MKD','MNE','SRB','SVK','SVN']);
let BUNDESLAENDER = [];   // nach dem Laden aus den Kartendaten

const MODI = {
  'europa-start': { name: 'Europa Start', karte: 'europa', pool: EUROPA_START, anzahl: 15, wiederholen: false,
                    desc: '15 Länder – die bekanntesten Länder Europas.' },
  'europa-profi': { name: 'Europa Profi', karte: 'europa', pool: EUROPA_PROFI, anzahl: 15, wiederholen: false,
                    desc: '15 Länder aus ganz Europa – auch die kleinen.' },
  'deutschland':  { name: 'Deutschland', karte: 'deutschland', pool: [], anzahl: 16, wiederholen: true,
                    desc: 'Alle 16 Bundesländer. Was nicht klappt, kommt am Ende noch einmal.' },
};
const WAIT_OK = 650, WAIT_BAD = 1800;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ═══════════════════════════════════════════════════════
   SVG bauen
   ═══════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function nameOf(karte, id) { const f = MAPS[karte].f.find(x => x.id === id); return f ? f.n : ''; }

function mapMarkup(karte, pool) {
  const M = MAPS[karte], inPool = new Set(pool || []);
  let s = `<path class="grat" d="${M.g}"/><g class="lands">`;
  M.f.forEach(f => {
    const cls = 'land' + (f.c ? ' ctx' : '') + (inPool.has(f.id) ? ' pool' : '');
    s += `<path class="${cls}" data-id="${f.id}" d="${f.d}"/>`;
  });
  s += '</g><g class="hits">';
  M.f.forEach(f => (f.h || []).forEach(h => { s += `<circle class="hit" data-id="${f.id}" cx="${h[0]}" cy="${h[1]}" r="${h[2]}"/>`; }));
  return s + '</g>';
}

/* ═══════════════════════════════════════════════════════
   STARTSEITE
   ═══════════════════════════════════════════════════════ */
function bestFor(modus) {
  try { const b = JSON.parse(localStorage.getItem('laender-finder-best') || '{}')[modus]; return b || null; }
  catch (e) { return null; }
}
function saveBest(modus, score, max) {
  try {
    const all = JSON.parse(localStorage.getItem('laender-finder-best') || '{}');
    const prev = all[modus];
    if (!prev || score / max > prev.s / prev.m) all[modus] = { s: score, m: max };
    localStorage.setItem('laender-finder-best', JSON.stringify(all));
  } catch (e) {}
}
function buildStart() {
  const box = $('modes');
  box.innerHTML = '';
  Object.entries(MODI).forEach(([key, m]) => {
    const M = MAPS[m.karte];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mode';
    const best = bestFor(key);
    const [vx, vy, vw, vh] = M.v, sq = Math.max(vw, vh) * 1.04;
    b.innerHTML = `<div class="mode-map"><svg viewBox="${vx + vw / 2 - sq / 2} ${vy + vh / 2 - sq / 2} ${sq} ${sq}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${mapMarkup(m.karte, m.pool)}</svg></div>
      <div class="mode-txt"><span class="mode-name"></span><span class="mode-desc"></span>
      <span class="mode-best">${best ? `Bestes Ergebnis: ${best.s} / ${best.m}` : ''}</span></div>`;
    b.querySelector('.mode-name').textContent = m.name;
    b.querySelector('.mode-desc').textContent = m.desc;
    b.addEventListener('click', () => startGame(key));
    box.appendChild(b);
  });
}

/* ═══════════════════════════════════════════════════════
   SPIEL
   ═══════════════════════════════════════════════════════ */
const G = { modus: null, m: null, queue: [], cur: null, score: 0, max: 0, fehler: 0,
            daneben: new Set(), verpasst: [], dots: [], frage: 0, locked: true, timer: 0 };

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startGame(modus) {
  const m = MODI[modus];
  clearTimeout(G.timer);
  Object.assign(G, { modus, m, score: 0, fehler: 0, daneben: new Set(), verpasst: [], frage: 0, locked: false });
  G.queue = shuffle(m.pool.slice()).slice(0, m.anzahl);
  G.max = G.queue.length;
  G.dots = G.queue.map(() => '');

  $('start').hidden = true;
  $('game').hidden = false;
  $('result').hidden = true;
  $('show-result').hidden = true;
  $('map').innerHTML = mapMarkup(m.karte);
  View.init(MAPS[m.karte]);
  next();
}

function pathOf(id) { return $('map').querySelector(`.land[data-id="${id}"]`); }

function renderDots() {
  const box = $('dots');
  box.innerHTML = G.dots.map((d, i) => `<span class="dot ${d}${!d && i === G.frage && !G.m.wiederholen && !G.locked ? ' now' : ''}"></span>`).join('');
  $('count').textContent = G.m.wiederholen
    ? `${G.dots.filter(Boolean).length} / ${G.max}`
    : `${Math.min(G.frage + (G.locked ? 0 : 1), G.max)} / ${G.max}`;
}

function next() {
  if (!G.queue.length) return finish();
  G.cur = G.queue.shift();
  G.locked = false;
  const el = $('prompt-name');
  el.textContent = nameOf(G.m.karte, G.cur);
  el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');
  renderDots();
}

function handleTap(id, cx, cy) {
  if (G.locked || !G.cur || !id) return;      // Meer oder gesperrt → nichts passiert
  G.locked = true;
  const target = pathOf(G.cur);

  if (id === G.cur) {
    const ersterVersuch = !G.daneben.has(G.cur);
    if (ersterVersuch) G.score++;
    target.classList.remove('miss');
    target.classList.add(ersterVersuch ? 'ok' : 'late', 'pop');
    target.addEventListener('animationend', () => target.classList.remove('pop'), { once: true });
    markDot(ersterVersuch ? 'ok' : 'late');
    G.timer = setTimeout(next, WAIT_OK);
    return;
  }

  // Daneben
  G.fehler++;
  const tapped = pathOf(id);
  if (tapped) { tapped.classList.add('bad'); setTimeout(() => tapped.classList.remove('bad'), 1100); }
  showTip(nameOf(G.m.karte, id), cx, cy);
  target.classList.remove('reveal'); void target.getBoundingClientRect(); target.classList.add('reveal');
  setTimeout(() => {
    target.classList.remove('reveal');
    if (!G.m.wiederholen) target.classList.add('miss');
  }, 1500);

  if (G.m.wiederholen) {
    G.daneben.add(G.cur);
    G.queue.push(G.cur);                       // kommt am Ende noch einmal
  } else {
    G.verpasst.push(G.cur);
    markDot('bad');
  }
  G.timer = setTimeout(next, WAIT_BAD);
}

function markDot(kind) {
  if (G.m.wiederholen) { const i = G.dots.indexOf(''); if (i >= 0) G.dots[i] = kind; }
  else { G.dots[G.frage] = kind; G.frage++; }
  renderDots();
}

let tipT = 0;
function showTip(name, cx, cy) {
  const tip = $('tip'), r = $('map-wrap').getBoundingClientRect();
  tip.innerHTML = '';
  tip.append('Das ist ');
  const b = document.createElement('b'); b.textContent = name; tip.append(b);
  let x = cx - r.left, y = cy - r.top;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  tip.classList.add('show');
  const tr = tip.getBoundingClientRect();              // im Kartenrahmen halten
  if (tr.left < r.left + 6) x += r.left + 6 - tr.left;
  if (tr.right > r.right - 6) x -= tr.right - (r.right - 6);
  if (tr.top < r.top + 6) y += tr.height + 28;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  clearTimeout(tipT);
  tipT = setTimeout(() => tip.classList.remove('show'), 1600);
}

function finish() {
  G.locked = true; G.cur = null;
  $('hint').style.opacity = 0;
  $('prompt-q').textContent = '';
  $('prompt-name').textContent = G.m.name;
  renderDots();
  const { score, max } = G;
  const pct = Math.round(score / max * 100);
  const msg = pct === 100 ? 'Perfekt – alles beim ersten Versuch!'
            : pct >= 80 ? 'Super, du kennst dich richtig gut aus!'
            : pct >= 50 ? 'Gut gemacht – weiter so!'
            : 'Dranbleiben – beim nächsten Mal klappt mehr!';
  const sub = G.m.wiederholen
    ? `Alle ${max} Bundesländer zugeordnet – ${score} davon beim ersten Versuch.`
    : `${score} von ${max} Ländern beim ersten Tippen gefunden.`;
  const liste = G.m.wiederholen ? [...G.daneben] : G.verpasst;

  const box = $('result');
  box.innerHTML = `
    <div class="res-score">${score}<small> / ${max}</small></div>
    <div class="res-msg"></div>
    <div class="res-sub"></div>
    ${liste.length ? `<div class="res-missed"><h3>${G.m.wiederholen ? 'Das hat erst beim zweiten Mal geklappt:' : 'Diese Länder übst du am besten noch einmal:'}</h3><ul></ul></div>` : ''}
    <div class="res-btns">
      <button type="button" class="btn primary" id="again">🔄 Nochmal</button>
      <button type="button" class="btn ghost" id="other">Andere Karte</button>
      <button type="button" class="btn link" id="look">Karte ansehen</button>
    </div>`;
  box.querySelector('.res-msg').textContent = msg;
  box.querySelector('.res-sub').textContent = sub;
  const ul = box.querySelector('ul');
  if (ul) liste.forEach(id => { const li = document.createElement('li'); li.textContent = nameOf(G.m.karte, id); ul.appendChild(li); });
  box.querySelector('#again').onclick = () => startGame(G.modus);
  box.querySelector('#other').onclick = showStart;
  box.querySelector('#look').onclick = () => { box.hidden = true; $('show-result').hidden = false; };
  box.hidden = false;

  saveBest(G.modus, score, max);
  try {
    if (window.LernApps) LernApps.saveResult({
      score, max, label: `${score} / ${max} ${G.m.name}`,
      skill: G.modus === 'deutschland' ? 'bundeslaender' : 'europa-laender',
    });
  } catch (e) {}
}

function showStart() {
  clearTimeout(G.timer);
  G.locked = true;
  $('game').hidden = true;
  $('start').hidden = false;
  $('prompt-q').textContent = 'Wo liegt';
  buildStart();
}

$('quit').addEventListener('click', showStart);
$('show-result').addEventListener('click', () => { $('result').hidden = false; $('show-result').hidden = true; });

/* ═══════════════════════════════════════════════════════
   ZOOMEN & VERSCHIEBEN (Pinch, Ziehen, Mausrad, Knöpfe)
   ═══════════════════════════════════════════════════════ */
const View = LernKarte.ansicht({
  svg: $('map'), wrap: $('map-wrap'), maxZoom: 8,
  onTap: (id, x, y) => handleTap(id, x, y),
  onGeste: () => { $('hint').style.opacity = 0; },
});
const viewInit = View.init;
View.init = map => { $('hint').style.opacity = ''; viewInit(map); };
$('z-in').addEventListener('click', () => View.centerZoom(1.5));
$('z-out').addEventListener('click', () => View.centerZoom(1 / 1.5));
$('z-reset').addEventListener('click', () => View.reset());

LernKarte.laden('../../daten/karten.json').then(d => {
  MAPS = d;
  BUNDESLAENDER = MAPS.deutschland.f.filter(f => !f.c).map(f => f.id);
  MODI.deutschland.pool = BUNDESLAENDER;
  buildStart();
}).catch(() => {
  $('modes').innerHTML = '<p style="color:var(--red);font-weight:800">Die Karten konnten nicht geladen werden. Bitte einmal mit dem Internet verbinden und neu laden.</p>';
});
</script>
</body>
</html>
