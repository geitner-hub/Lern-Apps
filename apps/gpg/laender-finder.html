<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <script src="../../gemeinsam/umgebung.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Länder-Finder – Lernwelt</title>
  <!--
  ═══════════════════════════════════════════════
   LERNWELT – Länder-Finder (GPG)
   Bundesländer, Länder Europas und Länder der anderen Kontinente auf der Karte finden.

   Modi (Auswahl in der App):
     Deutschland        – alle 16 Bundesländer; Fehler kommen am Ende wieder
     Europa             – 15 aus 39 Ländern, die bekannten kommen öfter dran
                          (ersetzt „Europa Start“ und „Europa Profi“, deren Bestwerte zählen weiter)
     Asien und Ozeanien, Afrika, Amerika – je 15 Länder auf der Weltkarte (Equal Earth),
                          Umschalter „Flach / Globus“
     Kontinente und Ozeane – 7 Kontinente und 5 Ozeane auf dem Globus (Klasse 5)
     Welt               – 15 Länder aus allen Kontinenten auf dem Globus; nach einem Fehler dreht er sich hin

   Kartendaten: Natural Earth (gemeinfrei, naturalearthdata.com), vereinfacht → läuft offline,
   keine externen Dienste. Europa/Deutschland: daten/karten.json. Weltkarte: daten/welt.json,
   Projektion Equal Earth über gemeinsam/welt-karte.js (d3-geo, lokal in vendor/).
   Globus: gemeinsam/globus.js (SVG, orthografisch, kein WebGL), Ozeane aus daten/ozeane.json.
   Länderlisten: Europa unten im Skript (MODI), Kontinente in daten/welt.json (modi → liste).
  ═══════════════════════════════════════════════
  -->
  <link rel="stylesheet" href="../../gemeinsam/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f0e1a;
      --surface: #1b1929;
      --accent:  #e6a817;
      --accent2: #fde68a;
      --indigo:  #6366f1;
      --indigo2: #818cf8;
      --text:    #f1f0fb;
      --text2:   rgba(241,240,251,.65);
      --muted:   rgba(241,240,251,.38);
      --green:   #4ade80;
      --red:     #f87171;
      --r:       14px;

      /* Karte */
      --sea:     #121a3a;
      --sea2:    #1b2656;
      --land:    #4b4f70;
      --land-st: #141a3a;
      --ctx:     #272c47;
      --late:    #818cf8;
      --miss:    #7a3b50;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    button:focus-visible { outline: 3px solid var(--indigo2); outline-offset: 2px; }

    .screen { position: fixed; inset: 0; display: flex; flex-direction: column;
      padding: max(.9rem, env(safe-area-inset-top)) 1rem calc(4.4rem + env(safe-area-inset-bottom)); }
    .screen[hidden] { display: none; }

    /* ── Start ─────────────────────────────── */
    #start { overflow-y: auto; align-items: center; }
    .start-inner { width: 100%; max-width: 980px; margin: auto 0; padding: 1rem 0; }
    .start-head { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; margin-bottom: .35rem; }
    h1 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400;
      font-size: clamp(2rem, 5vw, 3rem); color: var(--accent); line-height: 1.05; }
    .start-sub { color: var(--text2); font-size: 1rem; margin-bottom: 1.6rem; max-width: 60ch; }
    .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    @media (max-width: 760px) { .modes { grid-template-columns: 1fr; } }
    .mode {
      display: flex; flex-direction: column; text-align: left;
      background: var(--surface); border-radius: 18px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.07);
      transition: transform .15s ease, border-color .15s ease;
    }
    .mode:hover, .mode:focus-visible { transform: translateY(-3px); border-color: rgba(230,168,23,.55); }
    .mode:active { transform: scale(.98); }
    .mode-map { position: relative; aspect-ratio: 1 / 1; background: radial-gradient(circle at 50% 40%, var(--sea2), var(--sea) 75%); }
    @media (max-width: 760px) { .mode { flex-direction: row; } .mode-map { width: 38%; flex-shrink: 0; } }
    .mode-map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .mode-map .land { fill: var(--land); stroke: var(--land-st); stroke-width: .6px; vector-effect: non-scaling-stroke; }
    .mode-map .land.pool { fill: var(--indigo2); }
    .mode-map .land.ctx { fill: var(--ctx); }
    .mode-map .kugel { fill: rgba(129,140,248,.08); }
    .mode-laedt { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 800; font-size: .85rem; }
    .mode-map .grat { display: none; }
    .mode-txt { padding: .9rem 1rem 1.05rem; display: flex; flex-direction: column; gap: .25rem; justify-content: center; }
    .mode-name { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 1.35rem; color: var(--text); }
    .mode-desc { font-size: .88rem; color: var(--text2); line-height: 1.4; }
    .mode-best { font-size: .78rem; font-weight: 800; color: var(--accent); margin-top: .2rem; min-height: 1em; }

    /* ── Spiel ─────────────────────────────── */
    #game { gap: .6rem; }
    .topbar { display: flex; align-items: center; gap: .8rem; }
    .quit { font-weight: 800; font-size: .85rem; color: var(--text2); padding: .45rem .8rem;
      border-radius: 99px; background: rgba(255,255,255,.06); flex-shrink: 0; }
    .quit:hover { color: var(--text); }
    .dots { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; justify-content: center; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.12); transition: background .25s; }
    .dot.now  { box-shadow: 0 0 0 2px var(--indigo2); }
    .dot.ok   { background: var(--accent); }
    .dot.late { background: var(--late); }
    .dot.bad  { background: var(--red); }
    .count { font-weight: 800; font-size: .9rem; color: var(--text2); flex-shrink: 0; min-width: 4.5rem; text-align: right; }

    .prompt { display: flex; align-items: baseline; justify-content: center; gap: .6rem; flex-wrap: wrap; text-align: center; min-height: 3.1rem; }
    .prompt-q { font-size: 1.05rem; color: var(--text2); font-weight: 700; }
    .prompt-name { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(1.7rem, 4.5vw, 2.5rem);
      color: var(--accent2); line-height: 1.1; }
    .prompt-name.in { animation: nameIn .35s cubic-bezier(.2,.9,.3,1.25); }
    @keyframes nameIn { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }

    #map-wrap {
      position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, var(--sea2), var(--sea) 70%);
      box-shadow: inset 0 0 0 1px rgba(129,140,248,.14);
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    #map, #globus { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #map[hidden], #globus[hidden] { display: none; }
    #globus .kugel { fill: var(--sea2); stroke: none; }
    .kugel-rand { fill: none; stroke: rgba(129,140,248,.45); stroke-width: 1.5px; pointer-events: none; }
    .grat.grat-haupt { stroke: rgba(230,168,23,.55); stroke-width: 1.6px; }
    .land.meer { fill: transparent; stroke: none; }
    .land.meer.ok, .land.meer.late, .land.meer.miss { fill-opacity: .55; }
    .land.kont { stroke: var(--land); stroke-width: .8px; }   /* Ländergrenzen verschwinden, Kontinent wirkt als eine Fläche */
    .land.kont.ok { stroke: var(--accent); } .land.kont.late { stroke: var(--late); } .land.kont.miss { stroke: var(--miss); }
    .mode-map .land.meer { fill: transparent; }
    .mode-map .land.kont { stroke: var(--indigo2); stroke-width: 1px; }
    .zoom .z-an { background: rgba(99,102,241,.55); }
    .zoom button[hidden] { display: none; }
    .kugel { fill: rgba(129,140,248,.07); stroke: rgba(129,140,248,.25); stroke-width: 1px; vector-effect: non-scaling-stroke; }
    .grat { fill: none; stroke: rgba(129,140,248,.13); stroke-width: 1px; vector-effect: non-scaling-stroke; pointer-events: none; }
    .land {
      fill: var(--land); stroke: var(--land-st); stroke-width: .9px; vector-effect: non-scaling-stroke;
      stroke-linejoin: round; transition: fill .3s ease;
      transform-box: fill-box; transform-origin: center;
    }
    .land.ctx { fill: var(--ctx); }
    .land.ok   { fill: var(--accent); }
    .land.late { fill: var(--late); }
    .land.miss { fill: var(--miss); }
    .land.pop  { animation: pop .45s cubic-bezier(.2,.9,.3,1.4); }
    .land.bad  { fill: var(--red) !important; transition: none; }
    .land.reveal { animation: reveal 1.5s ease-in-out; }
    .hit { fill: transparent; pointer-events: all; }
    @keyframes pop { 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
    @keyframes reveal {
      0%   { fill: var(--land); }
      25%  { fill: #fff6d6; filter: drop-shadow(0 0 6px rgba(253,230,138,.9)); }
      55%  { fill: var(--accent); filter: drop-shadow(0 0 10px rgba(230,168,23,.9)); }
      100% { fill: var(--land); filter: none; }
    }

    .tip {
      position: absolute; z-index: 5; pointer-events: none;
      background: var(--surface); color: var(--text); font-weight: 800; font-size: .95rem;
      padding: .45rem .8rem; border-radius: 12px; white-space: nowrap;
      border: 1px solid rgba(248,113,113,.55); box-shadow: 0 8px 24px rgba(0,0,0,.45);
      transform: translate(-50%, calc(-100% - 14px)); opacity: 0; transition: opacity .15s;
    }
    .tip.show { opacity: 1; }
    .tip::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
      border: 7px solid transparent; border-bottom: 0; border-top-color: rgba(248,113,113,.55); }
    .tip b { color: var(--red); font-weight: 900; }

    .zoom { position: absolute; top: .7rem; right: .7rem; z-index: 4; display: flex; flex-direction: column; gap: .4rem; }
    .zoom button { width: 44px; height: 44px; border-radius: 12px; background: rgba(27,25,41,.85);
      border: 1px solid rgba(255,255,255,.1); font-size: 1.35rem; font-weight: 900; line-height: 1;
      display: grid; place-items: center; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .zoom button:active { transform: scale(.94); }
    .zoom .z-reset { font-size: 1rem; }
    .hint { position: absolute; left: .8rem; bottom: .7rem; z-index: 3; font-size: .78rem; color: var(--muted);
      pointer-events: none; transition: opacity .6s; }

    /* ── Ergebnis ──────────────────────────── */
    .result {
      position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(420px, calc(100% - 2rem)); max-height: calc(100% - 2rem); overflow-y: auto;
      background: rgba(27,25,41,.96); border: 1px solid rgba(230,168,23,.35); border-radius: 20px;
      padding: 1.4rem 1.4rem 1.2rem; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.55);
      animation: nameIn .4s cubic-bezier(.2,.9,.3,1.2);
    }
    .result[hidden] { display: none; }
    .res-score { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: 3.2rem; color: var(--accent); line-height: 1; }
    .res-score small { font-size: 1.6rem; color: var(--text2); }
    .res-msg { font-weight: 800; font-size: 1.05rem; margin: .45rem 0 .2rem; }
    .res-sub { color: var(--text2); font-size: .88rem; }
    .res-missed { margin-top: .9rem; text-align: left; background: rgba(255,255,255,.04); border-radius: 12px; padding: .7rem .85rem; }
    .res-missed h3 { font-size: .85rem; color: var(--text2); font-weight: 800; margin-bottom: .35rem; }
    .res-missed ul { list-style: none; display: flex; flex-wrap: wrap; gap: .35rem; }
    .res-missed li { font-size: .85rem; font-weight: 700; padding: .2rem .6rem; border-radius: 99px;
      background: rgba(122,59,80,.5); border: 1px solid rgba(248,113,113,.3); }
    .res-btns { display: flex; gap: .6rem; margin-top: 1.1rem; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 8rem; padding: .8rem 1rem; border-radius: 14px; font-weight: 900; font-size: 1rem; }
    .btn.primary { background: var(--accent); color: #231a02; }
    .btn.ghost { background: rgba(255,255,255,.07); }
    .btn.link { flex-basis: 100%; padding: .4rem; font-size: .85rem; color: var(--indigo2); font-weight: 800; }
    .show-result { position: absolute; z-index: 6; left: 50%; bottom: .8rem; transform: translateX(-50%);
      background: var(--accent); color: #231a02; font-weight: 900; padding: .65rem 1.2rem; border-radius: 99px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    .show-result[hidden] { display: none; }

    @media (max-height: 560px) { .prompt-name { font-size: 1.6rem; } .prompt { min-height: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .land, .dot { transition: none; }
      .land.pop, .prompt-name.in, .result { animation: none; }
      .land.reveal { animation: none; fill: var(--accent); }
    }
  </style>
</head>
<body>

<!-- ── Start ───────────────────────────────────── -->
<section id="start" class="screen">
  <div class="start-inner">
    <div class="start-head"><h1>🗺️ Länder-Finder</h1></div>
    <p class="start-sub">Ein Name erscheint – tippe auf der Karte an, wo das Land liegt. Mit zwei Fingern kannst du die Karte größer ziehen.</p>
    <div class="modes" id="modes"></div>
  </div>
</section>

<!-- ── Spiel ───────────────────────────────────── -->
<section id="game" class="screen" hidden>
  <div class="topbar">
    <button class="quit" id="quit" type="button">✕ Beenden</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="prompt" aria-live="polite">
    <span class="prompt-q" id="prompt-q">Wo liegt</span>
    <span class="prompt-name" id="prompt-name"></span>
  </div>
  <div id="map-wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Karte"></svg>
    <svg id="globus" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Globus" hidden></svg>
    <div class="zoom">
      <button type="button" id="z-in" aria-label="Größer">+</button>
      <button type="button" id="z-out" aria-label="Kleiner">−</button>
      <button type="button" id="z-reset" class="z-reset" aria-label="Ganze Karte">⤢</button>
      <button type="button" id="z-ansicht" aria-label="Globus zeigen" hidden>🌍</button>
      <button type="button" id="z-netz" class="z-an" aria-label="Gradnetz ein/aus" hidden>#</button>
    </div>
    <div class="tip" id="tip"></div>
    <div class="hint" id="hint">Zwei Finger: vergrößern · ein Finger: verschieben</div>
    <div class="result" id="result" hidden></div>
    <button class="show-result" id="show-result" type="button" hidden>Ergebnis zeigen</button>
  </div>
</section>

<script src="../../gemeinsam/navbar.js"></script>
<script src="../../gemeinsam/karten-ansicht.js"></script>
<script src="../../gemeinsam/welt-karte.js"></script>
<script src="../../gemeinsam/globus.js"></script>
<script src="../../gemeinsam/freigabe.js"></script>
<script src="../../gemeinsam/ueben.js"></script>   <!-- Etappe 9: Freigabe des Übungs-Rahmens (Modi = Stufen gpg.6.laender.*) -->
<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   KARTENDATEN in daten/karten.json (Natural Earth, gemeinfrei; vorbereitet & vereinfacht)
   Format: { w, h, v: Kernausschnitt [x,y,w,h], g: Gradnetz, f: [{ id, n: Name, d: Pfad, c?: Kontext, h?: [[x,y,r],…] Tipphilfe }] }
   ═══════════════════════════════════════════════════════ */
let MAPS = null;   // wird aus ../../daten/karten.json geladen (gemeinsam mit der Entdecker-Expedition);
                   // die Weltkarten der Kontinent-Modi kommen danach aus LernWelt (daten/welt.json) dazu
let WELT = null, WELT_FEHLER = false;

/* ═══════════════════════════════════════════════════════
   MODI – hier Länderlisten anpassen (IDs = ISO-Codes aus den Kartendaten)
   ═══════════════════════════════════════════════════════ */
const EUROPA_BEKANNT = ['DEU','FRA','ITA','ESP','PRT','GBR','IRL','NLD','BEL','CHE','AUT','POL',
                        'CZE','DNK','NOR','SWE','FIN','GRC','HUN','ROU','UKR','RUS','ISL','HRV'];
const EUROPA_ALLE = EUROPA_BEKANNT.concat(['ALB','BGR','BIH','BLR','CYP','EST','LTU','LUX','LVA',
                      'MDA','MKD','MNE','SRB','SVK','SVN']);
let BUNDESLAENDER = [];   // nach dem Laden aus den Kartendaten

// welt: true → Karte und Länderliste aus daten/welt.json (gleicher Schlüssel wie dort unter modi)
// globus: 'nur' → nur auf dem Globus, 'umschalten' → flache Karte mit Umschalter „Flach / Globus“
const MODI = {
  'kontinente-ozeane': { name: 'Kontinente und Ozeane', globus: 'nur', karte: 'kontinente', pool: [], anzahl: 12, wiederholen: true,
                    wort: 'Kontinente und Ozeane', mitte: [10, 20],
                    desc: 'Alle 7 Kontinente und 5 Ozeane auf dem Globus. Was nicht klappt, kommt am Ende noch einmal.' },
  'deutschland':  { name: 'Deutschland', karte: 'deutschland', pool: [], anzahl: 16, wiederholen: true,
                    desc: 'Alle 16 Bundesländer. Was nicht klappt, kommt am Ende noch einmal.' },
  'europa':       { name: 'Europa', karte: 'europa', pool: EUROPA_ALLE, bekannt: EUROPA_BEKANNT, anzahl: 15, wiederholen: false,
                    desc: '15 Länder aus ganz Europa – die bekannten kommen öfter dran.' },
  'asien-ozeanien': { name: 'Asien und Ozeanien', welt: true, globus: 'umschalten', mitte: [100, 15], karte: 'asien-ozeanien', pool: [], anzahl: 15, wiederholen: false,
                    desc: '15 Länder von der Türkei bis Neuseeland.' },
  'afrika':       { name: 'Afrika', welt: true, globus: 'umschalten', mitte: [18, 2], karte: 'afrika', pool: [], anzahl: 15, wiederholen: false,
                    desc: '15 Länder von Marokko bis Südafrika.' },
  'amerika':      { name: 'Amerika', welt: true, globus: 'umschalten', mitte: [-80, 10], karte: 'amerika', pool: [], anzahl: 15, wiederholen: false,
                    desc: '15 Länder aus Nord-, Mittel- und Südamerika.' },
  'welt':         { name: 'Welt', welt: true, globus: 'nur', mitte: [10, 30], karte: 'welt', pool: [], anzahl: 15, wiederholen: false,
                    desc: '15 Länder aus allen Kontinenten auf dem Globus. Nach einem Fehler dreht er sich zum Land.' },
};
const WAIT_OK = 650, WAIT_BAD = 1800;
// Anschluss an den Übungs-Rahmen (Etappe 9): Themen-ID je Modus → Freigabe, Ergebnis, Fehlerheft
const THEMA = { 'deutschland': 'gpg.6.laender.bundeslaender', 'europa': 'gpg.6.laender.europa',
                'asien-ozeanien': 'gpg.6.laender.asien-ozeanien', 'afrika': 'gpg.6.laender.afrika', 'amerika': 'gpg.6.laender.amerika',
                'welt': 'gpg.6.laender.welt', 'kontinente-ozeane': 'gpg.5.erde.kontinente-ozeane' };
const SKILL = { 'deutschland': 'bundeslaender', 'europa': 'europa-laender', 'kontinente-ozeane': 'kontinente-ozeane' };

// Kontinente und Ozeane (Globus): IDs, Namen, Blickrichtung nach einem Fehler
const KONTINENTE = { eu: ['Europa', [15, 50]], as: ['Asien', [90, 40]], af: ['Afrika', [20, 3]], na: ['Nordamerika', [-100, 45]],
                     sa: ['Südamerika', [-60, -15]], oz: ['Australien und Ozeanien', [140, -22]], an: ['Antarktis', [0, -80]] };
const OZEAN_MITTE = { at: [-30, 15], pa: [-150, 0], in: [80, -20], ar: [0, 80], so: [20, -65] };
// asiatischer Teil Russlands (östlich des Urals, ca. 60° O; dazu die Spitze jenseits von 180°)
function gradBox(w, s, o, n) {          // Rechteck entlang der Breitenkreise, im Uhrzeigersinn (d3-Regel)
  const r = [];
  for (let x = w; x <= o; x += 5) r.push([x, s]);
  for (let x = o; x >= w; x -= 5) r.push([x, n]);
  r.reverse(); r.push(r[0]);
  return [r];
}
const RUS_ASIEN = { type: 'MultiPolygon', coordinates: [gradBox(60, 30, 180, 85), gradBox(-180, 55, -160, 75)] };
const frei = modus => !window.LernUeben || LernUeben.Freigabe.erlaubt(THEMA[modus]);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ═══════════════════════════════════════════════════════
   SVG bauen
   ═══════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function nameKarte(karte, id) { const f = MAPS[karte].f.find(x => x.id === id); return f ? f.n : ''; }

function mapMarkup(karte, pool) { return LernKarte.markup(MAPS[karte], pool); }

/* ═══════════════════════════════════════════════════════
   STARTSEITE
   ═══════════════════════════════════════════════════════ */
function bestFor(modus) {
  try {
    const all = JSON.parse(localStorage.getItem('laender-finder-best') || '{}');
    if (all[modus]) return all[modus];
    if (modus !== 'europa') return null;
    // früher zwei Europa-Modi: der bessere Bestwert zählt weiter
    const alt = ['europa-start', 'europa-profi'].map(k => all[k]).filter(Boolean)
      .sort((a, b) => b.s / b.m - a.s / a.m);
    return alt[0] || null;
  }
  catch (e) { return null; }
}
function saveBest(modus, score, max) {
  try {
    const all = JSON.parse(localStorage.getItem('laender-finder-best') || '{}');
    const prev = all[modus] || bestFor(modus);
    if (!prev || score / max > prev.s / prev.m) all[modus] = { s: score, m: max };
    localStorage.setItem('laender-finder-best', JSON.stringify(all));
  } catch (e) {}
}
function buildStart() {
  const box = $('modes');
  box.innerHTML = '';
  Object.entries(MODI).forEach(([key, m]) => {
    const M = MAPS[m.karte];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mode';
    const best = bestFor(key);
    if (!M) {                                          // Weltkarte lädt noch (oder fehlt offline)
      b.disabled = true;
      b.innerHTML = `<div class="mode-map"><span class="mode-laedt">${WELT_FEHLER ? 'Weltkarte fehlt – bitte mit dem Internet verbinden' : 'Weltkarte lädt …'}</span></div>
        <div class="mode-txt"><span class="mode-name"></span><span class="mode-desc"></span><span class="mode-best"></span></div>`;
      b.querySelector('.mode-name').textContent = m.name;
      b.querySelector('.mode-desc').textContent = m.desc;
      box.appendChild(b);
      return;
    }
    let bildSvg;
    if (m.globus === 'nur') {
      const el = globusElemente(key, true);
      bildSvg = `<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${LernGlobus.bild(el, m.mitte, 200)}</svg>`;
    } else {
      const [vx, vy, vw, vh] = M.v, sq = Math.max(vw, vh) * 1.04;
      bildSvg = `<svg viewBox="${vx + vw / 2 - sq / 2} ${vy + vh / 2 - sq / 2} ${sq} ${sq}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${mapMarkup(m.karte, m.pool)}</svg>`;
    }
    b.innerHTML = `<div class="mode-map">${bildSvg}</div>
      <div class="mode-txt"><span class="mode-name"></span><span class="mode-desc"></span>
      <span class="mode-best">${best ? `Bestes Ergebnis: ${best.s} / ${best.m}` : ''}</span></div>`;
    b.querySelector('.mode-name').textContent = m.name;
    b.querySelector('.mode-desc').textContent = m.desc;
    if (!frei(key)) { b.disabled = true; b.style.opacity = '.45'; b.querySelector('.mode-name').textContent = '🔒 ' + m.name; box.appendChild(b); return; }
    b.addEventListener('click', () => startGame(key));
    box.appendChild(b);
  });
}

/* ═══════════════════════════════════════════════════════
   SPIEL
   ═══════════════════════════════════════════════════════ */
const G = { modus: null, m: null, queue: [], cur: null, score: 0, max: 0, fehler: 0,
            daneben: new Set(), verpasst: [], dots: [], frage: 0, locked: true, timer: 0, lupe: null, globus: false };
let GLOBUS_WAHL = false;   // „Flach / Globus“ in den Kontinent-Modi: zuletzt gewählte Ansicht
let OZEANE = null, Glob = null;

/** Elemente für den Globus (vorschau: vereinfacht, Liste hervorgehoben) */
function globusElemente(modus, vorschau) {
  const m = MODI[modus], M = MAPS[m.karte], geo = g => vorschau ? LernGlobus.vereinfacht(g, 6) : g;
  if (m.karte === 'kontinente') {
    const el = OZEANE.map(o => ({ id: 'oz-' + o.id, cls: 'land meer', geo: geo(o.geo) }));
    WELT.daten.laender.forEach(l => {
      if (!KONTINENTE[l.k]) return;
      el.push({ id: 'k-' + l.k, cls: 'land kont' + (vorschau ? ' pool' : ''), geo: geo(WELT.geo(l.id)) });
      if (l.id === 'RUS') el.push({ id: 'k-as', cls: 'land kont' + (vorschau ? ' pool' : ''), geo: geo(WELT.geo(l.id)), clip: RUS_ASIEN });
    });
    return el;
  }
  const pool = new Set(vorschau ? m.pool : []);
  return M.f.map(f => ({ id: f.id, cls: 'land' + (f.c ? ' ctx' : '') + (pool.has(f.id) ? ' pool' : ''), geo: geo(WELT.geo(f.id)) }));
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/** Länder einer Runde ziehen; „bekannt“ zählt doppelt (kommt öfter dran) */
function ziehe(m) {
  if (!m.bekannt) return shuffle(m.pool.slice()).slice(0, m.anzahl);
  const bek = new Set(m.bekannt), rest = m.pool.slice(), out = [];
  while (out.length < m.anzahl && rest.length) {
    const gew = rest.map(id => bek.has(id) ? 2 : 1);
    let r = Math.random() * gew.reduce((a, b) => a + b, 0), i = 0;
    while (i < rest.length - 1 && (r -= gew[i]) >= 0) i++;
    out.push(rest.splice(i, 1)[0]);
  }
  return out;
}

function startGame(modus) {
  if (!frei(modus)) return showStart();
  const m = MODI[modus];
  clearTimeout(G.timer);
  if (!MAPS[m.karte]) return showStart();
  Object.assign(G, { modus, m, score: 0, fehler: 0, daneben: new Set(), verpasst: [], frage: 0, locked: false, lupe: null,
                    globus: m.globus === 'nur' || (m.globus === 'umschalten' && GLOBUS_WAHL) });
  G.queue = ziehe(m);
  G.max = G.queue.length;
  G.dots = G.queue.map(() => '');

  $('start').hidden = true;
  $('game').hidden = false;
  $('result').hidden = true;
  $('show-result').hidden = true;
  $('map').innerHTML = m.globus === 'nur' ? '' : mapMarkup(m.karte);
  $('hint').style.opacity = '';
  zeigeAnsicht();
  if (m.globus !== 'nur') View.init(MAPS[m.karte]);
  if (m.globus) {
    if (!Glob) Glob = LernGlobus.ansicht({ svg: $('globus'), wrap: $('map-wrap'),
      onTap: (id, x, y) => handleTap(id, x, y), onGeste: () => { $('hint').style.opacity = 0; } });
    Glob.setze(globusElemente(modus));
    Glob.reset();
    Glob.dreheZu(m.mitte, 1);
  }
  next();
}

/** Flache Karte oder Globus zeigen, Knöpfe passend */
function zeigeAnsicht() {
  const m = G.m;
  $('map').toggleAttribute('hidden', G.globus);        // SVG kennt .hidden nicht → Attribut setzen
  $('globus').toggleAttribute('hidden', !G.globus);
  $('z-ansicht').hidden = m.globus !== 'umschalten';
  $('z-ansicht').textContent = G.globus ? '🗺️' : '🌍';
  $('z-ansicht').setAttribute('aria-label', G.globus ? 'Flache Karte zeigen' : 'Globus zeigen');
  $('z-netz').hidden = !G.globus;
  $('hint').textContent = G.globus ? 'Ein Finger: drehen · zwei Finger: vergrößern' : 'Zwei Finger: vergrößern · ein Finger: verschieben';
  if (G.globus && Glob) Glob.groesse();
}

/** Alle Flächen eines Ziels – auf der flachen Karte und dem Globus (Kontinente: mehrere Länder) */
function teile(id) { return [...document.querySelectorAll(`#map .land[data-id="${id}"], #globus .land[data-id="${id}"]`)]; }
function nameOf(karte, id) {
  if (karte === 'kontinente') return id.startsWith('oz-') ? (OZEANE.find(o => 'oz-' + o.id === id) || {}).n || '' : (KONTINENTE[id.slice(2)] || [''])[0];
  return nameKarte(karte, id);
}
/** Wohin der Globus nach einem Fehler dreht */
function zielMitte(id) {
  if (G.m.karte === 'kontinente') return id.startsWith('oz-') ? OZEAN_MITTE[id.slice(3)] : KONTINENTE[id.slice(2)][1];
  return WELT.zentrum(id);
}

function renderDots() {
  const box = $('dots');
  box.innerHTML = G.dots.map((d, i) => `<span class="dot ${d}${!d && i === G.frage && !G.m.wiederholen && !G.locked ? ' now' : ''}"></span>`).join('');
  $('count').textContent = G.m.wiederholen
    ? `${G.dots.filter(Boolean).length} / ${G.max}`
    : `${Math.min(G.frage + (G.locked ? 0 : 1), G.max)} / ${G.max}`;
}

function next() {
  if (!G.queue.length) return finish();
  G.cur = G.queue.shift();
  G.locked = false;
  const el = $('prompt-name');
  el.textContent = nameOf(G.m.karte, G.cur);
  el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');
  lupe();
  renderDots();
}

/** Kleine Länder (z. B. Mittelamerika): Karte zoomt auf den Ausschnitt, danach wieder zurück */
function lupe() {
  if (G.globus) return;
  const lupen = MAPS[G.m.karte].lupen || [];
  const lu = lupen.find(l => l.ids.includes(G.cur));
  if (lu) { if (G.lupe !== lu) { View.zeige(...lu.v); G.lupe = lu; } }
  else if (G.lupe) { View.reset(); G.lupe = null; }
}

function handleTap(id, cx, cy) {
  if (G.locked || !G.cur || !id) return;      // Meer oder gesperrt → nichts passiert
  G.locked = true;
  const ziel = teile(G.cur);

  if (id === G.cur) {
    const ersterVersuch = !G.daneben.has(G.cur);
    if (ersterVersuch) G.score++;
    ziel.forEach(target => {
      target.classList.remove('miss');
      target.classList.add(ersterVersuch ? 'ok' : 'late');
      if (G.m.karte === 'kontinente') return;          // große Flächen nicht hüpfen lassen
      target.classList.add('pop');
      target.addEventListener('animationend', () => target.classList.remove('pop'), { once: true });
    });
    markDot(ersterVersuch ? 'ok' : 'late');
    G.timer = setTimeout(next, WAIT_OK);
    return;
  }

  // Daneben
  G.fehler++;
  teile(id).forEach(t => { t.classList.add('bad'); setTimeout(() => t.classList.remove('bad'), 1100); });
  showTip(nameOf(G.m.karte, id), cx, cy);
  if (G.globus) Glob.dreheZu(zielMitte(G.cur));       // Globus dreht zum richtigen Ort
  ziel.forEach(target => { target.classList.remove('reveal'); void target.getBoundingClientRect(); target.classList.add('reveal'); });
  setTimeout(() => {
    ziel.forEach(target => {
      target.classList.remove('reveal');
      if (!G.m.wiederholen) target.classList.add('miss');
    });
  }, 1500);

  if (G.m.wiederholen) {
    G.daneben.add(G.cur);
    G.queue.push(G.cur);                       // kommt am Ende noch einmal
  } else {
    G.verpasst.push(G.cur);
    markDot('bad');
  }
  G.timer = setTimeout(next, WAIT_BAD);
}

function markDot(kind) {
  if (G.m.wiederholen) { const i = G.dots.indexOf(''); if (i >= 0) G.dots[i] = kind; }
  else { G.dots[G.frage] = kind; G.frage++; }
  renderDots();
}

let tipT = 0;
function showTip(name, cx, cy) {
  const tip = $('tip'), r = $('map-wrap').getBoundingClientRect();
  tip.innerHTML = '';
  tip.append('Das ist ');
  const b = document.createElement('b'); b.textContent = name; tip.append(b);
  let x = cx - r.left, y = cy - r.top;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  tip.classList.add('show');
  const tr = tip.getBoundingClientRect();              // im Kartenrahmen halten
  if (tr.left < r.left + 6) x += r.left + 6 - tr.left;
  if (tr.right > r.right - 6) x -= tr.right - (r.right - 6);
  if (tr.top < r.top + 6) y += tr.height + 28;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  clearTimeout(tipT);
  tipT = setTimeout(() => tip.classList.remove('show'), 1600);
}

function finish() {
  G.locked = true; G.cur = null;
  $('hint').style.opacity = 0;
  $('prompt-q').textContent = '';
  $('prompt-name').textContent = G.m.name;
  renderDots();
  const { score, max } = G;
  const pct = Math.round(score / max * 100);
  const msg = pct === 100 ? 'Perfekt – alles beim ersten Versuch!'
            : pct >= 80 ? 'Super, du kennst dich richtig gut aus!'
            : pct >= 50 ? 'Gut gemacht – weiter so!'
            : 'Dranbleiben – beim nächsten Mal klappt mehr!';
  const sub = G.m.wiederholen
    ? `Alle ${max} ${G.m.wort || 'Bundesländer'} zugeordnet – ${score} davon beim ersten Versuch.`
    : `${score} von ${max} Ländern beim ersten Tippen gefunden.`;
  const liste = G.m.wiederholen ? [...G.daneben] : G.verpasst;

  const box = $('result');
  box.innerHTML = `
    <div class="res-score">${score}<small> / ${max}</small></div>
    <div class="res-msg"></div>
    <div class="res-sub"></div>
    ${liste.length ? `<div class="res-missed"><h3>${G.m.wiederholen ? 'Das hat erst beim zweiten Mal geklappt:' : 'Diese Länder übst du am besten noch einmal:'}</h3><ul></ul></div>` : ''}
    <div class="res-btns">
      <button type="button" class="btn primary" id="again">🔄 Nochmal</button>
      <button type="button" class="btn ghost" id="other">Andere Karte</button>
      <button type="button" class="btn link" id="look">Karte ansehen</button>
    </div>`;
  box.querySelector('.res-msg').textContent = msg;
  box.querySelector('.res-sub').textContent = sub;
  const ul = box.querySelector('ul');
  if (ul) liste.forEach(id => { const li = document.createElement('li'); li.textContent = nameOf(G.m.karte, id); ul.appendChild(li); });
  box.querySelector('#again').onclick = () => startGame(G.modus);
  box.querySelector('#other').onclick = showStart;
  box.querySelector('#look').onclick = () => { box.hidden = true; $('show-result').hidden = false; };
  box.hidden = false;

  saveBest(G.modus, score, max);
  try {
    if (window.LernApps) LernApps.saveResult({
      score, max, label: `${score} / ${max} ${G.m.name}`,
      skill: SKILL[G.modus] || 'welt-laender',
      thema: THEMA[G.modus],
    });
  } catch (e) {}
}

// Freigaben frisch geholt → Modus-Auswahl neu zeichnen, wenn sie gerade zu sehen ist
window.addEventListener('lernfreigabe:neu', () => { if (!$('start').hidden) buildStart(); });

function showStart() {
  clearTimeout(G.timer);
  G.locked = true;
  $('game').hidden = true;
  $('start').hidden = false;
  $('prompt-q').textContent = 'Wo liegt';
  buildStart();
}

$('quit').addEventListener('click', showStart);
$('show-result').addEventListener('click', () => { $('result').hidden = false; $('show-result').hidden = true; });

/* ═══════════════════════════════════════════════════════
   ZOOMEN & VERSCHIEBEN (Pinch, Ziehen, Mausrad, Knöpfe)
   ═══════════════════════════════════════════════════════ */
const View = LernKarte.ansicht({
  svg: $('map'), wrap: $('map-wrap'), maxZoom: 8,
  onTap: (id, x, y) => handleTap(id, x, y),
  onGeste: () => { $('hint').style.opacity = 0; },
});
const viewInit = View.init;
View.init = map => { $('hint').style.opacity = ''; viewInit(map); };
$('z-in').addEventListener('click', () => G.globus ? Glob.zoomen(1.5) : View.centerZoom(1.5));
$('z-out').addEventListener('click', () => G.globus ? Glob.zoomen(1 / 1.5) : View.centerZoom(1 / 1.5));
$('z-reset').addEventListener('click', () => { if (G.globus) { Glob.reset(); Glob.dreheZu(G.m.mitte, 1); } else View.reset(); });
$('z-ansicht').addEventListener('click', () => {
  if (!G.m || G.m.globus !== 'umschalten') return;
  G.globus = GLOBUS_WAHL = !G.globus;
  if (G.globus) { G.lupe = null; Glob.dreheZu(G.m.mitte, 1); }
  zeigeAnsicht();
  if (!G.globus) { View.fit(); lupe(); }
});
$('z-netz').addEventListener('click', () => {
  const an = !$('z-netz').classList.contains('z-an');
  $('z-netz').classList.toggle('z-an', an);
  if (Glob) Glob.gradnetz(an);
});

LernKarte.laden('../../daten/karten.json').then(d => {
  MAPS = Object.assign({}, d);
  BUNDESLAENDER = MAPS.deutschland.f.filter(f => !f.c).map(f => f.id);
  MODI.deutschland.pool = BUNDESLAENDER;
  buildStart();
  // Weltkarte (Equal Earth) danach – Europa und Deutschland gehen auch ohne sie
  LernWelt.laden().then(w => {
    WELT = w;
    Object.entries(MODI).forEach(([key, m]) => {
      if (!m.welt) return;
      MAPS[m.karte] = w.karte(m.karte);
      m.pool = w.laender(m.karte);
    });
    if (!$('start').hidden) buildStart();
    // Ozeane für „Kontinente und Ozeane“ (klein, kommt gleich hinterher)
    return LernGlobus.ozeane().then(oz => {
      OZEANE = oz;
      MODI['kontinente-ozeane'].pool = Object.keys(KONTINENTE).map(k => 'k-' + k).concat(oz.map(o => 'oz-' + o.id));
      MAPS.kontinente = { f: [] };
    });
  }).catch(e => { console.error(e); WELT_FEHLER = true; })
    .then(() => { if (!$('start').hidden) buildStart(); });
}).catch(() => {
  $('modes').innerHTML = '<p style="color:var(--red);font-weight:800">Die Karten konnten nicht geladen werden. Bitte einmal mit dem Internet verbinden und neu laden.</p>';
});
</script>
