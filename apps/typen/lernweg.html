<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <script src="../../gemeinsam/umgebung.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Lernweg – Lernwelt</title>
  <!--
  ═══════════════════════════════════════════════
   LERNWELT – Lernweg (digitaler Laufzettel mit Stationen)
   apps/typen/lernweg.html?weg=<ID>  →  daten/lernwege/<ID>.json   (eine Seite für alle Lernwege, jedes Fach)

   KEINE normale App (nicht in config.json): Ein Lernweg ist nur offen, wenn er im Admin unter
   Tab „🗺️ Lernwege“ einer Gruppe/Klasse zugeteilt ist (config.freigaben[ID][wer] = 'offen',
   ausgewertet mit LernFreigabe.zugeteilt). Dann erscheint er für diese Kinder oben auf der Startseite.
   Mit Admin-Anmeldung auf dem Gerät (Lehrer-iPad, Beamer) ist er immer als Vorschau zu sehen.

   Ersetzt das gedruckte Lernheft: Laufzettel, „So arbeitest du“, Hefteinträge und Aufgaben
   stehen auf dem iPad. Die Kinder schreiben ALLES ins Heft und kontrollieren an der
   Kontrollstation mit dem gedruckten Lösungsheft – bewusst KEINE automatische Kontrolle
   und kein Ergebnis für Pass/Sterne (Abhaken ist keine Leistung).
   Gespeichert wird nur auf dem Gerät (lernwelt-lernweg): abgehakte Schritte und Smileys.
   Neuer Lernweg = JSON-Datei daten/lernwege/<ID>.json (ID mit „.lernweg-“, z. B. gpg.6.lernweg-europa)
   + Katalog-Thema (quelle apps/typen/lernweg.html, parameter weg=<ID>) + Eintrag in sw.js NACHLADEN.
  ═══════════════════════════════════════════════
  -->
  <link rel="stylesheet" href="../../gemeinsam/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0f0e1a; --surface: #1b1929; --surface2: #252238; --accent: #e6a817; --indigo: #6366f1; --indigo2: #818cf8;
      --text: #f1f0fb; --text2: rgba(241,240,251,.7); --muted: rgba(241,240,251,.45); --line: rgba(255,255,255,.09);
      --green: #4ade80; --r: 18px; }
    body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh;
      padding: max(1.2rem, env(safe-area-inset-top)) 1rem 7rem; -webkit-tap-highlight-color: transparent; font-size: 1.05rem; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: clamp(1.9rem, 5vw, 2.6rem); color: var(--accent); line-height: 1.15; }
    h2 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: 1.35rem; color: var(--indigo2); margin: 1.6rem 0 .7rem; }
    .sub { color: var(--text2); margin: .25rem 0 1rem; }
    button { font: inherit; color: inherit; }
    .box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; margin-bottom: .8rem; }
    .regeln summary { cursor: pointer; font-weight: 900; list-style: none; }
    .regeln summary::-webkit-details-marker { display: none; }
    .regeln ul { margin: .6rem 0 0 1.2rem; color: var(--text2); line-height: 1.55; }

    /* Laufzettel */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .75rem; }
    .karte { display: flex; gap: .8rem; align-items: center; width: 100%; text-align: left; background: var(--surface);
      border: 2px solid var(--line); border-radius: var(--r); padding: .95rem 1rem; min-height: 5.4rem; cursor: pointer; transition: transform .15s, border-color .15s; }
    .karte:active { transform: scale(.98); }
    .karte.arbeit { border-color: rgba(129,140,248,.55); }
    .karte.fertig { border-color: rgba(74,222,128,.6); background: linear-gradient(135deg, rgba(74,222,128,.12), var(--surface)); }
    .karte.probe { background: linear-gradient(135deg, rgba(99,102,241,.35), rgba(230,168,23,.18)); border-color: rgba(129,140,248,.45); }
    .ico { font-size: 2rem; width: 2.6rem; text-align: center; flex-shrink: 0; }
    .txt { display: flex; flex-direction: column; gap: .15rem; min-width: 0; flex: 1; }
    .txt small { color: var(--muted); font-weight: 800; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
    .txt b { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: 1.2rem; }
    .txt span { color: var(--text2); font-size: .88rem; }
    .balken { height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); margin-top: .35rem; overflow: hidden; }
    .balken i { display: block; height: 100%; background: var(--indigo2); border-radius: 4px; }
    .fertig .balken i { background: var(--green); }
    .mini { font-size: 1.4rem; }

    /* Station */
    .zurueck { background: var(--surface2); border: 0; border-radius: 12px; padding: .6rem 1rem; font-weight: 900; cursor: pointer; margin-bottom: 1rem; }
    .kopf { display: flex; gap: .9rem; align-items: center; margin-bottom: .4rem; }
    .kopf .nr { background: var(--accent); color: #1b1300; font-family: 'Fredoka One', sans-serif; border-radius: 14px; padding: .35rem .8rem; font-size: 1.1rem; white-space: nowrap; }
    .schritt { display: flex; gap: .8rem; align-items: flex-start; width: 100%; text-align: left; background: var(--surface2); border: 2px solid transparent;
      border-radius: 14px; padding: .8rem .9rem; margin-bottom: .5rem; cursor: pointer; line-height: 1.4; }
    .schritt .haken { width: 1.9rem; height: 1.9rem; border-radius: 9px; border: 2px solid var(--muted); flex-shrink: 0; display: grid; place-items: center; font-weight: 900; }
    .schritt.an { border-color: rgba(74,222,128,.45); }
    .schritt.an .haken { background: var(--green); border-color: var(--green); color: #052e12; }
    .schritt.an .stext { color: var(--text2); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.3); }
    .schritt.kontrolle { background: rgba(230,168,23,.12); }
    .schritt .sym { font-size: 1.3rem; }
    .schritt a { color: var(--indigo2); font-weight: 900; }
    .aufgabe { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem 1.2rem; margin-bottom: .9rem; }
    .aufgabe h3 { font-size: 1.15rem; font-weight: 900; margin-bottom: .2rem; }
    .aufgabe h3 .bu { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 10px; background: var(--indigo); margin-right: .45rem; font-family: 'Fredoka One', sans-serif; font-weight: 400; }
    .heft { color: var(--accent); font-weight: 800; font-size: .92rem; margin: .1rem 0 .7rem; }
    .heft::before { content: '✏️ '; }
    .kasten { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; border: 2px dashed rgba(129,140,248,.5); border-radius: 14px; padding: .6rem; margin: .4rem 0 .8rem; }
    .kasten span { background: var(--surface2); border-radius: 10px; padding: .25rem .65rem; font-weight: 800; }
    .tipp { color: var(--text2); font-size: .92rem; margin-bottom: .6rem; }
    ol.liste { list-style: none; counter-reset: n; display: grid; gap: .55rem; }
    ol.liste > li { counter-increment: n; display: flex; gap: .6rem; line-height: 1.45; font-size: 1.12rem; }
    ol.liste > li::before { content: counter(n); flex-shrink: 0; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: rgba(255,255,255,.08);
      display: grid; place-items: center; font-weight: 900; font-size: .9rem; color: var(--text2); margin-top: .05rem; }
    ol.liste.sp2 { grid-template-columns: repeat(2, 1fr); } ol.liste.sp4 { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 640px) { ol.liste.sp2 { grid-template-columns: 1fr; } ol.liste.sp4 { grid-template-columns: repeat(2, 1fr); } }
    .luecke { display: inline-block; min-width: 4.5rem; border-bottom: 2px solid var(--accent); margin: 0 .15rem; }
    .opt { color: var(--indigo2); font-weight: 900; white-space: nowrap; }
    u { text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 900; }
    .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .zwei { grid-template-columns: 1fr; } }
    ol.abc { list-style: none; display: grid; gap: .55rem; }
    ol.abc li { display: flex; gap: .6rem; font-size: 1.12rem; }
    ol.abc li b { color: var(--indigo2); width: 1.4rem; flex-shrink: 0; }
    .beispiel { background: rgba(99,102,241,.14); border-radius: 12px; padding: .5rem .8rem; margin-bottom: .7rem; font-size: .98rem; }
    .spalten { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
    .spalten div { border: 2px solid var(--line); border-radius: 12px; padding: .6rem; text-align: center; font-weight: 900; min-height: 5rem; }
    .merk { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .9rem; }
    .merk div { background: rgba(230,168,23,.14); border: 1px solid rgba(230,168,23,.4); border-radius: 12px; padding: .7rem; font-weight: 900; text-align: center; }
    .plakat { background: #e8f5e3; color: #17331a; border-radius: 14px; padding: 1rem; text-align: center; margin-bottom: .9rem; line-height: 1.5; }
    .plakat .h { font-family: 'Fredoka One', sans-serif; font-size: 1.4rem; }
    .plakat .b { font-weight: 900; }
    ul.hilfe { list-style: none; display: grid; gap: .35rem; margin: .4rem 0 .8rem; }
    ul.hilfe li::before { content: '→ '; color: var(--accent); font-weight: 900; }

    /* Hefteintrag – so sieht er im Heft aus (helles Papier, Benes Schema) */
    .papier { background: #fffef8; color: #111; border-radius: 10px; padding: 1rem 1.2rem 1.4rem; margin: .4rem 0 .9rem; font-family: 'Atkinson Hyperlegible', 'Nunito', sans-serif; overflow-x: auto; }
    .papier .ue { display: flex; align-items: center; gap: .7rem; border-bottom: 3px solid #111; padding-bottom: .35rem; height: 3.4rem; }
    .papier .kreis { width: 2.4rem; height: 2.4rem; border: 3px solid #00a651; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.3rem; flex-shrink: 0; }
    .papier .ti { color: #3d9b3d; font-weight: 700; font-size: 1.25rem; flex: 1; }
    .papier .datum { border-bottom: 2px solid #111; width: 4.5rem; height: 1.2rem; }
    .papier p { border-bottom: 1px solid #b9c2cf; height: 2.3rem; line-height: 2.85rem; font-size: 1.08rem; white-space: pre; }
    .papier .g { color: #3d9b3d; font-weight: 700; } .papier .b { font-weight: 700; }
    .papier .merke { color: #ff5050; font-weight: 700; }
    .papier .mu { text-decoration: underline; text-decoration-color: #ff5050; text-decoration-thickness: 2px; text-underline-offset: 4px; }

    /* Smileys */
    .smileys { display: flex; gap: .6rem; }
    .smileys button { font-size: 2.1rem; background: var(--surface2); border: 2px solid transparent; border-radius: 16px; width: 4rem; height: 4rem; cursor: pointer; filter: grayscale(.6); opacity: .65; }
    .smileys button.an { border-color: var(--accent); filter: none; opacity: 1; background: rgba(230,168,23,.18); }
    .probe-zeile { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .probe-zeile .teil { color: var(--accent); font-weight: 900; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
    .probe-zeile .smileys button { width: 3.2rem; height: 3.2rem; font-size: 1.7rem; }
    .ueben { color: var(--text2); }
    .ueben li { margin: .3rem 0 .3rem 1.2rem; }
    .fehler { text-align: center; color: var(--text2); padding: 4rem 1rem; font-weight: 800; }
    .vorschau { background: rgba(230,168,23,.15); border: 1px solid rgba(230,168,23,.5); border-radius: 12px; padding: .5rem .8rem; font-size: .85rem; font-weight: 800; margin-bottom: 1rem; color: var(--accent); }
    /* Erweiterungen (Unit 2 ff.): Niveaus, App-Schritte, Kontroll-Code, Fortschrittsring, Start-Einschätzung */
    .niveaus b { display: block; margin-bottom: .5rem; }
    .nv-knoepfe { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .nv { background: var(--surface2); border: 2px solid transparent; border-radius: 14px; padding: .6rem .5rem; cursor: pointer; text-align: center; }
    .nv b { margin: 0; font-size: 1rem; } .nv small { display: block; color: var(--muted); font-size: .78rem; margin-top: .15rem; }
    .nv.an { border-color: var(--accent); background: rgba(230,168,23,.16); }
    @media (max-width: 560px) { .nv-knoepfe { grid-template-columns: 1fr; } }
    .nv-marke { margin-left: .5rem; font-size: .8rem; color: var(--accent); font-weight: 900; }
    .schritt.auto { cursor: default; } .schritt.auto .haken { border-style: dashed; }
    .app-stand { display: block; color: var(--indigo2); font-size: .85rem; font-weight: 800; margin-top: .25rem; text-decoration: none; }
    .schritt.an .app-stand { color: var(--green); }
    .code-zeile { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin-top: .45rem; }
    .code-zeile input { font: 800 1.05rem 'Nunito', sans-serif; padding: .5rem .7rem; border-radius: 10px; border: 2px solid var(--accent); background: #0f0e1a; color: var(--text); text-transform: uppercase; min-width: 12rem; }
    .code-ok { background: var(--accent); color: #1b1300; border: 0; border-radius: 10px; padding: .5rem 1rem; font-weight: 900; cursor: pointer; }
    #lw-code-msg { color: #f87171; font-weight: 800; font-size: .85rem; }
    .ring-box { display: flex; gap: 1rem; align-items: center; }
    .ring { --p: 0; width: 4.6rem; height: 4.6rem; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
      background: conic-gradient(var(--green) calc(var(--p) * 1%), rgba(255,255,255,.1) 0); }
    .ring span { background: var(--surface); width: 3.6rem; height: 3.6rem; border-radius: 50%; display: grid; place-items: center; font: 400 1.2rem 'Fredoka One', sans-serif; }
    .los { display: block; width: 100%; margin-top: 1rem; background: linear-gradient(135deg, var(--indigo), var(--indigo2)); color: #fff; border: 0; border-radius: 16px; padding: 1rem; font: 400 1.3rem 'Fredoka One', sans-serif; cursor: pointer; }
    .lesetext { background: #fffef8; color: #111; border-radius: 12px; padding: .8rem 1rem; margin-bottom: .8rem; line-height: 1.55; font-family: 'Atkinson Hyperlegible', 'Nunito', sans-serif; }
    .lesetext p + p { margin-top: .4rem; }
    a.oeffnen { white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { .karte { transition: none; } }
  </style>
</head>
<body>
<main class="wrap" id="app"><p class="fehler">Lädt …</p></main>
<script src="../../gemeinsam/freigabe.js"></script>

<script>
'use strict';
(function () {
  const SPEICHER_KEY = 'lernwelt-lernweg';
  //  { <Lernweg-ID>: { s: { "2.0": 1 } abgehakt (Station.Schritt), g: { "2": 3 } Smiley je Station, p: { "0": 2 } Probe-Check jetzt,
  //                    v: { "0": 1 } Probe-Check vorher, vf: 1 Start-Einschätzung erledigt, n: { "2": 1 } Niveau je Station (1–3),
  //                    t0: ms erster Besuch (ab da zählen App-Runden), a: 'JJJJ-MM-TT' letzter Besuch (Auto-Start der Startseite) } }
  const ID = new URLSearchParams(location.search).get('weg') || 'en.6.lernweg-u1';
  const app = document.getElementById('app');
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SYM = { buch: '📗', heft: '✏️', aufgaben: '📝', hefteintrag: '📒', kontrolle: '✅', app: '📱', extra: '★', hoeren: '🎧', partner: '👥', schreiben: '✍️' };
  const SMILEY = ['😟', '😐', '😀'];
  const NIVEAU = [null, { s: '★', n: 'Basis', t: 'mit Hilfen, weniger Aufgaben' }, { s: '★★', n: 'Standard', t: 'alle Pflichtaufgaben' }, { s: '★★★', n: 'Profi', t: 'mit Zusatzaufgabe' }];
  let D = null, codeOffen = '';

  function heute() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  // ── Speicher (nur dieses Gerät) ─────────────────────
  function alles() { try { return JSON.parse(localStorage.getItem(SPEICHER_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function stand() {
    const a = alles(); const s = a[ID] || {};
    return Object.assign({}, s, { s: s.s || {}, g: s.g || {}, p: s.p || {}, v: s.v || {}, n: s.n || {} });
  }
  function sichern(st) {
    const a = alles(); a[ID] = st;
    try { localStorage.setItem(SPEICHER_KEY, JSON.stringify(a)); } catch (e) { if (window.LW && LW.speicher) LW.speicher.fehlgeschlagen(e); }
  }

  // ── Niveaus (nur wenn der Lernweg sie hat): Aufgaben/Schritte mit "niveau": [1, 2] erscheinen nur dort ──
  const niveauVon = (st, s) => s.niveaus ? (Number(st.n[s.nr]) || 2) : 0;
  const passt = (x, nv) => !nv || !Array.isArray(x.niveau) || x.niveau.includes(nv);
  const schritteVon = (st, s) => s.schritte.map((x, i) => ({ x, i })).filter(o => passt(o.x, niveauVon(st, s)));
  const aufgabenVon = (st, s) => s.aufgaben.filter(a => passt(a, niveauVon(st, s)));

  // ── App-Schritte: zählen gute Runden seit dem ersten Besuch (Verlauf aus lern-apps-results, navbar.js) ──
  function appStand(x, st) {
    const z = x.ziel;
    if (!z) return null;
    let key = z.key;
    if (!key && x.link) { try { const u = new URL(x.link, location.href); u.searchParams.delete('stufe'); key = u.pathname.split('/').pop() + u.search; } catch (e) {} }
    let R = {};
    try { R = JSON.parse(localStorage.getItem('lern-apps-results') || '{}') || {}; } catch (e) {}
    const h = R[key] && Array.isArray(R[key].history) ? R[key].history : [];
    const soll = Math.max(1, Number(z.runden) || 1), pr = Number(z.prozent) || 70, ab = Number(st.t0) || 0;
    const n = h.filter(e => e && e.t >= ab && e.p >= pr && (!z.thema || e.s === z.thema)).length;
    return { n: Math.min(n, soll), soll, pr };
  }
  /** App-Schritte, deren Ziel erreicht ist, dauerhaft abhaken (der Verlauf hält nur 30 Runden je App) */
  function appsAbhaken(st) {
    let neu = false;
    D.stationen.forEach(s => s.schritte.forEach((x, i) => {
      const k = s.nr + '.' + i;
      if (x.art !== 'app' || !x.ziel || st.s[k]) return;
      const a = appStand(x, st);
      if (a && a.n >= a.soll) { st.s[k] = 1; neu = true; }
    }));
    if (neu) sichern(st);
  }

  // ── Bausteine ───────────────────────────────────────
  const luecken = t => esc(t).replace(/_{2,}/g, '<span class="luecke"></span>').replace(/\*([^*]+)\*/g, '<u>$1</u>');
  const kasten = l => l && l.length ? `<div class="kasten">${l.map(w => `<span>${esc(w)}</span>`).join('')}</div>` : '';
  const nvMarke = a => Array.isArray(a.niveau) && a.niveau.length < 3 ? `<span class="nv-marke">${a.niveau.map(n => NIVEAU[n].s).join(' / ')}</span>` : '';

  function aufgabeHTML(a) {
    let h = `<section class="aufgabe"><h3><span class="bu">${esc(a.nr)}</span>${esc(a.titel)}${nvMarke(a)}</h3>`;
    if (a.heft) h += `<p class="heft">${esc(a.heft)}</p>`;
    if (a.tipp && a.art !== 'mediation') h += `<p class="tipp">💡 ${esc(a.tipp)}</p>`;
    if (a.beispiel && a.art !== 'frei') h += `<div class="beispiel"><b>Beispiel:</b> ${esc(a.beispiel)}</div>`;
    // „wahl“ mit immer denselben (mehr als 2) Wörtern: einmal als Kasten statt in jeder Zeile
    const gleicheOpt = a.art === 'wahl' && a.items.length > 1 && a.items[0].o.length > 2 && a.items.every(x => x.o.join('|') === a.items[0].o.join('|'));
    if (gleicheOpt) h += kasten(a.items[0].o);
    if (a.art !== 'sortieren') h += kasten(a.kasten);
    const sp = a.spalten === 2 ? ' sp2' : a.spalten === 4 ? ' sp4' : '';
    if (a.lesetext) h += `<div class="lesetext">${a.lesetext.split('\n').map(z => `<p>${esc(z)}</p>`).join('')}</div>`;
    if (a.art === 'luecken') h += `<ol class="liste${sp}">${a.items.map(x => `<li><span>${luecken(x)}</span></li>`).join('')}</ol>`;
    else if (a.art === 'wahl') h += `<ol class="liste">${a.items.map(x => `<li><span>${luecken(x.t)}${gleicheOpt ? '' : ` <span class="opt">( ${x.o.map(esc).join(' / ')} )</span>`}</span></li>`).join('')}</ol>`;
    else if (a.art === 'saetze') h += `<ol class="liste">${a.items.map(x => `<li><span>${luecken(x)}</span></li>`).join('')}</ol>`;
    else if (a.art === 'zuordnen') h += `<div class="zwei"><ol class="liste">${a.links.map(x => `<li><span>${esc(x)}</span></li>`).join('')}</ol>
        <ol class="abc">${a.rechts.map((x, i) => `<li><b>${String.fromCharCode(97 + i)}</b><span>${esc(x)}</span></li>`).join('')}</ol></div>`;
    else if (a.art === 'sortieren') h += kasten(a.kasten) + `<div class="spalten">${a.spalten.map(s => `<div>${esc(s)}</div>`).join('')}</div>`;
    else if (a.art === 'frei') h += `<p style="margin-bottom:.6rem">${esc(a.text)}</p>${a.beispiel ? `<div class="beispiel"><b>Beispiel:</b> ${esc(a.beispiel)}</div>` : ''}${a.hilfe ? `<ul class="hilfe">${a.hilfe.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}`;
    else if (a.art === 'mediation') {
      h += `<div class="plakat">${a.plakat.map(([t, s]) => `<div class="${s}">${esc(t)}</div>`).join('')}</div>
        <p style="margin-bottom:.5rem">${esc(a.text)}</p><p class="tipp">💡 ${esc(a.tipp)}</p>
        <ol class="liste">${a.items.map(x => `<li><span>„${esc(x)}“</span></li>`).join('')}</ol>`;
    } else if (a.art === 'schreiben') {
      h += `<p>${esc(a.text)}</p><p style="font-weight:900;margin:.4rem 0">${esc(a.regel)}</p>
        ${a.hilfe ? `<div class="beispiel"><b>Hilfe – Satzanfänge:</b><ul class="hilfe">${a.hilfe.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
        <p class="heft">Schreibe ins Heft. Fang so an: ${esc(a.anfang)}</p>
        <p style="font-weight:900;margin:.6rem 0 .3rem">Checkliste (du und dein Partner):</p><ul class="hilfe">${a.checkliste.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    }
    return h + '</section>';
  }

  function hefteintragHTML(nr) {
    const he = D.hefteintraege && D.hefteintraege[nr];
    if (!he) return '';
    const zeile = z => `<p>${z.map(([t, s]) => s ? `<span class="${esc(s)}">${esc(t)}</span>` : esc(t)).join('')}</p>`;
    return `<h2>📒 Hefteintrag ${esc(nr)} – schreibe ihn genau so ab</h2>
      <div class="papier"><div class="ue"><span class="kreis">${esc(nr)}</span><span class="ti">${esc(he.titel)}</span><span class="datum" title="Datum"></span></div>
      <p></p>${he.zeilen.map(zeile).join('')}<p><span class="merke">Merke:</span> <span class="mu">${esc(he.merke)}</span></p></div>`;
  }

  function smileys(wert, attr) {
    return `<div class="smileys">${SMILEY.map((s, i) => `<button type="button" ${attr}="${i + 1}" class="${wert === i + 1 ? 'an' : ''}" aria-label="${['noch schwer', 'geht so', 'kann ich gut'][i]}">${s}</button>`).join('')}</div>`;
  }

  // ── Fortschritt ─────────────────────────────────────
  //  fertig = Kontrolle abgehakt; Stationen ohne Kontroll-Schritt (z. B. Checkpoint) = alle Schritte erledigt
  function fortschritt(st, s) {
    const l = schritteVon(st, s).filter(o => o.x.art !== 'extra');
    const fertig = l.filter(o => st.s[s.nr + '.' + o.i]).length;
    const k = l.find(o => o.x.art === 'kontrolle');
    const kontrolliert = k ? !!st.s[s.nr + '.' + k.i] : l.length > 0 && fertig === l.length;
    return { n: l.length, fertig, kontrolliert };
  }
  const pflicht = () => D.stationen.filter(s => !s.wahl);
  const wahl = () => D.stationen.filter(s => s.wahl);
  function gesamt(st) {
    const p = pflicht().filter(s => fortschritt(st, s).kontrolliert).length;
    const wSoll = wahl().length ? Math.min(Number(D.wahlAnzahl) || 1, wahl().length) : 0;
    const w = Math.min(wSoll, wahl().filter(s => fortschritt(st, s).kontrolliert).length);
    return { fertig: p + w, soll: pflicht().length + wSoll, p, w, wSoll };
  }

  function karte(st, s) {
    const f = fortschritt(st, s), g = st.g[s.nr], nv = niveauVon(st, s);
    const kl = f.kontrolliert ? ' fertig' : f.fertig ? ' arbeit' : '';
    const info = f.kontrolliert ? '✅ ' + (s.schritte.some(x => x.art === 'kontrolle') ? 'kontrolliert' : 'geschafft') : f.fertig ? `${f.fertig} von ${f.n} Schritten` : 'noch nicht begonnen';
    return `<button type="button" class="karte${kl}" data-station="${s.nr}">
      <span class="ico" aria-hidden="true">${esc(s.ico)}</span>
      <span class="txt"><small>Station ${s.nr}${s.kompetenz ? ' · ' + esc(s.kompetenz) : ''}</small><b>${esc(s.titel)}</b><span>${esc(info)}${nv && f.fertig ? ' · ' + NIVEAU[nv].s : ''}</span>
      <span class="balken"><i style="width:${Math.round(100 * f.fertig / Math.max(1, f.n))}%"></i></span></span>
      ${g ? `<span class="mini" aria-hidden="true">${SMILEY[g - 1]}</span>` : ''}</button>`;
  }

  // ── Ansichten ───────────────────────────────────────
  function laufzettel() {
    const st = stand();
    const regeln = `<details class="box regeln"><summary>📋 Unsere Regeln (antippen)</summary><ul>${D.regeln.map(r => `<li>${esc(r)}</li>`).join('')}</ul></details>`;
    const probeKarte = `<button type="button" class="karte probe" data-probe="1"><span class="ico" aria-hidden="true">🎯</span>
        <span class="txt"><small>Zum Schluss</small><b>Fit für die Probe?</b><span>Kreuze ehrlich an, was du schon kannst.</span></span></button>`;
    if (!wahl().length) {                                   // wie bisher (Unit 1)
      const fertig = D.stationen.filter(s => fortschritt(st, s).kontrolliert).length;
      app.innerHTML = `<h1>${esc(D.emoji || '🧭')} ${esc(D.titel)}</h1><p class="sub">${esc(D.untertitel)} · ${fertig} von ${D.stationen.length} Stationen kontrolliert</p>
        ${regeln}<h2>Mein Laufzettel</h2><div class="grid">${D.stationen.map(s => karte(st, s)).join('')}${probeKarte}</div>`;
    } else {
      const g = gesamt(st);
      app.innerHTML = `<h1>${esc(D.emoji || '🧭')} ${esc(D.titel)}</h1><p class="sub">${esc(D.untertitel)}</p>
        <div class="box ring-box"><div class="ring" style="--p:${Math.round(100 * g.fertig / Math.max(1, g.soll))}"><span>${g.fertig}/${g.soll}</span></div>
          <div><b>${g.fertig === g.soll ? '🎉 Alles geschafft!' : 'Dein Fortschritt'}</b><br><span class="sub">${g.p} von ${pflicht().length} Pflichtstationen · ${g.w} von ${g.wSoll} Wahlstation${g.wSoll === 1 ? '' : 'en'}</span></div></div>
        ${regeln}<h2>Pflichtstationen</h2><div class="grid">${pflicht().filter(s => !s.schluss).map(s => karte(st, s)).join('')}</div>
        <h2>Wahlstationen – wähle ${g.wSoll} von ${wahl().length}</h2><div class="grid">${wahl().map(s => karte(st, s)).join('')}</div>
        <h2>Zum Schluss</h2><div class="grid">${pflicht().filter(s => s.schluss).map(s => karte(st, s)).join('')}${probeKarte}</div>`;
    }
    app.dataset.station = '';
    window.scrollTo(0, 0);
  }

  function schrittHTML(st, s, o) {
    const x = o.x, k = s.nr + '.' + o.i, an = !!st.s[k];
    const link = x.link ? ` <a href="${esc(x.link)}" class="oeffnen">öffnen ›</a>` : '';
    let zusatz = '';
    if (x.art === 'app' && x.ziel) {
      const a = appStand(x, st);
      zusatz = `<span class="app-stand">${an ? '✓ geschafft' : `Stand: ${a.n} von ${a.soll} Runde${a.soll === 1 ? '' : 'n'} mit mindestens ${a.pr} %`} · hakt sich selbst ab</span>`;
    }
    if (x.art === 'kontrolle' && s.code && !an && codeOffen === k) {
      zusatz = `<span class="code-zeile"><input type="text" id="lw-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code von der Kontrollstation" aria-label="Kontroll-Code">
        <button type="button" class="code-ok" data-code-ok="${o.i}">OK</button><span id="lw-code-msg"></span></span>`;
    } else if (x.art === 'kontrolle' && s.code && !an) zusatz = '<span class="app-stand">🔑 Antippen und den Code von der Kontrollstation eingeben</span>';
    const auto = x.art === 'app' && x.ziel;
    return `<div class="schritt${an ? ' an' : ''}${x.art === 'kontrolle' ? ' kontrolle' : ''}${auto ? ' auto' : ''}" ${auto ? '' : `data-schritt="${o.i}" role="button" tabindex="0"`} aria-pressed="${an}">
      <span class="haken">${an ? '✓' : auto ? '⏳' : ''}</span><span class="sym" aria-hidden="true">${SYM[x.art] || '•'}</span>
      <span class="stext">${esc(x.text)}${link}${zusatz}</span></div>`;
  }

  function station(nr) {
    const s = D.stationen.find(x => x.nr === nr);
    if (!s) return laufzettel();
    const st = stand(), nv = niveauVon(st, s);
    const wahlNiveau = nv ? `<div class="box niveaus"><b>Wähle dein Niveau:</b><div class="nv-knoepfe">${[1, 2, 3].map(n =>
      `<button type="button" class="nv${n === nv ? ' an' : ''}" data-niveau="${n}"><b>${NIVEAU[n].s} ${NIVEAU[n].n}</b><small>${NIVEAU[n].t}</small></button>`).join('')}</div></div>` : '';
    const schritte = schritteVon(st, s).map(o => schrittHTML(st, s, o)).join('');
    const merk = s.merk ? `<div class="merk">${s.merk.map(m => `<div>${esc(m)}</div>`).join('')}</div>` : '';
    const tipps = s.tipps ? `<div class="box"><b>🎧 So hörst du richtig:</b><ul class="hilfe">${s.tipps.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : '';
    const al = aufgabenVon(st, s);
    const auf = al.length ? `<h2>📝 Aufgaben – alles ins Heft</h2><p class="tipp">Überschrift im Heft: <b>Station ${s.nr} – ${esc(s.titel)}</b></p>${merk}${al.map(aufgabeHTML).join('')}` : merk;
    app.innerHTML = `<button type="button" class="zurueck" data-zurueck>‹ Laufzettel</button>
      <div class="kopf"><span class="nr">Station ${s.nr}</span><h1>${esc(s.titel)}</h1></div>
      <p class="sub">${esc(s.kurz)}${s.wahl ? ' · Wahlstation' : ''}</p>${wahlNiveau}
      <h2>So arbeitest du – hake ab, was du geschafft hast</h2>${schritte}${tipps}
      ${s.hefteintrag ? hefteintragHTML(s.hefteintrag) : ''}${auf}
      <h2>So gut kann ich das</h2><div class="box">${smileys(st.g[s.nr], 'data-gefuehl')}</div>
      <button type="button" class="zurueck" data-zurueck style="margin-top:1rem">‹ Zurück zum Laufzettel</button>`;
    app.dataset.station = s.nr;
  }

  function vorher() {
    const st = stand();
    app.innerHTML = `<h1>${esc(D.emoji || '🧭')} ${esc(D.titel)}</h1><p class="sub">${esc(D.untertitel)}</p>
      <div class="box"><b>Bevor du startest:</b> Wie gut kannst du das <b>schon jetzt</b>? Sei ehrlich – am Ende vergleichst du.</div>
      ${D.probe.map((p, i) => `<div class="box probe-zeile"><div><div class="teil">${esc(p.teil)}</div><div>Ich kann ${esc(p.kann)}</div></div>${smileys(st.v[i], 'data-vorher-' + i)}</div>`).join('')}
      <button type="button" class="los" data-los>Los geht's › zum Laufzettel</button>`;
    app.dataset.station = '';
  }

  function probe() {
    const st = stand();
    const zeilen = D.probe.map((p, i) => `<div class="box probe-zeile"><div><div class="teil">${esc(p.teil)}</div><div>Ich kann ${esc(p.kann)}</div>
      <small style="color:var(--muted)">Üben: ${p.station ? 'Station ' + p.station : 'im Unterricht'}${st.v[i] ? ' · am Anfang: ' + SMILEY[st.v[i] - 1] : ''}</small></div>${smileys(st.p[i], 'data-probe-wert-' + i)}</div>`).join('');
    const ueben = D.probe.map((p, i) => ({ p, w: st.p[i] })).filter(x => x.w && x.w < 3);
    const offen = (wahl().length ? pflicht() : D.stationen).filter(s => !fortschritt(st, s).kontrolliert);
    app.innerHTML = `<button type="button" class="zurueck" data-zurueck>‹ Laufzettel</button>
      <h1>🎯 Fit für die Probe?</h1><p class="sub">Das kommt in der Probe dran. Tippe an, wie gut du es schon kannst.</p>${zeilen}
      <h2>Mein Lernplan bis zur Probe</h2><div class="box ueben">
      ${offen.length ? `<p><b>Noch nicht kontrolliert:</b> ${offen.map(s => 'Station ' + s.nr).join(', ')}</p>` : '<p>✅ Alle Stationen kontrolliert – super!</p>'}
      ${ueben.length ? `<p style="margin-top:.5rem"><b>Das übe ich noch:</b></p><ul>${ueben.map(x => `<li>${esc(x.p.kann)} → ${x.p.station ? 'Station ' + x.p.station : 'frag deine Lehrkraft'}</li>`).join('')}</ul>` : ''}
      <p style="margin-top:.6rem">💡 Jeden Tag 10 Minuten Vokabeltrainer und die Hefteinträge lesen!</p></div>`;
    app.dataset.station = '';
    window.scrollTo(0, 0);
  }

  // ── Bedienung ───────────────────────────────────────
  function codePruefen(i) {
    const nr = Number(app.dataset.station), s = D.stationen.find(x => x.nr === nr), feld = document.getElementById('lw-code');
    if (!s || !feld) return;
    const norm = v => String(v || '').toUpperCase().replace(/[^A-Z0-9ÄÖÜ]/g, '');
    if (norm(feld.value) && norm(feld.value) === norm(s.code)) {
      const st = stand(); st.s[nr + '.' + i] = 1; sichern(st); codeOffen = ''; station(nr);
    } else { const m = document.getElementById('lw-code-msg'); if (m) m.textContent = '❌ Falscher Code – schau im Lösungsheft oben nach.'; feld.select(); }
  }
  app.addEventListener('click', e => {
    const lk = e.target.closest('a');
    if (lk) { try { sessionStorage.setItem('lernwelt-lernweg-zurueck', location.href); } catch (er) {} return; }
    if (e.target.closest('input')) return;
    const t = e.target.closest('button, [data-schritt]');
    if (!t) return;
    if (t.dataset.station) { location.hash = 's' + t.dataset.station; return; }
    if (t.dataset.probe) { location.hash = 'probe'; return; }
    if (t.hasAttribute('data-zurueck')) { location.hash = ''; return; }
    const st = stand(), nr = Number(app.dataset.station);
    if (t.hasAttribute('data-los')) { st.vf = 1; sichern(st); route(); return; }
    if (t.dataset.codeOk !== undefined) { codePruefen(t.dataset.codeOk); return; }
    if (t.dataset.niveau) { st.n[nr] = Number(t.dataset.niveau); sichern(st); station(nr); return; }
    if (t.dataset.schritt !== undefined) {
      const s = D.stationen.find(x => x.nr === nr), x = s && s.schritte[Number(t.dataset.schritt)];
      const k = nr + '.' + t.dataset.schritt;
      if (x && x.art === 'kontrolle' && s.code && !st.s[k]) {          // Kontroll-Code nötig
        codeOffen = k; station(nr);
        const f = document.getElementById('lw-code'); if (f) f.focus();
        return;
      }
      if (st.s[k]) delete st.s[k]; else st.s[k] = 1;
      sichern(st);
      const an = !!st.s[k];
      t.classList.toggle('an', an); t.setAttribute('aria-pressed', an); t.querySelector('.haken').textContent = an ? '✓' : '';
      return;
    }
    if (t.dataset.gefuehl) { st.g[nr] = Number(t.dataset.gefuehl); sichern(st); station(nr); return; }
    const vw = [...t.attributes].find(a => a.name.startsWith('data-vorher-'));
    if (vw) { st.v[vw.name.slice(12)] = Number(vw.value); sichern(st); vorher(); return; }
    const pw = [...t.attributes].find(a => a.name.startsWith('data-probe-wert-'));
    if (pw) { st.p[pw.name.slice(16)] = Number(pw.value); sichern(st); probe(); }
  });
  app.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'lw-code') { const b = app.querySelector('[data-code-ok]'); if (b) codePruefen(b.dataset.codeOk); }
    else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-schritt]')) { e.preventDefault(); e.target.click(); }
  });

  // Zuteilung: nur für zugeteilte Gruppen/Klassen; mit Admin-Anmeldung immer (Vorschau)
  function adminVorschau() {
    try { const t = JSON.parse(localStorage.getItem('lernwelt-admin-schluessel') || 'null'); return !!(t && typeof t.token === 'string' && t.exp > Date.now()); }
    catch (e) { return false; }
  }
  const offen = () => !!(window.LernFreigabe && LernFreigabe.zugeteilt(ID));

  function route() {
    if (!D) return;
    if (!offen() && !adminVorschau()) {
      app.innerHTML = '<p class="fehler">🔒 Dieser Lernweg ist für dein iPad gerade nicht freigeschaltet.<br>Frag deine Lehrkraft.</p>';
      return;
    }
    const st = stand();
    if (offen()) {                                         // Start (ab da zählen App-Runden) und letzter Besuch (Auto-Start)
      let neu = false;
      if (!st.t0) { st.t0 = Date.now(); neu = true; }
      if (st.a !== heute()) { st.a = heute(); neu = true; }
      if (neu) sichern(st);
    }
    appsAbhaken(st);
    const h = location.hash.slice(1);
    if (h === 'probe') probe();
    else if (/^s\d+$/.test(h)) { const nr = Number(h.slice(1)); if (String(app.dataset.station) !== String(nr)) { codeOffen = ''; station(nr); window.scrollTo(0, 0); } else station(nr); }
    else if (D.zieleVorher && !st.vf) vorher();
    else laufzettel();
    if (!offen()) app.insertAdjacentHTML('afterbegin', '<div class="vorschau">👁 Vorschau für Lehrkräfte – dieser Lernweg ist für dieses iPad nicht zugeteilt.</div>');
  }
  window.addEventListener('hashchange', () => { app.dataset.station = ''; route(); });
  window.addEventListener('lernfreigabe:neu', route);      // frische config.json → Zuteilung neu prüfen
  // Zurück aus einer App (Safari: Seite aus dem Cache) → App-Schritte neu auswerten
  window.addEventListener('pageshow', e => { if (e.persisted) route(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D) route(); });

  if (!/^[a-z]+(\.[a-z0-9-]+){1,5}$/.test(ID)) { app.innerHTML = '<p class="fehler">Diesen Lernweg gibt es nicht.</p>'; return; }
  const ROOT = (window.LW && LW.ROOT) || '../../';
  fetch(ROOT + 'daten/lernwege/' + ID + '.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { D = d; document.title = (d.titel || 'Lernweg') + ' – Lernwelt'; route(); window.scrollTo(0, 0); })
    .catch(() => { app.innerHTML = '<p class="fehler">⚠️ Der Lernweg konnte nicht geladen werden. Bitte mit Internet neu öffnen.</p>'; });
})();
</script>
<script src="../../gemeinsam/navbar.js"></script>
</body>
</html>
