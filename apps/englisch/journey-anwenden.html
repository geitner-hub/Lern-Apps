<!--
  ═══════════════════════════════════════════════
   LERNWELT – English Journey Year 6: Anwenden-Stationen (Etappe 5)
   In jeder Station entscheidet die Sprache, was in der Szene passiert – keine Frage als Tor:
     u1  Berry's holiday blog   Absätze nach den Zeitangaben ordnen, Sätze mit and/but/so/because verbinden,
                                Präposition zum Foto wählen – der Blog wächst mit jeder richtigen Entscheidung
     u2  Den Weg beschreiben    Wegbeschreibung aus Sätzen bauen → die Figur läuft genau so; oder eine Beschreibung
                                lesen und antippen, wo man ankommt
     u3  Was passiert im Park?  Personen im Park über Sätze finden (present progressive + Ortspräpositionen)
     u4  Shops vergleichen      Mit Steigerungen entscheiden, in welchem Laden eingekauft wird
     u5  Klassenfahrt planen    Wettervorhersage und Bahnhofsdurchsage (🔊) bestimmen Tag, Gleis und Gepäck
   Läuft auf dem Übungs-Rahmen (ueben.js): Stufen = Katalog en.6.anwenden.u1–u5, Runde, Rückmeldung, Meisterschaft,
   Freigabe, Direktstart ?stufe=… (vom English Journey). Szenen in HTML/SVG – kein WebGL nötig.
   Aufgaben entstehen aus den Bausteinen unten (Wörter aus Highlight 6, Units 1–5).
  ═══════════════════════════════════════════════
-->
<link rel="stylesheet" href="../../gemeinsam/fonts.css">
<style>

<div id="app"></div>

<script src="../../gemeinsam/freigabe.js"></script>
<script src="../../gemeinsam/ueben.js"></script>
<script>
'use strict';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mischen = l => { const a = l.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = l => l[Math.floor(Math.random() * l.length)];
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const warte = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
const SPRACHE = 'en-GB';
const stimmeDa = () => { try { return !!window.speechSynthesis && speechSynthesis.getVoices().some(v => /^en/i.test(v.lang)); } catch (e) { return false; } };
try { if (window.speechSynthesis) speechSynthesis.getVoices(); } catch (e) {}
/** Knöpfe: Antippen markiert, fertig(wert) nach kurzer Szene */
function knoepfe(box, optionen, fertig, vorher) {
  const k = document.createElement('div'); k.className = 'aw-knoepfe';
  k.innerHTML = optionen.map((o, i) => `<button type="button" class="aw-k" data-i="${i}">${esc(o)}</button>`).join('');
  box.appendChild(k);
  k.addEventListener('click', async e => {
    const b = e.target.closest('[data-i]'); if (!b || k.dataset.zu) return;
    k.dataset.zu = '1'; b.classList.add('an');
    const wert = optionen[Number(b.dataset.i)];
    if (vorher) await vorher(wert);
    fertig(wert);
  });
}

// ═══ u1 Berry's holiday blog ═══════════════════════════════
//  Ein Blog je Runde: Absätze nach Wochentagen ordnen (3×), Sätze verbinden (3×), Präposition zum Foto (2×).
const BLOGS = [
  { titel: "Berry's blog: A week in Spain",
    abs: [['🛫', 'On Sunday we flew to Spain.'], ['🏖️', 'On Monday we went to the seaside. The weather was fantastic!'], ['🏛️', 'On Tuesday it was rainy, so we visited a museum.'],
          ['⛰️', 'On Wednesday we climbed a mountain near our hotel.'], ['🏠', 'In the end we flew home on Saturday. What an adventure!']],
    links: [['We wanted to swim', 'the water was too cold.', 'but'], ['It was very sunny', 'we bought ice cream.', 'so'],
            ["I didn't go to the museum", 'I felt sick.', 'because'], ['We played volleyball', 'we built a sandcastle.', 'and']],
    praep: [['My basket is ___ the umbrella.', '⛱️', '🧺', 'under'], ['The ball is ___ the bucket.', '🪣', '⚽', 'next to'], ['A crab is hiding ___ the rock.', '🪨', '🦀', 'behind']] },
  { titel: "Berry's blog: Munich",
    abs: [['🚆', 'On Friday we took the train to Munich.'], ['🏟️', 'On Saturday we visited the big stadium.'], ['📚', 'On Sunday morning it was rainy, so we stayed in the hotel and read.'],
          ['🌳', 'On Sunday afternoon the weather was sunny again. We went to a park.'], ['🏠', 'In the end we went home on Monday. I was sad!']],
    links: [['The stadium was fantastic', 'we saw a football match.', 'and'], ['We wanted to go to the zoo', 'it was closed.', 'but'],
            ['We were hungry', 'we had lunch in a café.', 'so'], ['My little brother cried', 'he lost his cap.', 'because']],
    praep: [['The cat is sleeping ___ the bed.', '🛏️', '🐈', 'under'], ['My book is ___ the chair.', '🪑', '📕', 'on'], ['My bike is ___ the tree.', '🌳', '🚲', 'next to']] },
  { titel: "Berry's blog: Holidays in Turkey",
    abs: [['✈️', 'On Monday we flew to Turkey.'], ['🏖️', 'On Tuesday we went to the beach and swam in the sea.'], ['⛵', 'On Wednesday Berry joined a sailing club.'],
          ['🏘️', 'On Thursday we visited an old town with a market.'], ['🏠', 'In the end, on Friday, we flew home. Nice to be home again!']],
    links: [['The sea was warm', 'we swam every day.', 'so'], ['Berry was a bit scared', 'the boat was very fast.', 'because'],
            ['The sailing teacher was strict', 'he was very nice.', 'but'], ['We ate fish', 'we drank lemonade.', 'and']],
    praep: [['A dog is sitting ___ the door.', '🚪', '🐕', 'in front of'], ['A bird is sitting ___ the house.', '🏠', '🐦', 'on'], ['The cat is hiding ___ the boat.', '⛵', '🐈', 'behind']] },
];
const PRAEP = ['under', 'on', 'next to', 'behind', 'in front of'];
const LAGE = { under: [[110, 50, 1.2], [110, 112, .7]], on: [[110, 98, 1.2], [110, 40, .75]], 'next to': [[80, 80, 1.1], [150, 88, .85]],
               behind: [[110, 92, 1.2], [128, 62, .6]], 'in front of': [[110, 64, 1], [104, 112, 1]] };
function bildHTML(a, b, lage) {
  const [pa, pb] = LAGE[lage], z = lage === 'behind' ? 0 : 2;
  return `<div class="bild" aria-hidden="true"><span style="left:${pa[0]}px;top:${pa[1]}px;font-size:${3.4 * pa[2]}rem;z-index:1">${a}</span>
    <span style="left:${pb[0]}px;top:${pb[1]}px;font-size:${3.4 * pb[2]}rem;z-index:${z}">${b}</span></div>`;
}
let blogPlan = [], blogZeit = 0;
function blogAufgaben() {
  const B = pick(BLOGS), links = mischen(B.links).slice(0, 3), praep = mischen(B.praep).slice(0, 2);
  const folge = ['abs', 'link', 'praep', 'abs', 'link', 'praep', 'abs', 'link'];
  const zust = { teile: [{ e: B.abs[0][0], t: B.abs[0][1] }] };   // was schon im Blog steht
  let a = 1, l = 0, p = 0;
  return folge.map((art, nr) => {
    const vorher = zust.teile.slice();
    let auf;
    if (art === 'abs') {
      const richtig = B.abs[a], rest = B.abs.slice(a);
      auf = { frage: 'Was kommt als Nächstes in Berrys Blog?', hinweis: 'Achte auf die Wochentage.', text: richtig[1],
        tipp: 'Sunday → Monday → Tuesday → Wednesday → … · In the end = am Ende', erklaerung: 'Die Wochentage zeigen die Reihenfolge.',
        pruef: e => e === richtig[1], kandidaten: mischen(rest), neu: { e: richtig[0], t: richtig[1] } };
      a++;
      if (a === B.abs.length - 1) { zust.teile.push(auf.neu); auf.danach = { e: B.abs[a][0], t: B.abs[a][1] }; zust.teile.push(auf.danach); a++; }
      else zust.teile.push(auf.neu);
    } else if (art === 'link') {
      const [x, y, w] = links[l++];
      const satz = `${x}, ${w} ${y}`.replace(', and', ' and');
      auf = { frage: `${x} ___ ${y}`, hinweis: 'Welches Wort verbindet die Sätze?', text: w, tipp: 'and = und · but = aber · so = deshalb · because = weil',
        erklaerung: { and: 'and verbindet zwei Dinge, die zusammenpassen.', but: 'but zeigt einen Gegensatz.', so: 'so nennt die Folge (deshalb).', because: 'because nennt den Grund (weil).' }[w],
        pruef: e => e === w, optionen: ['and', 'but', 'so', 'because'], neu: { e: '✏️', t: satz[0].toUpperCase() + satz.slice(1) } };
      zust.teile.push(auf.neu);
    } else {
      const [s, oa, ob, w] = praep[p++];
      const opt = mischen([w, ...mischen(PRAEP.filter(x => x !== w)).slice(0, 3)]);
      auf = { frage: s, hinweis: 'Schau aufs Foto: Welche Präposition passt?', text: w, tipp: 'under = unter · on = auf · next to = neben · behind = hinter · in front of = vor',
        pruef: e => e === w, optionen: opt, bild: [oa, ob, w], neu: { e: '📷', t: s.replace('___', w) } };
      zust.teile.push(auf.neu);
    }
    return Object.assign(auf, { art: 'eigen', typ: 'blog-' + art, sprache: SPRACHE, titel: B.titel, vorher, schluessel: B.titel + nr,
      zeige(box, fertig) {
        const blog = document.createElement('div'); blog.className = 'blog';
        const zeichne = (mit) => { blog.innerHTML = `<h3>${esc(this.titel)}</h3>${this.vorher.map(x => `<div class="abs"><span class="e">${x.e}</span><span>${esc(x.t)}</span></div>`).join('')}
          ${mit ? `<div class="abs neu"><span class="e">${mit.e}</span><span>${esc(mit.t)}</span></div>` : '<div class="leer">… dein nächster Teil …</div>'}`; };
        zeichne(null); box.appendChild(blog);
        const zeigeNeu = async wert => { if (this.pruef(wert)) { zeichne(this.neu); await warte(900); } };
        if (this.kandidaten) {
          const l2 = document.createElement('div');
          l2.innerHTML = this.kandidaten.map((k, i) => `<button type="button" class="karte-a" data-k="${i}"><span class="e">${k[0]}</span><span>${esc(k[1])}</span></button>`).join('');
          box.appendChild(l2);
          l2.addEventListener('click', async e => { const b = e.target.closest('[data-k]'); if (!b || l2.dataset.zu) return; l2.dataset.zu = 1; b.style.borderColor = '#e6a817';
            const w = this.kandidaten[Number(b.dataset.k)][1]; await zeigeNeu(w); fertig(w); });
        } else {
          if (this.bild) box.insertAdjacentHTML('beforeend', bildHTML(...this.bild));
          knoepfe(box, this.optionen, fertig, zeigeNeu);
        }
      } });
  });
}

// ═══ u2 Den Weg beschreiben ═════════════════════════════════
//  Straßenkarte 4 × 3 Kreuzungen. „Go along the street.“ = einen Block geradeaus, „Turn left/right.“ = abbiegen und einen Block.
const ORTE2 = [['🏪', 'the supermarket'], ['🚏', 'the bus stop'], ['💈', 'the hairdresser'], ['🐕', "the dogs' home"], ['🌳', 'the park'], ['📮', 'the post office'], ['🎪', 'the festival'], ['🍞', 'the bakery']];
const SPALTEN = 4, ZEILEN = 3, START2 = [1, 2];
const BEFEHLE = { gerade: 'Go along the street.', links: 'Turn left.', rechts: 'Turn right.' };
const RICHT = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // Norden, Osten, Süden, Westen
function lauf(befehle) {   // → Liste der Kreuzungen oder null (Figur käme von der Karte)
  let [x, y] = START2, r = 0; const weg = [[x, y]];
  for (const b of befehle) {
    if (b === 'links') r = (r + 3) % 4; if (b === 'rechts') r = (r + 1) % 4;
    x += RICHT[r][0]; y += RICHT[r][1];
    if (x < 0 || y < 0 || x >= SPALTEN || y >= ZEILEN) return null;
    weg.push([x, y]);
  }
  return weg;
}
function kurzerWeg(ziel) {   // Breitensuche über Befehlsfolgen (höchstens 5)
  const q = [[]];
  while (q.length) { const w = q.shift(), l = lauf(w); if (!l) continue; const e = l[l.length - 1]; if (w.length && e[0] === ziel[0] && e[1] === ziel[1]) return w; if (w.length < 5) ['gerade', 'links', 'rechts'].forEach(b => q.push(w.concat(b))); }
  return null;
}
const KX = x => 60 + x * 100, KY = y => 50 + y * 90;
function karteSVG(orte, figur, weg) {
  const linien = [];
  for (let y = 0; y < ZEILEN; y++) linien.push(`<line x1="${KX(0)}" y1="${KY(y)}" x2="${KX(SPALTEN - 1)}" y2="${KY(y)}"/>`);
  for (let x = 0; x < SPALTEN; x++) linien.push(`<line x1="${KX(x)}" y1="${KY(0)}" x2="${KX(x)}" y2="${KY(ZEILEN - 1)}"/>`);
  return `<svg class="szene" viewBox="0 0 420 290" role="img" aria-label="Straßenkarte">
    <rect width="420" height="290" fill="#8cc66a"/>
    <g stroke="#6b7280" stroke-width="22" stroke-linecap="round">${linien.join('')}</g>
    <g stroke="#f6f1e7" stroke-width="2" stroke-dasharray="8 8">${linien.join('')}</g>
    ${weg ? `<polyline points="${weg.map(([x, y]) => KX(x) + ',' + KY(y)).join(' ')}" fill="none" stroke="#e6a817" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>` : ''}
    ${orte.map(o => `<g class="tipp-ziel" data-ort="${o.x},${o.y}" tabindex="0" role="button" aria-label="${esc(o.name)}"><circle class="ring" cx="${KX(o.x)}" cy="${KY(o.y)}" r="21" fill="#fbf3e1" stroke="#9a6b43" stroke-width="3"/>
      <text x="${KX(o.x)}" y="${KY(o.y) + 9}" text-anchor="middle" font-size="24">${o.e}</text></g>`).join('')}
    <g class="figur" style="transition:transform .45s ease-in-out" transform="translate(${KX(figur[0])},${KY(figur[1])})"><circle r="13" fill="#6366f1" stroke="#fff" stroke-width="3"/><text y="6" text-anchor="middle" font-size="16">🧑</text></g>
    <text x="${KX(START2[0])}" y="${KY(START2[1]) + 34}" text-anchor="middle" font-size="12" font-weight="800" fill="#1b2a12">START ↑</text>
  </svg>`;
}
function wegAufgabe(lesen) {
  for (let v = 0; v < 40; v++) {
    const plaetze = []; for (let y = 0; y < ZEILEN; y++) for (let x = 0; x < SPALTEN; x++) if (!(x === START2[0] && y === START2[1])) plaetze.push([x, y]);
    const orte = mischen(plaetze).slice(0, 6).map((p, i) => ({ x: p[0], y: p[1] })), namen = mischen(ORTE2);
    orte.forEach((o, i) => { o.e = namen[i][0]; o.name = namen[i][1]; });
    const ziel = pick(orte), w = kurzerWeg([ziel.x, ziel.y]);
    if (!w || w.length < 2) continue;
    const text = w.map(b => BEFEHLE[b]).join(' ');
    const basis = { art: 'eigen', typ: lesen ? 'weg-lesen' : 'weg-bauen', sprache: SPRACHE, schluessel: ziel.name + text + lesen };
    if (lesen) return Object.assign(basis, {
      frage: `“Excuse me, how do I get to ${ziel.name}?” – “${text}”`, hinweis: 'Lies die Wegbeschreibung und tippe an, wo man ankommt.',
      text: `${ziel.e} ${ziel.name}`, ton: text, tipp: 'Start: Die Figur schaut nach oben (Norden). Abbiegen + einen Block.',
      pruef: e => e === ziel.x + ',' + ziel.y, eingabeText: e => { const o = orte.find(o => o.x + ',' + o.y === e); return o ? o.name : '–'; },
      zeige(box, fertig) {
        box.innerHTML = karteSVG(orte, START2);
        const svg = box.querySelector('svg');
        svg.addEventListener('click', async e => {
          const g = e.target.closest('[data-ort]'); if (!g || svg.dataset.zu) return; svg.dataset.zu = 1;
          g.querySelector('.ring').setAttribute('stroke', '#e6a817');
          await laufen(svg, lauf(w)); fertig(g.dataset.ort);
        });
      } });
    return Object.assign(basis, {
      frage: `Lotse die Figur zu ${ziel.e} ${ziel.name}.`, hinweis: 'Bau die Wegbeschreibung – die Figur macht genau, was du sagst.',
      text, tipp: 'Die Figur schaut am Start nach oben. „Turn left/right.“ = abbiegen und einen Block weiter.',
      pruef: e => { const l = lauf(e); return !!l && l[l.length - 1][0] === ziel.x && l[l.length - 1][1] === ziel.y; },
      eingabeText: e => e.map(b => BEFEHLE[b]).join(' ') || '–',
      zeige(box, fertig) {
        box.innerHTML = karteSVG(orte, START2) + '<div class="weg-liste" aria-live="polite"></div><div class="aw-knoepfe"></div>';
        const svg = box.querySelector('svg'), liste = box.querySelector('.weg-liste'), kn = box.querySelector('.aw-knoepfe'), plan = [];
        const neu = () => { liste.textContent = plan.map(b => BEFEHLE[b]).join(' '); kn.querySelector('[data-los]').disabled = !plan.length; };
        kn.innerHTML = Object.entries(BEFEHLE).map(([k, t]) => `<button type="button" class="aw-k" data-b="${k}">${t}</button>`).join('')
          + '<button type="button" class="aw-k" data-weg aria-label="Letzten Satz löschen">⌫</button><button type="button" class="aw-k aw-p" data-los disabled>▶ Los!</button>';
        kn.addEventListener('click', async e => {

async function laufen(svg, weg) {

// ═══ u4 Shops vergleichen ══════════════════════════════════
const LAEDEN = [['Charity Corner', '#d9534f'], ['Teen Style', '#6366f1'], ['Mega Store', '#3ea36b'], ['Second-Hand Sam', '#e6a817'], ['Happy Shop', '#e86b9a']];
const DINGE = [['🧤', 'gloves', true], ['📰', 'a magazine'], ['👗', 'a dress'], ['💿', 'CDs', true], ['🛹', 'a skateboard'], ['👟', 'trainers', true], ['🎒', 'a rucksack'], ['🧣', 'a scarf']];
const NAMEN4 = ['Mia', 'Jack', 'Leo', 'Emma', 'Ben', 'Lily'];

function shopAufgabe() {
  for (let v = 0; v < 80; v++) {
    const ld = mischen(LAEDEN).slice(0, 3), [e, ding, mehrzahl] = pick(DINGE), wer = pick(NAMEN4);
    const preise = mischen([3, 5, 8, 12, 15, 20]).slice(0, 3), noten = mischen([1, 2, 3, 4, 5]).slice(0, 3), meilen = mischen([0.5, 1, 2, 3]).slice(0, 3);
    const shops = ld.map((l, i) => ({ name: l[0], f: l[1], preis: preise[i], note: noten[i], meilen: meilen[i] }));
    const es = mehrzahl ? 'them' : 'it', welche = mehrzahl ? 'ones' : 'one';
    const art = pick(['billig', 'teuer', 'gut', 'nah', 'kombi1', 'kombi2', 'kombi3']);
    const A = shops[0], B = shops[1];
    let satz, passt, regel;
    if (art === 'billig') { satz = `${wer} wants ${ding}. ${wer === 'Mia' || wer === 'Emma' || wer === 'Lily' ? 'She' : 'He'} wants the cheapest ${welche}.`; passt = s => s.preis === Math.min(...preise); regel = 'the cheapest = der niedrigste Preis'; }
    else if (art === 'teuer') { satz = `${wer} has lots of pocket money and wants the most expensive ${ding.replace(/^a /, '')}.`; passt = s => s.preis === Math.max(...preise); regel = 'the most expensive = der höchste Preis'; }
    else if (art === 'gut') { satz = `${wer} wants ${ding} from the best shop – the one with the most stars.`; passt = s => s.note === Math.max(...noten); regel = 'the best = die meisten Sterne'; }
    else if (art === 'nah') { satz = `${wer} can't walk far. Which shop is the nearest?`; passt = s => s.meilen === Math.min(...meilen); regel = 'the nearest = am nächsten (die wenigsten Meilen)'; }

    const treffer = shops.filter(passt);

    const ziel = treffer[0], gem = mischen(shops);
    return { art: 'eigen', typ: 'shop-' + art, sprache: SPRACHE, frage: satz, ton: satz, schluessel: satz + preise.join(), hinweis: `Tippe den Laden an, in dem ${wer} einkauft.`,
      text: ziel.name, tipp: regel, erklaerung: regel, pruef: x => x === ziel.name, eingabeText: x => x,
      zeige(box, fertig) {
        box.innerHTML = `<div class="shops">${gem.map((s, i) => `<button type="button" class="shop" data-s="${i}" style="--f:${s.f}"><div class="dach"></div><b>${esc(s.name)}</b>
