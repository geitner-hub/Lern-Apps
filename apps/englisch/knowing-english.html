<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <script src="../../gemeinsam/umgebung.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Knowing English – Lernwelt</title>
  <!--
  ═══════════════════════════════════════════════
   LERNWELT – Knowing English (Neue Lern-Apps Etappe 7)
   Übersicht aller Grammatik-Strukturen als Kacheln mit Fortschritt, dazu „Mixed“ (alles
   durcheinander), „Welche Zeit passt?“ und „Meine Themen“ (nur schon Geübtes).

   Jede Struktur ist eine Inhaltsdatei des Aufgabentyp-Baukastens (daten/inhalte/en/<ID>.json)
   und öffnet in apps/typen/uebung.html. Mixed & Co. stehen in en.5.knowing-english.json.
   Strukturen über der Klasse des Kindes (Pass) erscheinen nicht; Freigaben aus dem Admin gelten.
   Neue Struktur: Inhaltsdatei + Katalog-Thema + Eintrag in STRUKTUREN unten (+ "aus" der Mixed-Stufen).
  ═══════════════════════════════════════════════
  -->
  <link rel="stylesheet" href="../../gemeinsam/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0f0e1a; --surface: #1b1929; --surface2: #252238; --accent: #e6a817; --indigo: #6366f1; --indigo2: #818cf8;
      --text: #f1f0fb; --text2: rgba(241,240,251,.65); --muted: rgba(241,240,251,.4); --line: rgba(255,255,255,.08); }
    body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh;
      padding: max(1.2rem, env(safe-area-inset-top)) 1rem 6rem; -webkit-tap-highlight-color: transparent; }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: clamp(2rem, 5vw, 2.8rem); color: var(--accent); }
    .sub { color: var(--text2); margin: .2rem 0 1.2rem; max-width: 62ch; }
    .gross { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; margin-bottom: 1.6rem; }
    @media (max-width: 720px) { .gross { grid-template-columns: 1fr; } }
    a.karte { display: flex; gap: .8rem; align-items: center; text-decoration: none; color: inherit; background: var(--surface);
      border: 1px solid var(--line); border-radius: 18px; padding: 1rem 1.1rem; min-height: 4.6rem; transition: transform .15s, border-color .15s; }
    a.karte:hover, a.karte:focus-visible { transform: translateY(-2px); border-color: rgba(230,168,23,.55); outline: none; }
    a.karte.mixed { background: linear-gradient(135deg, rgba(99,102,241,.35), rgba(230,168,23,.18)); border-color: rgba(129,140,248,.45); }
    .ico { font-size: 1.9rem; flex-shrink: 0; width: 2.4rem; text-align: center; }
    .txt { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
    .txt b { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: 1.2rem; }
    .txt small { color: var(--text2); font-size: .85rem; line-height: 1.3; }
    h2 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: 1.3rem; color: var(--indigo2); margin: 1.2rem 0 .6rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .7rem; }
    .fort { display: flex; gap: 3px; margin-top: .35rem; }
    .fort i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); }
    .fort i.an { background: var(--accent); } .fort i.halb { background: var(--indigo2); }
    .zu { opacity: .45; pointer-events: none; }
    .hinweis { color: var(--muted); font-size: .85rem; margin-top: 1rem; }
    @media (prefers-reduced-motion: reduce) { a.karte { transition: none; } }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🧩 Knowing English</h1>
  <p class="sub">Alle Grammatik-Themen an einem Ort. Übe ein Thema – oder alles durcheinander bei „Mixed“.</p>
  <div class="gross" id="gross"></div>
  <h2>Themen</h2>
  <div class="grid" id="themen"></div>
  <p class="hinweis" id="hinweis"></p>
</div>

<script src="../../gemeinsam/katalog.js"></script>
<script src="../../gemeinsam/freigabe.js"></script>
<script>
'use strict';
// Reihenfolge = Reihenfolge im Lehrwerk (bitte mit dem Buch abgleichen); klasse: ab welcher Klasse sichtbar
const STRUKTUREN = [
  { id: 'en.5.to-be', ico: '👋', kurz: 'I am, she is, we are' },
  { id: 'en.5.have-got', ico: '🎒', kurz: 'She has got a cat.' },
  { id: 'en.5.can', ico: '🏊', kurz: 'I can swim.' },
  { id: 'en.5.nomen', ico: '🍎', kurz: 'two boxes, an apple' },
  { id: 'en.5.pronomen', ico: '👤', kurz: "me, my, Tom's" },
  { id: 'en.5.there-is', ico: '🏠', kurz: 'There are two cats.' },
  { id: 'en.5.fragen', ico: '❓', kurz: 'What, where, when …' },
  { id: 'en.5.praepositionen', ico: '📍', kurz: 'in, on, at …' },
  { id: 'en.5.simple-present', ico: '🔁', kurz: 'he/she/it – s' },
  { id: 'en.5.present-progressive', ico: '👀', kurz: 'Look! It is raining.' },
  { id: 'en.5.simple-past', ico: '⏪', kurz: 'played, went, did' },
  { id: 'en.6.future', ico: '🔮', kurz: 'I think it will rain.' },
  { id: 'en.6.steigerung', ico: '📈', kurz: 'bigger, the best' },
  { id: 'en.6.some-any', ico: '🍪', kurz: 'Have you got any pets?' },
];
const MIX = 'en.5.knowing-english';
const UEBUNG = '../typen/uebung.html?inhalt=';
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function klasse() {
  try { const p = JSON.parse(localStorage.getItem('lernwelt-pass') || 'null');      // Testumgebung: umgebung.js setzt das Präfix selbst
        const k = p && p.profile && Number(p.profile.klasse); return k >= 1 && k <= 13 ? k : 0; }
  catch (e) { return 0; }
}
const strukturKlasse = id => Number(String(id).split('.')[1]) || 5;
const frei = id => !window.LernFreigabe || LernFreigabe.erlaubt(id);

/** Fortschritt: je Stufe ⭐ (2 gute Runden ≥ 70 %) oder angefangen */
function fortschritt(id) {
  const P = window.LernPass, ls = P && P.state && P.state.lernstand;
  const stufen = (window.LernKatalog && LernKatalog.stufen(id)) || [];
  return stufen.filter(s => !/\.mix$/.test(s.id)).map(s => {
    const e = ls && ls[s.id];
    if (!e) return '';
    return (Array.isArray(e.p) ? e.p : []).filter(x => x >= 70).length >= 2 ? 'an' : 'halb';
  });
}

function zeichne() {
  const k = klasse(), bis = k || 6;
  const sichtbar = STRUKTUREN.filter(s => strukturKlasse(s.id) <= bis);
  const mixStufe = bis >= 6 ? 'mixed-6' : 'mixed-5', zeitStufe = bis >= 6 ? 'zeiten-6' : 'zeiten';
  const gross = [
    { stufe: mixStufe, ico: '🧩', titel: 'Mixed', kurz: 'Alle Themen bis Klasse ' + bis + ' durcheinander', mixed: true },
    { stufe: zeitStufe, ico: '⏱️', titel: 'Welche Zeit passt?', kurz: 'Signalwörter erkennen' },
    { stufe: 'meine', ico: '⭐', titel: 'Meine Themen', kurz: 'Nur was du schon geübt hast' },
  ];
  $('gross').innerHTML = gross.map(g => {
    const sid = MIX + '.' + g.stufe;
    return `<a class="karte${g.mixed ? ' mixed' : ''}${frei(sid) ? '' : ' zu'}" href="${UEBUNG + MIX}&stufe=${encodeURIComponent(sid)}">
      <span class="ico" aria-hidden="true">${g.ico}</span><span class="txt"><b>${esc(g.titel)}</b><small>${esc(g.kurz)}</small></span></a>`;
  }).join('');
  $('themen').innerHTML = sichtbar.map(s => {
    const th = window.LernKatalog && LernKatalog.thema(s.id);
    const f = fortschritt(s.id), offen = frei(s.id);
    return `<a class="karte${offen ? '' : ' zu'}" href="${UEBUNG + encodeURIComponent(s.id)}">
      <span class="ico" aria-hidden="true">${offen ? s.ico : '🔒'}</span><span class="txt"><b>${esc(th ? th.titel : s.id)}</b>
      <small>${esc(s.kurz)}</small>${f.length ? `<span class="fort" aria-label="Fortschritt">${f.map(c => `<i class="${c}"></i>`).join('')}</span>` : ''}</span></a>`;
  }).join('');
  $('hinweis').textContent = k ? `Du siehst die Themen bis Klasse ${k}.` : 'Tipp: Mit Lernwelt-Pass siehst du genau die Themen deiner Klasse.';
}

zeichne();
if (window.LernKatalog && LernKatalog.bereit) LernKatalog.bereit.then(zeichne).catch(() => {});
window.addEventListener('lernpass:ready', zeichne);
window.addEventListener('lernfreigabe:neu', zeichne);
</script>
<script src="../../gemeinsam/navbar.js"></script>
</body>
</html>
