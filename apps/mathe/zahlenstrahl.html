<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<script src="../../gemeinsam/umgebung.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Zahlenstrahl – Lernwelt</title>
<!--
  ═══════════════════════════════════════════════
   LERNWELT – Zahlenstrahl (Mathe 5, Neue Lern-Apps Etappe 9a)
   Beide Richtungen: ablesen (Pfeil → Zahl) und einzeichnen (Zahl → Stelle antippen).
   Läuft auf dem Übungs-Rahmen (ueben.js); Eingaben über gemeinsam/ziffernblock.js.

   Stufen (Katalog ma.5.zahlenstrahl.*):
     Ablesen         bis 1 000, kleine Schritte 5/10/50, Start nicht immer bei 0
     Einzeichnen     bis 1 000, Stelle antippen (zählt der nächste Strich = halber Schritt Toleranz)
     Skala erkennen  bis 100 000: Wie groß ist ein Schritt? Fehlende Zahl am Pfeil
     Große Zahlen    bis 10 Millionen, ablesen und einzeichnen
     Lupe            Ausschnitt vergrößern (z. B. zwischen 3 400 und 3 500 genauer)
   Falsche Antwort: der Strahl zeigt die richtige Stelle (grün) und die getippte (rot) mit Abstand.
   Konfiguration der Skalen: SKALEN unten.
  ═══════════════════════════════════════════════
-->
<link rel="stylesheet" href="../../gemeinsam/fonts.css">
<style>
  html, body { margin: 0; background: #0f0e1a; }
  #app { padding-top: env(safe-area-inset-top, 0px); }
  .lu .eigen { max-width: 980px; }
  .lu .fb.mit-bild { max-width: 900px; }
  .strahl { display: block; width: 100%; height: auto; max-width: 980px; margin: .2rem auto .4rem; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; overflow: visible; }
  .strahl .linie { stroke: #f1f0fb; stroke-width: 3; }
  .strahl .strich { stroke: #f1f0fb; stroke-width: 2; }
  .strahl .strich.gross { stroke-width: 3.5; }
  .strahl .zahl { fill: #f1f0fb; font: 800 27px 'Nunito', sans-serif; text-anchor: middle; }
  .strahl .pfeil { fill: #e6a817; }
  .strahl .ziel { fill: #4ade80; } .strahl .tipp-m { fill: #f87171; }
  .strahl .abstand { stroke: #f87171; stroke-width: 3; stroke-dasharray: 6 4; fill: none; }
  .strahl .abst-text { fill: #fca5a5; font: 800 18px 'Nunito', sans-serif; text-anchor: middle; }
  .strahl .lupe-feld { fill: rgba(230,168,23,.25); stroke: #e6a817; stroke-width: 2; }
  .strahl .lupe-linie { stroke: rgba(230,168,23,.6); stroke-width: 2; stroke-dasharray: 5 4; }
  .strahl .tippzone { fill: transparent; cursor: pointer; }
  .zs-feld { min-width: 10ch; min-height: 3.4rem; margin: .3rem auto .2rem; display: flex; align-items: center; justify-content: center;
    background: #0b0a14; border: 3px solid #6366f1; border-radius: 16px; color: #f1f0fb; font: 900 2rem 'Nunito', sans-serif; padding: .2rem 1rem; width: fit-content; }
  .zs-feld.zb-leer::before { content: '?'; color: rgba(255,255,255,.3); }
  .zs-zeile { display: flex; gap: .6rem; justify-content: center; margin-top: .4rem; }
  .zs-hinweis { text-align: center; color: rgba(241,240,251,.6); font-weight: 800; font-size: .9rem; }
</style>
</head>
<body>
<div id="app"></div>

<script src="../../gemeinsam/freigabe.js"></script>
<script src="../../gemeinsam/ueben.js"></script>
<script src="../../gemeinsam/ziffernblock.js"></script>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const fmt = n => LernZiffernblock.format(n);
const zufall = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const wahl = l => l[Math.floor(Math.random() * l.length)];

/* ═══════════════════════════════════════════════════════
   SKALEN je Stufe: k = Wert eines kleinen Schritts, je = kleine Schritte je beschrifteter Strich,
   n = kleine Schritte auf dem Strahl, max = größte Zahl
   ═══════════════════════════════════════════════════════ */
const SKALEN = {
  klein: [{ k: 10, je: 10, n: 20, max: 1000 }, { k: 10, je: 5, n: 20, max: 1000 }, { k: 5, je: 10, n: 20, max: 1000 },
          { k: 50, je: 2, n: 20, max: 1000 }, { k: 1, je: 10, n: 20, max: 1000 }, { k: 2, je: 5, n: 20, max: 1000 }],
  skala: [{ k: 20, je: 5, n: 20, max: 100000 }, { k: 25, je: 4, n: 20, max: 100000 }, { k: 200, je: 5, n: 20, max: 100000 },
          { k: 250, je: 4, n: 20, max: 100000 }, { k: 500, je: 2, n: 20, max: 100000 }, { k: 1000, je: 5, n: 20, max: 100000 },
          { k: 2000, je: 5, n: 20, max: 100000 }, { k: 5000, je: 2, n: 20, max: 100000 }, { k: 50, je: 10, n: 20, max: 100000 }],
  gross: [{ k: 100000, je: 10, n: 20, max: 10000000 }, { k: 500000, je: 2, n: 20, max: 10000000 }, { k: 50000, je: 10, n: 20, max: 10000000 },
          { k: 200000, je: 5, n: 20, max: 10000000 }, { k: 10000, je: 10, n: 20, max: 10000000 }],
};
function skala(art) {
  const s = Object.assign({}, wahl(SKALEN[art]));
  const block = s.k * s.je, spanne = s.k * s.n;
  const starts = Math.floor((s.max - spanne) / block);
  s.start = Math.random() < .3 ? 0 : zufall(0, Math.max(0, starts)) * block;   // nicht immer bei 0
  return s;
}
const wert = (s, i) => s.start + i * s.k;
/** Strich (nicht beschriftet), auf den der Pfeil zeigt */
function freierStrich(s) { let i; do { i = zufall(1, s.n - 1); } while (i % s.je === 0); return i; }

/* ═══════════════════════════════════════════════════════
   ZEICHNEN
   ═══════════════════════════════════════════════════════ */
const X0 = 60, X1 = 940, Y = 90;
const xVon = (s, i) => X0 + (X1 - X0) * i / s.n;
function el(name, attr, text) { const e = document.createElementNS(NS, name); Object.entries(attr).forEach(([k, v]) => e.setAttribute(k, v)); if (text != null) e.textContent = text; return e; }

/**
 * Strahl als SVG. o = { s, beschriftet: Set(i) | 'alle', pfeil: i, ziel: i, tipp: i, oben: y-Versatz, svg }
 */
function strahl(o) {
  const s = o.s, y = Y + (o.oben || 0);
  const svg = o.svg || el('svg', { class: 'strahl', viewBox: `0 ${o.oben ? 0 : 20} 1000 ${o.hoehe || 150}`, role: 'img', 'aria-label': 'Zahlenstrahl' });
  svg.appendChild(el('line', { class: 'linie', x1: X0 - 25, y1: y, x2: X1 + 30, y2: y }));
  svg.appendChild(el('path', { d: `M${X1 + 30} ${y - 9} L${X1 + 48} ${y} L${X1 + 30} ${y + 9}Z`, fill: '#f1f0fb' }));
  // Beschriftung so dünn, dass nichts überlappt
  const abstand = (X1 - X0) / s.n * s.je, laengste = fmt(wert(s, s.n)).length * 15;
  const jeder = Math.ceil(laengste / (abstand * .95));
  for (let i = 0; i <= s.n; i++) {
    const gross = i % s.je === 0, x = xVon(s, i);
    svg.appendChild(el('line', { class: 'strich' + (gross ? ' gross' : ''), x1: x, y1: y - (gross ? 16 : 9), x2: x, y2: y + (gross ? 16 : 9) }));
    const zeigen = o.beschriftet === 'alle' ? gross && (i / s.je) % jeder === 0 : o.beschriftet && o.beschriftet.has(i);
    if (zeigen) svg.appendChild(el('text', { class: 'zahl', x, y: y + 44 }, fmt(wert(s, i))));
  }
  if (o.pfeil != null) { const x = xVon(s, o.pfeil); svg.appendChild(el('path', { class: 'pfeil', d: `M${x} ${y - 20} L${x - 12} ${y - 46} L${x + 12} ${y - 46}Z` })); }
  if (o.ziel != null) { const x = xVon(s, o.ziel); svg.appendChild(el('circle', { class: 'ziel', cx: x, cy: y, r: 11 })); }
  if (o.tipp != null && o.tipp !== o.ziel) {
    const x = xVon(s, o.tipp), xz = xVon(s, o.ziel);
    svg.appendChild(el('circle', { class: 'tipp-m', cx: x, cy: y, r: 10 }));
    if (o.ziel != null) {
      svg.appendChild(el('path', { class: 'abstand', d: `M${x} ${y - 24} L${x} ${y - 34} L${xz} ${y - 34} L${xz} ${y - 24}` }));
      svg.appendChild(el('text', { class: 'abst-text', x: (x + xz) / 2, y: y - 44 }, 'Abstand: ' + fmt(Math.abs(o.ziel - o.tipp) * s.k)));
    }
  }
  return svg;
}

/** Eingabe mit Ziffernblock (ein Zahlenfeld) */
function zahlEingabe(box, fertig) {
  const feld = document.createElement('div'); feld.className = 'zs-feld';
  box.appendChild(feld);
  LernZiffernblock.erstelle({ box, felder: [feld], einstellig: false, gruppieren: true, max: 9,
    fertig: w => { if (w[0]) fertig(Number(w[0])); } });
}
/** Stelle antippen: der nächste Strich zählt (Toleranz = halber kleiner Schritt) */
function antippen(box, s, svg, fertig) {
  let gewaehlt = null, marke = null;
  svg.appendChild(el('rect', { class: 'tippzone', x: X0 - 30, y: Y - 60, width: X1 - X0 + 60, height: 120 }));
  svg.addEventListener('pointerdown', e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    gewaehlt = Math.max(0, Math.min(s.n, Math.round((q.x - X0) / (X1 - X0) * s.n)));
    if (marke) marke.remove();
    const x = xVon(s, gewaehlt);
    marke = el('path', { class: 'pfeil', d: `M${x} ${Y - 20} L${x - 12} ${Y - 46} L${x + 12} ${Y - 46}Z` });
    svg.appendChild(marke);
    ok.disabled = false; ok.style.opacity = '';
  });
  const z = document.createElement('div'); z.className = 'zs-zeile';
  z.innerHTML = '<button type="button" class="btn p" disabled style="opacity:.4">✓ Fertig</button>';
  const ok = z.firstElementChild;
  ok.addEventListener('click', () => { if (gewaehlt != null) fertig(gewaehlt); });
  box.appendChild(z);
}

/* ═══════════════════════════════════════════════════════
   AUFGABEN
   ═══════════════════════════════════════════════════════ */
function ablesen(art) {
  const s = skala(art), i = freierStrich(s), loes = wert(s, i);
  return { typ: 'ablesen', art: 'eigen', frage: 'Welche Zahl zeigt der Pfeil?', hinweis: 'Tippe die Zahl mit dem Ziffernblock.',
    text: fmt(loes), tipp: 'Ein kleiner Schritt ist ' + fmt(s.k) + '. Zähle vom letzten beschrifteten Strich aus weiter.',
    zeige: (box, fertig) => { box.appendChild(strahl({ s, beschriftet: 'alle', pfeil: i })); zahlEingabe(box, fertig); },
    pruef: e => e === loes, eingabeText: e => fmt(e),
    loesungZeige: (box, e) => {
      const t = Math.round((e - s.start) / s.k);
      box.appendChild(strahl({ s, beschriftet: 'alle', ziel: i, tipp: t >= 0 && t <= s.n ? t : null }));
    } };
}
function einzeichnen(art) {
  const s = skala(art), i = freierStrich(s), ziel = wert(s, i);
  return { typ: 'einzeichnen', art: 'eigen', frage: 'Wo liegt ' + fmt(ziel) + '?', hinweis: 'Tippe die Stelle auf dem Zahlenstrahl an.',
    text: 'der Strich bei ' + fmt(ziel), tipp: 'Ein kleiner Schritt ist ' + fmt(s.k) + '.',
    zeige: (box, fertig) => { const svg = strahl({ s, beschriftet: 'alle' }); box.appendChild(svg); antippen(box, s, svg, fertig); },
    pruef: e => e === i, eingabeText: e => fmt(wert(s, e)),
    loesungZeige: (box, e) => box.appendChild(strahl({ s, beschriftet: 'alle', ziel: i, tipp: e })) };
}
function skalaErkennen() {
  const s = skala('skala');
  if (Math.random() < .5) {
    // Wie groß ist ein Schritt? Nur zwei beschriftete Striche
    const a = zufall(0, 1) * s.je, b = a + s.je * zufall(1, 2);
    return { typ: 'schritt', art: 'eigen', frage: 'Wie groß ist ein kleiner Schritt?', hinweis: 'Unterschied der beiden Zahlen geteilt durch die Zahl der Schritte.',
      text: fmt(s.k), erklaerung: `${fmt(wert(s, b))} − ${fmt(wert(s, a))} = ${fmt(wert(s, b) - wert(s, a))}; das sind ${b - a} Schritte → ${fmt(s.k)} je Schritt.`,
      zeige: (box, fertig) => { box.appendChild(strahl({ s, beschriftet: new Set([a, b]) })); zahlEingabe(box, fertig); },
      pruef: e => e === s.k, eingabeText: e => fmt(e) };
  }
  // fehlende Zahl am Pfeil, nur zwei Beschriftungen
  const i = freierStrich(s), loes = wert(s, i), bes = new Set([0, s.je]);
  return { typ: 'fehlt', art: 'eigen', frage: 'Welche Zahl gehört an den Pfeil?', hinweis: 'Finde zuerst heraus, wie groß ein Schritt ist.', text: fmt(loes),
    zeige: (box, fertig) => { box.appendChild(strahl({ s, beschriftet: bes, pfeil: i })); zahlEingabe(box, fertig); },
    pruef: e => e === loes, eingabeText: e => fmt(e),
    loesungZeige: (box, e) => { const t = Math.round((e - s.start) / s.k); box.appendChild(strahl({ s, beschriftet: 'alle', ziel: i, tipp: t >= 0 && t <= s.n ? t : null })); } };
}
function lupe() {
  // grob: 10 Schritte zu f·100, fein: der markierte Abschnitt mit 10 Schritten zu f·10
  const f = wahl([1, 1, 10, 100]), grob = { k: 100 * f, je: 10, n: 10 }, tausender = zufall(0, 8) * 1000 * f;
  grob.start = tausender;
  const abschnitt = zufall(0, 9), fein = { k: 10 * f, je: 5, n: 10, start: tausender + abschnitt * 100 * f };
  const i = freierStrich(fein), loes = wert(fein, i), einz = Math.random() < .4;
  const bild = (o) => {
    const svg = el('svg', { class: 'strahl', viewBox: '0 0 1000 300', role: 'img', 'aria-label': 'Zahlenstrahl mit Lupe' });
    strahl({ s: grob, beschriftet: 'alle', svg, oben: -30 });
    const xa = xVon(grob, abschnitt), xb = xVon(grob, abschnitt + 1);
    svg.appendChild(el('rect', { class: 'lupe-feld', x: xa, y: Y - 48, width: xb - xa, height: 36 }));
    svg.appendChild(el('line', { class: 'lupe-linie', x1: xa, y1: Y - 12, x2: X0, y2: Y + 130 }));
    svg.appendChild(el('line', { class: 'lupe-linie', x1: xb, y1: Y - 12, x2: X1, y2: Y + 130 }));
    strahl(Object.assign({ s: fein, beschriftet: 'alle', svg, oben: 150 }, o));
    return svg;
  };
  if (einz) return { typ: 'lupe-einzeichnen', art: 'eigen', frage: 'Wo liegt ' + fmt(loes) + '?', hinweis: 'Tippe auf dem unteren (vergrößerten) Strahl.',
    text: 'der Strich bei ' + fmt(loes),
    zeige: (box, fertig) => {
      const svg = bild({}); box.appendChild(svg);
      // Tippen nur auf dem unteren Strahl: eigene Hilfs-Skala mit Versatz
      let gewaehlt = null, marke = null;
      svg.addEventListener('pointerdown', e => {
        const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
        const q = p.matrixTransform(svg.getScreenCTM().inverse());
        if (q.y < Y + 90) return;
        gewaehlt = Math.max(0, Math.min(fein.n, Math.round((q.x - X0) / (X1 - X0) * fein.n)));
        if (marke) marke.remove();
        const x = xVon(fein, gewaehlt), y = Y + 150;
        marke = el('path', { class: 'pfeil', d: `M${x} ${y - 20} L${x - 12} ${y - 46} L${x + 12} ${y - 46}Z` }); svg.appendChild(marke);
        ok.disabled = false; ok.style.opacity = '';
      });
      const z = document.createElement('div'); z.className = 'zs-zeile';
      z.innerHTML = '<button type="button" class="btn p" disabled style="opacity:.4">✓ Fertig</button>';
      const ok = z.firstElementChild; ok.addEventListener('click', () => { if (gewaehlt != null) fertig(gewaehlt); });
      box.appendChild(z);
    },
    pruef: e => e === i, eingabeText: e => fmt(wert(fein, e)),
    loesungZeige: (box, e) => box.appendChild(bild({ ziel: i, tipp: e })) };
  return { typ: 'lupe-ablesen', art: 'eigen', frage: 'Welche Zahl zeigt der Pfeil?', hinweis: 'Unten siehst du den markierten Abschnitt vergrößert.', text: fmt(loes),
    zeige: (box, fertig) => { box.appendChild(bild({ pfeil: i })); zahlEingabe(box, fertig); },
    pruef: e => e === loes, eingabeText: e => fmt(e),
    loesungZeige: (box, e) => { const t = Math.round((e - fein.start) / fein.k); box.appendChild(bild({ ziel: i, tipp: t >= 0 && t <= fein.n ? t : null })); } };
}

const STUFEN = [
  { id: 'ma.5.zahlenstrahl.ablesen', titel: 'Ablesen', kurz: 'Pfeil → Zahl (bis 1 000)', erzeuge: () => ablesen('klein') },
  { id: 'ma.5.zahlenstrahl.einzeichnen', titel: 'Einzeichnen', kurz: 'Zahl → Stelle antippen', erzeuge: () => einzeichnen('klein') },
  { id: 'ma.5.zahlenstrahl.skala', titel: 'Skala erkennen', kurz: 'Wie groß ist ein Schritt? (bis 100 000)', erzeuge: skalaErkennen },
  { id: 'ma.5.zahlenstrahl.gross', titel: 'Große Zahlen', kurz: 'bis 10 Millionen', erzeuge: () => (Math.random() < .5 ? ablesen : einzeichnen)('gross') },
  { id: 'ma.5.zahlenstrahl.lupe', titel: 'Lupe', kurz: 'Ausschnitt genauer einordnen', erzeuge: lupe },
];
const HILFE = `<section><h2>So liest du einen Zahlenstrahl</h2>
  <p>1. Suche zwei beschriftete Striche. 2. Rechne den Unterschied aus. 3. Teile durch die Zahl der kleinen Schritte dazwischen – das ist ein Schritt.
  4. Zähle vom letzten beschrifteten Strich aus weiter.</p>
  <p>Beispiel: zwischen 200 und 300 liegen 10 Schritte → ein Schritt ist 10. Drei Schritte nach 200 liegt 230.</p></section>
  <section><h2>Große Zahlen</h2><p>Große Zahlen schreibt man in Dreiergruppen mit Abstand: 3 400 000 (drei Millionen vierhunderttausend).</p></section>`;

LernUeben.start({
  host: document.getElementById('app'), titel: '📏 Zahlenstrahl', untertitel: 'Ablesen und einzeichnen – bis 10 Millionen',
  stufen: STUFEN.map(s => ({ id: s.id, titel: s.titel, kurz: s.kurz })), runde: 8, hilfe: { html: HILFE },
  erzeuge: st => { const s = STUFEN.find(x => x.id === st.id); const a = s && s.erzeuge(); if (a) a.schluessel = a.typ + Math.random(); return a; },
  pruefe: (a, e) => { try { return !!a.pruef(e); } catch (err) { return false; } },
});
</script>
<script src="../../gemeinsam/navbar.js"></script>
</body>
</html>
