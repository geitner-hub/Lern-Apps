<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<script src="../../gemeinsam/umgebung.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mathe-Trainer – Lernwelt</title>
<!--
  ═══════════════════════════════════════════════
   Mathe-Trainer (Infrastruktur Etappe 4b): der Stoff der ganzen Jahrgangsstufe in Stufen.
     mathe-trainer.html?klasse=5   Große Zahlen, Rechenregeln, Rechenvorteile, Ganze Zahlen …
     mathe-trainer.html?klasse=6   Teilbarkeit, Brüche, Dezimalzahlen …
   Neue Themen der Jahrgangsstufe = neue Stufe in daten/kopfrechnen.json (apps.trainer).
   Früher: kopfrechnen-neu.html (leitet hierher weiter, Ergebnisse werden übernommen).
  ═══════════════════════════════════════════════
-->
<link rel="stylesheet" href="../../gemeinsam/fonts.css">
<style>
  html, body { margin: 0; background: #0f0e1a; }
  #app { padding-top: env(safe-area-inset-top, 0px); }
  .laden { color: rgba(241,240,251,.6); font: 800 1rem 'Nunito', system-ui, sans-serif; text-align: center; padding: 4rem 1rem; }
</style>
</head>
<body>
<div id="app"><p class="laden">⏳ Einen Moment …</p></div>

<script src="../../gemeinsam/generatoren-mathe.js"></script>
<script src="../../gemeinsam/freigabe.js"></script>
<script src="../../gemeinsam/ueben.js"></script>
<script>
  LernUeben.startMathe({
    app: 'trainer', host: document.getElementById('app'), standardKlasse: 5, icon: '🧮',
    umzug: kl => 'kopfrechnen-neu.html?klasse=' + kl,
  });
</script>
<script src="../../gemeinsam/navbar.js"></script>
</body>
</html>
