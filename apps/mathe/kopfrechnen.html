<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<script src="../../gemeinsam/umgebung.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kopfrechnen – Lernwelt</title>
<!--
  ═══════════════════════════════════════════════
   Kopfrechnen (Infrastruktur Etappe 4b): nur Einmaleins und Grundrechenarten.
   Eine Datei für alle Klassen:  kopfrechnen.html            → Klasse 5
                                 kopfrechnen.html?klasse=6   → Klasse 6 (1–6 möglich)
   Die alten Dateien kopfrechnen_kl1–6.html leiten hierher weiter; Ergebnisse,
   Sterne und offene Dorf-Aufträge werden beim ersten Öffnen übernommen.
   Stufen: daten/kopfrechnen.json (apps.kopfrechnen) · Aufgaben: gemeinsam/generatoren-mathe.js
   Rechenregeln, Brüche usw. stehen im Mathe-Trainer (mathe-trainer.html).
  ═══════════════════════════════════════════════
-->
<link rel="stylesheet" href="../../gemeinsam/fonts.css">
<style>
  html, body { margin: 0; background: #0f0e1a; }
  #app { padding-top: env(safe-area-inset-top, 0px); }
  .laden { color: rgba(241,240,251,.6); font: 800 1rem 'Nunito', system-ui, sans-serif; text-align: center; padding: 4rem 1rem; }
</style>
</head>
<body>
<div id="app"><p class="laden">⏳ Einen Moment …</p></div>

<script src="../../gemeinsam/generatoren-mathe.js"></script>
<script src="../../gemeinsam/freigabe.js"></script>
<script src="../../gemeinsam/ueben.js"></script>
<script>
  LernUeben.startMathe({
    app: 'kopfrechnen', host: document.getElementById('app'), standardKlasse: 5, icon: '🧠',
    umzug: kl => kl === '5' ? null : 'kopfrechnen_kl' + kl + '.html',   // bisherige App je Klasse
  });
</script>
<script src="../../gemeinsam/navbar.js"></script>
</body>
</html>
