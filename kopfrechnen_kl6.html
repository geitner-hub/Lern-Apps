<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kopfrechnen Klasse 6</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #00e5a0;
      --accent-warm: #ffb347;
      --bad: #ff6b6b;
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --border2: #21262d;
      --text: #e6edf3;
      --muted: #8b949e;
      --leicht: #00e5a0;
      --mittel: #ffb347;
      --schwer: #ff6b9d;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(transparent 50%, rgba(0,0,0,0.015) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    #app { position: relative; z-index: 2; width: 100%; max-width: 540px; }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 28px; }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      letter-spacing: 0.12em;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0,229,160,0.6), 0 0 60px rgba(0,229,160,0.2);
      line-height: 1;
    }

    .subtitle {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.3em;
      margin-top: 4px;
    }

    .stats-badge {
      display: none;
      margin-top: 12px;
      padding: 4px 16px;
      border-radius: 4px;
      background: rgba(0,229,160,0.08);
      border: 1px solid rgba(0,229,160,0.3);
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: clamp(24px, 6vw, 44px);
      box-shadow: 0 0 0 1px var(--border2), 0 24px 48px rgba(0,0,0,0.6), 0 0 80px rgba(0,229,160,0.04);
    }

    /* ── Buttons ── */
    .btn { cursor: pointer; border: none; font-family: 'JetBrains Mono', monospace; transition: all 0.15s; }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .btn:active { transform: translateY(1px); }

    .btn-confirm {
      padding: 14px 22px; border-radius: 8px;
      font-size: 1.1rem; font-weight: 800;
      background: var(--border2); color: var(--accent);
      border: 1px solid var(--border);
    }

    .btn-next {
      flex: 1; padding: 14px; border-radius: 8px;
      font-size: 0.85rem; font-weight: 800; letter-spacing: 0.12em;
      background: var(--accent); color: var(--bg);
      box-shadow: 0 0 20px rgba(0,229,160,0.4);
    }

    .btn-reset {
      padding: 14px 18px; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600;
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }

    /* ── Level buttons ── */
    .level-row { display: flex; gap: 10px; margin: 20px 0; }
    .level-btn {
      flex: 1; padding: 14px; border-radius: 8px;
      font-size: 0.85rem; font-weight: 800; letter-spacing: 0.1em;
      cursor: pointer; border: 2px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      background: var(--border2); color: var(--muted);
      transition: all 0.15s;
    }
    .level-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .level-btn.leicht.active {
      background: var(--leicht); color: var(--bg);
      border-color: var(--leicht);
      box-shadow: 0 0 20px rgba(0,229,160,0.4);
    }
    .level-btn.mittel.active {
      background: var(--mittel); color: var(--bg);
      border-color: var(--mittel);
      box-shadow: 0 0 20px rgba(255,179,71,0.4);
    }
    .level-btn.schwer.active {
      background: var(--schwer); color: var(--bg);
      border-color: var(--schwer);
      box-shadow: 0 0 20px rgba(255,107,157,0.4);
    }

    /* ── Start screen ── */
    .big-sigma {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem; color: var(--border2);
      line-height: 1; margin-bottom: 8px; text-align: center;
    }
    .start-title {
      text-align: center; font-weight: 800; font-size: 1rem;
      letter-spacing: 0.08em; margin-bottom: 6px;
    }
    .start-desc {
      text-align: center; color: var(--muted); font-size: 0.78rem;
      margin-bottom: 4px; line-height: 1.6;
    }
    .level-desc {
      text-align: center; font-size: 0.72rem; color: var(--muted);
      min-height: 2.4em; line-height: 1.6; margin-bottom: 18px;
    }
    .op-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 20px;
    }
    .op-card {
      padding: 10px 14px; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--border2);
      font-size: 0.72rem;
    }
    .op-card-label { margin-bottom: 2px; }
    .op-card-sub { color: var(--muted); }

    .start-btn {
      width: 100%; padding: 16px; border-radius: 8px;
      font-size: 0.9rem; font-weight: 800; letter-spacing: 0.15em;
      cursor: pointer; border: none; font-family: 'JetBrains Mono', monospace;
      transition: all 0.15s;
    }
    .start-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .start-btn.leicht { background: var(--leicht); color: var(--bg); box-shadow: 0 0 24px rgba(0,229,160,0.4); }
    .start-btn.mittel { background: var(--mittel); color: var(--bg); box-shadow: 0 0 24px rgba(255,179,71,0.4); }
    .start-btn.schwer { background: var(--schwer); color: var(--bg); box-shadow: 0 0 24px rgba(255,107,157,0.4); }

    /* ── Playing screen ── */
    .meta-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em;
    }
    .meta-count { color: var(--accent); }
    .meta-level-badge {
      padding: 2px 10px; border-radius: 4px; font-size: 0.65rem;
      font-weight: 800; letter-spacing: 0.1em;
    }
    .meta-level-badge.leicht { background: rgba(0,229,160,0.15); color: var(--leicht); }
    .meta-level-badge.mittel { background: rgba(255,179,71,0.15); color: var(--mittel); }
    .meta-level-badge.schwer { background: rgba(255,107,157,0.15); color: var(--schwer); }

    .progress-track {
      height: 3px; background: var(--border2);
      border-radius: 2px; margin-bottom: 32px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 2px;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(0,229,160,0.8);
    }
    .progress-fill.leicht { background: linear-gradient(90deg, var(--leicht), #00c97e); }
    .progress-fill.mittel { background: linear-gradient(90deg, var(--mittel), #ff9500); }
    .progress-fill.schwer { background: linear-gradient(90deg, var(--schwer), #e0005e); }

    .question-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.6rem, 10vw, 5rem);
      letter-spacing: 0.06em; line-height: 1;
      margin-bottom: 12px; text-align: center;
      transition: color 0.2s, text-shadow 0.2s;
      word-break: break-all;
    }
    .question-display.correct { color: var(--accent); text-shadow: 0 0 30px rgba(0,229,160,0.8); }
    .question-display.wrong   { color: var(--bad);    text-shadow: 0 0 30px rgba(255,107,107,0.8); }

    .feedback-line {
      height: 22px; margin-bottom: 20px; text-align: center;
      font-size: 0.78rem; letter-spacing: 0.1em; font-weight: 700;
    }
    .feedback-line.correct { color: var(--accent); }
    .feedback-line.wrong   { color: var(--bad); }

    /* ── Input area ── */
    .input-row { display: flex; gap: 10px; justify-content: center; }
    .answer-input {
      width: 160px; padding: 14px 16px;
      font-size: 1.4rem; text-align: center;
      font-family: 'JetBrains Mono', monospace; font-weight: 800;
      background: var(--bg); border: 2px solid var(--border);
      border-radius: 8px; color: var(--text); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .answer-input:focus { border-color: var(--muted); }
    .answer-input.correct { border-color: var(--accent); box-shadow: 0 0 16px rgba(0,229,160,0.3); }
    .answer-input.wrong   { border-color: var(--bad);    box-shadow: 0 0 16px rgba(255,107,107,0.3); }

    /* Bruch-Hinweis */
    .frac-hint {
      text-align: center; font-size: 0.65rem; color: var(--muted);
      letter-spacing: 0.08em; margin-top: 8px; opacity: 0.7;
    }
    .frac-hint.highlight { color: var(--accent-warm); opacity: 1; }

    /* ── Tipp box ── */
    .tipp-box {
      margin: 8px 0 12px 0; padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255,179,71,0.08);
      border: 1px solid rgba(255,179,71,0.3);
      font-size: 0.75rem; color: var(--accent-warm);
      letter-spacing: 0.06em; line-height: 1.6; text-align: center;
      animation: fadeUp 0.3s ease both;
    }
    .tipp-label { font-weight: 800; letter-spacing: 0.12em; margin-bottom: 3px; }

    /* ── Result screen ── */
    .score-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem; line-height: 1; text-align: center;
    }
    .score-label { text-align: center; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.15em; margin-top: 4px; color: var(--muted); }
    .score-meta  { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 8px; letter-spacing: 0.1em; margin-bottom: 24px; }

    .result-list { max-height: 220px; overflow-y: auto; margin-bottom: 20px; }
    .result-list::-webkit-scrollbar { width: 4px; }
    .result-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .result-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 12px; margin-bottom: 4px; border-radius: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;
    }
    .result-row.correct { background: rgba(0,229,160,0.06);  border: 1px solid rgba(0,229,160,0.15); }
    .result-row.wrong   { background: rgba(255,107,107,0.06); border: 1px solid rgba(255,107,107,0.15); }
    .result-num { color: var(--muted); min-width: 28px; }
    .result-eq  { flex: 1; text-align: center; }
    .result-check.correct { color: var(--accent); font-weight: 700; }
    .result-check.wrong   { color: var(--bad);    font-weight: 700; }

    .btn-row { display: flex; gap: 10px; }

    /* ── Footer ── */
    .footer { text-align: center; margin-top: 16px; font-size: 0.65rem; color: #484f58; letter-spacing: 0.2em; }

    /* ── Animations ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 60%{transform:translateX(10px)} }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
    .fade-up { animation: fadeUp 0.3s ease both; }
    .shake   { animation: shake 0.35s ease; }
    .pulse   { animation: pulse 0.3s ease; }
  </style>
</head>

<div id="app">
  <div class="header">
    <div class="title">KOPFRECHNEN · KL. 6</div>
    <div class="subtitle" id="subtitle">NIVEAU WÄHLEN · + − × ÷ · Brüche · Dezimal</div>
    <div id="stats-badge" class="stats-badge"></div>
  </div>
  <div class="card" id="card"></div>
  <div class="footer">KLASSE 6 · ENTER ZUM BESTÄTIGEN · BRÜCHE ALS 3/4 EINGEBEN</div>
</div>

<script>
// ── Eingebettete Navbar (standalone) ──────────────────
(function () {
  const STORE_KEY = 'lern-apps-results';
  function getPageKey() { return 'kopfrechnen_kl6.html'; }
  function loadResults() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
    catch(e) { return {}; }
  }
  function getResult() { return loadResults()[getPageKey()] || null; }

  window.LernApps = {
    saveResult(result) {
      const all = loadResults();
      all[getPageKey()] = {
        score:     result.score,
        max:       result.max,
        label:     result.label || (result.score + ' / ' + result.max),
        percent:   Math.round((result.score / result.max) * 100),
        timestamp: Date.now()
      };
      localStorage.setItem(STORE_KEY, JSON.stringify(all));
      updateBadge(all[getPageKey()]);
    },
    getAllResults() { return loadResults(); },
    getResult()     { return getResult(); }
  };

  const style = document.createElement('style');
  style.textContent = `
    #lern-result-badge {
      position: fixed; bottom: 1.2rem; right: 1.2rem; z-index: 9999;
      background: #1a1f5e; color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800; font-size: .82rem;
      padding: .45rem .95rem; border-radius: 99px;
      border: 2px solid rgba(255,255,255,.12);
      box-shadow: 0 4px 20px rgba(26,31,94,.35);
      display: none; align-items: center; gap: .45rem;
    }
    #lern-result-badge.show { display: flex; }
    #lern-result-badge .rb-bar {
      width: 52px; height: 6px; border-radius: 99px;
      background: rgba(255,255,255,.18); overflow: hidden;
    }
    #lern-result-badge .rb-fill {
      height: 100%; border-radius: 99px;
      background: #4ade80; transition: width .5s ease;
    }
    #lern-result-badge .rb-fill.mid { background: #f7c948; }
    #lern-result-badge .rb-fill.low { background: #f87171; }
  `;
  document.head.appendChild(style);

  const badge = document.createElement('div');
  badge.id = 'lern-result-badge';
  badge.innerHTML = `<span>🏆</span><span class="rb-label"></span><div class="rb-bar"><div class="rb-fill"></div></div>`;
  document.body.appendChild(badge);

  function updateBadge(result) {
    if (!result) return;
    const pct = result.percent || 0;
    badge.querySelector('.rb-label').textContent = result.label;
    const fill = badge.querySelector('.rb-fill');
    fill.style.width = pct + '%';
    fill.className = 'rb-fill' + (pct >= 70 ? '' : pct >= 40 ? ' mid' : ' low');
    badge.classList.add('show');
  }
  updateBadge(getResult());
})();
</script>

<script>
  const ROUND_SIZE = 10;

  const state = {
    phase: 'start',
    level: 'leicht',
    questions: [],
    current: 0,
    results: [],
    feedback: null,
    tippVisible: false,
    tippUsed: false,
    timer: 0,
    roundTime: 0,
    totalRounds: 0,
    totalCorrect: 0,
    totalQuestions: 0,
    timerInterval: null,
    feedbackTimeout: null,
  };

  // ── Bruch-Hilfsfunktionen ─────────────────────────────────────
  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { [a, b] = [b, a % b]; }
    return a;
  }

  function lcm(a, b) { return (a * b) / gcd(a, b); }

  // Kürzt Bruch, stellt sicher: Nenner > 0, Vorzeichen im Zähler
  function simplify(n, d) {
    if (d === 0) return { n: 0, d: 1 };
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(Math.abs(n), Math.abs(d));
    return { n: n / g, d: d / g };
  }

  // Gibt Bruch als lesbaren String zurück (z.B. "3/4", "2", "-1/3")
  function fracToStr(n, d) {
    const s = simplify(n, d);
    if (s.d === 1) return String(s.n);
    return `${s.n}/${s.d}`;
  }

  // Parst Nutzereingabe als {n, d} — versteht "3/4", "2", "1.5" (Dezimal → Bruch)
  function parseInput(raw) {
    raw = raw.trim().replace(',', '.');
    if (raw.includes('/')) {
      const parts = raw.split('/');
      if (parts.length !== 2) return null;
      const n = parseInt(parts[0].trim(), 10);
      const d = parseInt(parts[1].trim(), 10);
      if (isNaN(n) || isNaN(d) || d === 0) return null;
      return simplify(n, d);
    }
    const val = parseFloat(raw);
    if (isNaN(val)) return null;
    // Ganze Zahl
    if (Number.isInteger(val)) return { n: val, d: 1 };
    // Dezimalzahl → Bruch (max 2 Dezimalstellen)
    const factor = raw.includes('.') ? Math.pow(10, (raw.split('.')[1] || '').length) : 1;
    return simplify(Math.round(val * factor), factor);
  }

  // Vergleicht zwei {n,d}-Brüche auf Gleichheit (nach Kürzen)
  function fracEqual(a, b) {
    const sa = simplify(a.n, a.d);
    const sb = simplify(b.n, b.d);
    return sa.n === sb.n && sa.d === sb.d;
  }

  // ── Zufallszahlen ─────────────────────────────────────────────
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  // ── Aufgabengenerator ─────────────────────────────────────────
  // Alle Bruchergebnisse werden als {n, d} gespeichert — NIE als Dezimalzahl.
  // Ganze-Zahlen-Ergebnisse: {n: x, d: 1}
  function generateQuestion(level) {
    const types = level === 'leicht'
      ? ['int', 'frac_same', 'dec1', 'mal']
      : level === 'mittel'
      ? ['int_neg', 'frac_diff', 'dec2', 'mal']
      : ['rat', 'frac_mul', 'frac_div', 'neg_dec'];

    const type = types[Math.floor(Math.random() * types.length)];
    let question = null, answer = null, attempts = 0;

    do {
      attempts++;
      ({ question, answer } = tryGenerate(type));
    } while (attempts < 80 && (answer === null || question === null));

    return { question, answer, type };
  }

  function tryGenerate(type) {
    let question = null, answer = null;

    if (type === 'int') {
      // Ganze Zahlen, kein negatives Ergebnis
      const op = ['+', '-'][rand(0, 1)];
      const a = rand(1, 50), b = rand(1, 20);
      if (op === '+') {
        answer = { n: a + b, d: 1 };
        question = `${a} + ${b}`;
      } else {
        if (a <= b) return { question: null, answer: null };
        answer = { n: a - b, d: 1 };
        question = `${a} − ${b}`;
      }

    } else if (type === 'int_neg') {
      const op = ['+', '-'][rand(0, 1)];
      const a = rand(-20, 50), b = rand(-20, 30);
      const res = op === '+' ? a + b : a - b;
      answer = { n: res, d: 1 };
      question = op === '+' ? `${a} + ${b}` : `${a} − ${b}`;

    } else if (type === 'rat') {
      const op = ['+', '-', '×', '÷'][rand(0, 3)];
      const a = rand(-20, 40), b = rand(-15, 30);
      if (op === '÷') {
        if (b === 0) return { question: null, answer: null };
        const g = gcd(Math.abs(a), Math.abs(b));
        // Nur wenn Ergebnis ganzzahlig oder einfacher Bruch
        const rn = a / g, rd = b / g;
        if (Math.abs(rd) > 12) return { question: null, answer: null };
        answer = simplify(a, b);
        question = `${a} ÷ ${b}`;
      } else if (op === '×') {
        const res = a * b;
        if (Math.abs(res) > 200) return { question: null, answer: null };
        answer = { n: res, d: 1 };
        question = `${a} × ${b}`;
      } else {
        const res = op === '+' ? a + b : a - b;
        answer = { n: res, d: 1 };
        question = op === '+' ? `${a} + ${b}` : `${a} − ${b}`;
      }

    } else if (type === 'frac_same') {
      // Gleicher Nenner, + oder −
      const d = rand(2, 9);
      const n1 = rand(1, d - 1);
      const n2 = rand(1, d - 1);
      const op = ['+', '-'][rand(0, 1)];
      const rn = op === '+' ? n1 + n2 : n1 - n2;
      if (rn === 0) return { question: null, answer: null };
      answer = simplify(rn, d);
      // Ergebnis kann echter Bruch oder ganze Zahl sein — beides OK
      question = `${n1}/${d} ${op} ${n2}/${d}`;

    } else if (type === 'frac_diff') {
      // Verschiedene Nenner, nur Addition (Klasse 6: erweiterbar)
      const d1 = [2, 3, 4, 5, 6, 8][rand(0, 5)];
      const d2 = [2, 3, 4, 5, 6, 8][rand(0, 5)];
      if (d1 === d2) return { question: null, answer: null };
      const n1 = rand(1, d1 - 1);
      const n2 = rand(1, d2 - 1);
      const op = ['+', '-'][rand(0, 1)];
      const L = lcm(d1, d2);
      if (L > 24) return { question: null, answer: null }; // kein zu großer Nenner
      const rn = op === '+' ? n1 * (L / d1) + n2 * (L / d2) : n1 * (L / d1) - n2 * (L / d2);
      if (rn === 0) return { question: null, answer: null };
      answer = simplify(rn, L);
      question = `${n1}/${d1} ${op} ${n2}/${d2}`;

    } else if (type === 'frac_mul') {
      // Bruch × Bruch — Ergebnis immer ein Bruch oder ganze Zahl
      const d1 = rand(2, 6), n1 = rand(1, d1 - 1);
      const d2 = rand(2, 6), n2 = rand(1, d2 - 1);
      answer = simplify(n1 * n2, d1 * d2);
      question = `${n1}/${d1} × ${n2}/${d2}`;

    } else if (type === 'frac_div') {
      // Bruch ÷ Bruch — Kehrwert nehmen
      const d1 = rand(2, 6), n1 = rand(1, d1 - 1);
      const d2 = rand(2, 6), n2 = rand(1, d2 - 1);
      // (n1/d1) ÷ (n2/d2) = (n1*d2) / (d1*n2)
      answer = simplify(n1 * d2, d1 * n2);
      if (answer.d > 20) return { question: null, answer: null };
      question = `${n1}/${d1} ÷ ${n2}/${d2}`;

    } else if (type === 'dec1') {
      const a = parseFloat((rand(0, 50) + rand(0, 9) / 10).toFixed(1));
      const b = parseFloat((rand(0, 20) + rand(0, 9) / 10).toFixed(1));
      const op = ['+', '-'][rand(0, 1)];
      const res = parseFloat((op === '+' ? a + b : a - b).toFixed(1));
      if (res < 0) return { question: null, answer: null };
      // Dezimalzahl als Bruch speichern (1 Stelle → /10)
      answer = simplify(Math.round(res * 10), 10);
      question = `${a.toFixed(1)} ${op} ${b.toFixed(1)}`;

    } else if (type === 'dec2') {
      const a = parseFloat((rand(0, 20) + rand(0, 99) / 100).toFixed(2));
      const b = parseFloat((rand(0, 10) + rand(0, 99) / 100).toFixed(2));
      const res = parseFloat((a + b).toFixed(2));
      // Als Bruch /100
      answer = simplify(Math.round(res * 100), 100);
      question = `${a.toFixed(2)} + ${b.toFixed(2)}`;

    } else if (type === 'neg_dec') {
      const a = parseFloat((rand(-10, 20) + rand(0, 9) / 10).toFixed(1));
      const b = parseFloat((rand(-10, 15) + rand(0, 9) / 10).toFixed(1));
      const res = parseFloat((a + b).toFixed(1));
      answer = simplify(Math.round(res * 10), 10);
      question = `${a.toFixed(1)} + ${b.toFixed(1)}`;

    } else {
      // mal / Einmaleins
      const a = rand(2, 10), b = rand(2, 10);
      answer = { n: a * b, d: 1 };
      question = `${a} × ${b}`;
    }

    return { question, answer };
  }

  // Gibt die richtige Antwort als lesbaren String aus (für Ergebnisanzeige)
  function answerStr(ans) {
    if (!ans) return '?';
    const s = simplify(ans.n, ans.d);
    if (s.d === 1) return String(s.n);
    // Dezimalzahl, wenn Nenner Zehnerpotenz und Ergebnis "schön" ist
    if ([2, 4, 5, 10, 20, 25, 50, 100].includes(s.d)) {
      const dec = s.n / s.d;
      const decStr = dec.toString();
      if (decStr.length <= 6) return decStr;
    }
    return `${s.n}/${s.d}`;
  }

  // ── Tipps ─────────────────────────────────────────────────────
  function getTipp(q) {
    const s = q.question;
    if (s.includes('/') && s.includes('÷')) return 'Tipp: Kehrwert des zweiten Bruchs nehmen, dann multiplizieren!';
    if (s.includes('/') && s.includes('×')) return 'Tipp: Zähler × Zähler, Nenner × Nenner — dann kürzen!';
    if (s.includes('/')) return 'Tipp: Auf gleichen Nenner bringen, dann Zähler addieren/subtrahieren!';
    if (s.includes('.')) return 'Tipp: Stelle das Komma richtig — dann wie ganze Zahlen rechnen.';
    const parts = s.split(' ');
    const a = parseFloat(parts[0]), op = parts[1], b = parseFloat(parts[2]);
    if (op === '+') return `Tipp: Zähle von ${a} um ${Math.abs(b)} ${b >= 0 ? 'weiter' : 'zurück'}.`;
    if (op === '-' || op === '−') return `Tipp: Was muss ich zu ${b} addieren, um ${a} zu bekommen?`;
    if (op === '×') return `Tipp: ${a}×${b} = ${b}-mal die ${a} zusammenzählen.`;
    return `Tipp: ${b} × ? = ${a}`;
  }

  // ── Hilfsfunktionen ───────────────────────────────────────────
  function formatTime(s) {
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function updateStatsBadge() {
    const badge = document.getElementById('stats-badge');
    if (state.totalRounds > 0) {
      badge.style.display = 'inline-block';
      badge.textContent = `GESAMT ${state.totalCorrect}/${state.totalQuestions} · ${state.totalRounds} RUNDEN`;
    } else {
      badge.style.display = 'none';
    }
  }

  // Erkennt ob die aktuelle Frage ein Bruchergebnis erwartet
  function expectsFraction(q) {
    if (!q || !q.answer) return false;
    const s = simplify(q.answer.n, q.answer.d);
    return s.d !== 1;
  }

  // ── Runde starten ─────────────────────────────────────────────
  function startRound(level) {
    if (level) state.level = level;
    clearInterval(state.timerInterval);
    clearTimeout(state.feedbackTimeout);
    state.questions = Array.from({ length: ROUND_SIZE }, () => generateQuestion(state.level));
    state.current = 0;
    state.results = [];
    state.feedback = null;
    state.tippVisible = false;
    state.tippUsed = false;
    state.timer = 0;
    state.phase = 'playing';

    document.getElementById('subtitle').textContent = state.level === 'leicht'
      ? 'NIVEAU: LEICHT · + − × ÷'
      : state.level === 'mittel'
      ? 'NIVEAU: MITTEL · + − × ÷'
      : 'NIVEAU: SCHWER · + − × ÷';

    render();
    state.timerInterval = setInterval(() => {
      state.timer++;
      const el = document.getElementById('timer-display');
      if (el) el.textContent = '⏱ ' + formatTime(state.timer);
    }, 1000);
    setTimeout(() => document.getElementById('answer-input')?.focus(), 50);
  }

  function showTipp() {
    state.tippVisible = true;
    state.tippUsed = true;
    const q = state.questions[state.current];
    const tippEl = document.getElementById('tipp-area');
    if (tippEl) {
      tippEl.innerHTML = `<div class="tipp-box"><div class="tipp-label">💡 TIPP</div>${getTipp(q)}</div>`;
    }
  }

  function submitAnswer() {
    if (state.feedback) return;
    const input = document.getElementById('answer-input');
    if (!input || input.value.trim() === '') return;

    const parsed = parseInput(input.value);
    const q = state.questions[state.current];
    const correct = parsed !== null && fracEqual(parsed, q.answer);

    state.feedback = correct ? 'correct' : 'wrong';
    const givenStr = input.value.trim();
    state.results.push({ ...q, givenStr, correct, tippUsed: state.tippUsed });
    applyFeedbackUI(correct, q);

    state.feedbackTimeout = setTimeout(() => {
      state.feedback = null;
      state.tippVisible = false;
      state.tippUsed = false;
      if (state.current + 1 >= ROUND_SIZE) {
        clearInterval(state.timerInterval);
        const roundCorrect = state.results.filter(r => r.correct).length;
        state.totalRounds++;
        state.totalCorrect += roundCorrect;
        state.totalQuestions += ROUND_SIZE;
        state.roundTime = state.timer;
        state.phase = 'result';
        updateStatsBadge();
        render();
      } else {
        state.current++;
        render();
        setTimeout(() => document.getElementById('answer-input')?.focus(), 50);
      }
    }, correct ? 350 : 900);
  }

  function applyFeedbackUI(correct, q) {
    const qEl = document.getElementById('question-display');
    const fbEl = document.getElementById('feedback-line');
    const inEl = document.getElementById('answer-input');
    if (!qEl) return;
    qEl.className = 'question-display ' + (correct ? 'correct' : 'wrong');
    qEl.classList.add(correct ? 'pulse' : 'shake');
    if (inEl) inEl.className = 'answer-input ' + (correct ? 'correct' : 'wrong');
    if (fbEl) {
      fbEl.className = 'feedback-line ' + (correct ? 'correct' : 'wrong');
      fbEl.textContent = correct
        ? '✓ RICHTIG'
        : `✗ FALSCH — RICHTIG: ${answerStr(q.answer)}`;
    }
  }

  // ── Render ────────────────────────────────────────────────────
  function render() {
    const card = document.getElementById('card');
    card.className = 'card fade-up';
    void card.offsetWidth;
    if (state.phase === 'start')        renderStart(card);
    else if (state.phase === 'playing') renderPlaying(card);
    else if (state.phase === 'result')  renderResult(card);
  }

  function renderStart(card) {
    const lvl = state.level;
    const descText = lvl === 'leicht'
      ? 'Ganze Zahlen 1–50 · Brüche gleicher Nenner · Dezimal 1 Stelle'
      : lvl === 'mittel'
      ? 'Ganze Zahlen −20 bis +99 · Brüche versch. Nenner · Dezimal 2 Stellen'
      : 'Rationale Zahlen · Brüche × ÷ · Negative Dezimalzahlen';

    card.innerHTML = `
      <div class="big-sigma">∑</div>
      <div class="start-title">NIVEAU WÄHLEN</div>
      <div class="start-desc">${ROUND_SIZE} Aufgaben pro Runde · Alle 4 Grundrechenarten</div>

      <div class="level-row">
        <button class="level-btn leicht ${lvl==='leicht'?'active':''}" id="btn-leicht">🟢 LEICHT</button>
        <button class="level-btn mittel ${lvl==='mittel'?'active':''}" id="btn-mittel">🟡 MITTEL</button>
        <button class="level-btn schwer ${lvl==='schwer'?'active':''}" id="btn-schwer">🔴 SCHWER</button>
      </div>

      <div class="level-desc">${descText}</div>

      <div class="op-grid">
        <div class="op-card">
          <div class="op-card-label">➕➖ <strong>${lvl==='leicht'?'Ganze Zahlen':lvl==='mittel'?'Ganze Zahlen':'Rat. Zahlen'}</strong></div>
          <div class="op-card-sub">${lvl==='leicht'?'1 bis 50':lvl==='mittel'?'−20 bis +99':'alle 4 Arten'}</div>
        </div>
        <div class="op-card">
          <div class="op-card-label">½ <strong>${lvl==='leicht'?'Brüche gleicher N.':lvl==='mittel'?'Brüche + − (versch.)':'Brüche × ÷'}</strong></div>
          <div class="op-card-sub">${lvl==='leicht'?'z.B. 1/4 + 2/4':lvl==='mittel'?'z.B. 1/2 + 1/3':'z.B. 2/3 × 3/4'}</div>
        </div>
        <div class="op-card">
          <div class="op-card-label">🔢 <strong>${lvl==='leicht'?'Dezimalzahlen':lvl==='mittel'?'Dezimalzahlen':'Neg. Dezimalzahlen'}</strong></div>
          <div class="op-card-sub">${lvl==='leicht'?'1 Dezimalstelle':lvl==='mittel'?'2 Dezimalstellen':'1–2 Stellen'}</div>
        </div>
        <div class="op-card">
          <div class="op-card-label">✖️ <strong>Einmaleins</strong></div>
          <div class="op-card-sub">${lvl==='leicht'?'bis 10×10':'bis 10×10'}</div>
        </div>
      </div>

      <div style="margin-bottom:12px; padding:8px 14px; border-radius:8px; background:rgba(0,229,160,0.05); border:1px solid rgba(0,229,160,0.2); font-size:0.7rem; color:var(--muted); text-align:center; letter-spacing:0.06em;">
        💡 Brüche kannst du als <strong style="color:var(--accent)">3/4</strong> eingeben · Dezimalzahlen mit <strong style="color:var(--accent)">.</strong> oder <strong style="color:var(--accent)">,</strong>
      </div>

      <button class="start-btn ${lvl}" id="btn-start">STARTEN →</button>
    `;

    document.getElementById('btn-leicht').addEventListener('click', () => selectLevel('leicht'));
    document.getElementById('btn-mittel').addEventListener('click', () => selectLevel('mittel'));
    document.getElementById('btn-schwer').addEventListener('click', () => selectLevel('schwer'));
    document.getElementById('btn-start').addEventListener('click', () => startRound());
  }

  function selectLevel(lvl) {
    state.level = lvl;
    render();
  }

  function renderPlaying(card) {
    const q = state.questions[state.current];
    const pct = (state.current / ROUND_SIZE) * 100;
    const lvl = state.level;
    const lvlLabel = lvl === 'leicht' ? '🟢 LEICHT' : lvl === 'mittel' ? '🟡 MITTEL' : '🔴 SCHWER';
    const isFrac = expectsFraction(q);

    card.innerHTML = `
      <div class="meta-row">
        <span><span class="meta-count">${state.current + 1}</span>/${ROUND_SIZE}</span>
        <span class="meta-level-badge ${lvl}">${lvlLabel}</span>
        <span id="timer-display">⏱ ${formatTime(state.timer)}</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill ${lvl}" style="width:${pct}%"></div>
      </div>
      <div class="question-display" id="question-display">${q.question} =</div>
      <div class="feedback-line" id="feedback-line"></div>
      <div id="tipp-area">${state.tippVisible ? `<div class="tipp-box"><div class="tipp-label">💡 TIPP</div>${getTipp(q)}</div>` : ''}</div>
      <div class="input-row">
        <input id="answer-input" class="answer-input" type="text" inputmode="decimal"
          placeholder="${isFrac ? 'z.B. 3/4' : '___'}"
          autocomplete="off" spellcheck="false"/>
        <button class="btn btn-confirm" id="btn-submit">↵</button>
      </div>
      <div class="frac-hint ${isFrac ? 'highlight' : ''}">
        ${isFrac ? '½ Brucheingabe: z.B. 3/4 oder 6/8' : 'Eingabe: Zahl oder Bruch wie 3/4'}
      </div>
      ${!state.tippVisible && !state.feedback ? `<div style="text-align:center;margin-top:14px"><button id="btn-tipp" style="background:none;border:none;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;cursor:pointer;text-decoration:underline;">💡 TIPP ANZEIGEN</button></div>` : ''}
    `;

    document.getElementById('answer-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitAnswer();
    });
    document.getElementById('btn-submit').addEventListener('click', submitAnswer);
    const tippBtn = document.getElementById('btn-tipp');
    if (tippBtn) tippBtn.addEventListener('click', showTipp);
  }

  function renderResult(card) {
    const correctCount = state.results.filter(r => r.correct).length;
    const pct = Math.round((correctCount / ROUND_SIZE) * 100);
    const scoreColor = pct === 100 ? 'var(--accent)' : pct >= 70 ? 'var(--accent-warm)' : 'var(--bad)';
    const emoji = pct === 100 ? '🏆' : pct >= 80 ? '🎯' : pct >= 60 ? '💪' : '📚';
    const label = pct === 100 ? 'PERFEKT!' : pct >= 80 ? 'SEHR GUT' : pct >= 60 ? 'GUT GEMACHT' : 'WEITER ÜBEN';
    const lvl = state.level;
    const lvlLabel = lvl === 'leicht' ? '🟢 LEICHT' : lvl === 'mittel' ? '🟡 MITTEL' : '🔴 SCHWER';
    LernApps.saveResult({ score: correctCount, max: ROUND_SIZE, label: correctCount + ' / ' + ROUND_SIZE + ' · ' + label });

    const rows = state.results.map((r, i) => `
      <div class="result-row ${r.correct ? 'correct' : 'wrong'}">
        <span class="result-num">${String(i + 1).padStart(2, '0')}.</span>
        <span class="result-eq">${r.question} = <strong>${answerStr(r.answer)}</strong>${r.tippUsed ? ' <span style="color:var(--accent-warm);font-size:0.65rem">💡</span>' : ''}</span>
        <span class="result-check ${r.correct ? 'correct' : 'wrong'}">${r.correct ? '✓' : `✗ (${r.givenStr})`}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="score-display" style="color:${scoreColor};text-shadow:0 0 40px ${scoreColor}">
        ${correctCount}/${ROUND_SIZE}
      </div>
      <div class="score-label">${emoji} ${label}</div>
      <div class="score-meta">ZEIT: ${formatTime(state.roundTime)} · ${pct}% · ${lvlLabel}</div>
      <div class="result-list">${rows}</div>
      <div class="btn-row">
        <button class="btn btn-next" id="btn-next">NÄCHSTE RUNDE →</button>
        <button class="btn btn-reset" id="btn-menu">↺ MENÜ</button>
      </div>
    `;

    document.getElementById('btn-next').addEventListener('click', () => startRound());
    document.getElementById('btn-menu').addEventListener('click', resetAll);
  }

  function resetAll() {
    clearInterval(state.timerInterval);
    state.totalRounds = 0; state.totalCorrect = 0; state.totalQuestions = 0;
    state.phase = 'start';
    document.getElementById('subtitle').textContent = 'NIVEAU WÄHLEN · + − × ÷ · Brüche · Dezimal';
    updateStatsBadge();
    render();
  }

  // Init
  render();
</script>
</body>
</html>
