<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="gemeinsam/umgebung.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lernwelt · Meine Sicherungskarte</title>
<link rel="stylesheet" href="gemeinsam/fonts.css">
<style>
  :root { --bg:#0f0e1a; --panel:#1a1830; --line:#2e2b4d; --text:#ecebf5; --text2:#c9c7e0; --muted:#9d9abf; --gold:#e6a817; --indigo:#6366f1; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 'Nunito', system-ui, sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .leiste { max-width:620px; margin:0 auto; padding:1.4rem 1.2rem .6rem; }
  h1 { font-family:'Fredoka One', 'Nunito', sans-serif; font-weight:400; font-size:1.5rem; margin:0 0 .4rem; }
  h1 em { font-style:normal; color:var(--gold); }
  p { color:var(--text2); margin:0 0 1rem; }
  .knoepfe { display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:1.2rem; }
  .btn { display:inline-flex; align-items:center; gap:.35rem; padding:.65rem 1.1rem; border-radius:12px; border:1px solid var(--line);
         background:var(--panel); color:var(--text); font:800 .95rem 'Nunito', sans-serif; cursor:pointer; text-decoration:none; }
  .btn.primary { background:var(--gold); border-color:var(--gold); color:#2a1d00; }
  .hinweis { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1rem 1.1rem; color:var(--text2); }

  .blatt { display:flex; justify-content:center; padding:0 1rem 3rem; }
  .k { width:95mm; height:66mm; background:#fff; color:#16142a; border:.3mm solid #b9b6cf; border-radius:3mm; padding:4mm; display:grid;
       grid-template-columns:34mm 1fr; grid-template-rows:auto 1fr auto; column-gap:4mm; overflow:hidden; }
  .k-kopf { grid-column:1 / -1; display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2mm; }
  .k-brand { font-family:'Fredoka One', 'Nunito', sans-serif; font-size:11pt; }
  .k-brand em { font-style:normal; color:#c48d0a; }
  .k-sub { font-size:7pt; color:#6b6890; font-weight:700; }
  .k-qr { width:34mm; height:34mm; image-rendering:pixelated; }
  .k-rechts { display:flex; flex-direction:column; gap:2mm; min-width:0; }
  .k-name { font-size:11pt; font-weight:900; word-break:break-word; }
  .k-wie { font-size:7pt; line-height:1.4; background:#f4f2fb; border-radius:1.5mm; padding:1.5mm 2mm; }
  .k-code { grid-column:1 / -1; font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:13pt; font-weight:700;
            letter-spacing:.06em; margin-top:2mm; display:flex; justify-content:space-between; align-items:baseline; }
  .k-code small { font-family:'Nunito', sans-serif; font-size:6.5pt; font-weight:700; letter-spacing:0; color:#6b6890; }

  @page { size:A4 portrait; margin:12mm; }
  @media print {
    body { background:#fff; padding:0; }
    .leiste, #lern-home-btn { display:none !important; }
    .blatt { justify-content:flex-start; padding:0; }
  }
</style>
</head>
<body>

<div class="leiste">
  <h1>🧭 Lern<em>welt</em> · Meine Sicherungskarte</h1>
  <div id="oben"></div>
</div>
<div class="blatt" id="blatt"></div>

<script src="gemeinsam/qrcode.js"></script>
<script src="gemeinsam/shared.js"></script>
<script src="gemeinsam/sync-code.js"></script>
<script>
'use strict';
(function () {
  const oben = document.getElementById('oben'), blatt = document.getElementById('blatt');
  const zurueck = '<a class="btn" href="index.html">← Zur Lernwelt</a>';
  let st = null, pass = null;
  try { st = JSON.parse(localStorage.getItem('lernwelt-sync') || 'null'); } catch (e) {}
  try { pass = JSON.parse(localStorage.getItem('lernwelt-pass') || 'null'); } catch (e) {}
  const code = st && LernSyncCode.normalisieren(st.code);

  if (!code) {
    oben.innerHTML = `<div class="hinweis">Dein Pass ist noch nicht mit einer Sicherungskarte verbunden. Öffne in der Lernwelt deinen Pass → <b>Sicherung</b> → <b>📷 Karte scannen</b>.</div><div class="knoepfe" style="margin-top:1rem">${zurueck}</div>`;
    return;
  }

  const name = (pass && pass.profile && pass.profile.name) || '';
  oben.innerHTML = `
    <p>Drucke deine Karte aus oder speichere sie als PDF. Sie funktioniert genauso wie die Karte von deiner Lehrkraft und stellt immer deinen <b>neuesten</b> Stand wieder her.</p>
    <div class="knoepfe"><button type="button" class="btn primary" id="drucken">🖨 Drucken / als PDF sichern</button>${zurueck}</div>
    <p style="font-size:.85rem;color:var(--muted)">Wer diese Karte hat, kann deinen Pass öffnen. Zeig sie niemandem und heb sie gut auf.</p>`;
  document.getElementById('drucken').addEventListener('click', () => window.print());

  const c = document.createElement('canvas');
  const qr = renderQR(c, LernSyncCode.url(code), 600) ? c.toDataURL('image/png') : '';
  const esc = s => String(s).replace(/[&<>"']/g, x => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]));
  blatt.innerHTML = `
    <div class="k">
      <div class="k-kopf"><div><div class="k-brand">🧭 Lern<em>welt</em>-Pass</div><div class="k-sub">Sicherungskarte</div></div></div>
      ${qr ? `<img class="k-qr" src="${qr}" alt="QR-Code deiner Sicherungskarte">` : '<div class="k-qr"></div>'}
      <div class="k-rechts">
        <div class="k-name">${esc(name)}</div>
        <div class="k-wie">📷 Im Lernwelt-Symbol auf <b>QR scannen</b> tippen und diese Karte scannen. Dann ist dein Pass wieder da.</div>
      </div>
      <div class="k-code">${esc(LernSyncCode.formatieren(code))}<small>Gut aufheben!</small></div>
    </div>`;
})();
</script>
</body>
</html>
